name: Firestore 자동 백업

# ⚠️ 백업 위치 (2026-10-11): 이 저장소는 Cloudflare Pages 사이트와 연결돼 있어 브랜치마다 공개 미리보기 주소가 생김
#    → 고객 정보가 든 백업을 이 저장소에 두면 저장소를 비공개로 바꿔도 새어 나갈 수 있음
#    → 저장소 변수 BACKUP_REPO(사이트와 연결 안 된 비공개 저장소, 예: netformrnd-lab/pour-backups)가 있을 때만 돌고, 그 저장소에만 씀
# ✅ 2026-10-11 부터 pour-app-new 전체 백업은 비공개 저장소 netformrnd-lab/pour-backups 가 스스로 함(매일 한국 03:30 · 그 저장소 backup.mjs)
#    → 이 잡은 BACKUP_REPO 를 넣지 않으면 돌지 않음 (그대로 두면 됨 · 지우지 않고 남겨 둠)

on:
  # 매일 자정 KST (UTC 15:00)
  schedule:
    - cron: '0 15 * * *'

  # 수동 실행 (GitHub Actions 탭에서 직접 트리거 가능)
  workflow_dispatch:
    inputs:
      environment:
        description: '백업 환경'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development

jobs:
  # ── 프로덕션 백업 ─────────────────────────────────────────
  backup-production:
    name: 프로덕션 Firestore 백업
    runs-on: ubuntu-latest
    # 스케줄 실행 시 항상 prod, 수동 실행 시 선택값 따름
    if: vars.BACKUP_REPO != '' && vars.BACKUP_REPO != github.repository && (github.event_name == 'schedule' || github.event.inputs.environment == 'production')

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backup/package.json

      - name: 의존성 설치
        run: npm install
        working-directory: backup

      - name: Firestore 백업 실행 (프로덕션)
        env:
          NODE_ENV: production
          FIREBASE_PROJECT_ID: ${{ secrets.PROD_FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.PROD_FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.PROD_FIREBASE_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.BACKUP_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ vars.BACKUP_REPO }}
          BACKUP_COLLECTIONS: ${{ vars.BACKUP_COLLECTIONS || 'leads,leads-store,leads-grohome,leads-method,activities,site-resources,partner-companies' }}
        run: node firestore-backup.js
        working-directory: backup

      - name: 백업 실패 알림 (Slack — 선택사항)
        if: failure()
        run: |
          echo "백업 실패 — 슬랙 웹훅 연동 시 여기에 curl 명령 추가"
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-type: application/json' \
          #   --data '{"text":"🚨 POUR 프로덕션 Firestore 백업 실패! GitHub Actions 확인 요망"}'

  # ── 개발 환경 백업 ─────────────────────────────────────────
  backup-development:
    name: 개발 Firestore 백업
    runs-on: ubuntu-latest
    if: vars.BACKUP_REPO != '' && vars.BACKUP_REPO != github.repository && github.event.inputs.environment == 'development'

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backup/package.json

      - name: 의존성 설치
        run: npm install
        working-directory: backup

      - name: Firestore 백업 실행 (개발)
        env:
          NODE_ENV: development
          FIREBASE_PROJECT_ID: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.DEV_FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.DEV_FIREBASE_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.BACKUP_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ vars.BACKUP_REPO }}
          BACKUP_COLLECTIONS: ${{ vars.BACKUP_COLLECTIONS || 'leads,leads-store,leads-grohome' }}
        run: node firestore-backup.js
        working-directory: backup

  # ── 오래된 백업 정리 (월 1회) ─────────────────────────────
  cleanup-old-backups:
    name: 오래된 백업 정리
    runs-on: ubuntu-latest
    # 매월 1일 자정에만 실행 · 백업 저장소(BACKUP_REPO)에서
    if: vars.BACKUP_REPO != '' && vars.BACKUP_REPO != github.repository && github.event_name == 'schedule'

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BACKUP_REPO }}
          ref: backup/firestore-snapshots
          fetch-depth: 0
          token: ${{ secrets.BACKUP_GITHUB_TOKEN }}

      - name: 30일 이상 된 백업 폴더 삭제
        run: |
          CUTOFF=$(date -d '30 days ago' +%Y-%m-%dT)
          echo "기준일: $CUTOFF"
          # backups/prod/ 하위 타임스탬프 폴더 중 오래된 것 삭제
          for dir in backups/prod/*/; do
            dirname=$(basename "$dir")
            if [[ "$dirname" < "$CUTOFF" && "$dirname" != "latest" ]]; then
              echo "삭제: $dir"
              git rm -rf "$dir" 2>/dev/null || true
            fi
          done
          git diff --cached --quiet || git commit -m "cleanup: 30일 초과 백업 정리"
          git push origin backup/firestore-snapshots || true
