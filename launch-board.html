<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>넷폼 런칭보드 — 샘플 수령부터 디자인 완료까지</title>
<meta name="description" content="1팀·2팀·디자이너·외주업체가 함께 보는 신제품 출시 진행 대시보드">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#111827;--ink2:#374151;--muted:#6B7280;--faint:#9CA3AF;--line:#E5E7EB;--line2:#EEF0F4;
    --bg:#F4F7FB;--card:#FFFFFF;--blue:#2563EB;--blue-l:#EFF6FF;--red:#DC2626;--red-l:#FEF2F2;
    --amber:#B45309;--amber-l:#FFF7E6;--green:#059669;--green-l:#ECFDF5;--purple:#6D28D9;--purple-l:#F5F3FF;
    --r:16px;--shadow:0 1px 3px rgba(17,24,39,.05),0 4px 16px rgba(17,24,39,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:Pretendard,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
  .hidden{display:none!important}

  /* ── 상단 헤더 ── */
  .top{max-width:1320px;margin:16px auto 0;padding:0 20px}
  .hdr{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:18px;padding:14px 18px}
  .logo{display:flex;align-items:center;gap:12px;flex-shrink:0}
  .logo .mk{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#F59E0B,#6366F1 55%,#22C55E);color:#fff;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(99,102,241,.25)}
  .logo b{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em}
  .logo small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
  .search{flex:1;max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:0 14px;height:46px;background:#FBFCFE}
  .search input{flex:1;border:none;background:none;outline:none;min-width:0}
  .search .x{color:var(--faint);font-size:18px;padding:4px}
  .me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:6px 12px 6px 6px;flex-shrink:0}
  .me .av{width:32px;height:32px;border-radius:10px;background:#E0F2FE;color:#0369A1;font-weight:800;display:flex;align-items:center;justify-content:center}
  .me span{font-weight:700;font-size:13px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ── 레이아웃 ── */
  .wrap{max-width:1320px;margin:0 auto;padding:18px 20px 60px;display:grid;grid-template-columns:268px minmax(0,1fr);gap:22px;align-items:start}
  .side{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
  .box h4{margin:2px 4px 10px;font-size:12px;color:var(--muted);font-weight:700}
  .nav button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:12px;font-weight:700;font-size:14px;color:var(--ink2);text-align:left}
  .nav button:hover{background:#F6F8FB}
  .nav button.on{background:var(--blue-l);color:#1E40AF;box-shadow:inset 0 0 0 1px #DBEAFE}
  .nav .ic{width:22px;text-align:center;font-size:16px}
  .nav .cnt{margin-left:auto;font-size:11.5px;font-weight:800;background:var(--red);color:#fff;border-radius:999px;padding:2px 7px}
  .nav .cnt.soft{background:#EEF2F7;color:var(--muted)}

  /* 미니 캘린더 */
  .cal-h{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px}
  .cal-h b{font-size:15px}
  .cal-h button{width:32px;height:32px;border-radius:10px;color:var(--muted);font-size:16px}
  .cal-h button:hover{background:#F3F4F6}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
  .cal .wd{font-size:11px;color:var(--faint);font-weight:700;padding:4px 0}
  .cal .wd:first-child{color:#EF4444}
  .cal .d{position:relative;height:36px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px}
  .cal .d.out{color:#D1D5DB}
  .cal .d.today{background:#111827;color:#fff}
  .cal .d.sel{box-shadow:inset 0 0 0 2px var(--blue)}
  .cal .d.has{cursor:pointer}
  .cal .d.has:hover{background:#F3F6FB}
  .cal .d.today.has:hover{background:#111827}
  .dots{display:flex;gap:2px;margin-top:3px}
  .dots i{width:5px;height:5px;border-radius:50%}
  .cal-list{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
  .cal-list .t{font-size:12px;color:var(--muted);font-weight:700;margin:0 2px}
  .cal-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;text-align:left;font-size:13px;font-weight:700;width:100%}
  .cal-item small{margin-left:auto;font-size:11px;font-weight:700;opacity:.8}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11.5px;color:var(--muted);font-weight:600}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:8px;height:8px;border-radius:50%}

  /* ── 메인 ── */
  .banner{background:#FFF6E0;border:1px solid #FDE7B0;border-radius:var(--r);padding:15px 20px;display:flex;align-items:center;gap:12px;font-size:14px;color:#6B4E16}
  .banner b{color:#3F2D07}
  .banner .sp{flex:1}
  .h2{display:flex;align-items:flex-end;gap:12px;margin:26px 2px 6px;flex-wrap:wrap}
  .h2 h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
  .h2 .sp{flex:1}
  .sub{margin:0 2px 16px;color:var(--muted);font-size:13.5px;font-weight:500}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--ink2);white-space:nowrap}
  .btn:hover{background:#F9FAFB}
  .btn.pri{background:#111827;color:#fff;border-color:#111827}
  .btn.pri:hover{background:#1F2937}
  .btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
  .btn.danger{color:var(--red);border-color:#FECACA}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left}
  .stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
  .stat span{font-size:12px;color:var(--muted);font-weight:600}
  .stat.warn b{color:var(--red)}
  button.stat:hover{border-color:#CBD5E1}

  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:6px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex-shrink:0;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
  .tab i{width:9px;height:9px;border-radius:50%}
  .tab.on{background:#111827;color:#fff;border-color:#111827}

  .brand-sec{margin-top:22px}
  .brand-h{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
  .brand-h .pill{font-weight:800;font-size:15px;padding:6px 12px;border-radius:10px}
  .brand-h .n{color:var(--muted);font-size:13px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .card{border-radius:16px;border:1px solid;padding:12px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:transform .12s, box-shadow .12s;min-width:0}
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(17,24,39,.08)}
  .card .row1{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px}
  .card .bchip{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:8px;white-space:nowrap}
  .card .dday{font-size:12px;font-weight:800;padding:4px 9px;border-radius:8px;background:#fff;white-space:nowrap}
  .card .ico{width:54px;height:54px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 2px 8px rgba(17,24,39,.06);margin-top:6px}
  .card h3{margin:2px 0 0;font-size:16px;font-weight:800;letter-spacing:-.02em;word-break:keep-all;overflow-wrap:anywhere}
  .card .launch{font-size:13px;color:var(--ink2);font-weight:600}
  .card .launch b{font-weight:800}
  .card .now{font-size:12.5px;color:var(--muted);font-weight:600;min-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .bar{width:100%;height:6px;background:rgba(255,255,255,.9);border-radius:99px;overflow:hidden;margin-top:4px;box-shadow:inset 0 0 0 1px rgba(17,24,39,.05)}
  .bar i{display:block;height:100%;border-radius:99px}
  .card .pct{font-size:11.5px;font-weight:700;color:var(--muted);width:100%;display:flex;justify-content:space-between}
  .card .warn{font-size:12px;font-weight:800;color:var(--red);background:#fff;border-radius:8px;padding:3px 8px}
  .card .go{margin-top:8px;height:38px;padding:0 16px;border-radius:999px;border:1.5px solid;font-weight:800;font-size:13px;background:#fff;display:inline-flex;align-items:center;gap:6px}
  .add-card{border:1.5px dashed #CBD5E1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-weight:700;min-height:90px;background:rgba(255,255,255,.5)}
  .add-card:hover{border-color:#94A3B8;color:var(--ink2)}
  .add-card b{font-size:26px;font-weight:500}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-weight:600;background:#fff;border:1px dashed var(--line);border-radius:var(--r)}

  /* ── 목록 섹션 (캘린더·휴지통) ── */
  .wk{display:flex;flex-direction:column;gap:14px}
  .wk-sec{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .wk-sec .hd{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line2);font-weight:800;font-size:15px}
  .wk-sec .hd .n{font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px;background:#F3F4F6;color:var(--muted)}
  .wk-sec .hd small{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
  .wk-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
  .wk-row:last-child{border-bottom:none}
  .wk-row:hover{background:#FAFBFD}
  .wk-row .bdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .wk-row .mid{flex:1;min-width:0}
  .wk-row .mid b{display:block;font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wk-row .mid span{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wk-row .rt{font-size:12px;font-weight:800;white-space:nowrap}
  .wk-none{padding:16px;color:var(--faint);font-weight:600;font-size:13px}

  /* ── 주간 일정표 ── */
  .wk-nav{display:flex;align-items:center;gap:6px}
  .wk-nav button{height:38px;min-width:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--ink2)}
  .wk-over{background:var(--red-l);border:1px solid #FECACA;border-radius:14px;padding:10px 12px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .wk-over b{color:#991B1B;font-size:13px;margin-right:4px}
  .wk-over button{font-size:12px;font-weight:700;background:#fff;border:1px solid #FECACA;color:#991B1B;border-radius:8px;padding:5px 8px}
  .wkg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
  .wday{background:#fff;border:1px solid var(--line);border-radius:14px;min-height:300px;display:flex;flex-direction:column;overflow:hidden}
  .wday .dh{padding:9px 10px;border-bottom:1px solid var(--line2);display:flex;align-items:baseline;gap:6px;font-weight:800;font-size:13px;color:var(--ink2)}
  .wday .dh small{font-size:12px;color:var(--faint);font-weight:700}
  .wday.today{border-color:#111827;box-shadow:0 0 0 1px #111827}
  .wday.today .dh{background:#111827;color:#fff}
  .wday.today .dh small{color:#CBD5E1}
  .wday.wkend .dh{color:#9CA3AF}
  .wday .evs{padding:6px;display:flex;flex-direction:column;gap:5px}
  .wday .none{font-size:12px;color:#D1D5DB;font-weight:600;padding:6px 4px}
  .wev{display:block;width:100%;text-align:left;border-radius:9px;padding:6px 8px;border-left:3px solid;font-size:12px;line-height:1.35}
  .wev b{display:block;font-weight:800;font-size:12.5px;word-break:keep-all;overflow-wrap:anywhere}
  .wev span{display:block;color:var(--ink2);font-weight:600;word-break:keep-all;overflow-wrap:anywhere}
  .wev.done{opacity:.5}
  .wev.done b{text-decoration:line-through}
  .wev.over span{color:var(--red)}
  .wev.launch{border-left-width:0;font-weight:800}
  .wk-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--muted);font-weight:600}

  /* ── 큰 캘린더 ── */
  .bigcal{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .bigcal .cal .d{height:92px;align-items:stretch;justify-content:flex-start;padding:6px;border:1px solid var(--line2);border-radius:10px;text-align:left}
  .bigcal .cal .d .num{font-size:12px;font-weight:700;margin-bottom:4px}
  .bigcal .cal .d.today{background:#F8FAFC;color:var(--ink)}
  .bigcal .cal .d.today .num{background:#111827;color:#fff;border-radius:6px;padding:1px 6px;align-self:flex-start}
  .bigcal .ev{display:block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 5px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;text-align:left}
  .bigcal .dots{display:none}

  /* ── 업무 체계 ── */
  .flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px}
  .flow span{font-size:12.5px;font-weight:700;background:#F3F4F6;color:var(--muted);border-radius:8px;padding:6px 10px}
  .flow em{font-style:normal;color:var(--faint)}
  .phases{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
  .ph{border-radius:14px;padding:14px;border:1px solid}
  .ph .k{font-size:11.5px;font-weight:800;opacity:.8}
  .ph b{display:block;font-size:15px;margin:3px 0 6px}
  .ph .who{font-size:12px;font-weight:800;border-radius:8px;padding:4px 8px;background:#fff;display:inline-block;margin-bottom:8px}
  .ph ol{margin:0;padding-left:18px;font-size:12.5px;font-weight:600;color:var(--ink2);line-height:1.7}
  .tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
  table.tbl{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
  .tbl th{background:#F8FAFC;text-align:left;padding:11px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
  .tbl td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.5}
  .tbl tr:last-child td{border-bottom:none}
  .tbl .num{font-weight:800;color:var(--faint);width:40px}
  .tbl .role{font-weight:800;white-space:nowrap}
  .notes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .note{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .note b{display:block;font-size:14px;margin-bottom:6px}
  .note p{margin:0;font-size:13px;color:var(--ink2);line-height:1.6}
  .note.chk{border-color:#FDE68A;background:#FFFBEB}

  /* ── 제품 페이지 (체크리스트) ── */
  .back{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 10px;border-radius:12px;font-weight:700;color:var(--ink2);background:#fff;border:1px solid var(--line);margin-bottom:12px}
  .back:hover{background:#F9FAFB}
  .pcard{border:1px solid;border-radius:18px;padding:16px 18px}
  .pcard .row1{display:flex;align-items:center;gap:8px}
  .pcard .row1 .sp{flex:1}
  .pcard .bchip{font-size:12px;font-weight:800;padding:5px 10px;border-radius:8px}
  .pname{margin:10px 0 12px;font-size:24px;font-weight:800;letter-spacing:-.02em;word-break:keep-all}
  .pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
  .pmeta label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2)}
  .pmeta input{border:1px solid #D7DCE3;border-radius:10px;padding:0 10px;height:38px;background:#fff;outline:none;font-size:14px}
  .pmeta input[data-pf="lead"]{width:130px}
  .pmeta .dd{font-size:13px;font-weight:800;background:#fff;border-radius:8px;padding:5px 9px}
  .pcard .bar{margin-top:14px}
  .pcard .pct{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);margin-top:5px}
  .ck-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:22px 2px 4px}
  .ck-head b{font-size:18px;font-weight:800}
  .ck-head small{font-size:12.5px;color:var(--muted);font-weight:600}
  .phase-h{display:flex;align-items:center;gap:8px;margin:16px 2px 8px;font-size:13px;font-weight:800;color:var(--ink2)}
  .phase-h .who{font-size:11.5px;font-weight:800;border-radius:7px;padding:3px 8px}
  .ck{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .ck-row{display:grid;grid-template-columns:30px 190px minmax(0,1fr) 120px 150px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2);transition:background .3s}
  .ck-row:last-child{border-bottom:none}
  .ck-row.flash{background:#FFFBEB}
  .ck-box{display:flex;align-items:center;justify-content:center;cursor:pointer;width:30px;height:30px}
  .ck-box input{position:absolute;opacity:0;width:0;height:0}
  .ck-box span{width:24px;height:24px;border-radius:7px;border:2px solid #CBD5E1;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:900}
  .ck-box input:checked + span{background:var(--green);border-color:var(--green)}
  .ck-box input:checked + span::after{content:'✓'}
  .ck-box input:focus-visible + span{box-shadow:0 0 0 3px #BFDBFE}
  .ck-name b{display:block;font-size:14px;font-weight:800}
  .ck-name small{display:block;font-size:11.5px;color:var(--faint);font-weight:600;margin-top:1px}
  .ck-row.done .ck-name b{color:var(--faint);text-decoration:line-through}
  .ck-row input[type=text],.ck-row input:not([type]),.ck-row textarea,.ck-row input[type=date]{width:100%;border:1px solid transparent;background:#F6F8FA;border-radius:9px;padding:8px 10px;outline:none;font-size:13.5px;min-height:38px}
  .ck-row textarea{resize:none;overflow:hidden;line-height:1.45;display:block}

<script>
// ═══════════════════════════════════════════════════════════════
// 넷폼 런칭보드 — 제품 샘플 수령 → 디자인 완료(상세페이지·섬네일 세팅)
// 1팀·2팀·디자이너·외주업체 공용 · Firestore 실시간 공유
// 저장 위치: pour-os/launch-board/products/{제품} — 이미 배포된 pour-os/{doc=**} 규칙으로 읽기/쓰기 (규칙 추가 배포 불필요)
// ═══════════════════════════════════════════════════════════════
firebase.initializeApp({
  apiKey: "AIzaSyBbct9tO8nCUCjz4s9GnXQLkHuHe2FFyyU",
  authDomain: "pour-app-new.firebaseapp.com",
  projectId: "pour-app-new",
  storageBucket: "pour-app-new.firebasestorage.app",
  messagingSenderId: "411031141847",
  appId: "1:411031141847:web:e658174fd4b9652cdadf92"
});
const db = firebase.firestore();
const COL = 'pour-os/launch-board/products';
const FV = firebase.firestore.FieldValue;

// ── 브랜드 (카드 색) ──
const BRANDS = {
  grohome:   { name:'그로홈',     icon:'🏡', bg:'#FFF3E8', bd:'#F8D5B4', ac:'#D9691A', chip:'#FDE3CB' },
  pourstore: { name:'POUR스토어', icon:'🧱', bg:'#EEF1FB', bd:'#CBD3F0', ac:'#31428C', chip:'#DCE2F6' },
  barasday:  { name:'바라스데이', icon:'🌿', bg:'#F1F9E7', bd:'#CDE6AE', ac:'#4A8418', chip:'#DDF0C6' },
};
const BRAND_KEYS = Object.keys(BRANDS);

// ── 업무 단계 (01~11) · 기본 담당 ──
const PHASES = [
  { k:'P1', name:'기획',           who:'기획1팀 · BM',              color:'#2563EB', light:'#EFF6FF', steps:['s01','s02'] },
  { k:'P2', name:'패키지 디자인',   who:'디자이너 · 민지',            color:'#DB2777', light:'#FDF2F8', steps:['s03','s04','s05'] },
  { k:'P3', name:'상세페이지 기획', who:'기획1팀 · BM',              color:'#7C3AED', light:'#F5F3FF', steps:['s06'] },
  { k:'P4', name:'촬영 · 제작',     who:'1팀 · 채림 · BM · 외주',     color:'#0891B2', light:'#ECFEFF', steps:['s07','s08','s09','s10'] },
  { k:'P5', name:'최종 검수',       who:'BM · 본부장',               color:'#059669', light:'#ECFDF5', steps:['s11'] },
];
const STEPS = [
  { id:'s01', name:'제품 샘플 수령',     in:'제조사 샘플 (앞단 1팀 진행분)',   out:'샘플 실물 + 제품 스펙(용량·성분·규격) 공유' },
  { id:'s02', name:'기획',               in:'판매전략기획 결과',             out:'디자인 브리프 (타깃·셀링포인트·표기 문구)' },
  { id:'s03', name:'제품 스티커 디자인', in:'디자인 브리프 · 표기 문구',     out:'스티커 최종 시안 → 인쇄 발주' },
  { id:'s04', name:'단상자 디자인',      in:'디자인 브리프 · 칼선 규격',     out:'단상자 최종 시안 → 인쇄 발주' },
  { id:'s05', name:'제품 설명서 디자인', in:'사용법 · 주의사항 원고',        out:'설명서 최종본 → 인쇄 발주' },
  { id:'s06', name:'상세페이지 기획',    in:'브리프 · 패키지 시안',          out:'상세 구성안 · 카피 · 촬영 컷 리스트' },
  { id:'s07', name:'제품 촬영',          in:'촬영 컷 리스트 · 완성 패키지',  out:'누끼 · 연출 · 사용 컷 원본' },
  { id:'s08', name:'상세페이지 디자인',  in:'상세 구성안 · 촬영 원본',       out:'상세페이지 완성본' },
  { id:'s09', name:'섬네일 촬영',        in:'채널별 섬네일 규격',            out:'섬네일 원본 컷' },
  { id:'s10', name:'섬네일 디자인',      in:'섬네일 원본 컷',                out:'채널 규격별 섬네일' },
  { id:'s11', name:'최종 검수 · 세팅',   in:'상세페이지 · 섬네일 완성본',    out:'채널 등록(세팅) 완료 = 디자인 완료' },
];
const STEP_BY = Object.fromEntries(STEPS.map((s,i)=>[s.id,{...s,no:String(i+1).padStart(2,'0'),phase:PHASES.find(p=>p.steps.includes(s.id))}]));
const PEOPLE_BASE = ['민지','채림','BM','본부장','기획1팀','기획2팀','디자이너','외주'];

// ── 초기 데이터 (전달받은 그로홈 진행표 9종) — 컬렉션이 비어 있을 때 1회만 등록 ──
const SEED = (()=>{
  const blank = () => Object.fromEntries(STEPS.map(s=>[s.id,{status:'todo',owner:'',due:'',note:''}]));
  const mk = (id,name) => ({ id, brand:'grohome', name, launchDate:'', lead:'', memo:'', stages:blank() });
  const list = [
    mk('a28b1909-eaf5-4497-8e45-962f12288c2f','스티커 프라이머'),
    mk('7f1e549c-bb83-410a-9ce5-fb0cc11fc74f','2in1 철제용 페인트'),
    mk('7d4b99ce-9792-484d-82f1-41de1054a26e','2in1 벽체용 페인트'),
    mk('b87aacb8-d890-4a48-b0c3-20f3d57d17da','2in1 목재용 페인트'),
    mk('8205ff40-6ae2-48ab-9d88-1cfe33f5746c','루바월'),
    mk('92c6276e-173d-4004-8825-3ea8f91e5d3a','아트월'),
    mk('ce8b8ece-d0fd-46ae-b480-3bbb4791c693','흡음재 1'),
    mk('d6f9a4d5-332c-4fee-a4fa-b907a544f71b','흡음재 2'),
    mk('0427d606-d210-426c-bff1-6cd2be35eb82','타일카펫'),
  ];
  const set = (i,sid,v) => Object.assign(list[i].stages[sid], v);
  set(0,'s03',{status:'done',note:'스티커 라벨 디자인 완료. 업체에 견적 및 출고 일정 확인 요청 완료. 10월 7~8일 출고 가능.'});
  set(0,'s06',{status:'doing',note:'전달받은 미쿠아케 상세페이지 내용 확인 완료. 전체 기획 완료 여부는 확인 필요.'});
  set(0,'s08',{note:'기존 그로홈 상세페이지 디자인에 맞춰 한국어 버전 제작 예정.'});
  [1,2,3].forEach(i=>{
    set(i,'s03',{status:'doing',note:'3종 공통 현황: 단상자 및 라벨 초안 검토, 수정사항 정리 및 시안 제작 중.'});
    set(i,'s04',{status:'doing',note:'3종 공통 현황: 단상자 및 라벨 초안 검토, 수정사항 정리 및 시안 제작 중.'});
    set(i,'s08',{note:'기존 코트재 신제품 9종의 이미지 및 카피 활용 예정.'});
  });
  set(4,'s08',{status:'doing',note:'상세페이지 1차 작성 완료. 최종 디자인 완료 여부는 확인 필요.'});
  set(5,'s08',{status:'doing',owner:'채림',note:'아트월 이미지 제작 중. 촬영 여부는 미확인.'});
  return list;
})();

// ── 상태 ──
let items = [];            // 전체 문서 (삭제 포함)
let loaded = false, loadErr = '';
let view = 'home';         // home | week | cal | guide | trash | product
let brandTab = 'all';
let query = '';
let calMonth = monthStart(new Date());
let calSel = '';
let weekOff = 0;            // 주간 일정: 0=이번 주, -1=지난주, 1=다음 주
let openId = null, prevView = 'home', pendingRender = false;
let me = '';
try { me = localStorage.getItem('launchBoardName') || ''; } catch(e) {}

// ── 유틸 ──
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function monthStart(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function today(){ return ymd(new Date()); }
function parse(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function diffDays(s){ return Math.round((parse(s) - parse(today())) / 86400000); }
function dday(s){ if(!s) return ''; const n = diffDays(s); return n===0 ? 'D-DAY' : n>0 ? 'D-'+n : 'D+'+(-n); }
const WD = ['일','월','화','수','목','금','토'];
function fmtDate(s, withWd){ if(!s) return ''; const d = parse(s); return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate()) + (withWd ? ' ('+WD[d.getDay()]+')' : ''); }
function fmtShort(s){ if(!s) return ''; const d = parse(s); return (d.getMonth()+1)+'/'+d.getDate(); }
function weekRange(off = 0){ const t = parse(today()); const dow = (t.getDay()+6)%7; const mon = new Date(t); mon.setDate(t.getDate()-dow+off*7); const sun = new Date(mon); sun.setDate(mon.getDate()+6); return [ymd(mon), ymd(sun)]; }
function brandOf(p){ return BRANDS[p.brand] || { name:p.brandName||'기타', icon:'📦', bg:'#F3F4F6', bd:'#E5E7EB', ac:'#4B5563', chip:'#E5E7EB' }; }
function stg(p, sid){ return (p.stages && p.stages[sid]) || { status:'todo', owner:'', due:'', note:'' }; }
function isOver(s){ return s.due && s.status!=='done' && s.status!=='skip' && s.due < today(); }
function progress(p){
  const all = STEPS.map(s=>stg(p,s.id));
  const used = all.filter(x=>x.status!=='skip');
  const done = used.filter(x=>x.status==='done').length;
  return { done, total:used.length, pct: used.length ? Math.round(done/used.length*100) : 0 };
}
function overdueList(p){ return STEPS.filter(s=>isOver(stg(p,s.id))); }
function live(){ return items.filter(p=>!p.deletedAt); }
function matchQ(p){
  if (!query) return true;
  const q = query.toLowerCase();
  const hay = [p.name, brandOf(p).name, p.lead, p.memo, ...STEPS.map(s=>stg(p,s.id).owner)].join(' ').toLowerCase();
  return hay.includes(q);
}
function sortByLaunch(a,b){
  if (!a.launchDate && !b.launchDate) return (a.name||'').localeCompare(b.name||'','ko');
  if (!a.launchDate) return 1; if (!b.launchDate) return -1;
  return a.launchDate.localeCompare(b.launchDate);
}
function people(){
  const set = new Set(PEOPLE_BASE);
  live().forEach(p=>{ if(p.lead) set.add(p.lead); STEPS.forEach(s=>{ const o = stg(p,s.id).owner; if(o) set.add(o); }); });
  if (me) set.add(me);
  return [...set];
}
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.remove('hidden'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.add('hidden'),2600); }
function nowIso(){ return new Date().toISOString(); }
function who(){ return me || '이름 없음'; }

// ═══ Firestore 실시간 구독 ═══
let seeding = false;
db.collection(COL).onSnapshot(snap => {
  console.log(`[${COL}] ${snap.size}건 로드`);
  items = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  loaded = true; loadErr = '';
  if (snap.empty && !snap.metadata.fromCache && !seeding) seed();
  renderAll(false);
}, err => {
  console.error(`[${COL}] 로드 실패:`, err);
  loaded = true;
  loadErr = '데이터를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 해주세요. (' + (err.code || err.message) + ')';
  renderAll();
});

async function seed(){
  seeding = true;
  try {
    const batch = db.batch();
    const at = nowIso();
    SEED.forEach(p => {
      const { id, ...rest } = p;
      batch.set(db.collection(COL).doc(id), { ...rest, history:[{ at, by:'시스템', text:'기존 그로홈 진행표에서 가져옴' }], createdAt:at, createdBy:'시스템', updatedAt:at, updatedBy:'시스템', deletedAt:null });
    });
    await batch.commit();
    console.log(`[${COL}] 초기 데이터 ${SEED.length}건 등록`);
  } catch(e) { console.error(`[${COL}] 초기 등록 실패:`, e); toast('초기 데이터 등록 실패: '+(e.code||e.message)); }
}

async function writeDoc(id, patch, historyText){
  if (!me) { askName(); return false; }
  const at = nowIso();
  const data = { ...patch, updatedAt:at, updatedBy:who() };
  if (historyText) data.history = FV.arrayUnion({ at, by:who(), text:historyText });
  try { await db.collection(COL).doc(id).update(data); return true; }
  catch(e){ console.error(`[${COL}] 저장 실패:`, e); toast('저장 실패: '+(e.code||e.message)); return false; }
}

function launchesByDay(){

  live().forEach(p=>{ if(p.launchDate){ (map[p.launchDate] = map[p.launchDate] || []).push(p); } });

function calGrid(big){
  const map = launchesByDay();
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y,m,1), start = new Date(first); start.setDate(1 - first.getDay());
  const t = today();
  let html = WD.map(w=>`<div class="wd">${w}</div>`).join('');
  for (let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    if (i>=35 && d.getMonth()!==m) break;
    const key = ymd(d), list = map[key] || [];
    const cls = ['d', d.getMonth()!==m?'out':'', key===t?'today':'', key===calSel?'sel':'', list.length?'has':''].join(' ');
    const dots = `<div class="dots">${list.slice(0,4).map(p=>`<i style="background:${brandOf(p).ac}"></i>`).join('')}</div>`;
    const evs = big ? list.slice(0,3).map(p=>`<span class="ev" style="background:${brandOf(p).chip};color:${brandOf(p).ac}">${esc(p.name)}</span>`).join('') + (list.length>3?`<span class="ev" style="color:var(--muted)">+${list.length-3}</span>`:'') : '';
    html += `<div class="${cls}" ${list.length?`data-day="${key}"`:''}>${big?`<span class="num">${d.getDate()}</span>`:d.getDate()}${evs}${dots}</div>`;
  }
  return html;
}

// ── 주간 일정 (BM·본부장 주 1회 점검) ──
// 주간 일정: 그 주 월~일에 마감인 단계 + 출시일
function weekData(){
  const L = live(), [ws,we] = weekRange(weekOff);
  const days = [];
  for (let i=0;i<7;i++){ const d = parse(ws); d.setDate(d.getDate()+i); days.push({ key:ymd(d), d, evs:[] }); }
  const byKey = Object.fromEntries(days.map(x=>[x.key,x]));
  L.forEach(p=>{
    if (p.launchDate && byKey[p.launchDate]) byKey[p.launchDate].evs.push({ kind:'launch', p });
    STEPS.forEach(s=>{ const x = stg(p,s.id); if (x.due && byKey[x.due] && x.status!=='skip') byKey[x.due].evs.push({ kind:'step', p, sid:s.id, x }); });
  });
  days.forEach(dy=>dy.evs.sort((a,b)=>(a.kind==='launch'?-1:0)-(b.kind==='launch'?-1:0) || (a.x&&a.x.status==='done')-(b.x&&b.x.status==='done')));
  const over = [];
  L.forEach(p=>STEPS.forEach(s=>{ const x = stg(p,s.id); if (isOver(x)) over.push([p,s.id,x.due]); }));
  over.sort((a,b)=>a[2].localeCompare(b[2]));
  return { ws, we, days, over };
}
function viewWeek(){
  const w = weekData(), t = today();
  const title = weekOff===0 ? '이번 주' : weekOff===-1 ? '지난주' : weekOff===1 ? '다음 주' : (weekOff>0 ? weekOff+'주 뒤' : (-weekOff)+'주 전');
  const ev = e => {
    const b = brandOf(e.p);

    const st = STEP_BY[e.sid], done = e.x.status==='done', over = isOver(e.x);
    return `<button class="wev ${done?'done':''} ${over?'over':''}" data-open="${e.p.id}" data-step="${e.sid}" style="background:${b.bg};border-left-color:${b.ac}">
      <b>${done?'✓ ':''}${esc(e.p.name)}</b><span>${st.name}${e.x.owner?' · '+esc(e.x.owner):''}</span></button>`;
  };
  return `
    <div class="h2"><h2>주간 일정</h2><span class="sp"></span>
      <div class="wk-nav"><button data-wk="-1" aria-label="이전 주">‹</button><button data-wk="0">이번 주</button><button data-wk="1" aria-label="다음 주">›</button></div>
      <button class="btn" data-copy-week="">📋 주간 보고 복사</button></div>
    <p class="sub"><b>${title}</b> · ${fmtDate(w.ws)} ~ ${fmtDate(w.we)} · 단계별 마감일과 출시일이 날짜에 표시돼요. 누르면 체크리스트가 열려요.</p>
    ${w.over.length ? `<div class="wk-over"><b>⏰ 마감 지남 ${w.over.length}건</b>${w.over.map(([p,sid,d])=>`<button data-open="${p.id}" data-step="${sid}">${esc(p.name)} · ${STEP_BY[sid].name} (${fmtShort(d)})</button>`).join('')}</div>` : ''}
    <div class="wkg">${w.days.map((dy,i)=>`
      <div class="wday ${dy.key===t?'today':''} ${i>=5?'wkend':''}">
        <div class="dh">${WD[dy.d.getDay()]}<small>${dy.d.getMonth()+1}/${dy.d.getDate()}</small></div>
        <div class="evs">${dy.evs.length ? dy.evs.map(ev).join('') : '<div class="none">일정 없음</div>'}</div>
      </div>`).join('')}</div>
    <div class="wk-legend">${BRAND_KEYS.map(k=>`<span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${BRANDS[k].ac};margin-right:5px"></i>${BRANDS[k].name}</span>`).join('')}<span>✓ 흐리게 = 완료</span><span style="color:var(--red)">빨간 글씨 = 마감 지남</span></div>`;
}
function weekText(){
  const w = weekData();
  let t = `[런칭보드 주간 일정] ${fmtDate(w.ws)} ~ ${fmtDate(w.we)}\n`;
  w.days.forEach(dy=>{
    if (!dy.evs.length) return;
    t += `\n■ ${dy.d.getMonth()+1}/${dy.d.getDate()} (${WD[dy.d.getDay()]})\n`;
    t += dy.evs.map(e => e.kind==='launch' ? `- 🚀 [${brandOf(e.p).name}] ${e.p.name} 출시`
      : `- ${e.x.status==='done'?'✅':'⬜'} [${brandOf(e.p).name}] ${e.p.name} · ${STEP_BY[e.sid].name}${e.x.owner?' ('+e.x.owner+')':''}`).join('\n') + '\n';
  });
  if (w.over.length) t += `\n■ ⏰ 마감 지남 ${w.over.length}건\n` + w.over.map(([p,sid,d])=>`- [${brandOf(p).name}] ${p.name} · ${STEP_BY[sid].name} (${stg(p,sid).owner||'담당 미지정'}, ${fmtShort(d)})`).join('\n') + '\n';
  t += `\n바로가기: ${location.origin}${location.pathname}`;
  return t;
}

    <div class="notes">
      <div class="note"><b>1. 단계마다 책임자 1명</b><p>담당 칸에는 팀 이름이 아니라 <b>실제 책임자 이름 1명</b>을 적어요. 07~10단계처럼 여러 주체(1팀·채림·BM·외주)가 함께하면 누락되기 쉬워요.</p></div>
      <div class="note"><b>2. 마감일은 담당자가 직접</b><p>일을 받으면 담당자가 마감일을 입력해요. 마감이 지나면 빨간색으로 표시되고 '주간 일정'에 올라가요.</p></div>
      <div class="note"><b>3. 끝나면 체크</b><p>단계가 끝나면 체크박스를 눌러요. 컨펌이 필요한 단계는 BM 확인까지 받은 뒤 체크해요. 할 일 칸에는 지금 해야 할 내용을 짧게 적어요.</p></div>
      <div class="note"><b>4. 주 1회 BM·본부장 점검</b><p>'주간 일정' 화면에서 요일별 마감·출시와 마감 지난 단계를 한 번에 보고, '📋 주간 보고 복사'로 단톡에 공유해요.</p></div>
    </div>
    <h4 style="margin:22px 2px 10px;font-size:13px;color:var(--muted)">⑤ 구조 점검 · 정리가 필요한 부분</h4>
    <div class="notes">
      <div class="note chk"><b>샘플 수령이 두 번 나와요</b><p>앞단(1팀)의 '샘플 수령'과 01단계가 겹쳐요. 01단계는 <b>"샘플·스펙을 디자인 쪽에 넘겨준 시점"</b>으로 정하면 경계가 분명해져요.</p></div>
      <div class="note chk"><b>판매전략기획 ↔ 02 기획</b><p>앞단 마지막이 판매전략기획이라 02 기획과 겹쳐 보여요. 02는 <b>판매전략을 디자인 브리프(타깃·셀링포인트·표기 문구)로 옮기는 단계</b>로 두는 걸 추천해요.</p></div>
      <div class="note chk"><b>03~05와 06은 동시에 진행 가능</b><p>패키지 디자인(디자이너·민지)과 상세페이지 기획(1팀·BM)은 담당이 달라서 같이 진행할 수 있어요. 06을 03~05 완료까지 기다리게 하면 출시가 늦어져요.</p></div>
      <div class="note chk"><b>'디자인 완료'의 기준</b><p>11단계(BM·본부장)는 <b>상세페이지·섬네일이 판매 채널에 등록(세팅)까지 끝난 것</b>을 완료로 봐요. 파일만 완성된 상태와 구분돼요.</p></div>
    </div>`;
}

// ── 휴지통 ──
function viewTrash(){
  const del = items.filter(p=>p.deletedAt).sort((a,b)=>(b.deletedAt||'').localeCompare(a.deletedAt||''));
  return `<div class="h2"><h2>휴지통</h2></div><p class="sub">삭제한 제품은 여기 남아 있어요. 언제든 되살릴 수 있어요.</p>
    <div class="wk-sec">${del.length ? del.map(p=>{const b=brandOf(p);return `<div class="wk-row"><span class="bdot" style="background:${b.ac}"></span><span class="mid"><b>${esc(p.name)}</b><span>${esc(b.name)} · ${esc(p.deletedBy||'')} 삭제 · ${fmtShort((p.deletedAt||'').slice(0,10))}</span></span><button class="btn sm" data-restore="${p.id}">↩ 되살리기</button></div>`;}).join('') : '<div class="wk-none">비어 있어요</div>'}</div>`;
}

// ═══ 제품 페이지 (체크리스트) ═══
function viewProduct(p){
  const b = brandOf(p), pr = progress(p);
  const hist = (p.history||[]).slice().sort((a,c)=>(c.at||'').localeCompare(a.at||'')).slice(0,30);
  const ddColor = !p.launchDate ? 'var(--faint)' : diffDays(p.launchDate)<0 ? 'var(--red)' : b.ac;
  return `
    <button class="back" data-back="">← 전체 제품</button>
    <div class="pcard" style="background:${b.bg};border-color:${b.bd}">
      <div class="row1"><span class="bchip" style="background:${b.chip};color:${b.ac}">${esc(b.name)}</span><span class="sp"></span>
        <button class="btn sm" data-link="${p.id}">🔗 링크</button><button class="btn sm" data-info-edit="">✏️ 수정</button></div>
      <h1 class="pname">${esc(p.name)}</h1>
      <div class="pmeta">
        <label>🚀 출시일 <input type="date" data-pf="launchDate" value="${esc(p.launchDate)}"></label>
        ${p.launchDate ? `<span class="dd" style="color:${ddColor}">${dday(p.launchDate)}</span>` : ''}
        <label>👤 총괄 <input data-pf="lead" value="${esc(p.lead)}" placeholder="이름" list="peopleList"></label>
      </div>
      <div class="bar"><i style="width:${pr.pct}%;background:${b.ac}"></i></div>
      <div class="pct"><span>완료 ${pr.done}/${pr.total} 단계</span><span>${pr.pct}%</span></div>
    </div>
    <div class="ck-head"><b>체크리스트</b><small>끝난 단계는 체크 · 할 일·담당·마감일은 적으면 자동 저장돼요</small></div>
    ${PHASES.map(ph=>`
      <div class="phase-h"><span style="color:${ph.color}">●</span>${ph.name}<span class="who" style="background:${ph.light};color:${ph.color}">${ph.who}</span></div>
      <div class="ck">${ph.steps.map(sid=>ckRow(p,sid)).join('')}</div>`).join('')}
    <details class="hist-d"><summary>🕘 변경 기록 ${hist.length}건</summary>
      <div class="hist">${hist.length ? hist.map(h=>`<div><small>${fmtShort((h.at||'').slice(0,10))} ${esc(h.by)}</small>${esc(h.text)}</div>`).join('') : '<div>아직 기록이 없어요</div>'}</div></details>
    <datalist id="peopleList">${people().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`;
}
function ckRow(p, sid){
  const s = stg(p,sid), st = STEP_BY[sid], done = s.status==='done', over = isOver(s);
  return `<div class="ck-row ${done?'done':''} ${over?'over':''}" id="step-${sid}">
    <label class="ck-box" title="완료 체크"><input type="checkbox" data-ck="${sid}" ${done?'checked':''} aria-label="${esc(st.name)} 완료"><span></span></label>
    <div class="ck-name"><b>${st.no} ${st.name}</b><small>${esc(st.phase.who)}</small></div>
    <textarea rows="1" data-sid="${sid}" data-sf="note" placeholder="해야 할 내용">${esc(s.note)}</textarea>
    <div class="ck-meta">
      <input data-sid="${sid}" data-sf="owner" value="${esc(s.owner)}" placeholder="담당" list="peopleList" aria-label="담당">
      <input type="date" data-sid="${sid}" data-sf="due" value="${esc(s.due)}" aria-label="마감기한" title="마감기한">
    </div>
  </div>`;
}
function grow(t){ t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }

function openProduct(id, sid, focusLaunch){
  if (view!=='product') prevView = view;
  view = 'product'; openId = id;
  try { history.pushState({ p:id }, '', '?p='+encodeURIComponent(id)); } catch(e){}
  renderAll(); window.scrollTo({ top:0 });
  setTimeout(()=>{
    if (sid) { const el = document.getElementById('step-'+sid); if (el) { el.scrollIntoView({ block:'center' }); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'), 1600); } }
    if (focusLaunch) { const el = document.querySelector('[data-pf="launchDate"]'); if (el) el.focus(); }
  }, 60);
}
function goBack(){
  if (history.state && history.state.p) { history.back(); return; }
  view = prevView || 'home'; openId = null;
  try { history.replaceState(null, '', location.pathname); } catch(e){}
  renderAll(); window.scrollTo({ top:0 });
}
window.addEventListener('popstate', () => {
  let pid = null; try { pid = new URLSearchParams(location.search).get('p'); } catch(e){}
  if (pid) { if (view!=='product') prevView = view; view = 'product'; openId = pid; }
  else { view = prevView || 'home'; openId = null; }
  renderAll(); window.scrollTo({ top:0 });
});

// ═══ 모달 ═══
function modal(html){ $('modalRoot').innerHTML = `<div class="modal" id="mdl"><div class="in">${html}</div></div>`; }
function closeModal(){ $('modalRoot').innerHTML = ''; }

function askName(force){
  if (me && !force) return;
  modal(`<h3>👋 이름을 알려주세요</h3><p class="d">누가 입력·수정했는지 기록에 남기기 위해서예요. 이 기기에 한 번만 저장돼요.</p>
    <div class="form"><label>이름 (소속 함께 적어도 좋아요)<input id="nmIn" value="${esc(me)}" placeholder="예: 민지 / 채림 / 외주 OO스튜디오" maxlength="30"></label></div>
    <div class="m-act">${me?'<button class="btn" data-mclose="">취소</button>':''}<button class="btn pri" id="nmOk">시작하기</button></div>`);
  setTimeout(()=>$('nmIn') && $('nmIn').focus(), 50);
}
function saveName(){
  const v = ($('nmIn').value||'').trim();
  if (!v) { $('nmIn').focus(); return; }
  me = v; try { localStorage.setItem('launchBoardName', v); } catch(e){}
  closeModal(); renderAll(); toast(v+'님, 반가워요!');
}

function openInfo(){
  const p = items.find(x=>x.id===openId); if (!p) return;
  if (!me) { askName(); return; }
  modal(`<h3>✏️ 제품 수정</h3><p class="d">브랜드와 제품명을 바꿀 수 있어요.</p>
    <div class="form">
      <label>브랜드<div class="bsel" id="infoBrand">${brandBtns(p.brand)}</div></label>
      <label>제품명 · 프로젝트명<input id="fName" value="${esc(p.name)}" maxlength="80"></label>
    </div>
    <div class="m-act"><button class="btn danger" data-del="${p.id}" style="margin-right:auto">🗑️ 삭제</button><button class="btn" data-mclose="">취소</button><button class="btn pri" data-info-save="">저장</button></div>`);
}
let addBrand = 'grohome';
function openAdd(brand){
  if (!me) { askName(); return; }
  addBrand = BRANDS[brand] ? brand : (brandTab!=='all' ? brandTab : 'grohome');
  modal(`<h3>＋ 새 제품 등록</h3><p class="d">등록하면 11단계가 자동으로 만들어져요. 나머지는 상세 화면에서 채우면 돼요.</p>
    <div class="form">
      <label>브랜드<div class="bsel" id="addBrand">${brandBtns(addBrand)}</div></label>
      <label>제품명 · 프로젝트명<input id="aName" placeholder="예: 2in1 철제용 페인트" maxlength="80"></label>
      <div class="two"><label>출시 목표 예정일<input id="aLaunch" type="date"></label><label>총괄 담당 (PM)<input id="aLead" placeholder="예: 민지" list="peopleList2"></label></div>
      <datalist id="peopleList2">${people().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    </div>
    <div class="m-act"><button class="btn" data-mclose="">취소</button><button class="btn pri" id="addOk">등록</button></div>`);
  setTimeout(()=>$('aName') && $('aName').focus(), 50);
}
function brandBtns(sel){ return BRAND_KEYS.map(k=>`<button type="button" data-b="${k}" style="${sel===k?`background:${BRANDS[k].chip};border-color:${BRANDS[k].ac};color:${BRANDS[k].ac}`:''}">${BRANDS[k].name}</button>`).join(''); }
async function saveAdd(){
  const name = ($('aName').value||'').trim();
  if (!name) { $('aName').focus(); toast('제품명을 입력해주세요'); return; }
  const at = nowIso();
  const doc = { brand:addBrand, name, launchDate:$('aLaunch').value||'', lead:($('aLead').value||'').trim(), memo:'',
    stages:Object.fromEntries(STEPS.map(s=>[s.id,{status:'todo',owner:'',due:'',note:''}])),
    history:[{ at, by:who(), text:'제품 등록' }], createdAt:at, createdBy:who(), updatedAt:at, updatedBy:who(), deletedAt:null };
  try {
    const ref = await db.collection(COL).add(doc);
    console.log(`[${COL}] 등록: ${ref.id}`);
    closeModal(); toast('등록했어요!'); brandTab = 'all'; view = 'home'; renderAll(); openProduct(ref.id);
  } catch(e){ console.error(`[${COL}] 등록 실패:`, e); toast('등록 실패: '+(e.code||e.message)); }
}

// ═══ 저장 동작 (체크·입력하면 바로 저장) ═══
async function saveStepField(sid, field, value){
  const p = items.find(x=>x.id===openId); if (!p) return;
  const prev = stg(p,sid), st = STEP_BY[sid];
  if ((prev[field]||'') === value) return;
  const msg = field==='status' ? (value==='done' ? '완료 체크' : '체크 해제')
            : field==='note' ? '할 일: ' + (value ? value.split('\n')[0].slice(0,40) : '지움')
            : field==='owner' ? '담당 ' + (value || '없음')
            : '마감 ' + (value ? fmtShort(value) : '없음');
  const ok = await writeDoc(p.id, { ['stages.'+sid+'.'+field]: value, ['stages.'+sid+'.updatedAt']: nowIso(), ['stages.'+sid+'.updatedBy']: who() }, `${st.no} ${st.name} · ${msg}`);
  if (ok) toast(field==='status' && value==='done' ? '✅ 완료 체크했어요' : '저장했어요');
  else renderMain();
}
async function saveProductField(field, value){
  const p = items.find(x=>x.id===openId); if (!p) return;
  if ((p[field]||'') === value) return;
  const msg = field==='launchDate' ? '출시일 ' + (value ? fmtDate(value) : '미정') : '총괄 ' + (value || '없음');
  const ok = await writeDoc(p.id, { [field]: value }, msg);
  if (ok) toast('저장했어요'); else renderMain();
}
async function saveInfo(){
  const p = items.find(x=>x.id===openId); if (!p) return;
  const name = ($('fName').value||'').trim();
  if (!name) { toast('제품명을 입력해주세요'); return; }
  const onB = document.querySelector('#infoBrand button[data-sel="1"]');
  const patch = { brand: onB ? onB.dataset.b : p.brand, name };
  const ch = [];
  if (patch.brand!==p.brand) ch.push('브랜드 '+brandOf(patch).name);
  if (patch.name!==p.name) ch.push('이름 '+patch.name);
  if (!ch.length) { closeModal(); return; }
  const ok = await writeDoc(p.id, patch, '정보 수정: '+ch.join(', '));
  if (ok) { closeModal(); toast('저장했어요'); }
}
async function softDelete(id){
  const p = items.find(x=>x.id===id); if (!p) return;
  if (!confirm(`'${p.name}'을(를) 휴지통으로 옮길까요?\n휴지통에서 언제든 되살릴 수 있어요.`)) return;
  const ok = await writeDoc(id, { deletedAt:nowIso(), deletedBy:who() }, '휴지통으로 이동');
  if (ok) { closeModal(); openId = null; view = 'home'; try { history.replaceState(null,'',location.pathname); } catch(e){} renderAll(); toast('휴지통으로 옮겼어요'); }
}
async function restore(id){
  const ok = await writeDoc(id, { deletedAt:null, deletedBy:'' }, '휴지통에서 되살림');
  if (ok) toast('되살렸어요');
}
async function copyText(text, okMsg){
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(okMsg); } catch(_) { toast('복사하지 못했어요'); }
    ta.remove();
  }
}

// ═══ 이벤트 (위임) ═══
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-open], [data-day]');
  if (!t) return;
  const d = t.dataset;
  if (d.back!==undefined) return goBack();
  if (t.id==='meBtn') return askName(true);
  if (t.id==='nmOk') return saveName();
  if (t.id==='addOk') return saveAdd();
  if (t.id==='qx') { $('q').value=''; query=''; t.classList.add('hidden'); return renderMain(); }
  if (d.mclose!==undefined) return closeModal();
  if (d.view) { view = d.view; calSel = ''; if (d.view==='week') weekOff = 0; renderAll(); window.scrollTo({top:0}); return; }
  if (d.brand) { brandTab = d.brand; return renderMain(); }
  if (d.wk!==undefined) { weekOff = d.wk==='0' ? 0 : weekOff + Number(d.wk); return renderMain(); }
  if (d.add!==undefined) return openAdd(d.add);
  if (d.cal) { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+Number(d.cal), 1); calSel=''; renderMiniCal(); if(view==='cal') renderMain(); return; }
  if (d.day) { calSel = calSel===d.day ? '' : d.day; renderMiniCal(); if(view==='cal') renderMain(); return; }
  if (d.b) { // 브랜드 선택 버튼 (등록·정보수정 공용)
    const wrap = t.parentElement;
    wrap.querySelectorAll('button').forEach(x=>{ x.style.cssText=''; x.dataset.sel=''; });
    const B = BRANDS[d.b]; t.style.cssText = `background:${B.chip};border-color:${B.ac};color:${B.ac}`; t.dataset.sel='1';
    if (wrap.id==='addBrand') addBrand = d.b;
    return;
  }
  if (d.infoEdit!==undefined) return openInfo();
  if (d.infoSave!==undefined) return saveInfo();
  if (d.del) return softDelete(d.del);
  if (d.restore) return restore(d.restore);
  if (d.link) return copyText(location.origin+location.pathname+'?p='+d.link, '이 제품 바로가기 링크를 복사했어요');
  if (d.copyWeek!==undefined) return copyText(weekText(), '주간 일정을 복사했어요. 단톡에 붙여넣기 하세요');
  if (d.open) return openProduct(d.open, d.step, d.editInfo);
});
// 체크·입력 저장: change = 체크박스·날짜는 즉시, 글자는 칸을 벗어날 때
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.ck) return saveStepField(d.ck, 'status', t.checked ? 'done' : 'todo');
  if (d.sf) return saveStepField(d.sid, d.sf, t.value.trim());
  if (d.pf) return saveProductField(d.pf, t.value.trim());
});
document.addEventListener('input', e => { if (e.target.tagName==='TEXTAREA' && e.target.dataset.sf) grow(e.target); });
document.addEventListener('focusin', e => { if (!me && $('main').contains(e.target) && /INPUT|TEXTAREA/.test(e.target.tagName)) { e.target.blur(); askName(); } });
document.addEventListener('focusout', () => { setTimeout(()=>{ if (pendingRender && !typing()) renderMain(); }, 400); });
document.addEventListener('keydown', e => {
  if (e.key==='Escape') { if ($('modalRoot').innerHTML) { if (me) closeModal(); } else if (view==='product' && !typing()) goBack(); }
  if (e.key==='Enter' && e.target.id==='nmIn') saveName();
  if (e.key==='Enter' && e.target.classList && e.target.classList.contains('card')) openProduct(e.target.dataset.open);
});
$('q').addEventListener('input', e => {
  query = e.target.value.trim(); $('qx').classList.toggle('hidden', !query);
  if (view!=='home') { view='home'; openId=null; try { history.replaceState(null,'',location.pathname); } catch(e){} renderNav(); }
  renderMain();
});

// 시작
try { const pid = new URLSearchParams(location.search).get('p'); if (pid) { view = 'product'; openId = pid; history.replaceState({ p:pid }, '', location.search); } } catch(e){}
renderAll();
if (!me) askName();
</script>
</body>
</html>
