<title>광고 운영 · POUR 마케팅 허브</title>
<!--
  광고 운영 — Aside 광고 일일 보고서 보기 (사용자 결정 2026-10-15 "광고 운영 내재화 + AI팀 매뉴얼 화면 (Aside 연동)")
  · 읽는 곳(pour-app-new · 공개 규칙 pour-os/{doc=**} · 로그인 없음 · 규칙 변경 없음):
      pour-os/v2/adreports/{YYYY-MM-DD} {date, title, md, summary, offs(JSON 글), longtail(JSON 글 · 없을 수 있음), by:'aside', at}
  · 쓰기 없음 — Aside 만 REST 로 올림 (pour-os-v2/CLAUDE.md 'Aside 전용 쓰기 경로')
  · 위 카드: 최신 보고서 요약 · 이번 주 끈 것 n개(offs) · 새 롱테일 n개(longtail · 칸 없으면 숨김)
  · [보고서] 위 한 줄 ‹ 고르기 › + 전체/일일/주간 → 보고서(제목 · 한 줄 결론 · 숫자 칸 · md(표 포함 · core.js mdLite = 모든 글자 escape)) · 주소 #YYYY-MM-DD
      2026-10-19 사장님 "보기 매우 불편해" → 보고서를 맨 위로 · 제안서 검증(기본 접힘)·운영 기준(접힌 한 줄)은 아래 · #aside 일 때만 운영 기준·지시문이 맨 위(펼침)
      없는 날짜 주소 = '아직 없어요' 안내 뒤 최신 (주소 그대로 · 올라오면 같은 주소로 보임) · 평일 09시 지나 오늘 일일이 없으면 안내 · [🔗 링크 복사](본부장님께 전달) · [🖨 인쇄](보고서만)
  · [끈 것·변경] 주소 #off — ① Aside 가 끈 것(일일 보고서 offs + 보고서 밖 처리분 AUTO_OFF.noted · 날짜·매체·캠페인·대상·조치·근거) + 규칙 점검(offAudit · 빨간 꼬리표만) + 처리 대기
      ② 외주 변경(changes) ③ 주간·월간 개수 — 2026-10-19 김송희 확정 "정해진 규칙 안에서는 Aside가 직접 끈다"(쿠팡 30일 1만 원+·주문 0 → 키워드 제외 · 메타 금요일 구매 10+·2주 180% 미만 → OFF)
  · [메타 판정] 금요일 증액/유지/종료/보류 + 근거 — 보고서 judges(JSON 글) 또는 본문 md 의 '판정' 칸 표 → 제안서 기준(350%+ 2주 · 200~350% · 180% 미만 2주 · 구매 10건)과 일치/다름 · 주소 #judge
  · 맨 위 '제안서 검증'(2026-10-15 "진짜 목적 = 데일리그로스 「넷폼_메타운영_제안서_202610」이 정답인지 실제 운영 데이터로 검증"):
      pour-os/v2/proposal/dailygrowth-202610 {title, at, by, json(baseline · structure · hypotheses H1~H6 · gaps_20261015)} — Aside 가 매일 갱신 · 읽기만
      기준선 vs 실제(최신 보고서 metrics → 없으면 보고서 글에서 읽음) · 가설 카드 · 현재 세팅과 제안서 구조 차이 · 규칙마다 출처 배지 [제안서 pXX]/[김송희 관리방안]/[Aside 추가]
      접기·펴기는 이 기기에만 기억(localStorage · 막히면 늘 펼침)
  · 외주 운영 기간 (2026-10-15 사장님 "메타·네이버·쿠팡 약 2개월 외주 · 세팅 분석만 · 데이터 쌓고 매일·금요일 보고"): 맨 위 띠(adops.js AD_MODE) + [Aside 지시문 복사](asideAdsText)
  · 외주 + 내부 관리 (2026-10-16 사장님 "외주 눈치볼 필요없었어 · 민지님이 분석관리해서 나에게 보고"): 띠에 김민지 → 사장님 매주 보고 · [예약 글 복사](asideAdsLaunch · 한 번만 넣음 → #aside 화면 지시문을 그대로) · [지시문 전체 복사]
      일일 = adreports/{YYYY-MM-DD} · 주간 = adreports/{금요일}-weekly (kind 'weekly') · [끈 것·변경] = Aside 끈 것(offs) + 외주 변경(changes) · 보고서 고르기 = 문서 id (#id)
  · 규칙 안 끄기 (2026-10-19 김송희): 운영 기준 상자 아래 '자동 끄기 규칙'(adops.AUTO_OFF) · 지시문 판 2026-10-19 · 예약 글 판도 2026-10-19(3번 줄 바뀜 → 업무OS '확인할 것'에 새 예약 글 넣기)
  · 계산 adops.js (시험 node marketing-hub/adops.test.mjs)
-->

<style>
:root{--navy:#0D1B2A;--accent:#2563EB;--accent-l:#EFF6FF;--green:#059669;--green-l:#ECFDF5;--red:#DC2626;--red-l:#FEF2F2;

  --r:12px;--r-sm:8px;--shadow:0 1px 6px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,system-ui,'Segoe UI',sans-serif;font-size:14px}

  // 본문 맨 위 '# 제목' 줄은 위 제목과 같아 뺌
  const lines=String(r.md||'').replace(/\r/g,'').split('\n'), h1=lines.findIndex(l=>l.trim());
  const mdTitle=h1>=0&&/^#\s+/.test(lines[h1])?lines[h1].replace(/^#\s+/,'').trim():'';
  const body=mdTitle?lines.slice(h1+1).join('\n'):String(r.md||'');
  const title=r.title||mdTitle||r.date;
  return `${nav}${note}
    <article class="card rep" id="report">
      <div class="rep-h"><div class="rep-k"><span class="kind-l${wk?' w':''}">${wk?'주간':'일일'}</span>${esc(dayL(r.date))} · ${r.by==='aside'?'Aside':esc(r.by||'')} 올림${r.at?' '+esc(atL(r.at)):''}</div>
        <h1>${esc(title)}</h1>
        <div class="acts"><button type="button" id="copy-link">🔗 링크 복사</button><button type="button" id="print-rep">🖨 인쇄</button></div></div>
      ${r.summary?`<div class="tldr"><span>한 줄 결론</span>${esc(r.summary)}</div>`:''}${kpis}
      <div class="md">${body.trim()?A.srcTags(C.mdLite(body)):`<p>${esc(r.summary||'내용 없음')}</p>`}</div></article>`;
}
function vOff(){
  // 끈 것·변경 (2026-10-19 규칙 안 끄기) — ① Aside 가 끈 것 + 규칙 점검 + 처리 대기 ② 외주 변경 ③ 주간·월간
  const R=A.AUTO_OFF, L=A.changeLog(S.reps,todayKST(),R.noted), offs=L.offs, ch=L.changes, today=todayKST();
  const rule=R.on?`<div class="crit"><b>규칙 안에서는 Aside 가 직접 꺼요</b> <span class="sub">${esc(R.by)} ${esc(R.since)} 확정</span><br>쿠팡 ${srcB(R.coupang.src)} ${esc(R.coupang.t)} · 매일<br>메타 ${srcB(R.meta.src,R.meta.page)} ${esc(R.meta.t)}<br><span class="sub">${esc(R.human)} · '점검' = 규칙 밖으로 보이는 줄에 빨간 꼬리표 (막지는 않음 · 사람이 확인)</span></div>`:'';
  const med=Object.entries(L.offMedia).map(([m,n])=>`<span>${esc(m)}<b>${n}</b></span>`).join('');
  const cnt=`<div class="cnts"><span>오늘<b>${L.offToday}</b></span><span>이번 주<b>${L.offWeek}</b></span>${med}<span>점검<b style="color:${L.offBad?'var(--red)':'var(--green)'}">${L.offBad?`확인 ${L.offBad}`:'이상 없음'}</b></span></div>`;
  const pend=(R.pending||[]).length?`<div class="pend" id="off-pend"><b>처리 대기</b>${R.pending.map(x=>`<span>${esc(x.media)} ${esc(x.campaign)} 캠페인 · <b>${esc(x.target)}</b> — ${esc(x.note)} (${esc(dayL(x.date))})</span>`).join('')}</div>`:'';
  const chk=(x)=>!x.chk?'<span class="sub">규칙 전</span>':x.warn.length?x.warn.map(w=>`<span class="warn">${esc(w)}</span>`).join(' '):'<span class="okc">규칙 안</span>';
  const offT=offs.length?`<div class="tbl"><table class="offs ct" id="off-table"><thead><tr><th>날짜</th><th>매체</th><th>캠페인</th><th>대상</th><th>조치</th><th>근거</th><th>점검</th></tr></thead><tbody>${offs.map(x=>`<tr${x.warn&&x.warn.length?' class="warnrow"':''}>
      <td data-l="날짜" style="white-space:nowrap"><span>${esc(x.date?dayL(x.date):'')}${x.noted?' <span class="sub">처리 기록</span>':''}</span></td><td data-l="매체">${x.media?`<span class="med m-${esc(x.media)}">${esc(x.media)}</span>`:''}</td>
      <td data-l="캠페인">${esc(x.campaign)}</td><td data-l="대상"><b>${esc(x.target)}</b></td><td data-l="조치">${esc(x.what)}</td><td data-l="근거"><span>${A.srcTags(esc(x.note))}</span></td><td data-l="점검"><span>${chk(x)}</span></td></tr>`).join('')}</tbody></table></div>`
    :`<div class="empty">아직 끈 것이 없어요${R.on?' · 쿠팡은 매일 08:30, 메타는 금요일 08:30 에 규칙에 걸리는 것만 꺼요':''}</div>`;
  const noted=offs.some(x=>x.noted)?`<p class="crit sub">처리 기록 = 보고서를 올린 뒤 처리했다고 알려 준 것 · Aside 다음 일일 보고서 offs 에 들어오면 그 줄로 바뀌어요</p>`:'';
  const chT=ch.length?`<div class="tbl"><table class="offs ct"><thead><tr><th>날짜</th><th>누가</th><th>매체</th><th>캠페인</th><th>대상</th><th>무엇을</th><th>메모·근거</th></tr></thead><tbody>${ch.map(x=>`<tr>
      <td data-l="날짜" style="white-space:nowrap">${esc(x.date?dayL(x.date):'')}</td><td data-l="누가">${esc(x.who)}</td><td data-l="매체">${x.media?`<span class="med m-${esc(x.media)}">${esc(x.media)}</span>`:''}</td>
      <td data-l="캠페인">${esc(x.campaign)}</td><td data-l="대상"><b>${esc(x.target)}</b></td><td data-l="무엇을">${esc(x.what)}</td><td data-l="메모·근거">${esc(x.note)}</td></tr>`).join('')}</tbody></table></div>`
    :'<div class="empty">아직 외주 변경이 없어요 · 외주업체가 세팅을 바꾸면 다음 날 일일 보고서에 모여요</div>';
  const wk=L.weeks.length?`<div class="tbl"><table><thead><tr><th>주</th><th class="n">끈 것·변경</th></tr></thead><tbody>${L.weeks.slice(0,12).map(x=>`<tr><td>${esc(A.weekL(x.w))}</td><td class="n">${x.n}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">없음</div>';
  const mo=L.months.length?`<div class="tbl"><table><thead><tr><th>월</th><th class="n">끈 것·변경</th></tr></thead><tbody>${L.months.slice(0,12).map(x=>`<tr><td>${esc(Number(x.m.slice(5,7)))}월 <span class="sub">${esc(x.m.slice(0,4))}</span></td><td class="n">${x.n}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">없음</div>';
  return `<div class="card" id="off-card"><h3>끈 것 ${offs.length} <span class="sub">Aside 일일 보고서 offs${offs.some(x=>x.noted)?' + 처리 기록':''} · 최신순 · ${esc(dayL(today))} 기준</span></h3>${rule}${cnt}${pend}${offT}${noted}</div>
    <div class="card"><h3>외주 변경 ${ch.length} <span class="sub">외주가 바꾼 세팅(일일 보고서 changes) · 최신순</span></h3>${chT}</div>
    <div class="grid2"><div class="card"><h3>주간 <span class="sub">월요일 시작 · 끈 것 + 변경</span></h3>${wk}</div><div class="card"><h3>월간</h3>${mo}</div></div>`;
}
function nextFri(){const t=todayKST(),d=new Date(t+'T00:00:00Z'),add=(5-d.getUTCDay()+7)%7;return C.addDays(t,add);}
function vJudge(){
  const J=A.judgeLog(S.reps);
  const crit=`<div class="crit"><b>외주 기간 기준</b> ${srcB(A.SRC.K)} 테스트 캠페인 ROAS 300% (넘으면 고정 캠페인으로 옮길 후보 · 못 넘으면 다음 소재) · 고정 캠페인(이긴 소재·타겟) 400~500% 유지 — 캠페인 이름에 '테스트'가 있으면 테스트로 봐요<br><span class="sub">참고 ${srcB(A.SRC.P)} 증액 350%+ 2주 → 예산 +20% · 유지 200~350% · 종료 180% 미만 2주 · 구매 10건 전 보류 — 외주 운영 기간 판정 = 외주업체 ${srcB(A.SRC.D)} · 비교 = 가을(Aside) ${srcB(A.SRC.A)}</span>${A.AUTO_OFF.on?`<br><b>자동 끄기</b> ${srcB(A.AUTO_OFF.meta.src,A.AUTO_OFF.meta.page)} ${esc(A.AUTO_OFF.meta.t)} — Aside 가 직접 (${esc(A.AUTO_OFF.by)} ${esc(A.AUTO_OFF.since)}) · <a href="#off">끈 것·변경 ›</a>`:''}</div>`;
  const cnt=`<div class="cnts">${A.JUDGE.map(j=>`<span>${j}<b>${J.count[j]}</b></span>`).join('')}<span>김송희 기준과 다름<b style="color:${J.kshDiff?'var(--red)':'inherit'}">${J.kshDiff}</b></span><span>(참고) 제안서와 다름<b>${J.diff}</b></span></div>`;
  const rows=J.rows.length?`<div class="tbl"><table class="ct"><thead><tr><th>날짜</th><th>캠페인</th><th>대상</th><th class="n">ROAS 14일</th><th class="n">ROAS 7일</th><th class="n">구매</th><th>외주 판정</th><th>근거</th><th>김송희 기준</th><th>비교</th><th>제안서 기준 (참고)</th></tr></thead><tbody>${J.rows.map(x=>`<tr>
      <td data-l="날짜" style="white-space:nowrap">${esc(x.date?dayL(x.date):'')}</td><td data-l="캠페인">${esc(x.campaign)}</td><td data-l="대상"><b>${esc(x.target)}</b></td>
      <td data-l="ROAS 14일" class="n">${pctL(x.roas14)}</td><td data-l="ROAS 7일" class="n">${pctL(x.roas)}</td><td data-l="구매" class="n">${x.purchases==null?'—':x.purchases}</td>
      <td data-l="외주 판정">${x.verdict?`<span class="st s-${esc(x.verdict)}">${esc(x.verdict)}</span>`:esc(x.verdictRaw)}</td><td data-l="근거">${esc(x.reason)}</td>
      <td data-l="김송희 기준">${x.ksh?`<span class="st s-${esc(x.ksh)}">${esc(x.ksh)}</span> `:''}<span class="sub">${esc(x.kshWhy)}</span></td><td data-l="비교"><span class="st s-${esc(x.kshMatch)}">${esc(x.kshMatch)}</span></td>
      <td data-l="제안서 기준 (참고)">${x.expect?`<span class="st s-${esc(x.expect)}">${esc(x.expect)}</span> `:''}<span class="sub">${esc(x.expectWhy)} · ${esc(x.match)}</span></td></tr>`).join('')}</tbody></table></div>`
    :`<div class="empty">아직 판정이 없어요 · 첫 금요일 판정 ${esc(dayL(nextFri()))} 16:00<br><span class="sub">금요일 주간 보고서의 judges 칸(또는 '판정' 칸이 있는 표)이 여기에 모여요</span></div>`;
  return `<div class="card"><h3>메타 판정 ${J.rows.length} <span class="sub">모든 보고서 · 최신순 · 판정 vs 김송희 기준 (제안서는 참고)</span></h3>${crit}${cnt}${rows}</div>`;
}
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  if(!S.loaded)return;
  // 순서 (2026-10-19 보기 개선): 보고서(또는 고른 탭) 먼저 → 제안서 검증(접힘) → 운영 기준·Aside 지시문(접힘) · #aside 면 지시문이 맨 위
  const view=S.view==='off'?vOff():S.view==='judge'?vJudge():vRep();
  const body=S.err?`<div class="msg" role="alert">${esc(S.err)}</div>`:S.asideTop?modeBar()+view+verify():view+verify()+modeBar();
  $('#app').innerHTML=body+`<p class="foot">Aside 가 매일 08:30 일일 · 금요일 16:00 주간 광고 보고서를 올려요 · 이 화면은 읽기만 해요<br>실행: ${A.AD_MODE.mode==='parallel'?`메타·네이버·쿠팡 = 외주업체 + ${esc(A.AD_MODE.manager)} (바꿀 것 직접 또는 외주에 전함)`:'외주 운영 기간 메타·네이버·쿠팡 = 외주업체'} ${srcB(A.SRC.D)} · 운영 기준 = 김송희 관리방안 ${srcB(A.SRC.K)} · Aside = ${A.AD_MODE.mode==='parallel'?'분석·바꿀 안':'분석·보고만'}${A.AUTO_OFF.on?' + 규칙 안 끄기(쿠팡 제외 키워드 · 메타 금요일 OFF)':' (끄거나 바꾸지 않음)'} · 예산·목표 = 본부장 ${srcB(A.SRC.P)}</p>`;
}
document.addEventListener('click',(e)=>{
  if(e.target.closest('#show-aside')){S.showText=!S.showText;render();return;}
  if(e.target.closest('#copy-aside')||e.target.closest('#copy-launch')){const b=e.target.closest('#copy-aside')||e.target.closest('#copy-launch'),txt=b.id==='copy-launch'?A.asideAdsLaunch():A.asideAdsText();
    const done=(ok)=>{b.textContent=ok?'복사했어요':'복사가 막혔어요 · 지시문 보기에서 길게 눌러 복사';if(!ok){S.showText=true;render();}};
    try{navigator.clipboard.writeText(txt).then(()=>done(true),(err)=>{console.error('[복사] 실패:',err);done(false);});}catch(err){console.error('[복사] 실패:',err);done(false);}return;}
  const k=e.target.closest('#kinds button');if(k){S.kind=k.dataset.k;const first=S.reps.find(x=>S.kind==='all'||(S.kind==='weekly')===A.isWeekly(x));if(first){S.cur=first.id;S.miss='';history.replaceState(null,'','#'+first.id);}render();return;}
  if(e.target.closest('#vtoggle')){vOpen=!vOpen;LSset('ads_verify_open2',vOpen?'1':'0');render();return;}
  const t=e.target.closest('#tabs button');if(t){S.view=t.dataset.v;history.replaceState(null,'',S.view!=='rep'?'#'+S.view:(S.cur?'#'+S.cur:location.pathname));render();window.scrollTo(0,0);return;}
  const d=e.target.closest('#rep-older,#rep-newer');if(d&&d.dataset.d){pickRep(d.dataset.d);return;}
  const cl=e.target.closest('#copy-link');if(cl){const u=location.origin+location.pathname+'#'+encodeURIComponent(S.cur);
    const done=(ok)=>{cl.textContent=ok?'✓ 복사했어요':'복사 막힘 · 주소창 주소를 보내 주세요';setTimeout(()=>{cl.textContent='🔗 링크 복사';},2000);};
    try{navigator.clipboard.writeText(u).then(()=>done(true),(err)=>{console.error('[링크 복사] 실패:',err);done(false);});}catch(err){console.error('[링크 복사] 실패:',err);done(false);}
    history.replaceState(null,'','#'+S.cur);return;}
  if(e.target.closest('#print-rep')){window.print();return;}
});
// 보고서 고르기 (‹ › · 고르기 칸) — 주소도 그 보고서로
function pickRep(id){S.cur=id;S.miss='';history.replaceState(null,'','#'+id);render();const a=$('#rnav');if(a&&a.getBoundingClientRect().top<0)a.scrollIntoView({block:'start'});}
document.addEventListener('change',(e)=>{if(e.target.id==='rep-pick')pickRep(e.target.value);});
document.addEventListener('toggle',(e)=>{if(e.target.id==='ad-mode')S.modeOpen=e.target.open;},true);   // 다시 그려도 펼침 그대로
render();load();
</script>
</body>
