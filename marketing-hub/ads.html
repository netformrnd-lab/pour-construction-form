      pour-os/v2/adreports/{YYYY-MM-DD} {date, title, md, summary, offs(JSON 글), longtail(JSON 글 · 없을 수 있음), by:'aside', at}
  · 쓰기 없음 — Aside 만 REST 로 올림 (pour-os-v2/CLAUDE.md 'Aside 전용 쓰기 경로')
  · 위 카드: 최신 보고서 요약 · 이번 주 끈 것 n개(offs) · 새 롱테일 n개(longtail · 칸 없으면 숨김)
  · [보고서] 왼쪽 날짜(최신순) → 오른쪽 md(표 포함 · core.js mdLite = 모든 글자 escape) · 주소 #YYYY-MM-DD
  · [끈 것 기록] 모든 보고서 offs 합친 표(날짜·매체·캠페인·대상·근거·조치) + 주간·월간 개수 · 주소 #off
  · [메타 판정] 금요일 증액/유지/종료/보류 + 근거 — 보고서 judges(JSON 글) 또는 본문 md 의 '판정' 칸 표 → 제안서 기준(350%+ 2주 · 200~350% · 180% 미만 2주 · 구매 10건)과 일치/다름 · 주소 #judge
  · 맨 위 '제안서 검증'(2026-10-15 "진짜 목적 = 데일리그로스 「넷폼_메타운영_제안서_202610」이 정답인지 실제 운영 데이터로 검증"):
      pour-os/v2/proposal/dailygrowth-202610 {title, at, by, json(baseline · structure · hypotheses H1~H6 · gaps_20261015)} — Aside 가 매일 갱신 · 읽기만
      기준선 vs 실제(최신 보고서 metrics → 없으면 보고서 글에서 읽음) · 가설 카드 · 현재 세팅과 제안서 구조 차이 · 규칙마다 출처 배지 [제안서 pXX]/[김송희 관리방안]/[Aside 추가]
      접기·펴기는 이 기기에만 기억(localStorage · 막히면 늘 펼침)
  · 외주 운영 기간 (2026-10-15 사장님 "메타·네이버·쿠팡 약 2개월 외주 · 세팅 분석만 · 데이터 쌓고 매일·금요일 보고"): 맨 위 띠(adops.js AD_MODE) + [Aside 지시문 복사](asideAdsText)

  · 계산 adops.js (시험 node marketing-hub/adops.test.mjs)

async function loadProposal(){
  try{const d=await db.collection('pour-os').doc('v2').collection('proposal').doc(A.PROPOSAL_ID).get();
    console.log(`[proposal/${A.PROPOSAL_ID}] ${d.exists?'있음':'없음'}`);S.prop=A.parseProposal(d.exists?d.data():{});if(!d.exists)S.propErr='아직 검증 문서가 없어요 (Aside 가 올리면 보여요) · 아래는 제안서 기본값';}

async function load(){
  const pp=loadProposal();
  try{
    const snap=await db.collection('pour-os').doc('v2').collection('adreports').get();   // orderBy 안 씀 · 날짜 글로 정렬
    S.reps=A.sortReports(snap.docs.map(d=>({id:d.id,...d.data(),date:d.data().date||d.id})));
    console.log(`[adreports] ${S.reps.length}건 로드`);
    if(S.cur&&!S.reps.some(r=>r.id===S.cur)){const byDate=S.reps.find(r=>r.date===S.cur);S.cur=byDate?byDate.id:'';}   // 옛 주소 #YYYY-MM-DD 도
    if(!S.cur)S.cur=S.reps[0]?S.reps[0].id:'';
  }catch(e){console.error('[adreports] 로드 실패:',e);S.err='보고서를 못 불러왔어요 · 인터넷 연결을 확인하고 새로고침해 주세요 ('+(e.code||e.message||e)+')';}
  await pp;S.loaded=true;render();
}

function modeBar(){
  const M=A.AD_MODE; if(M.mode!=='outsourced')return '';
  return `<div class="mode" id="ad-mode"><b>${esc(M.label)}</b> ${srcB(A.SRC.D)} · ${esc(M.from)}부터 ${esc(M.until)}<br>${esc(M.note)} 보고: <b>${esc(M.daily)} 일일</b> · <b>${esc(M.weekly)} 주간</b> · 이후 쌓인 데이터로 자동화 여부를 정해요.
    <div class="basis" id="ad-basis"><b>운영 기준</b> ${srcB(A.SRC.K)} <span class="sub">외주 기간 (사장님 2026-10-15)</span>${A.KSH_RULES.map(r=>`<div class="rl"><b>${esc(r.m)}</b>${esc(r.t)}</div>`).join('')}</div>
    <div class="row"><button type="button" id="copy-aside" aria-label="Aside 광고 지시문 복사">Aside 광고 지시문 복사</button><button type="button" id="show-aside" aria-expanded="${S.showText}">${S.showText?'지시문 접기':'지시문 보기'}</button><span>Aside 08:30 광고 예약 작업과 금요일 16:00 예약에 이 글을 그대로 넣어요 · 판 ${esc(A.ASIDE_ADS_VER)}</span></div>
    ${S.showText?`<textarea readonly id="aside-text" aria-label="Aside 광고 지시문">${esc(A.asideAdsText())}</textarea>`:''}</div>`;
}
function tops(){
  const t=A.topCards(S.reps,todayKST()), last=t.last;
  return `<div class="tops">
    <div class="top sum"><div class="l">최신 보고서${last?` · ${esc(dayL(last.date))}${A.isWeekly(last)?'<span class="kind">주간</span>':''}`:''}</div><div class="s">${last?esc(t.summary||last.title||'요약 없음'):'아직 보고서가 없어요'}</div></div>
    ${(()=>{const L=A.changeLog(S.reps,todayKST());return L.has?`<div class="top"><div class="l">이번 주 외주 변경</div><div class="v">${L.rows.filter(x=>x.who!=='Aside'&&A.weekStart(x.date||'1970-01-01')===A.weekStart(todayKST())).length}<small>건</small></div></div>`
      :t.offsWeek?`<div class="top"><div class="l">이번 주 끈 것</div><div class="v">${t.offsWeek}<small>개</small></div></div>`:'';})()}
    ${t.longtail!=null?`<div class="top"><div class="l">새 롱테일</div><div class="v">${t.longtail}<small>개</small></div></div>`:''}
  </div>`;
}
const srcB=(src,page)=>`<span class="src s-${A.srcKind(src)}">${esc(A.srcText(src,page))}</span>`;
const pctL=(v)=>v==null?'—':`${Math.round(v*10)/10}%`;
function verify(){
  const P=S.prop||A.parseProposal({}), b=P.baseline, rep=S.reps[0]||null, act=A.actualOf(rep,P), hc=A.hypCount(P.hypotheses);
  const head=`<h3>제안서 검증 <span class="ref">참고</span> <span class="sub">데일리그로스「넷폼_메타운영_제안서_202610」(2026.10.15) · 외주 기간 운영 기준은 김송희 관리방안${P.at?` · Aside 갱신 ${esc(atL(P.at))}`:''}</span><span class="sp"></span><button type="button" id="vtoggle" aria-expanded="${vOpen}">${vOpen?'접기':'펴기'}</button></h3>`;
  const sumLine=`<div class="cnts">${A.HYP_STATUS.map(h=>`<span>${esc(h)}<b>${hc[h]}</b></span>`).join('')}<span>세팅 차이<b>${(P.gaps||[]).length}</b></span><span>메타 ROAS<b>${pctL(act.meta_roas)}</b></span></div>`;
  if(!vOpen)return `<section class="card" id="verify">${head}${sumLine}</section>`;
  const how=(k)=>act[k]!=null?`${esc(act.date?dayL(act.date):'')} · ${esc(act.how[k]||'')}${act.how[k]==='보고서 글에서 읽음'?' (기간이 짧을 수 있음)':''}`:'최신 보고서에 없음';
  const target=b.meta_roas_target_dec, mr=act.meta_roas, cls=mr==null?'':mr>=target?'ok':mr<b.meta_roas_jan_sep?'low':'';
  const tiles=`<div class="cmp">
    <div class="cm ${cls}"><div class="l">메타 ROAS ${srcB(A.SRC.P)}</div><div class="v ${mr==null?'na':''}">${mr==null?'값 없음':pctL(mr)}</div><div class="h">${how('meta_roas')}</div>
      <div class="bar" aria-label="12월 목표 ${target}% 대비"><i style="width:${mr==null?0:Math.min(100,Math.round(mr/target*100))}%"></i></div>
      <div class="b">기준선 1~9월 <b>${b.meta_roas_jan_sep}%</b> · 9월 <b>${b.meta_roas_sep}%</b> → 12월 목표 <b>${target}%</b>${mr!=null?` · 목표까지 ${mr>=target?'달성':`${Math.round((target-mr)*10)/10}%p`}`:''}</div></div>
    <div class="cm"><div class="l">자사몰 MER ${srcB(A.SRC.P)}</div><div class="v ${act.mall_mer==null?'na':''}">${act.mall_mer==null?'값 없음':pctL(act.mall_mer)}</div><div class="h">${how('mall_mer')}</div>
      <div class="b">기준선 1~9월 <b>${b.mall_mer_jan_sep}%</b> · 9월 <b>${b.mall_mer_sep}%</b> · 카페24 순매출 ÷ 메타 광고비</div></div>
    <div class="cm"><div class="l">합산 MER ${srcB(A.SRC.P)}</div><div class="v ${act.total_mer==null?'na':''}">${act.total_mer==null?'값 없음':pctL(act.total_mer)}</div><div class="h">${how('total_mer')}</div>
      <div class="b">전체 매출 ÷ (메타+쿠팡+네이버 광고비) · 주간 · 제안서 기준선 없음</div></div></div>`;
  const hy=(P.hypotheses||[]).length?`<div class="hyps">${P.hypotheses.map(h=>{const st=A.hypStatus(h.status);return `<div class="hy"><div class="t"><b>${esc(h.id||'')}</b><span class="a">${esc(h.area||'')}</span><span class="st s-${esc(st)}">${esc(st)}</span>${srcB(A.SRC.P,h.page)}</div>
      <dl><dt>확인</dt><dd>${esc(h.what||'')}</dd><dt>어디서</dt><dd>${esc(h.where||'')}</dd><dt>통과</dt><dd>${esc(h.pass||'')}</dd>${h.fail?`<dt>미달이면</dt><dd>${esc(h.fail)}</dd>`:''}${h.result?`<dt>결과</dt><dd>${esc(h.result)}</dd>`:''}</dl></div>`;}).join('')}</div>`
    :'<div class="empty">가설이 아직 없어요</div>';
  const gd=P.gapsAt?`${Number(P.gapsAt.slice(4,6))}/${Number(P.gapsAt.slice(6,8))} 기준`:'';
  const gaps=(P.gaps||[]).length?`<ul class="gaps">${P.gaps.map(g=>`<li>${A.srcTags(esc(typeof g==='string'?g:(g.t||g.text||JSON.stringify(g))))}</li>`).join('')}</ul>`:'<div class="empty">차이 없음</div>';
  const st=P.structure||{}, live=st.live?`<div class="rl"><b>라이브</b>${esc(st.live)} ${srcB(A.SRC.P,(P.rules.find(r=>r.k==='live')||{}).page)}</div>`:'';
  const rules=P.rules.map(r=>`<div class="rl${r.ref?' isref':''}"><b>${esc(r.m||'')}</b>${esc(r.t||'')} ${srcB(r.src,r.page)}${r.ref?' <span class="ref">참고</span>':''}</div>`).join('')+live;
  return `<section class="card" id="verify">${head}${S.propErr?`<div class="crit" style="color:var(--gold)">${esc(S.propErr)}</div>`:''}<div class="vb">
    <h4>기준선 vs 실제 <span class="sub">실제 = 최신 보고서 ${rep?esc(dayL(rep.date)):'없음'}</span></h4>${tiles}
    <h4>가설 H1~H6 <span class="sub">무엇을 확인 · 어디서 · 통과 조건 · 상태</span></h4>${hy}
    <h4>현재 세팅과 제안서 구조 차이 ${(P.gaps||[]).length} <span class="sub">${esc(gd)}</span></h4>${gaps}
    <h4>운영 규칙 <span class="sub">출처 · 외주 기간 기준 = 김송희 관리방안 · 제안서 = 참고</span> ${srcB(A.SRC.K)} ${srcB(A.SRC.P)} ${srcB(A.SRC.A)}</h4>${rules}
  </div></section>`;
}
function vRep(){
  if(!S.reps.length)return `<div class="card"><div class="empty">아직 올라온 보고서가 없어요 · Aside 가 매일 08:30 에 올려요</div></div>`;
  const shown=S.reps.filter(x=>S.kind==='all'||(S.kind==='weekly')===A.isWeekly(x)), r=S.reps.find(x=>x.id===S.cur)||shown[0]||S.reps[0], nW=S.reps.filter(A.isWeekly).length;
  const list=shown.length?shown.map(x=>`<button type="button" data-d="${esc(x.id)}" class="${x.id===r.id?'on':''}" aria-label="${esc(x.date)} ${A.isWeekly(x)?'주간':'일일'} 보고서"><b>${esc(dayL(x.date))}${A.isWeekly(x)?'<span class="kind">주간</span>':''}</b><span>${esc(x.summary||x.title||'')}</span></button>`).join('')
    :`<div class="empty">${S.kind==='weekly'?`아직 주간 보고서가 없어요 · 첫 주간 ${esc(dayL(nextFri()))} 16:00`:'없음'}</div>`;
  return `<div class="split">
    <div class="card"><h3>보고서 ${S.reps.length} <span class="sub">최신순</span></h3><div class="fil" id="kinds">${[['all','전체'],['daily','일일'],['weekly',`주간 ${nW}`]].map(([k,l])=>`<button type="button" data-k="${k}" class="${S.kind===k?'on':''}">${esc(l)}</button>`).join('')}</div><div class="dates" id="dates">${list}</div></div>
    <article class="card" id="report"><div class="rep-h"><b>${esc(r.title||r.date)}${A.isWeekly(r)?'<span class="kind">주간</span>':''}</b><span class="sub">${esc(r.date)} · ${r.by==='aside'?'Aside':esc(r.by||'')} 올림${r.at?' '+esc(atL(r.at)):''} · <span class="ro">읽기 전용</span></span></div>
      <div class="md">${A.srcTags(C.mdLite(r.md||r.summary||''))}</div></article>
  </div>`;
}
function vOff(){
  const L=A.changeLog(S.reps,todayKST());
  if(!L.has&&!L.rows.length)return `<div class="card"><div class="empty">변경 기록이 아직 없어요 · 외주업체가 세팅을 바꾸면 다음 날 일일 보고서에 모여요</div></div>`;
  const cnt=`<div class="cnts"><span>이번 주<b>${L.thisWeek}</b></span><span>이번 달<b>${L.thisMonth}</b></span><span>전체<b>${L.rows.length}</b></span></div>`;
  const wk=L.weeks.length?`<div class="tbl"><table><thead><tr><th>주</th><th class="n">변경</th></tr></thead><tbody>${L.weeks.slice(0,12).map(x=>`<tr><td>${esc(A.weekL(x.w))}</td><td class="n">${x.n}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">없음</div>';
  const mo=L.months.length?`<div class="tbl"><table><thead><tr><th>월</th><th class="n">변경</th></tr></thead><tbody>${L.months.slice(0,12).map(x=>`<tr><td>${esc(Number(x.m.slice(5,7)))}월 <span class="sub">${esc(x.m.slice(0,4))}</span></td><td class="n">${x.n}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">없음</div>';
  const rows=L.rows.length?`<div class="tbl"><table class="offs ct"><thead><tr><th>날짜</th><th>누가</th><th>매체</th><th>캠페인</th><th>대상</th><th>무엇을</th><th>메모·근거</th></tr></thead><tbody>${L.rows.map(x=>`<tr>
      <td data-l="날짜" style="white-space:nowrap">${esc(x.date?dayL(x.date):'')}</td><td data-l="누가">${esc(x.who)}</td><td data-l="매체">${x.media?`<span class="med m-${esc(x.media)}">${esc(x.media)}</span>`:''}</td>
      <td data-l="캠페인">${esc(x.campaign)}</td><td data-l="대상"><b>${esc(x.target)}</b></td><td data-l="무엇을">${esc(x.what)}</td><td data-l="메모·근거">${esc(x.note)}</td></tr>`).join('')}</tbody></table></div>`
    :'<div class="empty">아직 외주 변경이 없어요</div>';
  return `<div class="card"><h3>변경 기록 ${L.rows.length} <span class="sub">외주가 바꾼 세팅(일일 보고서 changes) · 최신순 · 10/15 이전 Aside 끈 것 포함</span></h3>${cnt}${rows}</div>
    <div class="grid2"><div class="card"><h3>주간 <span class="sub">월요일 시작</span></h3>${wk}</div><div class="card"><h3>월간</h3>${mo}</div></div>`;
}
function nextFri(){const t=todayKST(),d=new Date(t+'T00:00:00Z'),add=(5-d.getUTCDay()+7)%7;return C.addDays(t,add);}
function vJudge(){
  const J=A.judgeLog(S.reps);
  const crit=`<div class="crit"><b>외주 기간 기준</b> ${srcB(A.SRC.K)} 테스트 캠페인 ROAS 300% (넘으면 고정 캠페인으로 옮길 후보 · 못 넘으면 다음 소재) · 고정 캠페인(이긴 소재·타겟) 400~500% 유지 — 캠페인 이름에 '테스트'가 있으면 테스트로 봐요<br><span class="sub">참고 ${srcB(A.SRC.P)} 증액 350%+ 2주 → 예산 +20% · 유지 200~350% · 종료 180% 미만 2주 · 구매 10건 전 보류 — 외주 운영 기간 판정 = 외주업체 ${srcB(A.SRC.D)} · 비교 = 겨울(Aside) ${srcB(A.SRC.A)}</span></div>`;
  const cnt=`<div class="cnts">${A.JUDGE.map(j=>`<span>${j}<b>${J.count[j]}</b></span>`).join('')}<span>김송희 기준과 다름<b style="color:${J.kshDiff?'var(--red)':'inherit'}">${J.kshDiff}</b></span><span>(참고) 제안서와 다름<b>${J.diff}</b></span></div>`;
  const rows=J.rows.length?`<div class="tbl"><table class="ct"><thead><tr><th>날짜</th><th>캠페인</th><th>대상</th><th class="n">ROAS 14일</th><th class="n">ROAS 7일</th><th class="n">구매</th><th>외주 판정</th><th>근거</th><th>김송희 기준</th><th>비교</th><th>제안서 기준 (참고)</th></tr></thead><tbody>${J.rows.map(x=>`<tr>
      <td data-l="날짜" style="white-space:nowrap">${esc(x.date?dayL(x.date):'')}</td><td data-l="캠페인">${esc(x.campaign)}</td><td data-l="대상"><b>${esc(x.target)}</b></td>
      <td data-l="ROAS 14일" class="n">${pctL(x.roas14)}</td><td data-l="ROAS 7일" class="n">${pctL(x.roas)}</td><td data-l="구매" class="n">${x.purchases==null?'—':x.purchases}</td>
      <td data-l="외주 판정">${x.verdict?`<span class="st s-${esc(x.verdict)}">${esc(x.verdict)}</span>`:esc(x.verdictRaw)}</td><td data-l="근거">${esc(x.reason)}</td>
      <td data-l="김송희 기준">${x.ksh?`<span class="st s-${esc(x.ksh)}">${esc(x.ksh)}</span> `:''}<span class="sub">${esc(x.kshWhy)}</span></td><td data-l="비교"><span class="st s-${esc(x.kshMatch)}">${esc(x.kshMatch)}</span></td>
      <td data-l="제안서 기준 (참고)">${x.expect?`<span class="st s-${esc(x.expect)}">${esc(x.expect)}</span> `:''}<span class="sub">${esc(x.expectWhy)} · ${esc(x.match)}</span></td></tr>`).join('')}</tbody></table></div>`
    :`<div class="empty">아직 판정이 없어요 · 첫 금요일 판정 ${esc(dayL(nextFri()))} 16:00<br><span class="sub">금요일 주간 보고서의 judges 칸(또는 '판정' 칸이 있는 표)이 여기에 모여요</span></div>`;
  return `<div class="card"><h3>메타 판정 ${J.rows.length} <span class="sub">모든 보고서 · 최신순 · 판정 vs 김송희 기준 (제안서는 참고)</span></h3>${crit}${cnt}${rows}</div>`;
}
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  if(!S.loaded)return;
  const body=S.err?`<div class="msg" role="alert">${esc(S.err)}</div>`:modeBar()+verify()+tops()+(S.view==='off'?vOff():S.view==='judge'?vJudge():vRep());
  $('#app').innerHTML=body+`<p class="foot">Aside 가 매일 08:30 일일 · 금요일 16:00 주간 광고 보고서를 올려요 · 이 화면은 읽기만 해요<br>실행: 외주 운영 기간 메타·네이버·쿠팡 = 외주업체 ${srcB(A.SRC.D)} · 운영 기준 = 김송희 관리방안 ${srcB(A.SRC.K)} · Aside = 분석·보고만 · 예산·목표 = 본부장 ${srcB(A.SRC.P)}</p>`;
}
document.addEventListener('click',(e)=>{
  if(e.target.closest('#show-aside')){S.showText=!S.showText;render();return;}
  if(e.target.closest('#copy-aside')){const b=e.target.closest('#copy-aside'),txt=A.asideAdsText();
    const done=(ok)=>{b.textContent=ok?'복사했어요':'복사가 막혔어요 · 지시문 보기에서 길게 눌러 복사';if(!ok){S.showText=true;render();}};
    try{navigator.clipboard.writeText(txt).then(()=>done(true),(err)=>{console.error('[복사] 실패:',err);done(false);});}catch(err){console.error('[복사] 실패:',err);done(false);}return;}
  const k=e.target.closest('#kinds button');if(k){S.kind=k.dataset.k;const first=S.reps.find(x=>S.kind==='all'||(S.kind==='weekly')===A.isWeekly(x));if(first)S.cur=first.id;render();return;}
  if(e.target.closest('#vtoggle')){vOpen=!vOpen;LSset('ads_verify_open',vOpen?'1':'0');render();return;}
  const t=e.target.closest('#tabs button');if(t){S.view=t.dataset.v;history.replaceState(null,'',S.view!=='rep'?'#'+S.view:(S.cur?'#'+S.cur:location.pathname));render();window.scrollTo(0,0);return;}
  const d=e.target.closest('#dates button');if(d){S.cur=d.dataset.d;history.replaceState(null,'','#'+S.cur);render();
    if(window.matchMedia('(max-width:900px)').matches){const a=$('#report');if(a)a.scrollIntoView({block:'start'});}}
});
render();load();
</script>
</body>
</html>
