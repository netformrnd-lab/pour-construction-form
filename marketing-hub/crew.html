<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AI 크루 결과 올리기 · POUR 마케팅 허브</title>
<!--
  Aside(AI 브라우저) 전용 · 그로홈 AI 크루(봄·여름·가을·겨울·하늘·우주) 결과 → 업무OS 승인 (사용자 결정 2026-10-12)
  · 보드 고르기 → 날짜 → 결과 붙여 넣기([지표] [상태] [A]~[E] 표 · 그로홈 보드에서 쓰던 모양) → 미리 보기 → [업무OS에 올리기]
  · 쓰는 곳(pour-app-new · 공개 규칙 pour-os/{doc=**} · 규칙 변경 없음):
      pour-os/v2/aiboards/{보드 id}  지표 값(날짜별) · 상태 한 줄
      pour-os/v2/aiasks/{id}         행동 A~E 하나 = 승인 한 건 → 업무OS '확인할 것' (AI → 담당 → 리드 → 본부장)
  · 같은 날 같은 행동을 다시 올리면: 아직 담당 차례이거나 'AI 에게 다시'로 돌려받은 것만 2번째 판으로 고침 · 위로 올라간 뒤엔 그대로(날짜를 바꿔 새로)
  · 빼는 것: 원가·마진·제조사·공급 단가 칸 · 관리자 자리 행동(노출 E) · 휴대폰 번호·메일(가림) — crew.js
  · 실행(가격·광고·발송·게시)은 하지 않음 — 표와 초안까지 · 실제 반영은 승인 뒤 사람이 업무OS '실행' 업무에서
  · 모든 버튼·칸에 고정 id · aria-label (Aside 루틴이 찾는 이름)
-->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="core.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#0D1B2A;--accent:#2563EB;--accent-l:#EFF6FF;--green:#059669;--green-l:#ECFDF5;--red:#DC2626;--red-l:#FEF2F2;--amber:#B45309;--amber-l:#FFFBEB;
  --text:#111827;--text-md:#4B5563;--text-sm:#9CA3AF;--bg:#F9FAFB;--card:#fff;--border:#E5E7EB;--r:12px;--r-sm:8px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,system-ui,'Segoe UI',sans-serif;font-size:15px}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header b{font-size:16px;white-space:nowrap}
header .who{margin-left:auto;font-size:12px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45vw}
header a,header button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:var(--r-sm);padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit;text-decoration:none;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px}
label{display:block;font-size:13px;font-weight:700;color:var(--text-md);margin:0 0 6px}
.field{margin-bottom:14px}
select,input[type=date],input[type=email],input[type=password],textarea{width:100%;max-width:100%;font:inherit;border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 12px;background:#fff;color:var(--text)}
textarea{min-height:180px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;border:0;border-radius:var(--r-sm);padding:14px;font:inherit;font-weight:800;cursor:pointer;background:#fff;border:1px solid var(--border);color:var(--text);min-width:120px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{flex:0 0 auto;padding:8px 12px;font-size:13px;min-width:0}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:12.5px;color:var(--text-md);margin-top:6px;line-height:1.6}
#status-message{font-size:15px;font-weight:800;border-radius:var(--r-sm);padding:14px;margin:0 0 14px;display:none;word-break:keep-all;line-height:1.6}
#status-message.ok{display:block;background:var(--green-l);color:var(--green)}
#status-message.err{display:block;background:var(--red-l);color:var(--red)}
#status-message.wait{display:block;background:var(--accent-l);color:var(--accent)}
#status-message a{color:inherit}
.warn{background:var(--amber-l);color:var(--amber);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;font-weight:700;margin:0 0 10px;line-height:1.6}
.list{border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.li{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13.5px;line-height:1.6;word-break:break-word}
.li:last-child{border-bottom:0}
.li b{color:var(--navy)}
.li .s{color:var(--text-md);font-size:12.5px}
.pill{display:inline-block;font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 7px;background:var(--accent-l);color:var(--accent);margin-right:6px}
.pill.g{background:var(--green-l);color:var(--green)} .pill.m{background:#F3F4F6;color:var(--text-md)} .pill.r{background:var(--red-l);color:var(--red)}
.tbl{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-sm);margin-top:6px}
table{border-collapse:collapse;font-size:12px;min-width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:left;max-width:280px;overflow:hidden;text-overflow:ellipsis}
th{background:#F3F4F6}
details summary{cursor:pointer;font-weight:800;font-size:14px}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:#F3F4F6;border-radius:var(--r-sm);padding:10px;margin:8px 0 0;max-height:320px;overflow:auto}
#login-error{color:var(--red);font-weight:700;font-size:14px;min-height:1em}
@media (max-width:700px){main{padding:12px}.row2{grid-template-columns:1fr}.card{padding:14px}}
@media (max-width:420px){header .who{display:none}}
</style>
</head>
<body>
<header>
  <b>🤖 AI 크루 결과 올리기</b>
  <span class="who" id="who"></span>
  <a href="upload.html" id="go-upload" hidden>리포트 올리기</a>
  <button type="button" id="logout-button" aria-label="로그아웃" hidden>로그아웃</button>
</header>
<main>
  <section class="card" id="login-section" hidden>
    <div class="field"><label for="login-email">이메일</label><input id="login-email" type="email" autocomplete="username" aria-label="이메일"></div>
    <div class="field"><label for="login-password">비밀번호</label><input id="login-password" type="password" autocomplete="current-password" aria-label="비밀번호"></div>
    <div class="btns"><button type="button" class="btn pri" id="login-button" aria-label="로그인">로그인</button></div>
    <p id="login-error" role="alert"></p>
  </section>

  <section id="crew-section" hidden>
    <p id="status-message" role="status" aria-live="polite"></p>
    <div class="card">
      <div class="row2">
        <div class="field"><label for="crew-board">누구의 결과인가요</label><select id="crew-board" aria-label="보드"></select></div>
        <div class="field"><label for="crew-date">실행 날짜</label><input id="crew-date" type="date" aria-label="실행 날짜"></div>
      </div>
      <div id="crew-who" class="hint"></div>
      <div id="crew-redo"></div>
      <div id="crew-rules"></div>
      <details id="crew-guide-box" style="margin:6px 0 14px"><summary>Aside 지시문 · 붙여 넣는 모양 ▾</summary>
        <div class="btns" style="margin-top:8px"><button type="button" class="btn sm" id="copy-guide" aria-label="지시문 복사">지시문 복사</button></div>
        <pre id="crew-guide"></pre></details>
      <div class="field"><label for="crew-text">결과 붙여 넣기</label>
        <textarea id="crew-text" aria-label="결과 붙여 넣기" placeholder="[지표]&#10;cv_mall&#9;7.4&#10;[상태]&#10;A: 한 줄&#10;[A]&#10;요약: 한 줄&#10;상품&#9;채널&#9;가용재고 …"></textarea>
        <div class="hint">원가·마진·제조사·공급 단가 칸은 자동으로 빠지고, 휴대폰 번호·메일은 가려져요 · 실제 반영(가격·광고·발송·게시)은 승인 뒤 사람이 해요</div></div>
      <div class="btns">
        <button type="button" class="btn" id="preview-button" aria-label="미리보기">미리보기</button>
        <button type="button" class="btn pri" id="save-button" aria-label="업무OS에 올리기">업무OS에 올리기</button>
      </div>
    </div>
    <div class="card" id="preview-section" hidden><div id="preview"></div></div>
  </section>
</main>
<script type="module">
import * as K from './crew.js';
const FB_CFG={apiKey:"AIzaSyBbct9tO8nCUCjz4s9GnXQLkHuHe2FFyyU",authDomain:"pour-app-new.firebaseapp.com",projectId:"pour-app-new",
  storageBucket:"pour-app-new.firebasestorage.app",messagingSenderId:"411031141847",appId:"1:411031141847:web:e658174fd4b9652cdadf92"};
firebase.initializeApp(FB_CFG);
const auth=firebase.auth(), db=firebase.firestore();
if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&new URLSearchParams(location.search).has('emu')){auth.useEmulator('http://127.0.0.1:9099');db.useEmulator('127.0.0.1',8080);}
const C=window.MktCore, $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const V2=()=>db.collection('pour-os').doc('v2');
const OS_URL='../pourstore-renewal/os2.html';
const todayKST=()=>C.addDays(C.yesterdayKST(),1);
let roles=null, mateDoc=null, users={}; // users = 필요한 사람만 (담당 1명 · 번호·PIN 칸은 안 씀)

// 보드 고르기 (그로홈 크루 6명) — 주소 #보드id 로 바로
const BOARDS=Object.values(K.BOARDS);
$('crew-board').innerHTML=BOARDS.map(b=>{const m=K.mateOf(b.mate);return `<option value="${b.id}">${m.name} · ${m.role} — ${b.title} (${K.brandL(b.brand)})</option>`;}).join('');
const h=location.hash.slice(1); if(K.boardOf(h))$('crew-board').value=h;
$('crew-date').value=todayKST();
const board=()=>K.boardOf($('crew-board').value), mate=()=>K.mateOf(board().mate);

// 로그인 (Aside = 업로더 · 관리자)
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e=>console.error('[auth] persistence',e));
auth.onAuthStateChanged(async u=>{
  $('login-section').hidden=!!u; $('crew-section').hidden=!u; $('logout-button').hidden=!u; $('go-upload').hidden=!u; $('who').textContent=u?u.email:'';
  if(!u)return;
  try{const rd=await C.col(db,'mkt-access','open').doc('roles').get(); roles=rd.exists?rd.data():{};}catch(e){console.error('[mkt-access] 역할 확인 실패',e);roles={};}
  if(!C.isUploaderEmail(u.email,roles)&&!C.isAdminEmail(u.email,roles)){setMsg('err','이 계정은 올릴 수 없어요 · 관리자에게 업로더 계정을 받아 주세요');$('save-button').disabled=true;}
  await loadMate();
});
const LOGIN_ERR={'auth/invalid-credential':'이메일 또는 비밀번호가 올바르지 않습니다.','auth/wrong-password':'비밀번호가 틀렸습니다.','auth/user-not-found':'없는 계정입니다.','auth/too-many-requests':'시도가 많습니다. 잠시 후 다시 하세요.','auth/network-request-failed':'네트워크 오류입니다.'};
$('login-button').onclick=async()=>{const email=$('login-email').value.trim(),pw=$('login-password').value;if(!email||!pw){$('login-error').textContent='이메일과 비밀번호를 입력하세요.';return;}
  $('login-button').disabled=true;try{await auth.signInWithEmailAndPassword(email,pw);$('login-error').textContent='';$('login-password').value='';}
  catch(e){console.error('[auth] 로그인 실패',e);$('login-error').textContent=LOGIN_ERR[e.code]||('로그인 실패: '+e.code);}finally{$('login-button').disabled=false;}};
$('login-password').addEventListener('keydown',e=>{if(e.key==='Enter')$('login-button').click();});
$('logout-button').onclick=()=>auth.signOut();
function setMsg(kind,html){const m=$('status-message');m.className=kind;m.innerHTML=html;}

// 이 AI 의 담당 · 확정 규칙 · 'AI 에게 다시' 돌려받은 것 (Aside 가 올리기 전에 읽음)
async function loadMate(){
  const b=board(), m=mate(); $('crew-guide').textContent=K.asideText(b);
  try{
    const [md,back]=await Promise.all([V2().collection('aimates').doc(m.id).get(),V2().collection('aiasks').where('mate','==',m.id).get()]);
    mateDoc=md.exists?md.data():null;
    const oid=K.ownerFor(mateDoc,b.brand); if(oid&&!users[oid]){const ud=await V2().collection('users').doc(oid).get();users[oid]=ud.exists?{name:ud.data().name||'',active:ud.data().active}:null;}
    const owner=ownerId(), on=(mateDoc&&mateDoc.rules||[]).filter(r=>!r.off);
    const backs=back.docs.map(d=>d.data()).filter(a=>a.state==='back'&&a.board===b.id);
    console.log(`[aimates/${m.id}] ${mateDoc?'있음':'없음'} · 규칙 ${on.length} · 돌려받은 것 ${backs.length}`);
    $('crew-who').innerHTML=`승인 길: <b>${esc(m.name)}(AI)</b> → ${owner?`<b>${esc(nameOf(owner))}</b>(담당)`:'<b>담당 미정</b> — 관리자 누구나'} → 상급자 순서 · ${esc(K.brandL(b.brand))}`;
    $('crew-rules').innerHTML=on.length?`<div class="warn">확정 규칙 ${on.length}개 — 꼭 지켜 주세요<br>${on.map(r=>'· '+esc(r.text)).join('<br>')}</div>`:'';
    $('crew-redo').innerHTML=backs.length?`<div class="warn">고쳐서 다시 올릴 것 ${backs.length}건 — 같은 날짜·같은 행동으로 다시 붙여 넣으면 2번째 판이 돼요<br>${backs.map(a=>`· ${esc(a.run)} ${esc(a.act)} · ${esc(a.title)} — <b>${esc(a.back&&a.back.text||'')}</b> (${esc(a.back&&a.back.byName||'')})`).join('<br>')}</div>`:'';
  }catch(e){console.error('[AI 크루] 담당·규칙 불러오기 실패',e);$('crew-who').textContent='담당·규칙을 못 불러왔어요 · 인터넷 연결을 확인해 주세요';}
}
const nameOf=(id)=>(users[id]||{}).name||id;
function ownerId(){const id=K.ownerFor(mateDoc,board().brand); const u=users[id]; return u&&u.active!==false?id:'';}
$('crew-board').onchange=()=>{history.replaceState(null,'','#'+$('crew-board').value);$('preview-section').hidden=true;loadMate();};
$('copy-guide').onclick=async()=>{try{await navigator.clipboard.writeText(K.asideText(board()));$('copy-guide').textContent='✓ 복사했어요';setTimeout(()=>{$('copy-guide').textContent='지시문 복사';},1500);}catch(e){$('crew-guide-box').open=true;}};

// 미리 보기
function parse(){const p=K.parseCrew($('crew-text').value,board());return p;}
function preview(){
  const b=board(), p=parse(), run=$('crew-date').value, acts=Object.entries(p.acts);
  const n=acts.filter(([c,x])=>(x.items||[]).length||x.sum||(x.body||[]).length).length;
  $('preview').innerHTML=`<h2>${esc(mate().name)} · ${esc(b.title)} · ${esc(run)}</h2>
    ${p.warn.map(w=>`<div class="warn">${esc(w)}</div>`).join('')}
    ${p.unknown.length?`<div class="warn">모르는 지표 키(안 올림): ${esc(p.unknown.join(' · '))}</div>`:''}
    <div class="hint" style="margin:0 0 6px">지표 ${p.metrics.length}개 · 승인 요청 ${n}건</div>
    ${p.metrics.length?`<div class="list">${p.metrics.map(x=>{const m=b.metrics.find(y=>y.k===x.k);return `<div class="li"><b>${esc(x.l)}</b> ${esc(K.fmtMetric(m,x.v))} <span class="s">· 목표 ${esc(K.fmtMetric(m,m.target))}${K.metricOk(m,x.v)?' ✓':''}</span></div>`;}).join('')}</div>`:''}
    ${acts.map(([c,x])=>{const a=K.actOf(b.id,c)||{t:''};return `<div style="margin-top:12px"><span class="pill">${esc(c)}</span><b>${esc(a.t)}</b> <span class="s">· 번호 ${x.items.length}개${p.status[c]?' · '+esc(p.status[c]):''}</span>
      ${x.sum?`<div class="hint">요약: ${esc(x.sum)}</div>`:''}
      ${x.items.length?`<div class="tbl"><table><tr><th>번호</th>${x.cols.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${x.items.slice(0,30).map(it=>`<tr><td>${esc(it.n)}</td>${x.cols.map(h=>`<td title="${esc(it.c[h]||'')}">${esc(it.c[h]||'')}</td>`).join('')}</tr>`).join('')}</table></div>`:''}</div>`;}).join('')}`;
  $('preview-section').hidden=false; return {p,n};
}
$('preview-button').onclick=()=>{preview();};

// 올리기: 보드 지표 + 행동마다 승인 한 건 (없으면 만들고 · 담당 차례이거나 돌려받은 것만 2번째 판으로)
$('save-button').onclick=async()=>{
  const b=board(), m=mate(), run=$('crew-date').value, u=auth.currentUser;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(run)){setMsg('err','날짜를 골라 주세요');return;}
  const {p,n}=preview(); if(!p.metrics.length&&!n){setMsg('err','올릴 것이 없어요 · [지표] 또는 [A]~[E] 표를 붙여 넣어 주세요');return;}
  $('save-button').disabled=true; setMsg('wait','올리는 중…');
  const at=new Date().toISOString(), owner=ownerId();
  try{
    if(p.metrics.length||Object.keys(p.status).length){
      const metrics={},hist={}; p.metrics.forEach(x=>{metrics[x.k]={v:x.v,date:run,at};hist[x.k]={[run]:x.v};});
      await V2().collection('aiboards').doc(b.id).set({id:b.id,board:b.id,mate:m.id,brand:b.brand,metrics,hist,status:p.status,at,by:u.email},{merge:true});
      console.log(`[aiboards/${b.id}] 지표 ${p.metrics.length}개`);
    }
    const asks=K.asksFromParse(p,{board:b.id,mate:m.id,brand:b.brand,run,at,owner,src:'crew'}); const res={made:0,redo:0,kept:[]};
    for(const a of asks){
      const ref=V2().collection('aiasks').doc(a.id);
      await db.runTransaction(async(tx)=>{const s=await tx.get(ref);
        if(!s.exists){tx.set(ref,{...a,log:[...a.log]});res.made++;return;}
        const cur=s.data(); if(!K.canRedo(cur)){res.kept.push(`${a.act} (${cur.state==='ok'?'최종 승인됨':cur.state==='no'?'안 함':'위로 올라감'})`);return;}
        tx.update(ref,{...K.redoFields(cur,a,owner||cur.owner||''),log:firebase.firestore.FieldValue.arrayUnion({at,by:'ai:'+m.id,byName:`${m.name} (AI)`,act:'redo'})});res.redo++;});
    }
    console.log(`[aiasks] 새로 ${res.made} · 다시 ${res.redo} · 그대로 ${res.kept.length}`);
    setMsg('ok',`올렸어요 · 승인 요청 새로 ${res.made}건${res.redo?` · 고쳐서 다시 ${res.redo}건`:''}${p.metrics.length?` · 지표 ${p.metrics.length}개`:''}${res.kept.length?`<br>그대로 둔 것: ${esc(res.kept.join(' · '))} — 새로 올리려면 날짜를 바꿔 주세요`:''}<br><a href="${OS_URL}" target="_blank" rel="noopener">업무OS에서 보기 ›</a> · 승인 차례: ${owner?esc(nameOf(owner))+'님':'관리자 누구나'}`);
    loadMate();
  }catch(e){console.error('[AI 크루] 올리기 실패',e);setMsg('err','올리지 못했어요: '+esc(e.code||e.message));}
  finally{$('save-button').disabled=false;}
};
</script>
