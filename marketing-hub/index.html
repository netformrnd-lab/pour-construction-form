  · 열면: Aside 가 올린 mkt-uploads 중 아직 정리 안 된 것을 정리 → mkt-sales / mkt-ads / mkt-stock (같은 날짜 = 덮어씀)

  · 관리자가 아닌 계정(Aside 업로더)은 upload.html 로 보냄 (실제 차단은 보안 규칙)

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#0D1B2A;--accent:#2563EB;--accent-l:#EFF6FF;--green:#059669;--green-l:#ECFDF5;--red:#DC2626;--red-l:#FEF2F2;
  --gold:#D97706;--gold-l:#FFFBEB;--text:#111827;--text-md:#4B5563;--text-sm:#9CA3AF;--bg:#F9FAFB;--card:#fff;--border:#E5E7EB;
  --r:12px;--r-sm:8px;--shadow:0 1px 6px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,system-ui,'Segoe UI',sans-serif;font-size:14px}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header b{font-size:16px}
header .sp{flex:1}
header a,header button{color:#fff;border:1px solid rgba(255,255,255,.4);background:transparent;border-radius:var(--r-sm);padding:6px 10px;font-size:12px;text-decoration:none;cursor:pointer;font-family:inherit}
#who{font-size:12px;opacity:.8}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
nav button{flex:none;border:1px solid var(--border);background:#fff;border-radius:20px;padding:7px 14px;font:inherit;font-weight:700;color:var(--text-md);cursor:pointer}
nav button.on{background:var(--navy);border-color:var(--navy);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.card h3{margin:0;padding:12px 16px;font-size:14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.card .bd{padding:14px 16px}
.sub{font-size:12px;color:var(--text-sm)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{font-size:11px;color:var(--text-md);background:#F9FAFB}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px}
.pill.ok{background:var(--green-l);color:var(--green)}.pill.err{background:var(--red-l);color:var(--red)}
.pill.wait{background:var(--gold-l);color:var(--gold)}.pill.m{background:#F3F4F6;color:var(--text-md)}
.up{color:var(--green);font-weight:700}.down{color:var(--red);font-weight:700}
.btn{border:1px solid var(--border);background:#fff;border-radius:var(--r-sm);padding:8px 12px;font:inherit;font-weight:700;cursor:pointer;color:var(--text)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:5px 9px;font-size:12px}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.btn.obs{background:#7C3AED;border-color:#7C3AED;color:#fff}
#obsidian-send{width:100%;max-width:360px;padding:12px}
.btn:disabled{opacity:.5}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:14px}
.kpi .l{font-size:12px;color:var(--text-md)}.kpi .v{font-size:22px;font-weight:800;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.form label{display:block;font-size:12px;font-weight:700;color:var(--text-md);margin-bottom:5px}
input,select{width:100%;max-width:100%;font:inherit;border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 10px;background:#fff}
.msg{padding:12px 16px;border-radius:var(--r-sm);margin-bottom:14px;font-weight:700}
.msg.ok{background:var(--green-l);color:var(--green)}.msg.err{background:var(--red-l);color:var(--red)}.msg.wait{background:var(--accent-l);color:var(--accent)}
.empty{padding:22px 16px;text-align:center;color:var(--text-sm)}
ol.adv{margin:0;padding:0 16px 0 34px}ol.adv li{padding:7px 0;border-bottom:1px solid var(--border)}ol.adv li:last-child{border:0}
ol.adv .r{font-size:12px;color:var(--text-md)}
#login{max-width:380px;margin:40px auto}
.acct-list{border-top:1px solid var(--border)}
.acct-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border)}
.acct-row .who{flex:1;min-width:0;word-break:break-all}
.acct-row .acts{display:flex;gap:6px;flex-wrap:wrap}

.tm{border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.tm summary{list-style:none;cursor:pointer}.tm summary::-webkit-details-marker{display:none}
.tm .h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.tm .h b{font-size:15px}
.tm[open]{background:#FAFAFB}
details.wk>summary{cursor:pointer;padding:12px 16px;font-weight:800;list-style:none}details.wk>summary::-webkit-details-marker{display:none}
.tm .l{font-size:12px;color:var(--text-md);margin-top:6px;word-break:keep-all}
.rows .row{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border)}
.rows .row:last-child{border-bottom:0}.rows .row .tx{flex:1;min-width:0;word-break:break-all}
.rows .row .t{flex:none;width:44px;font-weight:800;font-variant-numeric:tabular-nums}
.rows .row .acts{display:flex;gap:6px;flex-wrap:wrap;flex:none}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:12px}
.week .d{border:1px solid var(--border);border-radius:var(--r-sm);padding:8px;min-width:0}

.week .d .dh{font-weight:800;font-size:12px;margin-bottom:6px}.week .d div.it{font-size:11px;color:var(--text-md);padding:2px 0;word-break:keep-all}

.vf>div{margin-bottom:12px}.vf label.t{display:block;font-size:12px;font-weight:700;color:var(--text-md);margin-bottom:5px}
@media (max-width:900px){.team-grid{grid-template-columns:repeat(2,1fr)}.week{grid-template-columns:repeat(4,minmax(0,1fr))}}

<header>
  <b>📊 마케팅 허브</b>
  <span class="sp"></span>
  <span id="who"></span>
  <a href="upload.html" id="go-upload">📥 리포트 올리기</a>
  <button type="button" id="logout" hidden>로그아웃</button>
</header>
<nav id="tabs" hidden></nav>
<main id="app"></main>
<script>
'use strict';
const FB_CFG={apiKey:"AIzaSyBbct9tO8nCUCjz4s9GnXQLkHuHe2FFyyU",authDomain:"pour-app-new.firebaseapp.com",projectId:"pour-app-new",
  storageBucket:"pour-app-new.firebasestorage.app",messagingSenderId:"411031141847",appId:"1:411031141847:web:e658174fd4b9652cdadf92"};
firebase.initializeApp(FB_CFG);
const auth=firebase.auth(), db=firebase.firestore(), FV=firebase.firestore.FieldValue;
// 로컬 시험(localhost?emu=1)만 에뮬레이터 — 실제 주소에선 동작 안 함
const EMU=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&new URLSearchParams(location.search).has('emu');
if(EMU){auth.useEmulator('http://127.0.0.1:9099');db.useEmulator('127.0.0.1',8080);}
const C=window.MktCore, $=(s)=>document.querySelector(s);
const OWNER_EMAILS=C.OWNER_EMAILS;
const MODE=C.storeMode(), col=(n)=>C.col(db,n,MODE); // 저장 위치: core.js STORE_MODE
const COLL={uploads:'mkt-uploads',status:'mkt-upload-status',sales:'mkt-sales',ads:'mkt-ads',stock:'mkt-stock',access:'mkt-access',settings:'mkt-settings',voc:'mkt-voc',team:'mkt-team'};
// 업무OS v2 '확인할 것' 다리 (공개 규칙 pour-os/{doc=**} · CRM 다리와 같은 모양) — AI 팀 검토 대기 · 고객의 소리 급함
const linksCol=()=>db.collection('pour-os').doc('v2').collection('links');
const KIND_COLL={sales:COLL.sales,ads:COLL.ads,stock:COLL.stock};
const DEFAULT_SET={defaultLeadTimeDays:7,safetyDays:7,windowDays:14,roasLow:200,roasHigh:400,minCost:10000,minClicks:10,adsDays:7};
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won=(n)=>Math.round(n||0).toLocaleString('ko-KR');
const num=(n,d=0)=>(n==null?'-':Number(n).toLocaleString('ko-KR',{maximumFractionDigits:d}));
const todayKST=()=>C.addDays(C.yesterdayKST(),1);
const tsMs=(t)=>t&&t.toMillis?t.toMillis():(t?new Date(t).getTime():0);
const fmtTs=(t)=>{const m=tsMs(t);if(!m)return '-';const d=new Date(m+9*3600e3);return d.toISOString().slice(5,16).replace('T',' ');};

const HASH_TAB={'#voc':'voc','#team':'team'}; // 업무OS 바로가기 (…/marketing-hub/#voc)
const S={user:null,tab:HASH_TAB[location.hash]||'home',roles:null,settings:{...DEFAULT_SET},sales:[],ads:[],stock:[],log:[],voc:[],links:[],team:{},msg:null,temp:null,busy:false};

/* ── 로그인 ── */
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e=>console.error('[auth] persistence',e));
auth.onAuthStateChanged(async(u)=>{
  S.user=u; $('#logout').hidden=!u; $('#who').textContent=u?u.email:'';
  if(!u){$('#tabs').hidden=true;renderLogin();return;}
  try{
    const r=await col(COLL.access).doc('roles').get(); // secure: 관리자만 읽힘 · open: 누구나 읽힘 → 아래에서 이메일로 확인
    S.roles=r.exists?r.data():{admins:[],uploaders:[],people:{}};
    if(!C.isAdminEmail(u.email,S.roles)){location.replace('upload.html'+location.search);return;}
  }catch(e){
    if(e.code==='permission-denied'){location.replace('upload.html'+location.search);return;} // 업로더·미등록 → 올리기 화면
    console.error('[mkt-access] 로드 실패',e);setMsg('err','권한 확인 실패: '+(e.code||e.message));render();return;
  }
  $('#tabs').hidden=false;
  await boot();
});
$('#logout').onclick=()=>auth.signOut();
function renderLogin(){
  $('#app').innerHTML=`<div class="card" id="login"><h3>관리자 로그인</h3><div class="bd">
    <div style="margin-bottom:10px"><label class="sub" for="lg-email">이메일</label><input id="lg-email" type="email" autocomplete="username"></div>
    <div style="margin-bottom:12px"><label class="sub" for="lg-pw">비밀번호</label><input id="lg-pw" type="password" autocomplete="current-password"></div>
    <button class="btn pri" style="width:100%;padding:12px" id="lg-btn">로그인</button><p class="sub" id="lg-err" style="color:var(--red)"></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="lg-reset">비밀번호 재설정 메일</button><button class="btn sm" id="lg-first">처음이면 대표 계정 만들기</button></div>
    <p class="sub">비밀번호를 모르면 이메일을 넣고 [비밀번호 재설정 메일] → 메일의 링크에서 새 비밀번호를 정합니다.</p></div></div>`;
  const go=async()=>{try{await auth.signInWithEmailAndPassword($('#lg-email').value.trim(),$('#lg-pw').value);}
    catch(e){console.error('[auth] 로그인 실패',e);$('#lg-err').textContent=e.code==='auth/invalid-credential'?'이메일 또는 비밀번호가 올바르지 않습니다.':('로그인 실패: '+e.code);}};
  $('#lg-btn').onclick=go;$('#lg-pw').onkeydown=(e)=>{if(e.key==='Enter')go();};
  const em=()=>$('#lg-email').value.trim().toLowerCase(), err=(t,ok)=>{$('#lg-err').style.color=ok?'var(--green)':'var(--red)';$('#lg-err').textContent=t;};
  $('#lg-reset').onclick=async()=>{if(!em()){err('이메일을 먼저 넣으세요.');return;}
    try{await auth.sendPasswordResetEmail(em());err(`${em()} 로 재설정 요청을 보냈습니다. 5분 안에 메일(보낸 사람 noreply@pour-app-new.firebaseapp.com)이 안 오면 스팸·프로모션함을 보고, 그래도 없으면 아직 계정이 없는 것입니다 → 비밀번호 칸에 새 비밀번호(8자 이상)를 넣고 [처음이면 대표 계정 만들기].`,true);}catch(e){console.error('[auth] 재설정 실패',e);err('재설정 메일 실패: '+e.code);}};
  $('#lg-first').onclick=async()=>{ // 대표 이메일만 · 이미 계정이 있으면 재설정 안내
    if(!OWNER_EMAILS.includes(em())){err('대표 이메일(netformrnd@gmail.com)만 여기서 만들 수 있습니다. 다른 계정은 대표가 [계정] 탭에서 만듭니다.');return;}
    const pw=$('#lg-pw').value;if(pw.length<8){err('비밀번호 칸에 새로 쓸 비밀번호(8자 이상)를 넣고 다시 누르세요.');return;}
    try{await auth.createUserWithEmailAndPassword(em(),pw);}
    catch(e){console.error('[auth] 계정 만들기 실패',e);err(e.code==='auth/email-already-in-use'?'이미 계정이 있습니다. 비밀번호를 모르면 [비밀번호 재설정 메일]을 누르세요.':('계정 만들기 실패: '+e.code));}};
}

/* ── 시작: 설정 → 쌓인 업로드 정리 → 데이터 ── */
async function boot(){
  try{
    const s=await col(COLL.settings).doc('main').get();
    S.settings={...DEFAULT_SET,...(s.exists?s.data():{})};
  }catch(e){console.error('[mkt-settings] 로드 실패',e);}
  render();
  await processPending();
  await loadData();
}

async function processPending(){
  try{
    // 정리된 마지막 업로드 시각 − 2일 이후 업로드만 읽음 (CSV 가 커서 전부 읽지 않음)
    const since=new Date(Date.now()-60*864e5);
    const st=await col(COLL.status).where('uploadCreatedAt','>=',since).get();
    S.log=st.docs.map(d=>({id:d.id,...d.data()}));
    console.log(`[${COLL.status}] ${S.log.length}건`);
    const done=new Set(S.log.map(x=>x.id));
    const last=Math.max(0,...S.log.map(x=>tsMs(x.uploadCreatedAt)));
    const from=new Date(Math.max(since.getTime(),last-2*864e5));
    const up=await col(COLL.uploads).where('createdAt','>=',from).get();
    const pending=up.docs.map(d=>({id:d.id,...d.data()})).filter(u=>!done.has(u.id));
    console.log(`[${COLL.uploads}] ${up.size}건 읽음 · 정리할 것 ${pending.length}건`);
    if(!pending.length) return;
    // 판매·광고 먼저, 재고는 마지막(일평균 판매량이 필요) · 같은 종류는 올린 순서
    const rank=(u)=>(C.channelOf(u.channel)||{}).kind==='stock'?1:0;
    pending.sort((a,b)=>rank(a)-rank(b)||tsMs(a.createdAt)-tsMs(b.createdAt));
    setMsg('wait',`쌓인 업로드 ${pending.length}건 정리 중…`);render();
    let ok=0,fail=0;
    for(const u of pending){const r=await processUpload(u);r.result==='ok'?ok++:fail++;S.log.push(r);}
    setMsg(fail?'err':'ok',`업로드 ${pending.length}건 정리 — 성공 ${ok}${fail?` · 실패 ${fail} (업로드 기록 탭)`:''}`);
  }catch(e){console.error('[정리] 실패',e);setMsg('err','업로드 정리 실패: '+(e.code||e.message));}
  render();
}

async function processUpload(u){
  const ch=C.channelOf(u.channel);
  const base={uploadId:u.id,channel:u.channel,reportDate:u.reportDate,uploadedBy:u.uploadedBy||'',uploaderEmail:u.uploaderEmail||'',
    fileName:u.fileName||'',uploadCreatedAt:u.createdAt||null,processedBy:S.user.email};
  let status;
  try{
    if(!ch) throw new Error('모르는 채널: '+u.channel);
    const r=C.analyze(u.csv,u.channel);
    if(!r.ok) throw new Error(r.errors.join(' '));
    const docs=C.buildDocs(r,u.channel,u.reportDate);
    const coll=KIND_COLL[ch.kind];
    if(ch.kind==='stock'){
      const from=C.addDays(u.reportDate,-(S.settings.windowDays-1));
      const ss=await col(COLL.sales).where('reportDate','>=',from).get();
      const sales=ss.docs.map(d=>d.data()).filter(s=>s.reportDate<=u.reportDate);
      console.log(`[${COLL.sales}] 재고 계산용 ${sales.length}건`);
      for(const d of docs.values()) Object.assign(d,C.stockPlan(d,sales,S.settings));
    }
    // 같은 날짜·채널의 이전 정리분 중 이번에 없는 것은 지움 (그날 리포트를 통째로 바꿈 → 중복·유령 줄 없음)
    const old=await col(coll).where('reportDate','==',u.reportDate).get();
    const stale=old.docs.filter(d=>(ch.kind==='stock'||d.data().channel===u.channel)&&!docs.has(d.id));
    const ops=[...[...docs].map(([id,d])=>({id,d:{...d,uploadId:u.id,updatedAt:FV.serverTimestamp()}})),...stale.map(d=>({id:d.id,del:true}))];
    for(let i=0;i<ops.length;i+=400){
      const b=db.batch();
      for(const o of ops.slice(i,i+400)){const ref=col(coll).doc(o.id);o.del?b.delete(ref):b.set(ref,o.d);}
      await b.commit();
    }
    console.log(`[${coll}] ${u.reportDate} ${u.channel}: ${docs.size}건 저장 · ${stale.length}건 정리`);
    status={...base,result:'ok',rows:r.rows.length,docs:docs.size,removed:stale.length,message:`${r.rows.length}행 → ${docs.size}건`};
  }catch(e){
    console.error('[정리] 업로드',u.id,'실패',e);
    status={...base,result:'fail',rows:0,docs:0,message:String(e.message||e)};
  }
  await col(COLL.status).doc(u.id).set({...status,processedAt:FV.serverTimestamp()});
  return {id:u.id,...status,processedAt:new Date()};
}

// 고객의 소리 급함 → 업무OS: 바뀐 줄만 쓰고 · 이제 없는 줄은 닫음(open:false · 지우지 않음)
async function syncVocLinks(){
  const want=new Map(C.vocLinks(S.voc,todayKST()).map(l=>[l.id,l]));
  const cur=new Map(S.links.filter(l=>l.kind==='voc').map(l=>[l.id,l]));
  const w=[];
  want.forEach((l,id)=>{const c=cur.get(id);if(!c||c.title!==l.title||c.sub!==l.sub||c.date!==l.date)w.push([id,c?{...l,at:c.at||l.at}:l]);});
  cur.forEach((c,id)=>{if(!want.has(id))w.push([id,{...c,open:false,closedAt:new Date().toISOString()}]);});
  if(!w.length)return;
  const b=db.batch();w.forEach(([id,d])=>b.set(linksCol().doc(id),d));await b.commit();
  S.links=S.links.filter(l=>l.kind!=='voc').concat([...want.values()]);
  console.log(`[업무OS 다리] 고객의 소리 ${w.length}줄 반영`);
}

function stockRows(){
  // 상품별 가장 최근 재고 → 지금 판매 기록으로 다시 계산
  const latest=new Map();
  for(const d of S.stock){const k=d.productKey||d.productCode||d.productName;const p=latest.get(k);if(!p||d.reportDate>p.reportDate)latest.set(k,d);}
  return [...latest.values()].map(d=>({...d,...C.stockPlan(d,S.sales,S.settings)}))
    .sort((a,b)=>(b.reorderNeeded-a.reorderNeeded)||((a.daysLeft==null?1e9:a.daysLeft)-(b.daysLeft==null?1e9:b.daysLeft)));
}
function salesRows(){
  const t=todayKST(), a=C.addDays(t,-7), b=C.addDays(t,-14);
  const m=new Map();
  for(const s of S.sales){
    const k=s.productCode||s.productName; const r=m.get(k)||{code:s.productCode,name:s.productName,q7:0,r7:0,qp:0,rp:0,ch:new Set()};
    if(!r.name&&s.productName)r.name=s.productName;
    if(s.reportDate>=a){r.q7+=s.qty||0;r.r7+=s.revenue||0;r.ch.add(s.channel);} else if(s.reportDate>=b){r.qp+=s.qty||0;r.rp+=s.revenue||0;}
    m.set(k,r);
  }
  return [...m.values()].sort((x,y)=>y.r7-x.r7||y.q7-x.q7);
}
function dailyRevenue(){
  const days=[];for(let i=14;i>=1;i--)days.push(C.addDays(todayKST(),-i));
  const sum=Object.fromEntries(days.map(d=>[d,0]));
  for(const s of S.sales) if(s.reportDate in sum) sum[s.reportDate]+=s.revenue||0;
  return days.map(d=>({d,v:sum[d]}));
}

function vocKeep(v){
  const p=$('#voc-product'),t=$('#voc-text');if(!p||!t)return null;
  if(v===undefined){const a=document.querySelector('input[name=voc-type]:checked'),b=document.querySelector('input[name=voc-source]:checked');return {p:p.value,t:t.value,a:a&&a.value,b:b&&b.value};}
  if(!v)return null;
  p.value=v.p;t.value=v.t;
  for(const [n,x] of [['voc-type',v.a],['voc-source',v.b]])if(x)document.querySelectorAll(`input[name=${n}]`).forEach(i=>{i.checked=i.value===x;});
  return null;
}
function vocProducts(){
  const set=new Set();
  for(const x of S.sales)if(x.productName)set.add(x.productName);
  for(const x of S.stock)if(x.productName)set.add(x.productName);

}

/* ── 동작 ── */
document.addEventListener('click',async(e)=>{
  const b=e.target.closest('button');if(!b)return;
  try{
    if(b.id==='set-save'){
      const next={};for(const k of Object.keys(DEFAULT_SET)){const v=Number($('#st-'+k).value);if(!Number.isFinite(v)||v<0){setMsg('err','숫자를 확인하세요: '+k);render();return;}next[k]=v;}
      if(next.windowDays<1||next.adsDays<1){setMsg('err','기간은 1일 이상이어야 합니다');render();return;}
      await col(COLL.settings).doc('main').set({...next,updatedAt:FV.serverTimestamp(),updatedBy:S.user.email});
      S.settings={...DEFAULT_SET,...next};setMsg('ok','기준값을 저장했습니다');await loadData();return;
    }
    if(b.id==='obsidian-copy'){
      try{await navigator.clipboard.writeText(obsidianText());setMsg('ok',`노트 내용을 복사했습니다 → 옵시디언에서 '${C.OBSIDIAN_NOTE}' 노트를 만들고(없으면) 내용을 지운 뒤 붙여넣기`);}
      catch(err){console.error('[옵시디언] 복사 실패',err);setMsg('err','복사 실패 — 브라우저가 클립보드를 막았습니다');}
      render();window.scrollTo(0,0);return;
    }
    if(b.id==='obs-vault-save'){try{localStorage.setItem('mkt_obsidian_vault',$('#obs-vault').value.trim());}catch(err){console.error('[옵시디언] 볼트 이름 저장 실패',err);}setMsg('ok','볼트 이름을 저장했습니다');render();return;}
    if(b.id==='migrate-open'){
      if(!confirm('임시 저장소의 데이터를 잠긴 저장소로 복사할까요?'))return;
      b.disabled=true;b.textContent='옮기는 중…';
      const names=[COLL.access,COLL.settings,COLL.status,COLL.sales,COLL.ads,COLL.stock,COLL.voc,COLL.team];let total=0;
      for(const n of names){
        const snap=await C.col(db,n,'open').get();console.log(`[옮기기] ${n} ${snap.size}건`);
        for(let i=0;i<snap.docs.length;i+=400){const bt=db.batch();for(const d of snap.docs.slice(i,i+400))bt.set(C.col(db,n,'secure').doc(d.id),d.data());await bt.commit();}
        total+=snap.size;
      }
      const r=await col(COLL.access).doc('roles').get();if(r.exists)S.roles=r.data();
      setMsg('ok',`임시 저장소에서 ${total}건을 옮겼습니다`);await processPending();await loadData();return;
    }
    if(b.id==='reprocess-all'){await processPending();await loadData();return;}
    if(b.dataset.redo){
      b.disabled=true;const d=await col(COLL.uploads).doc(b.dataset.redo).get();
      if(!d.exists){setMsg('err','원본 업로드가 없습니다');render();return;}
      const r=await processUpload({id:d.id,...d.data()});S.log=S.log.filter(x=>x.id!==d.id).concat(r);
      setMsg(r.result==='ok'?'ok':'err',`다시 정리: ${r.result==='ok'?'성공':'실패'} — ${r.message}`);await loadData();return;
    }
    if(b.id==='voc-save'){await saveVoc(b);return;}
    if(b.dataset.vocDone){
      const v=S.voc.find(x=>x.id===b.dataset.vocDone);if(!v)return;
      b.disabled=true;const resolved=!v.resolved;
      await col(COLL.voc).doc(v.id).update({resolved,resolvedAt:resolved?FV.serverTimestamp():null,resolvedBy:resolved?S.user.email:null});
      v.resolved=resolved;await syncVocLinks();setMsg('ok',`${v.product} — ${resolved?'끝남으로 표시':'다시 열었습니다'}`);render();return;
    }
    if(b.dataset.review){
      const l=S.links.find(x=>x.id===b.dataset.review);if(!l)return;
      b.disabled=true;
      await linksCol().doc(l.id).set({open:false,closedAt:new Date().toISOString(),closedBy:S.user.email},{merge:true});
      if(l.member)await col(COLL.team).doc(l.member).set({lastDate:l.date||todayKST(),lastTitle:String(l.title||'').replace(/^검토:\s*/,''),lastNote:l.note||l.sub||'',lastReviewedAt:FV.serverTimestamp(),lastReviewedBy:S.user.email,reviewed:FV.increment(1)},{merge:true});
      S.links=S.links.filter(x=>x.id!==l.id);
      if(l.member)S.team[l.member]={...(S.team[l.member]||{}),lastDate:l.date||todayKST(),lastTitle:String(l.title||'').replace(/^검토:\s*/,'')};
      setMsg('ok',`검토 끝: ${l.title}`);render();return;
    }
    if(b.dataset.copy){await copyTable(b.dataset.copy);return;}
    if(b.dataset.acct)await acct(b.dataset.acct,b);
  }catch(err){console.error('[동작] 실패',err);setMsg('err','실패: '+(err.code||err.message));render();}
});

async function copyTable(kind){
  let rows;
  if(kind==='stock')rows=[['상품코드','상품명','가용재고','일평균','남은일수','리드타임','발주필요','발주수량','기준일'],...stockRows().map(r=>[r.productCode,r.productName,r.available,r.avgDailySales,r.daysLeft==null?'':r.daysLeft,r.leadTimeDays,r.reorderNeeded?'Y':'',r.reorderQty,r.reportDate])];
  else if(kind==='ads'){const a=C.keywordAdvice(S.ads,S.settings);rows=[['판단','채널','캠페인','키워드','노출','클릭','비용','전환매출','ROAS%'],...[['올리기',a.up],['줄이기',a.down],['끄기',a.off],['유지',a.keep]].flatMap(([l,list])=>list.map(d=>[l,chName(d.channel),d.campaign,d.keyword,d.impressions,d.clicks,Math.round(d.cost),Math.round(d.revenue),d.roas]))];}
  else if(kind==='voc')rows=[['날짜','제품','종류','들은곳','내용','끝남'],...S.voc.map(v=>[v.date,v.product,v.type,v.source,v.text,v.resolved?'Y':''])];
  else rows=[['상품코드','상품명','7일수량','7일매출','전주수량'],...salesRows().map(r=>[r.code,r.name,r.q7,Math.round(r.r7),r.qp])];
  const tsv=rows.map(r=>r.map(c=>String(c==null?'':c).replace(/[\t\n]/g,' ')).join('\t')).join('\n');
  try{await navigator.clipboard.writeText(tsv);setMsg('ok',`${rows.length-1}줄을 복사했습니다 (Claude·옵시디언에 붙여넣기)`);}
  catch(e){console.error('[복사] 실패',e);setMsg('err','복사 실패 — 브라우저가 클립보드를 막았습니다');}
  render();
}

async function saveVoc(b){
  const typ=document.querySelector('input[name=voc-type]:checked'), src=document.querySelector('input[name=voc-source]:checked');
  const r=C.vocDoc({product:$('#voc-product').value,type:typ?typ.value:'',source:src?src.value:'',text:$('#voc-text').value});
  if(!r.ok){setMsg('err','실패: '+r.errors.join(' '));render();return;}
  b.disabled=true;
  const ref=await col(COLL.voc).add({...r.doc,date:todayKST(),by:S.user.uid,byEmail:S.user.email,createdAt:FV.serverTimestamp()});
  console.log('[mkt-voc] 저장',ref.id,r.doc.product,r.doc.type);
  S.voc.unshift({id:ref.id,...r.doc,date:todayKST(),byEmail:S.user.email,createdAt:new Date()});
  $('#voc-product').value='';$('#voc-text').value='';document.querySelectorAll('input[name=voc-type]').forEach(i=>{i.checked=false;});
  await syncVocLinks().catch(e=>console.error('[업무OS 다리] 고객의 소리',e));
  setMsg('ok',`완료: ${r.doc.product} ${r.doc.type} 저장${r.masked?` (개인정보 ${r.masked}곳 가림)`:''}${r.doc.urgent?' · 급함 → 업무OS 확인할 것':''}`);render();window.scrollTo(0,0);
}
function tempPw(){const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';const a=new Uint32Array(14);crypto.getRandomValues(a);return Array.from(a,x=>c[x%c.length]).join('')+'!7';}
async function createAuth(email,pw){ // 보조 앱으로 만들어 지금 로그인한 관리자가 로그아웃되지 않게
  let app=firebase.apps.find(a=>a.name==='mkt-acct');if(!app){app=firebase.initializeApp(FB_CFG,'mkt-acct');if(EMU)app.auth().useEmulator('http://127.0.0.1:9099');}
  try{await app.auth().createUserWithEmailAndPassword(email,pw);await app.auth().signOut();return 'created';}
  catch(e){if(e.code==='auth/email-already-in-use')return 'exists';throw e;}
}
async function saveRoles(r){
  const ppl=Object.values(r.people||{}).filter(p=>p.active!==false);
  r.admins=ppl.filter(p=>p.role==='admin').map(p=>p.email);
  r.uploaders=ppl.filter(p=>p.role==='uploader').map(p=>p.email);
  r.staffs=ppl.filter(p=>p.role==='staff').map(p=>p.email);
  r.updatedAt=new Date().toISOString();r.updatedBy=S.user.email;
  await col(COLL.access).doc('roles').set(r);S.roles=r;
}
async function acct(a,b){
  if(a==='copy'){try{await navigator.clipboard.writeText(S.temp.pw);setMsg('ok','임시 비밀번호를 복사했습니다');}catch(e){setMsg('err','길게 눌러 복사하세요');}render();return;}
  const r=JSON.parse(JSON.stringify(S.roles||{}));r.people=r.people||{};
  if(a==='add'){
    const email=$('#ac-email').value.trim().toLowerCase(), name=$('#ac-name').value.trim(), role=$('#ac-role').value;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){setMsg('err','이메일을 확인하세요');render();return;}
    if(OWNER_EMAILS.includes(email)){setMsg('err','대표 이메일은 이미 관리자입니다');render();return;}
    if(role!=='admin'&&OWNER_EMAILS.concat(r.admins||[]).includes(email)&&!confirm('관리자 이메일을 관리자가 아닌 역할로 바꿀까요?'))return;
    b.disabled=true;b.textContent='만드는 중…';
    const pw=tempPw(), res=await createAuth(email,pw);
    r.people[email]={...(r.people[email]||{}),email,name:name||email.split('@')[0],role,active:true,addedAt:(r.people[email]||{}).addedAt||new Date().toISOString(),addedBy:S.user.email};
    await saveRoles(r);S.temp=res==='created'?{email,pw}:null;
    setMsg('ok',res==='created'?`${email} 계정을 만들고 ${({admin:'관리자',staff:'직원',uploader:'업로더'})[role]}로 등록했습니다`:`${email} 은(는) 이미 계정이 있어 역할만 등록했습니다`);render();return;
  }
  const email=b.dataset.e;if(!r.people[email])return;
  if(a==='toggle'){
    const off=r.people[email].active!==false;
    if(off&&!confirm(`${email} 사용을 중지할까요? (계정은 남고 권한만 없어집니다)`))return;
    r.people[email].active=!off;await saveRoles(r);setMsg('ok',`${email} ${off?'사용 중지':'다시 사용'}`);render();return;
  }
  if(a==='reset'){await auth.sendPasswordResetEmail(email);setMsg('ok',`${email} 로 비밀번호 재설정 메일을 보냈습니다`);render();}
}
</script>
