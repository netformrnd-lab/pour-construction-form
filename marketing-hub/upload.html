<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>리포트 올리기 · POUR 마케팅 허브</title>
<!--
  Aside(AI 브라우저) 전용 입력 페이지. 화면 하나: 채널 · 날짜 · CSV → 미리보기 → 저장.
  · Firebase: pour-app-new · 컬렉션 mkt-uploads (새로 만들기만 — firestore.rules '마케팅 허브')
  · 정리(판매·광고·재고 표로)는 관리자 화면(index.html)을 열 때 한다
  · 모든 버튼·칸에 고정 id · aria-label (Aside 루틴이 찾는 이름 — 바꾸면 marketing-hub/README.md 루틴도 같이)
-->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="core.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#0D1B2A;--accent:#2563EB;--accent-l:#EFF6FF;--green:#059669;--green-l:#ECFDF5;--red:#DC2626;--red-l:#FEF2F2;
  --text:#111827;--text-md:#4B5563;--text-sm:#9CA3AF;--bg:#F9FAFB;--card:#fff;--border:#E5E7EB;--r:12px;--r-sm:8px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,system-ui,'Segoe UI',sans-serif;font-size:15px}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header b{font-size:16px;white-space:nowrap}
header .who{margin-left:auto;font-size:12px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45vw}
header button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:var(--r-sm);padding:6px 10px;font-size:12px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:700;color:var(--text-md);margin:0 0 6px}
.field{margin-bottom:14px}
select,input[type=date],input[type=email],input[type=password],textarea{width:100%;max-width:100%;font:inherit;border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 12px;background:#fff;color:var(--text)}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
input[type=file]{width:100%;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:var(--r-sm);padding:14px;font:inherit;font-weight:800;cursor:pointer;background:#fff;border:1px solid var(--border);color:var(--text)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:12px;color:var(--text-sm);margin-top:6px}
#status-message{font-size:16px;font-weight:800;border-radius:var(--r-sm);padding:14px;margin:0 0 14px;display:none;word-break:keep-all}
#status-message.ok{display:block;background:var(--green-l);color:var(--green)}
#status-message.err{display:block;background:var(--red-l);color:var(--red)}
#status-message.wait{display:block;background:var(--accent-l);color:var(--accent)}
#preview-errors{color:var(--red);font-weight:700;font-size:14px}
#preview-errors div{margin-bottom:4px}
.cols{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cols span{font-size:12px;background:var(--accent-l);color:var(--accent);border-radius:20px;padding:3px 10px}
.tbl{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-sm)}
table{border-collapse:collapse;font-size:12px;min-width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:left}
th{background:#F3F4F6}
#login-error{color:var(--red);font-weight:700;font-size:14px;min-height:1em}
@media (max-width:700px){main{padding:12px}.row2{grid-template-columns:1fr}.card{padding:14px}}
</style>
</head>
<body>
<header>
  <b>📥 리포트 올리기</b>
  <span class="who" id="who"></span>
  <button type="button" id="logout-button" aria-label="로그아웃" hidden>로그아웃</button>
</header>
<main>
  <!-- 로그인 -->
  <section class="card" id="login-section" hidden>
    <div class="field"><label for="login-email">이메일</label><input id="login-email" type="email" autocomplete="username" aria-label="이메일"></div>
    <div class="field"><label for="login-password">비밀번호</label><input id="login-password" type="password" autocomplete="current-password" aria-label="비밀번호"></div>
    <div class="btns"><button type="button" class="btn pri" id="login-button" aria-label="로그인">로그인</button></div>
    <p id="login-error" role="alert"></p>
  </section>

  <!-- 업로드 -->
  <section id="upload-section" hidden>
    <p id="status-message" role="status" aria-live="polite"></p>
    <div class="card">
      <div class="row2">
        <div class="field"><label for="channel">채널</label>
          <select id="channel" aria-label="채널"></select></div>
        <div class="field"><label for="report-date">리포트 날짜</label>
          <input id="report-date" type="date" aria-label="리포트 날짜"></div>
      </div>
      <div class="field"><label for="csv-file">CSV 파일</label>
        <input id="csv-file" type="file" accept=".csv,.tsv,.txt,text/csv" aria-label="CSV 파일">
        <div class="hint" id="file-info">파일을 고르거나, 아래 칸에 표를 붙여넣기</div></div>
      <div class="field"><label for="csv-text">붙여넣기</label>
        <textarea id="csv-text" aria-label="CSV 붙여넣기" placeholder="엑셀·관리자 화면 표를 복사해서 붙여넣기 (첫 줄 = 열 이름)"></textarea></div>
      <div class="btns">
        <button type="button" class="btn" id="preview-button" aria-label="미리보기">미리보기</button>
        <button type="button" class="btn pri" id="save-button" aria-label="저장">저장</button>
      </div>
    </div>
    <div class="card" id="preview-section" hidden>
      <div id="preview-errors" role="alert"></div>
      <div id="preview-summary"></div>
      <div class="cols" id="preview-columns"></div>
      <div class="tbl"><table id="preview-table"></table></div>
    </div>
  </section>
</main>
<script>
'use strict';
const FB_CFG={apiKey:"AIzaSyBbct9tO8nCUCjz4s9GnXQLkHuHe2FFyyU",authDomain:"pour-app-new.firebaseapp.com",projectId:"pour-app-new",
  storageBucket:"pour-app-new.firebasestorage.app",messagingSenderId:"411031141847",appId:"1:411031141847:web:e658174fd4b9652cdadf92"};
firebase.initializeApp(FB_CFG);
const auth=firebase.auth(), db=firebase.firestore();
// 로컬 시험(localhost?emu=1)만 에뮬레이터 — 실제 주소에선 동작 안 함
if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&new URLSearchParams(location.search).has('emu')){auth.useEmulator('http://127.0.0.1:9099');db.useEmulator('127.0.0.1',8080);}
const MODE=window.MktCore.storeMode(); // 저장 위치: core.js STORE_MODE
const C=window.MktCore, $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('channel').innerHTML='<option value="">채널 선택</option>'+C.CHANNELS.map(c=>`<option value="${c.id}">${c.label}</option>`).join('');
$('report-date').value=C.yesterdayKST();

/* 로그인 */
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e=>console.error('[auth] persistence',e));
auth.onAuthStateChanged(async u=>{
  $('login-section').hidden=!!u; $('upload-section').hidden=!u; $('logout-button').hidden=!u;
  $('who').textContent=u?u.email:'';
  if(u&&MODE==='open'){ // 직원(고객의 소리만)은 고객의 소리 화면으로 · 잠긴 저장소에선 역할을 못 읽으므로 직원은 voc.html 주소로 바로 들어감
    try{const rd=await C.col(db,'mkt-access','open').doc('roles').get(), r=rd.exists?rd.data():{};
      if(C.isStaffEmail(u.email,r)&&!C.isUploaderEmail(u.email,r)&&!C.isAdminEmail(u.email,r))location.replace('voc.html'+location.search);}
    catch(e){console.error('[mkt-access] 역할 확인 실패',e);}
  }
});
const LOGIN_ERR={'auth/invalid-credential':'이메일 또는 비밀번호가 올바르지 않습니다.','auth/wrong-password':'비밀번호가 틀렸습니다.',
  'auth/user-not-found':'없는 계정입니다.','auth/too-many-requests':'시도가 많습니다. 잠시 후 다시 하세요.','auth/network-request-failed':'네트워크 오류입니다.'};
$('login-button').onclick=async()=>{
  const email=$('login-email').value.trim(), pw=$('login-password').value;
  if(!email||!pw){$('login-error').textContent='이메일과 비밀번호를 입력하세요.';return;}
  $('login-button').disabled=true;
  try{await auth.signInWithEmailAndPassword(email,pw);$('login-error').textContent='';$('login-password').value='';}
  catch(e){console.error('[auth] 로그인 실패',e);$('login-error').textContent=LOGIN_ERR[e.code]||('로그인 실패: '+e.code);}
  finally{$('login-button').disabled=false;}
};
$('login-password').addEventListener('keydown',e=>{if(e.key==='Enter')$('login-button').click();});
$('logout-button').onclick=()=>auth.signOut();

/* 입력 읽기 — 한국 관리자 사이트 CSV 는 EUC-KR 인 경우가 많아 UTF-8 실패 시 EUC-KR 로 */
async function readInput(){
  const f=$('csv-file').files[0];
  if(f){
    const buf=await f.arrayBuffer();
    let text;
    try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){text=new TextDecoder('euc-kr').decode(buf);}
    return {text,fileName:f.name};
  }
  return {text:$('csv-text').value,fileName:''};
}
$('csv-file').onchange=()=>{const f=$('csv-file').files[0];$('file-info').textContent=f?`선택한 파일: ${f.name} (${Math.round(f.size/1024)}KB) — 붙여넣기 칸보다 우선`:'파일을 고르거나, 아래 칸에 표를 붙여넣기';};

function setStatus(cls,text){const s=$('status-message');s.className=cls;s.textContent=text;}
function chLabel(){const c=C.channelOf($('channel').value);return c?c.label:'';}

function showPreview(r){
  $('preview-section').hidden=false;
  $('preview-errors').innerHTML=r.errors.map(e=>`<div>오류: ${esc(e)}</div>`).join('');
  $('preview-summary').textContent=r.ok?`인식한 데이터 ${r.rows.length}행 (앞 10행 표시)`:'';
  $('preview-columns').innerHTML=(r.recognized||[]).map(x=>`<span>${esc(x.label)} ← ${esc(x.column)}</span>`).join('');
  const head=r.header||[], body=r.preview||[];
  $('preview-table').innerHTML=head.length?`<thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${body.map(row=>`<tr>${head.map((_,i)=>`<td>${esc(row[i])}</td>`).join('')}</tr>`).join('')}</tbody>`:'';
}

async function check(){
  const channel=$('channel').value, date=$('report-date').value;
  if(!channel) return {fail:'채널을 고르세요.'};
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return {fail:'리포트 날짜를 고르세요.'};
  const {text,fileName}=await readInput();
  if(!text.trim()) return {fail:'CSV 파일을 고르거나 표를 붙여넣으세요.'};
  const r=C.analyze(text,channel);
  showPreview(r);
  if(!r.ok) return {fail:r.errors.join(' ')};
  return {r,text,fileName,channel,date};
}

$('preview-button').onclick=async()=>{
  setStatus('','');
  const c=await check();
  if(c.fail) setStatus('err','오류: '+c.fail); else setStatus('wait',`미리보기 정상: ${c.date} ${chLabel()} ${c.r.rows.length}행 — [저장]을 누르세요`);
};

$('save-button').onclick=async()=>{
  const btn=$('save-button'); btn.disabled=true; setStatus('wait','저장 중…');
  try{
    const c=await check();
    if(c.fail){setStatus('err','실패: '+c.fail);return;}
    const u=auth.currentUser;
    if(MODE==='open'){ // 공개 저장소: 규칙이 못 막으므로 화면에서 등록된 계정인지 확인
      const rd=await C.col(db,'mkt-access','open').doc('roles').get();
      const roles=rd.exists?rd.data():{};
      if(!C.isAdminEmail(u.email,roles)&&!C.isUploaderEmail(u.email,roles)){setStatus('err','실패: 이 계정은 업로드 권한이 없습니다. 관리자에게 등록을 요청하세요.');return;}
    }
    // 공개 저장소에선 고객 정보 같은 다른 열이 새지 않게 알아본 열만 저장
    let csv=c.text, reduced=false;
    if(MODE==='open'||C.utf8Bytes(csv)>=C.MAX_CSV_BYTES){csv=C.reducedCsv(c.r);reduced=true;}
    if(C.utf8Bytes(csv)>=C.MAX_CSV_BYTES){setStatus('err','실패: 파일이 너무 큽니다. 기간을 하루로 줄여 다시 받으세요.');return;}
    const ref=await C.col(db,'mkt-uploads',MODE).add({
      channel:c.channel, reportDate:c.date, csv, uploadedBy:u.uid, uploaderEmail:u.email,
      rowCount:c.r.rows.length, fileName:c.fileName.slice(0,200), reduced,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    console.log('[mkt-uploads] 저장',ref.id,c.channel,c.date,c.r.rows.length+'행');
    setStatus('ok',`완료: ${c.date} ${chLabel()} ${c.r.rows.length}행`);
    $('csv-file').value=''; $('csv-text').value=''; $('csv-file').onchange();
  }catch(e){
    console.error('[mkt-uploads] 저장 실패',e);
    setStatus('err',e&&e.code==='permission-denied'?'실패: 이 계정은 업로드 권한이 없습니다. 관리자에게 등록을 요청하세요.':'실패: 저장 오류 ('+(e&&(e.code||e.message))+')');
  }finally{btn.disabled=false;}
};
</script>
</body>
</html>
