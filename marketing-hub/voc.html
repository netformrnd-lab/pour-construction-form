<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>고객의 소리 · POUR 마케팅 허브</title>
<!--
  직원용 '고객의 소리' 쓰기 화면 (사용자 결정 2026-10-10 · 볼트 '00 고객의 소리(VOC)')
  · 전화·CS 끝나고 30초: 제품 · 종류 · 들은 곳 · 한 줄 → mkt-voc (새로 만들기만 — firestore.rules '마케팅 허브' mktValidVoc)
  · 전화번호·이메일·주민번호·동호수는 저장 전에 가림(core.js maskPII) · 고객 이름은 쓰지 않게 안내
  · 하자·안전 = 업무OS '확인할 것'에 바로 한 줄(pour-os/v2/links · 내용은 안 보냄)
  · 읽기·끝남 표시·온유 분석은 관리자 화면(index.html › 고객의 소리)
-->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="core.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#0D1B2A;--accent:#2563EB;--accent-l:#EFF6FF;--green:#059669;--green-l:#ECFDF5;--red:#DC2626;--red-l:#FEF2F2;
  --text:#111827;--text-md:#4B5563;--text-sm:#9CA3AF;--bg:#F9FAFB;--card:#fff;--border:#E5E7EB;--r:12px;--r-sm:8px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,system-ui,'Segoe UI',sans-serif;font-size:15px}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header b{font-size:16px;white-space:nowrap}
header .who{margin-left:auto;font-size:12px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45vw}
header button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:var(--r-sm);padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit}
main{max-width:600px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px}
label.t{display:block;font-size:13px;font-weight:700;color:var(--text-md);margin:0 0 6px}
.field{margin-bottom:16px}
input[type=text],input[type=email],input[type=password],textarea{width:100%;max-width:100%;font:inherit;border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 12px;background:#fff;color:var(--text)}
textarea{min-height:96px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips label{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:22px;padding:10px 16px;font-weight:700;cursor:pointer;background:#fff;color:var(--text)}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips label:has(input:checked){background:var(--navy);border-color:var(--navy);color:#fff}
.chips label.urg:has(input:checked){background:var(--red);border-color:var(--red)}
.btn{width:100%;border:0;border-radius:var(--r-sm);padding:15px;font:inherit;font-weight:800;cursor:pointer;background:var(--accent);color:#fff}
.btn:disabled{opacity:.5}
.hint{font-size:12px;color:var(--text-sm);margin-top:6px}
#status-message{font-size:15px;font-weight:800;border-radius:var(--r-sm);padding:14px;margin:0 0 14px;display:none;word-break:keep-all}
#status-message.ok{display:block;background:var(--green-l);color:var(--green)}
#status-message.err{display:block;background:var(--red-l);color:var(--red)}
#login-error{color:var(--red);font-weight:700;font-size:14px;min-height:1em}
.mine div{padding:9px 0;border-bottom:1px solid var(--border);font-size:14px;word-break:break-all}.mine div:last-child{border:0}
.mine .s{font-size:12px;color:var(--text-sm)}
@media (max-width:700px){main{padding:12px}.card{padding:14px}}
</style>
</head>
<body>
<header>
  <b>🗣 고객의 소리</b>
  <span class="who" id="who"></span>
  <button type="button" id="logout-button" hidden>로그아웃</button>
</header>
<main>
  <section class="card" id="login-section" hidden>
    <div class="field"><label class="t" for="login-email">이메일</label><input id="login-email" type="email" autocomplete="username"></div>
    <div class="field"><label class="t" for="login-password">비밀번호</label><input id="login-password" type="password" autocomplete="current-password"></div>
    <button type="button" class="btn" id="login-button">로그인</button>
    <p id="login-error" role="alert"></p>
    <p class="hint">계정은 대표가 마케팅 허브 › 계정에서 '직원'으로 만들어 줍니다.</p>
  </section>

  <section id="voc-section" hidden>
    <p id="status-message" role="status" aria-live="polite"></p>
    <div class="card">
      <div class="field"><label class="t" for="voc-product">제품</label>
        <input id="voc-product" type="text" list="voc-products" maxlength="60" placeholder="제품 이름" autocomplete="off"><datalist id="voc-products"></datalist></div>
      <div class="field"><label class="t">종류</label><div class="chips" id="voc-types"></div></div>
      <div class="field"><label class="t">들은 곳</label><div class="chips" id="voc-sources"></div></div>
      <div class="field"><label class="t" for="voc-text">내용 (한 줄)</label>
        <textarea id="voc-text" maxlength="300" placeholder="예: 뚜껑을 열 때 액이 새서 손에 묻는다고 함"></textarea>
        <div class="hint">고객 이름·전화번호·주소는 쓰지 마세요. 적어도 전화번호·이메일·동호수는 자동으로 가립니다.</div></div>
      <button type="button" class="btn" id="save-button">저장</button>
    </div>
    <div class="card" id="mine-card" hidden><label class="t">오늘 이 기기에서 쓴 것</label><div class="mine" id="mine"></div></div>
  </section>
</main>
<script>
'use strict';
const FB_CFG={apiKey:"AIzaSyBbct9tO8nCUCjz4s9GnXQLkHuHe2FFyyU",authDomain:"pour-app-new.firebaseapp.com",projectId:"pour-app-new",
  storageBucket:"pour-app-new.firebasestorage.app",messagingSenderId:"411031141847",appId:"1:411031141847:web:e658174fd4b9652cdadf92"};
firebase.initializeApp(FB_CFG);
const auth=firebase.auth(), db=firebase.firestore();
if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&new URLSearchParams(location.search).has('emu')){auth.useEmulator('http://127.0.0.1:9099');db.useEmulator('127.0.0.1',8080);}
const C=window.MktCore, MODE=C.storeMode(), $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayKST=()=>C.nowKST().date;
const MINE_KEY='mkt_voc_mine';

$('voc-types').innerHTML=C.VOC_TYPES.map(t=>`<label class="${t===C.VOC_URGENT_TYPE?'urg':''}"><input type="radio" name="voc-type" value="${esc(t)}">${esc(t)}</label>`).join('');
$('voc-sources').innerHTML=C.VOC_SOURCES.map((t,i)=>`<label><input type="radio" name="voc-source" value="${esc(t)}"${i===0?' checked':''}>${esc(t)}</label>`).join('');
// 제품 목록: 이 기기에서 전에 쓴 제품 (직원은 판매·재고를 못 읽음)
function mine(){try{const m=JSON.parse(localStorage.getItem(MINE_KEY)||'{}');return {products:m.products||[],today:m.date===todayKST()?(m.today||[]):[]};}catch(e){return {products:[],today:[]};}}
function saveMine(m){try{localStorage.setItem(MINE_KEY,JSON.stringify({...m,date:todayKST()}));}catch(e){console.error('[기기 저장] 실패',e);}}
function paintMine(){
  const m=mine();
  $('voc-products').innerHTML=m.products.map(p=>`<option value="${esc(p)}">`).join('');
  $('mine-card').hidden=!m.today.length;
  $('mine').innerHTML=m.today.map(x=>`<div><b>${esc(x.product)}</b> · ${esc(x.type)} — ${esc(x.text)}<div class="s">${esc(x.at)}</div></div>`).join('');
}
paintMine();

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e=>console.error('[auth] persistence',e));
auth.onAuthStateChanged(u=>{
  $('login-section').hidden=!!u; $('voc-section').hidden=!u; $('logout-button').hidden=!u;
  $('who').textContent=u?u.email:'';
});
$('login-button').onclick=async()=>{
  const email=$('login-email').value.trim(), pw=$('login-password').value;
  if(!email||!pw){$('login-error').textContent='이메일과 비밀번호를 입력하세요.';return;}
  $('login-button').disabled=true;
  try{await auth.signInWithEmailAndPassword(email,pw);$('login-error').textContent='';$('login-password').value='';}
  catch(e){console.error('[auth] 로그인 실패',e);$('login-error').textContent=e.code==='auth/invalid-credential'?'이메일 또는 비밀번호가 올바르지 않습니다.':('로그인 실패: '+e.code);}
  finally{$('login-button').disabled=false;}
};
$('login-password').addEventListener('keydown',e=>{if(e.key==='Enter')$('login-button').click();});
$('logout-button').onclick=()=>auth.signOut();

function setStatus(cls,text){const s=$('status-message');s.className=cls;s.textContent=text;window.scrollTo(0,0);}
$('save-button').onclick=async()=>{
  const btn=$('save-button');
  const typ=document.querySelector('input[name=voc-type]:checked'), src=document.querySelector('input[name=voc-source]:checked');
  const r=C.vocDoc({product:$('voc-product').value,type:typ?typ.value:'',source:src?src.value:'',text:$('voc-text').value});
  if(!r.ok){setStatus('err','실패: '+r.errors.join(' '));return;}
  btn.disabled=true;
  try{
    const u=auth.currentUser;
    if(MODE==='open'){ // 공개 저장소: 규칙이 못 막으므로 화면에서 등록된 계정인지 확인
      const rd=await C.col(db,'mkt-access','open').doc('roles').get(), roles=rd.exists?rd.data():{};
      if(!C.isStaffEmail(u.email,roles)&&!C.isAdminEmail(u.email,roles)){setStatus('err','실패: 이 계정은 고객의 소리 권한이 없습니다. 대표에게 직원 등록을 요청하세요.');return;}
    }
    const date=todayKST();
    const ref=await C.col(db,'mkt-voc',MODE).add({...r.doc,date,by:u.uid,byEmail:u.email,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    console.log('[mkt-voc] 저장',ref.id,r.doc.product,r.doc.type);
    if(r.doc.urgent){ // 하자·안전 → 업무OS '확인할 것' (대시보드가 같은 id 로 이어서 관리 · 끝나면 닫음)
      const l=C.vocLinks([{id:ref.id,...r.doc,date,resolved:false}],date)[0];
      await db.collection('pour-os').doc('v2').collection('links').doc(l.id).set(l).catch(e=>console.error('[업무OS 다리] 실패',e));
    }
    const m=mine();
    m.products=[r.doc.product,...m.products.filter(p=>p!==r.doc.product)].slice(0,50);
    m.today=[{product:r.doc.product,type:r.doc.type,text:r.doc.text,at:C.nowKST().time},...m.today].slice(0,30);
    saveMine(m);paintMine();
    $('voc-product').value='';$('voc-text').value='';document.querySelectorAll('input[name=voc-type]').forEach(i=>{i.checked=false;});
    setStatus('ok',`완료: ${r.doc.product} ${r.doc.type} 저장${r.masked?` (개인정보 ${r.masked}곳 가림)`:''}${r.doc.urgent?' · 급함으로 바로 알림':''}`);
  }catch(e){
    console.error('[mkt-voc] 저장 실패',e);
    setStatus('err',e&&e.code==='permission-denied'?'실패: 이 계정은 고객의 소리 권한이 없습니다. 대표에게 직원 등록을 요청하세요.':'실패: 저장 오류 ('+(e&&(e.code||e.message))+')');
  }finally{btn.disabled=false;}
};
</script>
</body>
</html>
