<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#107C41">
<title>POUR 분해원가</title>
<!--
  같은 틀 (2026-11-25 밤 송희님 "디자인 통일"): 가격·마진 대시보드 › 제품 › 분해원가 = 이 화면(?embed=1)을 대시보드 안 자리에 — 왼쪽 메뉴·위쪽 머리·한 줄 요약은 대시보드 것
    · 모양 = 대시보드에서 잰 값(도구줄·버튼·상태 탭·표·묶음 줄) · 따로 열면(경영 열람) 같은 모양의 위쪽 머리
  견적서(2026-11-25 밤): 업체 × 구성요소마다 여러 개 · cost-names/{카드}.vfiles (마스터·경영 열람만) · 저장소는 송희님 선택 전 = 노션 링크만(FILE_STORE.mode "link")
  노션 가져오기(2026-11-25 밤): window.costImport.applyNotion(payload) — 아래 applyNotionImport 설명 · 기록 cost-names/_notion
  분해원가 — 2026-11-25 송희님: '원가 계산기' → 메뉴 이름 '분해원가' · 품목별 원가 관리 화면
  · 목록 = 브랜드 · 품목·규격 · 생산 방식 · 국내/수입 · 완제품 원가 · 확정/임시 · 견적 유효기간 (거르기: 브랜드·생산 방식·국내/수입·분해 필요)
  · 생산 방식(자체생산 · 국내 OEM · 해외 OEM·수입 · 완제품 매입)마다 기본 줄 · 외화 단가 × 환율(카드 fx) → 원화
  · 구성요소마다 업체 여러 곳(A 주 · B 서브 · C…: 단가·부가세·통화·MOQ·리드타임·견적일·유효기간·메모) → '적용' 1곳으로 완제품 원가 · [업체 비교] 탭 = 나란히·최저가·바꾸면 ±
    실제 업체 이름 = cost-names/{id}.vsup (마스터·경영 열람만) · 카드엔 가칭(A사·B사)만
  · [가격정책표에 반영] (C) = 마스터만 바로 반영: product-meta/prod-cost.map[제품] + cost-log(누가·언제·전→후) + dashboard-activity + 카드 applied
    부마스터 = 반영 요청(가격정책표 개정안 → 마스터 승인) · 자동으로 몰래 안 바뀜
  ─ 아래는 11/23 처음 만든 때 설명 ─
  원가 분해·조립 계산기 — 2026-11-23 김송희 요청·승인 (관리 = 대시보드 · 경영팀 = 공급처까지 전부 열람 · 본부장님 = 전부 · 처음 품목 = POUR스토어 기존 품목 포함)
  · 같은 날 오후 범위 줄임: 결과는 ① 최종 완제품 원가 ② 판매가를 넣으면 마진율·마진액 두 가지 (판매가 3단계 고정 표·판매가 설정은 뺌)
    마진율 = 엑셀 '판매가' 시트 식을 판매가 기준으로 거꾸로 푼 값(pcc-core marginCalc) + 작게 가격정책표 방식 (판매가−원가)÷판매가
  · 가격·마진 대시보드(pourstore-pricing-dashboard.html)와 같은 프로젝트(pourstoreproject) · 같은 로그인
  · 품목 1장 = 원가 분해 1장 (송희님 엑셀 '표준_원가계산기_v7' 과 같은 칸·같은 식 — 계산은 아래 pcc-core 블록 하나)
  · 저장 자리 (규칙 pourstore.rules 2026-11-23):
      cost-cards/{id}   숫자·구성·가칭(A사·B사)만 — 마스터·부마스터·경영 열람 읽기 / 마스터 쓰기
      cost-names/{id}   실제 공급처·제조사 이름 — 마스터 + 경영 열람(읽기) · _alias = 이름→가칭 · _ref = 가격정책표 공급업체·제조사(본 화면이 저장)
      cost-ref/products 가격정책표 제품·매입원가·채널 판매가 + 채널·수수료(본 화면이 저장) · cost-ref/cards 요약(가격정책표 매입원가 옆 표시)
  · 매입원가 바꾸기 = 버튼 하나 [매입원가로 승인요청] → 가격정책표 개정안(product-meta/pricing-draft.cost) → 마스터가 가격정책표에서 승인 (자동 덮어쓰기 없음)
  · 채널·수수료 = 가격정책표가 cost-ref/products.channels 로 넘겨줌(config/calc.chVar 수수료) · 고칠 수 있음
  · 역할: 마스터 = 전부 보기·수정·승인 · 경영 열람(config/access.mgmtEmails) = 전부 보기만 · 부마스터 = 원가·마진 보기 + 업체는 가칭 · 열람·팀원 = 못 봄(서버 규칙)
-->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ══ 분해원가 — 가격·마진 대시보드와 같은 모양 (2026-11-25 송희님 "통일감") ══
   대시보드에서 잰 값 그대로: 바탕 #F4F6F8 · 글꼴 Pretendard 13px · 도구줄 #F3F5F7(패딩 10px 18px · 아래 선 #D5D9DE) · 버튼 12px(패딩 6px 13px · 둥글기 8 · 선 #E2E8F0) · 주 버튼 #107C41
   표: 머리 #F3F5F7 11.5px 600 · 칸 12.3px 500 · 줄 높이 32 · 선 #D5D9DE · 묶음 줄 진초록 #0A3D22 / 초록 #15683B(26px) · 숫자 오른쪽 · 상태 탭 = 회색 판 안 흰 단추
   빨강은 위험(역마진·유효기간 지남·확인 필요)에만 · ?embed=1 이면 대시보드 틀(왼쪽 메뉴·위쪽 머리) 안 — 이 화면의 머리는 숨김 */
:root{--g:#107C41;--gd:#0B5C30;--gdeep:#0A4A27;--band1:#0A3D22;--band2:#15683B;--grid:#D5D9DE;--grid2:#EEF0F3;--head:#F3F5F7;--ink:#1F2733;--ink2:#5A6572;--mute:#8A94A0;--faint:#9AA5B1;--canvas:#F4F6F8;--btnline:#E2E8F0;--gl:#EEF8F1;--gl2:#F3FAF5;--gline:#CFE8D8;--red:#C0392B;--redbg:#FDECEC;--tab:#0B7A3E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font-family:Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif;font-size:13px;-webkit-text-size-adjust:100%;overflow-x:hidden;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font-family:inherit;color:inherit}
a{color:inherit}
.ld{padding:60px 16px;text-align:center;color:var(--ink2)}
.dim{color:var(--mute)}
/* 위쪽 머리 (따로 열었을 때만 · 대시보드 리본과 같은 모양) */
.rb{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--grid2);padding:calc(10px + env(safe-area-inset-top)) 22px 10px}
.rb .brand{display:flex;flex-direction:column;gap:1px;min-width:180px}
.rb .brand b{font-size:16px;letter-spacing:-.3px}
.rb .brand span{font-size:11px;color:var(--ink2)}
.rb .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}
.role{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--g);color:#fff}
.role.mgmt{background:var(--gd)}.role.sub{background:#fff;color:var(--gdeep);box-shadow:inset 0 0 0 1.5px var(--gd)}
/* 한 줄 요약 (대시보드 리본 .kline 과 같음) */
.kline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.kline i{font-style:normal;opacity:.5}
.kline .kl{border:0;background:none;padding:2px 4px;border-radius:5px;cursor:pointer;font:inherit;font-size:12px;color:inherit}
.kline .kl b{font-weight:800;color:var(--ink)}
.kline .kl.warn b{color:var(--gd);text-decoration:underline}
.kline .kl.on{background:var(--gl)}
.kline .kl:hover{background:var(--gl)}
body.embed .rb{display:none}
/* 상태 탭 (가격정책표 준비중·판매중·단종과 같은 모양) */
.pstabs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px 2px}
.tabbar{display:flex;gap:4px;background:#F1F5F9;border-radius:12px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tabbar button{flex:none;display:flex;align-items:baseline;gap:6px;border:0;background:transparent;border-radius:9px;padding:7px 14px;font:inherit;font-size:13.5px;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tabbar button b{font-size:12px;color:var(--mute);font-weight:700}
.tabbar button.on{background:#fff;color:var(--tab);box-shadow:0 1px 3px rgba(15,23,42,.14)}
.tabbar button.on b{color:var(--tab)}
/* 도구줄 */
.toolrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--head);border-bottom:1px solid var(--grid);padding:10px 18px}
.toolrow .ttl{font-size:14px;font-weight:700;margin-right:6px}
.toolrow .sp{flex:1}
.toolrow .hint2{font-size:11.5px;color:var(--ink2)}
.in{border:1px solid var(--grid);border-radius:3px;padding:5px 9px;background:#fff;font-size:13px;height:30px;min-width:0;width:100%}
.in:focus{outline:2px solid var(--g);outline-offset:-1px}
.in.num{text-align:right;font-variant-numeric:tabular-nums}
select.in{padding:4px 6px}
.in.ro,.in:disabled{background:#F7F8F9;color:var(--ink);border-color:var(--grid2);opacity:1;-webkit-text-fill-color:var(--ink)}
.toolrow .in{width:auto}
.toolrow .q{width:240px}
.toolrow .pfilt{display:none}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:4px;border:1px solid var(--btnline);background:#fff;color:var(--ink);border-radius:8px;padding:6px 13px;font-size:12px;cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1.35}
.tbtn:hover{border-color:var(--g);color:var(--gd)}
.tbtn.primary{background:var(--g);border-color:var(--g);color:#fff;font-weight:700}
.tbtn.primary:hover{background:var(--gd)}
.tbtn.sm{padding:3px 8px;font-size:11.5px;border-radius:6px}
.tbtn.red{color:var(--red)}
.tbtn:disabled{opacity:.45;cursor:default}
.tbtn:active{transform:scale(.96)}
.seg{display:flex;border:1px solid var(--btnline);border-radius:8px;overflow:hidden;background:#fff;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:transparent;padding:5px 11px;font-size:12px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button .n{font-size:10px;opacity:.75;margin-left:3px}
.seg button.on{background:var(--g);color:#fff}
.lnk{border:0;background:none;padding:0;color:var(--gd);font-weight:700;text-decoration:underline;cursor:pointer;font-size:inherit}
/* 표 (가격정책표 #priceGrid 와 같은 모양) */
.gridwrap{overflow:auto;-webkit-overflow-scrolling:touch;background:#fff;max-width:100%}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:12.3px}
.grid th{position:sticky;top:0;z-index:2;background:var(--head);color:var(--ink2);font-size:11.5px;font-weight:600;text-align:left;padding:4px 8px;height:35px;border-bottom:1px solid var(--grid);border-right:1px solid var(--grid2);white-space:nowrap}
.grid td{padding:0 8px;height:32px;border-bottom:1px solid var(--grid);border-right:1px solid var(--grid2);font-weight:500;vertical-align:middle;background:#fff}
.grid th.num,.grid td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.grid td.nw,.grid th.nw{white-space:nowrap}
.grid .stk{position:sticky;left:0;z-index:1}
.grid th.stk{z-index:3}
.grid tr.go{cursor:pointer}
.grid tr.go:hover td{background:var(--gl2)}
.grid tr.l1 td{background:var(--band1);color:#fff;font-size:13px;font-weight:700;height:26px;border-right:0}
.grid tr.l2 td{background:var(--band2);color:#fff;font-size:12.5px;font-weight:700;height:26px;border-right:0}
.grid tr.l1 td .n,.grid tr.l2 td .n{font-weight:500;opacity:.75;margin-left:6px;font-size:11.5px}
.grid tr.l2 td .lnk{color:#fff;font-size:11.5px;font-weight:600}
.pname{font-weight:600;line-height:1.3}
.pspec{font-size:11px;color:var(--mute);line-height:1.3}
.sub{font-size:10px;font-weight:600;color:var(--faint);line-height:1.2;margin-top:1px}
.grid td .sub .tag{font-size:9.5px;padding:0 4px}
.foot{color:var(--ink2);font-size:11.5px;line-height:1.6;margin:8px 18px 18px}
/* 꼬리표 */
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:4px;background:#E3F1E8;color:var(--gd);white-space:nowrap;vertical-align:1px}
.tag.ok,.tag.has{background:#E3F1E8;color:var(--gd)}
.tag.tmp{background:#fff;color:var(--gdeep);border:1px dashed #8FC6A3;padding:0 5px}
.tag.diff{background:#fff;color:var(--gd);box-shadow:inset 0 0 0 1px var(--g)}
.tag.need,.tag.off{background:#F1F2F5;color:#4B5563}
.tag.chk{background:var(--redbg);color:var(--red)}
.tag.nt{background:#fff;color:#37352F;box-shadow:inset 0 0 0 1px #C9C7C2;font-weight:700}
.tag.ndel{background:#F1F2F5;color:#6B7280;text-decoration:line-through}
.v-soon{color:var(--gdeep);font-weight:800;box-shadow:inset 0 0 0 1px var(--gd);background:var(--gl);border-radius:4px;padding:0 4px}
.v-over{color:var(--red);font-weight:800;background:var(--redbg);border-radius:4px;padding:0 4px}
.plus{color:var(--gdeep);font-weight:800;border:1px solid var(--gd);border-radius:4px;padding:0 3px}
.minus{color:var(--g);font-weight:800}
.minusR,.minusR b{color:var(--red)!important}
.empty{padding:26px 14px;text-align:center;color:var(--ink2);font-size:13px;line-height:1.6;background:#fff}
.err{background:var(--redbg);color:var(--red);padding:9px 18px;font-size:12.5px;line-height:1.55;border-bottom:1px solid #F5C6C6}
.warn{background:var(--gl);color:var(--gdeep);padding:9px 18px;font-size:12.5px;line-height:1.55;border-bottom:1px solid var(--gline)}
.note{color:var(--ink2);font-size:11.5px;line-height:1.6;margin:6px 0 0}
.hint{font-size:11px;color:var(--gd);margin-top:2px}
/* 줄 위 안내 한 줄 (가격정책표 개정안 줄과 같은 모양) */
.pl-line{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;background:var(--gl2);border:1px solid var(--gline);border-radius:8px;padding:7px 10px;font-size:12.5px;margin:10px 18px 0}
.pl-line b{font-variant-numeric:tabular-nums}
.pl-line .big{font-size:15px;font-weight:800}
.pl-line i{font-style:normal;opacity:.45}
/* 상세 화면 (품목 1장 · 같은 틀 안) */
.sheet{position:fixed;inset:0;z-index:50;background:var(--canvas);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.dhead{position:sticky;top:0;z-index:6;background:#fff;border-bottom:1px solid var(--grid2);padding-top:env(safe-area-inset-top)}
.dhead .r1{display:flex;align-items:center;gap:10px;padding:10px 18px 4px;flex-wrap:wrap}
.dhead .tt{font-size:15px;font-weight:800;letter-spacing:-.2px;min-width:0}
.dhead .meta{font-size:11.5px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dhead .sp{flex:1}
.dhead .pstabs{padding:4px 18px 8px}
.dbody{padding:0 0 calc(80px + env(safe-area-inset-bottom))}
.panel{background:#fff;border:1px solid var(--grid);border-radius:6px;margin:10px 18px;overflow:hidden}
.panel>.ph{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--head);border-bottom:1px solid var(--grid);padding:6px 10px;font-weight:700;font-size:12.5px}
.panel>.ph .sp{flex:1}
.panel>.ph .rt{font-weight:500;color:var(--ink2);font-size:11.5px}
.panel>.pb{padding:10px}
.panel>.pb.flush{padding:0}
details.panel>summary{cursor:pointer;list-style:none}
details.panel>summary::-webkit-details-marker{display:none}
.fg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 10px}
.fld{min-width:0}
.fld>label{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--ink2);font-weight:600;margin:0 0 3px;white-space:nowrap;overflow:hidden}
.fld.w2{grid-column:span 2}.fld.w3{grid-column:span 3}.fld.w6{grid-column:1/-1}
.calc{display:flex;align-items:center;min-height:30px;padding:0 8px;border-radius:3px;background:#F7F8F9;font-weight:700;font-variant-numeric:tabular-nums}
.mline{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:flex-end}
.mline .fld{width:130px}
.mline .res{display:flex;gap:14px;align-items:baseline;padding:0 4px 4px;font-size:12px;color:var(--ink2)}
.mline .res b{font-size:16px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.mline .res b.red{color:var(--red)}
/* 구성요소 표 (편집) */
table.ed{min-width:1500px}
.ed td{padding:2px 4px;height:34px}
.ed .in{height:28px;font-size:12.5px;padding:0 6px}
.ed .c{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:8px}
.ed .rmv,.vt .rmv{border:0;background:none;color:var(--mute);cursor:pointer;font-size:14px;width:24px;height:26px}
.ed .mv{border:0;background:none;color:var(--mute);cursor:pointer;font-size:10px;width:16px;padding:0}
.ed tfoot td{background:var(--head);font-weight:800}
.ed tr.vopen>td{background:var(--gl2)}
.ed tr.vrow>td{background:var(--gl2);padding:0 0 8px 36px;height:auto}
.vcell{display:flex;gap:4px;align-items:center;min-width:0}
.vcell .in{flex:1;min-width:70px}
.vcell .vnm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

// ── 기존 제품 → 카드 자동 생성 (2026-11-25 송희님 4번: 판매중·준비중 전부(세트 제외) · 공급업체 넷폼 = 자체생산 · 그 밖 = 국내 OEM · 모두 임시) ──
function seedCandidates(S, refList) {

  const sets = base.filter((p) => p.type === "세트"), list = base.filter((p) => p.type !== "세트" && !have.has(p.k) && !ids.has(C.seedId(p.k)));
  return { list, sets, had: base.filter((p) => p.type !== "세트").length - list.length };
}
function SeedSheet({ ctx, onClose }) {
  const { S, user, refList, setToast } = ctx;
  const { list, sets, had } = seedCandidates(S, refList), [busy, setBusy] = useState(false), [done, setDone] = useState(0);
  const noNames = !S.refNames, rn = (p) => (S.refNames || {})[p.k] || {}, mOf = (p) => seedMethodOf(rn(p).sup || rn(p).mfg);
  const run = async () => {
    if (!list.length || !confirm(`기존 제품 ${list.length}개로 분해원가 카드를 만들까요?\n\n· 1줄 '완제품 매입' = 지금 매입원가 · '분해 필요' · '임시'\n· 생산 방식: 공급업체가 넷폼이면 자체생산, 그 밖은 국내 OEM\n· 가격정책표 원가는 바꾸지 않아요`)) return;
    setBusy(true);
    try {
      const amap = { ...(S.alias || {}) }, al = makeAliaser(amap, S.mfgList), at = new Date().toISOString(), by = user.email || "";
      for (let i = 0; i < list.length; i += 150) {
        const part = list.slice(i, i + 150), b = db.batch(), sum = {};
        part.forEach((p) => {
          const r = rn(p), supN = String(r.sup || r.mfg || "").trim(), mfgN = String(r.mfg || r.sup || "").trim();
          const card = { ...C.seedCard(p, al(supN)), method: mOf(p), origin: "국내" }; card.mfgAlias = al(mfgN);
          const id = C.seedId(p.k), doc = { ...card, history: [{ at, by, what: `가격정책표 기존 값으로 자동 생성 (1줄 '완제품 매입' = 지금 매입원가 · ${C.methodName(card.method)})`, why: "처음 넣을 품목" }], deleted: false, createdAt: at, createdBy: by, updatedAt: at, updatedBy: by };
          b.set(cardsCol().doc(id), doc); b.set(namesCol().doc(id), { mfg: mfgN, sup: { seed: supN }, vsup: { seed: { A: supN } }, updatedAt: at, updatedBy: by }); sum[id] = C.summaryOf(doc);
        });
        b.set(namesCol().doc("_alias"), { map: amap, updatedAt: at, updatedBy: by }, { merge: true });
        b.set(refDoc("cards"), { map: sum, at }, { merge: true });
        await b.commit(); setDone(i + part.length); console.log(`[cost-cards] 자동 생성 ${i + part.length}/${list.length}`);
      }
      setToast(`카드 ${list.length}장을 만들었어요 (분해 필요 · 임시)`); onClose();
    } catch (e) { console.error("[cost-cards] 자동 생성 실패", e); setToast("만들다 멈췄어요: " + (e.code || e.message) + " — 다시 누르면 남은 것만 만들어요"); }

  const selfN = list.filter((p) => mOf(p) === "self").length;
  return html`<${Frame} title="🧩 기존 제품 카드 만들기" close=${onClose} meta=${html`<span>가격정책표 판매중·준비중 전부(세트 제외) · 제품마다 분해원가 1장</span>`}>
    <div class="pl-line"><span>만들 카드 <b class="big">${list.length}장</b></span>${brandsN.map(([b, n]) => html`<${React.Fragment} key=${b}><i>·</i><span>${b} <b>${n}</b></span><//>`)}<i>·</i><span>자체생산 <b>${selfN}</b> · 국내 OEM <b>${list.length - selfN}</b></span><i>·</i><span class="dim">이미 카드 있음 ${had} · 세트 ${sets.length} 제외</span>
      <span style=${{ flex: 1 }}></span><button type="button" class="tbtn primary" disabled=${busy || !list.length} onClick=${run}>${busy ? `만드는 중… ${done}/${list.length}` : `${list.length}장 만들기`}</button></div>
    ${noNames && html`<div class="warn" style=${{ margin: "10px 18px 0", borderRadius: 6 }}>가격정책표의 공급업체 이름이 아직 안 넘어왔어요 — 가격·마진 대시보드를 마스터로 한 번 열면 넘어와요. (지금 만들면 공급처가 비고, 생산 방식이 모두 국내 OEM 이 돼요)</div>`}

      ${st.items.some((i) => i.cmp.diffs.length) && html`<div class="warn" style=${{ margin: "0 18px", borderRadius: 6 }}>'다름' 칸에 마우스를 올리면 어느 줄이 다른지 보여요. 엑셀 식이 v7과 다르게 바뀌었거나 칸이 밀렸을 수 있어요 — 확인 뒤 저장해 주세요.</div>`}
      <p class="foot">· 같은 브랜드·품목·규격·차수 카드가 있으면 그 카드를 고쳐요(이력에 '엑셀 올리기') · 없으면 새로 만들어요 · 공급처·제조사 실제 이름은 따로(마스터·경영 열람만) 저장돼요.
        <br />· 엑셀 구성요소 줄 = <b>A 업체(주) · 적용</b>으로 들어가요 · 이미 넣어 둔 B·C 업체 견적, 생산 방식·국내/수입·환율, 노션 견적은 그대로 남아요.</p>
    <//>`}
  <//>`;
}
function TrashSheet({ ctx, onClose }) {
  const { S, user, setToast } = ctx;
  const list = (S.cards || []).filter((c) => c.deleted).sort((a, b) => String(b.deletedAt || "").localeCompare(String(a.deletedAt || "")));
  const back = async (c) => { try { await setDeleted(user, c, false); setToast("되살렸어요"); } catch (e) { console.error("[cost-cards] 되살리기 실패", e); setToast("못 되살렸어요: " + (e.code || e.message)); } };
  return html`<${Frame} title="🗑 휴지통" close=${onClose} meta=${html`<span>지운 카드는 여기 남아요 · 되살리면 이력도 그대로</span>`}>
    <div class="panel"><div class="pb flush">${list.length ? html`<div class="gridwrap"><table class="grid" style=${{ minWidth: 560 }}><thead><tr><th>품목 · 규격</th><th>브랜드 · 차수</th><th>지운 사람 · 때</th><th></th></tr></thead><tbody>${list.map((c) => html`<tr key=${c.id}><td><span class="pname">${c.item}</span> <span class="pspec">${c.spec}</span></td><td class="nw">${c.brand} · ${c.round}</td><td class="nw">${who(c.deletedBy)} ${whenTxt(c.deletedAt)}</td><td><button type="button" class="tbtn sm" onClick=${() => back(c)}>되살리기</button></td></tr>`)}</tbody></table></div>` : html`<div class="empty">휴지통이 비어 있어요.</div>`}</div></div>
  <//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
