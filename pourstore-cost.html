<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#107C41">
<title>POUR 분해원가</title>
<!--
  분해원가 — 2026-11-25 송희님: '원가 계산기' → 메뉴 이름 '분해원가' · 품목별 원가 관리 화면
  · 목록 = 브랜드 · 품목·규격 · 생산 방식 · 국내/수입 · 완제품 원가 · 확정/임시 · 견적 유효기간 (거르기: 브랜드·생산 방식·국내/수입·분해 필요)
  · 생산 방식(자체생산 · 국내 OEM · 해외 OEM·수입 · 완제품 매입)마다 기본 줄 · 외화 단가 × 환율(카드 fx) → 원화
  · 구성요소마다 업체 여러 곳(A 주 · B 서브 · C…: 단가·부가세·통화·MOQ·리드타임·견적일·유효기간·메모) → '적용' 1곳으로 완제품 원가 · [업체 비교] 탭 = 나란히·최저가·바꾸면 ±
    실제 업체 이름 = cost-names/{id}.vsup (마스터·경영 열람만) · 카드엔 가칭(A사·B사)만
  · [가격정책표에 반영] (C) = 마스터만 바로 반영: product-meta/prod-cost.map[제품] + cost-log(누가·언제·전→후) + dashboard-activity + 카드 applied
    부마스터 = 반영 요청(가격정책표 개정안 → 마스터 승인) · 자동으로 몰래 안 바뀜
  ─ 아래는 11/23 처음 만든 때 설명 ─
  원가 분해·조립 계산기 — 2026-11-23 김송희 요청·승인 (관리 = 대시보드 · 경영팀 = 공급처까지 전부 열람 · 본부장님 = 전부 · 처음 품목 = POUR스토어 기존 품목 포함)
  · 같은 날 오후 범위 줄임: 결과는 ① 최종 완제품 원가 ② 판매가를 넣으면 마진율·마진액 두 가지 (판매가 3단계 고정 표·판매가 설정은 뺌)
    마진율 = 엑셀 '판매가' 시트 식을 판매가 기준으로 거꾸로 푼 값(pcc-core marginCalc) + 작게 가격정책표 방식 (판매가−원가)÷판매가
  · 가격·마진 대시보드(pourstore-pricing-dashboard.html)와 같은 프로젝트(pourstoreproject) · 같은 로그인
  · 품목 1장 = 원가 분해 1장 (송희님 엑셀 '표준_원가계산기_v7' 과 같은 칸·같은 식 — 계산은 아래 pcc-core 블록 하나)
  · 저장 자리 (규칙 pourstore.rules 2026-11-23):
      cost-cards/{id}   숫자·구성·가칭(A사·B사)만 — 마스터·부마스터·경영 열람 읽기 / 마스터 쓰기
      cost-names/{id}   실제 공급처·제조사 이름 — 마스터 + 경영 열람(읽기) · _alias = 이름→가칭 · _ref = 가격정책표 공급업체·제조사(본 화면이 저장)
      cost-ref/products 가격정책표 제품·매입원가·채널 판매가 + 채널·수수료(본 화면이 저장) · cost-ref/cards 요약(가격정책표 매입원가 옆 표시)
  · 매입원가 바꾸기 = 버튼 하나 [매입원가로 승인요청] → 가격정책표 개정안(product-meta/pricing-draft.cost) → 마스터가 가격정책표에서 승인 (자동 덮어쓰기 없음)
  · 채널·수수료 = 가격정책표가 cost-ref/products.channels 로 넘겨줌(config/calc.chVar 수수료) · 고칠 수 있음
  · 역할: 마스터 = 전부 보기·수정·승인 · 경영 열람(config/access.mgmtEmails) = 전부 보기만 · 부마스터 = 원가·마진 보기 + 업체는 가칭 · 열람·팀원 = 못 봄(서버 규칙)
-->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#107C41;--navy2:#0A4A27;--bg:#F4F5F8;--card:#fff;--line:#E3E6EE;--line2:#EEF0F5;--ink:#1B2233;--ink2:#3C455A;--mute:#6B7386;--red:#C0392B;--redbg:#FDECEC;--amber:#0B5C30;--ambg:#EEF8F1;--yel:#0A4A27;--yelbg:#EEF8F1;--green:#0B5C30;--grbg:#EEF8F1;--soft:#E3F1E8;--gline:#8FC6A3}
/* 색 (2026-11-25 송희님): 가격·마진 대시보드와 같은 초록 톤 · 싸지는 차이(−) = 초록 · 비싸지는 차이(+)·견적 곧 끝남 = 진한 초록 글씨 + 테두리 · 빨강은 위험(역마진·유효기간 지남·확인 필요)에만
   (--navy 이름은 예전 그대로 두고 값만 초록 #107C41 — 가격정책표 --xl-green) */
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font-family:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px calc(90px + env(safe-area-inset-bottom))}
.ld{padding:60px 16px;text-align:center;color:var(--mute)}
.top{padding:calc(10px + env(safe-area-inset-top)) 0 4px}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.nav a{color:var(--green);font-weight:700;text-decoration:none}
.nav .sp{flex:1}
.h1{font-size:22px;font-weight:800;margin:10px 0 2px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.role{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--navy);color:#fff}
.role.mgmt{background:#0B5C30}.role.sub{background:#fff;color:#0A4A27;box-shadow:inset 0 0 0 1.5px #0B5C30}
.sub{color:var(--mute);font-size:13px;margin:0 0 8px;line-height:1.55}
.next{background:#fff;border:1px solid var(--line);border-left:3px solid var(--navy);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--ink2);margin:8px 0 10px;line-height:1.6;display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center}
.next b{color:var(--ink)}
.lnk{border:0;background:none;padding:0;color:var(--green);font-weight:800;text-decoration:underline;cursor:pointer;font-size:inherit}
.err{background:var(--redbg);color:var(--red);border-radius:10px;padding:9px 12px;font-size:13px;margin:8px 0;line-height:1.55}
.warn{background:var(--ambg);color:#0A4A27;border:1px solid var(--gline);border-radius:10px;padding:9px 12px;font-size:13px;margin:8px 0;line-height:1.55}
.ok{background:var(--grbg);color:var(--green);border-radius:10px;padding:9px 12px;font-size:13px;margin:8px 0;line-height:1.55}
.note{color:var(--mute);font-size:12px;line-height:1.6;margin:8px 2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:38px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.solid{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.soft{background:var(--soft);border-color:var(--soft)}
.btn.red{color:var(--red)}
.btn.sm{height:30px;padding:0 9px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 8px}
.tools .sp{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .n{font-weight:600;opacity:.75;margin-left:4px}
.in{height:40px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:15px;background:#fff;width:100%;min-width:0}
.in:focus{outline:2px solid var(--navy);outline-offset:-1px}
select.in{padding:0 6px}
.in.ro,.in:disabled{background:#F7F8FB;color:var(--ink);border-color:var(--line2);opacity:1;-webkit-text-fill-color:var(--ink)}
.in.num{text-align:right;font-variant-numeric:tabular-nums}
.find{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.find .in{max-width:260px;height:36px;font-size:14px}
.tg{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tg input{width:17px;height:17px;accent-color:var(--navy)}
/* 브랜드 합계 */
.tots{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:4px 0 10px}
.tot{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tot .k{font-size:12px;color:var(--mute);font-weight:700;display:flex;gap:6px;align-items:center}
.tot .v{font-size:19px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.tot .s{font-size:12px;color:var(--mute);margin-top:2px}
/* 표 */
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;border:1px solid var(--line);border-radius:12px;max-width:100%}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.t th{position:sticky;top:0;z-index:1;background:#F7F8FB;color:var(--ink2);font-weight:700;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
.t td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.go{cursor:pointer}
.t tr.go:hover td{background:#F3FAF5}
.t .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t .nw{white-space:nowrap}
.t .dim{color:var(--mute)}
.t .stk{position:sticky;left:0;z-index:2;background:#fff}
.t th.stk{z-index:3;background:#F7F8FB}
.t td.v-soon,.v-soon{background:var(--yelbg)!important;color:var(--yel);font-weight:800;box-shadow:inset 0 0 0 1px var(--green)}
.t td.v-over,.v-over{background:var(--redbg)!important;color:var(--red);font-weight:800}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--navy);white-space:nowrap;vertical-align:1px}
.tag.need{background:#F1F2F5;color:#4B5563}.tag.diff{background:#fff;color:var(--green);box-shadow:inset 0 0 0 1px var(--navy)}.tag.has{background:var(--grbg);color:var(--green)}
.tag.tmp{background:#fff;color:var(--yel);border:1px dashed var(--gline);padding:1px 6px}.tag.chk{background:var(--redbg);color:var(--red)}.tag.ok{background:var(--grbg);color:var(--green)}
.tag.off{background:#F1F2F5;color:#6B7280}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.plus{color:#0A4A27;font-weight:800;border:1px solid var(--green);border-radius:4px;padding:0 3px}
/* 결과 두 가지 */
.res .rg{display:grid;grid-template-columns:minmax(250px,1fr) 2fr;gap:12px}
.res .r1,.res .r2{background:#F7F8FB;border-radius:12px;padding:12px 14px;min-width:0}
.res .k{font-size:13.5px;color:var(--ink2);font-weight:800}
.res .big{font-size:30px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.res .big.red{color:var(--red)}
.res .s{font-size:12px;color:var(--mute);margin-top:2px}
.res .mi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.res .mi .fld>label{display:flex;align-items:center;gap:4px;min-height:20px;white-space:nowrap;overflow:hidden}
.res .mi .tag{font-size:10px;padding:1px 5px}
.res .mo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.res .mo>div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.tline{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:12px}
.minusR,.minusR b{color:var(--red)!important}
details.more>summary{cursor:pointer;font-weight:800;font-size:14px;color:var(--ink2)}.minus{color:var(--navy);font-weight:800}
/* 폰 목록 */
.ml{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mr{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:#fff;padding:11px 14px;cursor:pointer;font-size:14px}
.mr:first-child{border-top:0}
.mr .a{display:flex;gap:6px;align-items:center}
.mr .a b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.mr .b,.mr .c{color:var(--ink2);font-size:12.5px;margin-top:3px;display:flex;gap:4px 10px;flex-wrap:wrap}
.mr .c{color:var(--mute)}
.mr .b b{color:var(--ink);font-variant-numeric:tabular-nums}
.empty{padding:26px 14px;text-align:center;color:var(--mute);font-size:13.5px;line-height:1.6;background:#fff;border:1px dashed var(--line);border-radius:14px}
/* 시트(전체 화면) */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-top{position:sticky;top:0;z-index:6;background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.sh-in{max-width:1240px;margin:0 auto;padding:10px 16px}
.sh-t{display:flex;align-items:center;gap:8px}
.sh-t .tt{flex:1;min-width:0;font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-t .x{border:0;background:var(--soft);color:var(--navy);font-weight:800;border-radius:9px;height:34px;padding:0 12px;cursor:pointer;font-size:13px;flex:none}
.sh-sub{font-size:12.5px;color:var(--mute);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;border:0;background:none;padding:8px 12px;font-weight:800;font-size:14px;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--navy);border-bottom-color:var(--navy)}
.sh-body{max-width:1240px;margin:0 auto;padding:4px 16px calc(110px + env(safe-area-inset-bottom))}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.sec>h3{margin:0 0 10px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec>h3 .sp{flex:1}
.sec>h3 .rt{font-size:12px;color:var(--mute);font-weight:600}
.fg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fld{min-width:0}
.fld>label{display:block;font-size:12px;color:var(--mute);font-weight:700;margin:0 0 4px}
.fld.w2{grid-column:span 2}.fld.w4{grid-column:1/-1}
.calc{display:flex;align-items:center;height:40px;padding:0 10px;border-radius:9px;background:#F7F8FB;font-weight:800;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kv>div{background:#F7F8FB;border-radius:12px;padding:10px 12px;min-width:0}
.kv .k{font-size:12px;color:var(--mute);font-weight:700}
.kv .v{font-size:20px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kv .s{font-size:11.5px;color:var(--mute);margin-top:2px}
.subt{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.subt span{font-size:12px;background:#F7F8FB;border-radius:8px;padding:4px 8px;color:var(--ink2)}
.subt span b{font-variant-numeric:tabular-nums}
/* 구성요소 표(PC) */
table.ed{min-width:1640px;font-size:12.5px}
.ed td{padding:4px 4px;border-bottom:1px solid var(--line2)}
.ed th{padding:7px 5px;font-size:11.5px}
.ed .in{height:32px;font-size:13px;padding:0 6px;border-radius:7px}
.ed .c{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:8px}
.ed .rmv{border:0;background:none;color:var(--mute);cursor:pointer;font-size:15px;width:26px;height:28px}
.ed .mv{border:0;background:none;color:var(--mute);cursor:pointer;font-size:11px;width:18px;padding:0}
.ed tfoot td{background:#F7F8FB;font-weight:800}
/* 구성요소 카드(폰) */
.rc{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;background:#fff}
.rc .rh{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.rc .rh .no{font-weight:800;color:var(--mute);width:22px}
.rc .rh select{flex:1}
.rc .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rc .g .w2{grid-column:1/-1}
.rc .res{display:flex;gap:6px 12px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--ink2);background:#F7F8FB;border-radius:9px;padding:7px 9px}
.rc .res b{font-variant-numeric:tabular-nums}
.hint{font-size:11.5px;color:var(--green);margin-top:3px}
/* 아래 고정 저장줄 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:55;background:#fff;border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom))}
.bar .in2{max-width:1240px;margin:0 auto;display:flex;gap:8px;align-items:center}
.bar .why{flex:1;min-width:0;height:40px}
.bar .st{font-size:12.5px;color:var(--mute);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:var(--navy2);color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:700;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.2);line-height:1.45}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:10px 0;border-top:1px solid var(--line2);font-size:13px;line-height:1.55}
.hist li:first-child{border-top:0}
.hist .w{color:var(--mute);font-size:12px}
.login{max-width:380px;margin:60px auto 0;padding:0 16px}
.login .in{margin-bottom:8px}
.sale td.over{color:var(--red);font-weight:800;text-align:center}
.qc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

  // 외화 단가: 견적 단가 × 환율(카드의 fx · 통화별 1개 = 원) → 원화 · 통화가 비면(원) 엑셀과 같은 식 그대로

  //  줄의 단가·부가세·통화·MOQ·출처·가칭 = 적용 업체 값(거울) → 위 계산·엑셀 식은 그대로

  const vRole = (i) => (i === 0 ? "주" : i === 1 ? "서브" : "");
  const nextVid = (vs) => { for (let i = 0; i < 26; i++) { const v = String.fromCharCode(65 + i); if (!(vs || []).some((x) => x.vid === v)) return v; } return "V" + ((vs || []).length + 1); };

  // 줄마다 업체별 단가·개당 금액 + 적용 업체로 바꿨을 때 차이 · 최저가(같으면 지금 적용 업체)
  function vendorCompare(c) {

  // ── 엑셀 '판매가' 시트 식 (화면엔 3단계 표를 안 씀 · 아래 marginCalc 가 이 식을 거꾸로 푼 값 · 대조 시험용으로 남김) ──

  // 판매가(V+) = 백원 올림[ (완제품 원가 + 물류비) ÷ ( ((1−할인) − 목표 마진) ÷ 1.1 − (1−할인) × (채널 수수료 + 카드·PG 수수료) ) ] · 분모 ≤ 0 → 마진 과다

  // ── 판매가를 넣으면 마진 (2026-11-23 송희님 · 위 판매가 식을 판매가 기준으로 거꾸로 푼 값) ──

  // ── 엑셀 v7 품목 시트 읽기 (aoa = 시트를 2차원 배열로 · 0부터 셈) ──

    ["fragName", /향료\s*이름/, [6, 4]], ["fragRatio", /함유율/, [7, 4]], ["fragBatch", /배합량/, [8, 6]], ["fragDirect", /직접/, [8, 9]], ["fragNeed", /필요량/, [9, 4]],
  ];

    ["no", /^(번호|No\.?|#)$/i, 0], ["kind", /^구분/, 1], ["name", /구성\s*요소/, 2], ["use", /무엇/, 3], ["sup", /공급처/, 4], ["inMfg", /제조\s*단가/, 5],
    ["price", /견적\s*단가/, 6], ["vat", /부가세/, 7], ["unitV", /단가\s*\(\s*V/, 8], ["per", /개당\s*\/\s*1\s*회/, 9], ["usage", /사용량|횟수/, 10],
    ["moq", /MOQ|구매/i, 11], ["perAmt", /개당\s*금액/, 12], ["left", /남는\s*비용/, 13], ["src", /출처/, 14],

  function parseV7(sheetName, aoa) {
    const warn = [], top = {};

  // 바뀐 것 한 줄 (이력용 — 실제 업체 이름은 넣지 않음, 가칭만)
  const F_LB = { brand: "브랜드", round: "차수", item: "품목", spec: "규격", method: "생산 방식", origin: "국내·수입", scope: "완제품 범위", qty: "생산 수량", validUntil: "견적 유효기간", include: "합계 포함", prodKey: "가격정책표 연결", need: "분해 필요", mfgAlias: "완제품 제조사" };

  // 가격정책표 기존 제품 → 원가 분해 1장 (6번: 1줄 '완제품 매입' = 지금 매입원가 · 상태 '분해 필요')

        const sn = await tx.get(draftDoc()), cur = sn.exists ? sn.data() : {}, meta = cur.meta || { status: "", by: "", at: "", note: "" };

        if (meta.status === "대기") { nm = { ...meta, note: [meta.note, line].filter(Boolean).join(" / ").slice(0, 500) }; mode = "대기"; }
        else if (meta.status === "작성중") { nm = meta; mode = "작성중"; }   // 작성 중인 개정안 → 같이 담기만 (승인요청은 가격정책표 위 줄에서)
        else { nm = { status: "대기", by, at, note: line }; mode = "새로"; }
        tx.set(draftDoc(), { cost: { [k]: unit }, costSrc: { [k]: { card: card.id, by, at, from: pt == null ? null : pt, why: "" } }, meta: nm, updatedAt: at }, { merge: true });
      });
      console.log(`[pricing-draft] 완제품 원가 반영 요청 ${k} → ${unit} (${mode})`);
      setToast(mode === "작성중" ? "가격정책표에 작성 중인 개정안에 같이 담았어요 · 가격정책표 위 [승인요청]을 눌러야 승인 단계로 가요" : "가격정책표 개정안에 담았어요 · 마스터가 승인하면 바뀌어요");
    } catch (e) { console.error("[pricing-draft] 반영 요청 실패", e); setToast("요청 못 했어요: " + (e.code || e.message)); }
    setBusy(false);
  };
  return html`<button class="btn solid" disabled=${busy || !card || !(unit > 0)} onClick=${req}>${busy ? "요청 중…" : `가격정책표 반영 요청 (${pt == null ? "없음" : won(pt)} → ${won(unit)}원)`}</button>`;
}

// ── 기존 제품 → 카드 자동 생성 (6번) ──
const SEED_BRANDS = ["POUR스토어", "GROHOME"];
function seedCandidates(S, refList) {
  const have = new Set((S.cards || []).map((c) => c.prodKey).filter(Boolean)), ids = new Set((S.cards || []).map((c) => c.id));
  const base = refList.filter((p) => (p.st === "출시" || p.st === "출시준비") && (p.brand || []).some((b) => SEED_BRANDS.includes(b)));
  const sets = base.filter((p) => p.type === "세트"), list = base.filter((p) => p.type !== "세트" && !have.has(p.k) && !ids.has(C.seedId(p.k)));
  return { list, sets, had: base.filter((p) => p.type !== "세트").length - list.length };
}
function SeedSheet({ ctx, onClose }) {
  const { S, user, refList, setToast } = ctx; useBackClose(true, onClose);
  const { list, sets, had } = seedCandidates(S, refList), [busy, setBusy] = useState(false), [done, setDone] = useState(0);
  const noNames = !S.refNames;
  const run = async () => {
    if (!list.length || !confirm(`기존 제품 ${list.length}개로 원가 분해 카드를 만들까요?\n\n· 1줄 '완제품 매입' = 지금 매입원가 · 상태 '분해 필요'\n· 가격정책표 매입원가는 바꾸지 않아요`)) return;
    setBusy(true);
    try {
      const amap = { ...(S.alias || {}) }, al = makeAliaser(amap, S.mfgList), at = new Date().toISOString(), by = user.email || "";
      for (let i = 0; i < list.length; i += 150) {
        const part = list.slice(i, i + 150), b = db.batch(), sum = {};
        part.forEach((p) => {
          const r = (S.refNames || {})[p.k] || {}, supN = String(r.sup || r.mfg || "").trim(), mfgN = String(r.mfg || r.sup || "").trim();
          const card = C.seedCard(p, al(supN)); card.mfgAlias = al(mfgN);
          const id = C.seedId(p.k), doc = { ...card, history: [{ at, by, what: "가격정책표 기존 값으로 자동 생성 (1줄 '완제품 매입' = 지금 매입원가)", why: "처음 넣을 품목" }], deleted: false, createdAt: at, createdBy: by, updatedAt: at, updatedBy: by };
          b.set(cardsCol().doc(id), doc); b.set(namesCol().doc(id), { mfg: mfgN, sup: { seed: supN }, updatedAt: at, updatedBy: by }); sum[id] = C.summaryOf(doc);
        });
        b.set(namesCol().doc("_alias"), { map: amap, updatedAt: at, updatedBy: by }, { merge: true });
        b.set(refDoc("cards"), { map: sum, at }, { merge: true });
        await b.commit(); setDone(i + part.length); console.log(`[cost-cards] 자동 생성 ${i + part.length}/${list.length}`);
      }
      setToast(`카드 ${list.length}장을 만들었어요 (분해 필요)`); onClose();
    } catch (e) { console.error("[cost-cards] 자동 생성 실패", e); setToast("만들다 멈췄어요: " + (e.code || e.message) + " — 다시 누르면 남은 것만 만들어요"); }
    setBusy(false);
  };
  const byBrand = SEED_BRANDS.map((b) => [b, list.filter((p) => (p.brand || []).includes(b)).length]);
  return html`<div class="sheet" role="dialog" aria-label="기존 제품 카드 만들기"><div class="sh-top"><div class="sh-in"><div class="sh-t"><div class="tt">🧩 기존 제품 카드 만들기</div><button class="x" onClick=${onClose}>닫기</button></div>
    <div class="sh-sub">POUR스토어·그로홈 판매중·준비중 제품마다 원가 분해 1장</div></div></div>
    <div class="sh-body">
      <div class="sec"><h3>만들 카드 ${list.length}장</h3>
        <div class="kv">${byBrand.map(([b, n]) => html`<div key=${b}><div class="k">${b}</div><div class="v">${n}장</div></div>`)}
          <div><div class="k">이미 카드 있음</div><div class="v">${had}개</div><div class="s">건너뜀</div></div>
          <div><div class="k">세트(패키지)</div><div class="v">${sets.length}개</div><div class="s">제외 — 구성 단품 합으로 계산됨</div></div></div>
        <p class="note">· 1줄 '완제품 매입' = 지금 매입원가 · 공급처 = 지금 공급업체 · 출처 '가격정책표 기존 값' · 상태 '분해 필요'
          <br />· 생산 수량은 1개(매입원가 그대로 보이게), 합계는 '제외'로 둬요 — 분해할 때 실제 수량·포함으로 바꿔요.
          <br />· 가격정책표 매입원가 값은 바꾸지 않아요. 매입원가가 빈 제품은 그 줄을 '확인 필요'로 둬요.</p>
        ${noNames && html`<div class="warn">가격정책표의 공급업체 이름이 아직 안 넘어왔어요 — 가격·마진 대시보드를 마스터로 한 번 열면 넘어와요. (지금 만들면 공급처가 비어요)</div>`}
        <div class="tblw" style=${{ maxHeight: 320, overflowY: "auto", marginTop: 8 }}><table class="t" style=${{ minWidth: 520 }}><thead><tr><th>제품</th><th>브랜드</th><th>상태</th><th class="num">지금 매입원가</th>${!noNames && html`<th>지금 공급업체</th>`}</tr></thead>
          <tbody>${list.slice(0, 400).map((p) => html`<tr key=${p.k}><td>${p.name} <span class="dim">${p.spec && p.spec !== "-" ? p.spec : ""}</span></td><td class="nw">${(p.brand || []).join("/")}</td><td class="nw">${ST_NAME[p.st] || p.st}</td><td class="num">${p.cost == null || p.cost === "" ? html`<span class="tag chk">없음</span>` : won(p.cost)}</td>${!noNames && html`<td class="nw">${((S.refNames || {})[p.k] || {}).sup || ((S.refNames || {})[p.k] || {}).mfg || "—"}</td>`}</tr>`)}</tbody></table></div>
        <div style=${{ display: "flex", gap: 8, marginTop: 12, alignItems: "center" }}><button class="btn solid" disabled=${busy || !list.length} onClick=${run}>${busy ? `만드는 중… ${done}/${list.length}` : `${list.length}장 만들기`}</button><button class="btn" onClick=${onClose}>닫기</button></div>
      </div></div></div>`;
}

// ── 엑셀 올리기 (v7 · 품목별 시트 1장) ──
function ImportSheet({ ctx, onClose }) {
  const { S, user, refList, setToast } = ctx; useBackClose(true, onClose);
  const [st, setSt] = useState({ file: "", items: [], busy: false, err: "", done: 0 });
  const keyOf = (c) => [nz(C.normBrand(c.brand)), nz(c.item), nz(c.spec), C.roundNo(c.round)].join("|");
  const read = async (f) => {
    if (!f) return; setSt((s) => ({ ...s, busy: true, err: "", items: [] }));
    try {
      const X = await loadXLSX(), wb = X.read(await f.arrayBuffer(), { type: "array" });
      const cards = (S.cards || []).filter((c) => !c.deleted), items = [];
      wb.SheetNames.forEach((name) => {
        if (C.sheetSkip(name)) return;
        const aoa = X.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: "" });
        const p = C.parseV7(name, aoa); if (!p.card.rows.length && !p.card.item) return;
        const cmp = C.compareXl(p), match = cards.find((c) => keyOf(c) === keyOf(p.card)) || null;
        const cands = refList.filter((r) => r.type !== "세트" && nz(r.name) === nz(p.card.item) && nz(r.spec === "-" ? "" : r.spec) === nz(p.card.spec));
        items.push({ name, p, cmp, match, link: match && match.prodKey ? null : cands.length === 1 ? cands[0] : null, on: true });
      });
      console.log(`[엑셀 올리기] ${f.name} · 품목 시트 ${items.length}장`);
      setSt({ file: f.name, items, busy: false, err: items.length ? "" : "품목 시트를 못 찾았어요 (v7 양식인지 확인)", done: 0 });
    } catch (e) { console.error("[엑셀 올리기] 읽기 실패", e); setSt((s) => ({ ...s, busy: false, err: "엑셀을 못 읽었어요: " + (e.message || e) })); }
  };
  const save = async () => {
    const todo = st.items.filter((i) => i.on); if (!todo.length) return;
    setSt((s) => ({ ...s, busy: true, done: 0 }));
    const ctxS = { user, amap: { ...(S.alias || {}) }, mfgList: S.mfgList };
    let n = 0, same = 0;
    try {
      for (const it of todo) {
        const prev = it.match, pn = prev ? S.names[prev.id] || {} : {};
        const pv = namesInit(pn, prev ? prev.rows : []).vsup, vsup = {};
        const rows = it.p.card.rows.map((r, k) => {
          const o = prev && prev.rows && prev.rows[k], same = o && nz(o.name) === nz(r.name), id = same ? o.id : "x" + k + Math.random().toString(36).slice(2, 7);
          const a = { ...C.vendorsOf(r)[0], vid: "A" }, others = same ? C.vendorsOf(o).filter((v) => v.vid !== "A") : [];
          vsup[id] = { ...(same ? pv[o.id] || {} : {}), A: it.p.names.sup[k] || "" };
          return { ...r, id, vendors: [a, ...others], sel: "A" };
        });
        const card = { ...it.p.card, rows, prodKey: prev ? prev.prodKey || "" : it.link ? it.link.k : "", prodLabel: prev ? prev.prodLabel || "" : it.link ? `${it.link.name}${it.link.spec && it.link.spec !== "-" ? " " + it.link.spec : ""}` : "",
          method: prev ? prev.method || "" : "", origin: prev ? prev.origin || "" : "", fx: (prev && prev.fx) || {}, need: false, seed: "excel", sale: (prev && prev.sale) || {} };
        const r = await saveCard(ctxS, { id: prev ? prev.id : "", prev, prevNames: pn, d: toEdit(card), nm: { mfg: it.p.names.mfg, vsup }, why: `엑셀 올리기 · ${st.file} › ${it.name}` });
        if (r.same) same++;
        n++; setSt((s) => ({ ...s, done: n }));
      }
      setToast(`엑셀 ${n}장 확인 · 저장 ${n - same}장${same ? ` · 바뀐 것 없음 ${same}장` : ""}`); onClose();
    } catch (e) { console.error("[엑셀 올리기] 저장 실패", e); setSt((s) => ({ ...s, busy: false, err: `${n}장 저장 뒤 멈췄어요: ${e.code || e.message}` })); }
  };
  const tog = (k) => setSt((s) => ({ ...s, items: s.items.map((x, j) => (j === k ? { ...x, on: !x.on } : x)) }));
  return html`<div class="sheet" role="dialog" aria-label="엑셀 올리기"><div class="sh-top"><div class="sh-in"><div class="sh-t"><div class="tt">📥 엑셀 올리기 (표준 원가계산기 v7)</div><button class="x" onClick=${onClose}>닫기</button></div>
    <div class="sh-sub">품목별 시트 1장 = 카드 1장 · '완제품 원가 요약'·'판매가'·'목록'·'양식(새 품목)' 시트는 건너뛰어요</div></div></div>
    <div class="sh-body">
      <div class="sec"><label class="dropz" style=${{ display: "block", cursor: "pointer" }}>
        <input type="file" accept=".xlsx,.xlsm,.xls" style=${{ display: "none" }} onChange=${(e) => read(e.target.files && e.target.files[0])} />
        <b style=${{ color: "var(--navy)" }}>엑셀 파일 고르기</b><div class="note">${st.file ? `고른 파일: ${st.file}` : "A5~B11 기본 정보 · D5~E10 범위·유효기간·향료 · 12행 머리글 · 13~32행 구성요소"}</div></label>
        ${st.busy && !st.items.length && html`<div class="ld">읽는 중…</div>`}
        ${st.err && html`<div class="err">${st.err}</div>`}
      </div>
      ${st.items.length > 0 && html`<div class="sec"><h3>미리 보기 ${st.items.length}장 <span class="rt">저장 전 확인 · 엑셀이 계산해 둔 값과 화면 계산을 줄마다 대조</span></h3>
        <div class="tblw" style=${{ border: 0 }}><table class="t" style=${{ minWidth: 900 }}><thead><tr><th></th><th>시트</th><th>브랜드 · 품목 · 규격 · 차수</th><th class="num">줄</th><th class="num">생산 수량</th><th class="num">완제품 기준 원가</th><th>엑셀 값과</th><th>저장 방식</th><th>알림</th></tr></thead>
        <tbody>${st.items.map((it, k) => { const x = C.cardCalc(it.p.card); return html`<tr key=${k}>
          <td><input type="checkbox" checked=${it.on} onChange=${() => tog(k)} aria-label="저장할지" /></td><td class="nw">${it.name}</td>
          <td><b>${it.p.card.brand} · ${it.p.card.item} ${it.p.card.spec}</b> · ${it.p.card.round || "차수 없음"}</td><td class="num">${it.p.card.rows.length}</td><td class="num">${won(C.num(it.p.card.qty))}</td><td class="num"><b>${fmt(x.unit)}</b></td>
          <td>${it.cmp.diffs.length ? html`<span class="tag chk" title=${it.cmp.diffs.map((d) => `${d.row ? d.row + "줄 " : ""}${d.what}: 엑셀 ${fmt(d.excel)} / 화면 ${fmt(d.ours)}`).join("\n")}>다름 ${it.cmp.diffs.length}칸</span>` : it.cmp.checked ? html`<span class="tag ok">같음 ✓ ${it.cmp.checked}줄</span>` : html`<span class="tag off">계산값 없음</span>`}</td>
          <td class="nw">${it.match ? html`<span class="tag tmp">기존 카드 고침</span>` : html`<span class="tag ok">새 카드</span>`}${it.link ? html`<span class="tag" style=${{ marginLeft: 4 }}>가격표 연결: ${it.link.name}</span>` : ""}</td>
          <td style=${{ fontSize: 12, color: "var(--mute)" }}>${it.p.warn.join(" · ")}</td></tr>`; })}</tbody></table></div>
        ${st.items.some((i) => i.cmp.diffs.length) && html`<div class="warn">'다름' 칸에 마우스를 올리면 어느 줄이 다른지 보여요. 엑셀 식이 v7과 다르게 바뀌었거나 칸이 밀렸을 수 있어요 — 확인 뒤 저장해 주세요.</div>`}
        <div style=${{ display: "flex", gap: 8, marginTop: 12, alignItems: "center" }}><button class="btn solid" disabled=${st.busy || !st.items.some((i) => i.on)} onClick=${save}>${st.busy ? `저장 중… ${st.done}/${st.items.filter((i) => i.on).length}` : `${st.items.filter((i) => i.on).length}장 저장`}</button><button class="btn" onClick=${onClose}>닫기</button></div>
        <p class="note">· 같은 브랜드·품목·규격·차수 카드가 있으면 그 카드를 고쳐요(이력에 '엑셀 올리기'로 남음) · 없으면 새로 만들어요 · 공급처·제조사 실제 이름은 따로(마스터·경영 열람만) 저장돼요.
          <br />· 엑셀 구성요소 줄 = <b>A 업체(주) · 적용</b>으로 들어가요 · 이미 넣어 둔 B·C 업체 견적, 생산 방식·국내/수입·환율은 그대로 남아요.</p>
      </div>`}
    </div></div>`;
}
function TrashSheet({ ctx, onClose }) {
  const { S, user, setToast } = ctx; useBackClose(true, onClose);
  const list = (S.cards || []).filter((c) => c.deleted).sort((a, b) => String(b.deletedAt || "").localeCompare(String(a.deletedAt || "")));
  const back = async (c) => { try { await setDeleted(user, c, false); setToast("되살렸어요"); } catch (e) { console.error("[cost-cards] 되살리기 실패", e); setToast("못 되살렸어요: " + (e.code || e.message)); } };
  return html`<div class="sheet" role="dialog" aria-label="휴지통"><div class="sh-top"><div class="sh-in"><div class="sh-t"><div class="tt">🗑 휴지통</div><button class="x" onClick=${onClose}>닫기</button></div><div class="sh-sub">지운 카드는 여기 남아요 · 되살리면 이력도 그대로</div></div></div>
    <div class="sh-body"><div class="sec">${list.length ? html`<ul class="hist">${list.map((c) => html`<li key=${c.id} style=${{ display: "flex", gap: 8, alignItems: "center" }}><div style=${{ flex: 1 }}><b>${c.item} ${c.spec}</b> <span class="w">${c.brand} · ${c.round} · ${who(c.deletedBy)} ${whenTxt(c.deletedAt)}</span></div><button class="btn sm" onClick=${() => back(c)}>되살리기</button></li>`)}</ul>` : html`<div class="empty">휴지통이 비어 있어요.</div>`}</div></div></div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
