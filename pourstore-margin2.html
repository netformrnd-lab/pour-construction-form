<!--
  마진 v2 (폰) — 사용자 결정 2026-10-05 · 시안 pour-os-v2/mockups/step7-crm-margin-v2-plan.png ④⑤
  · 버전1(pourstore-pricing-dashboard.html)은 그대로. 같은 프로젝트(pourstoreproject) · 같은 로그인 · 같은 데이터
  · 가격 = 팀용 단가표(team-catalog/current — 버전1 관리자 화면이 계산해 저장하는 채널별 판매가)
  · 원가 = products · products-added + product-meta prod-cost(원가 수정) · prod-ship(택배비) · prod-rename(이름 변경)
  · 권한: 마스터 = 원가·이익(원)·마진 % / 부마스터 = 마진 %만(원가·이익 금액 안 보임) / 일반(허용·팀) = 판매가만(팀용 단가표만 읽음)
  · 가격 바꾸기 요청 = 버전1 개정안(product-meta/pricing-draft)에 담고 '대기' → 마스터가 PC 가격정책표에서 승인(버전1 그대로 — CRM 단가도 같이)
  · 마진 낮음 · 가격 요청 → 업무OS(pour-app-new) pour-os/v2/links (src 'margin', kind marginLow · priceReq) — 이름·채널·% 한 줄만
  · 재고·유통기한 = 공용 DB(commerce-division) expiryLots 읽기만 (올리기·재고 충전 계산은 PC)
-->

<body>
<div id="root"><div class="m2-load">마진 불러오는 중…</div></div>

<!-- 계산만 (저장 없음) — 시험: node 로 이 스크립트만 꺼내 돌림 (pour-os-v2 밖 · scratchpad m2/calc.test.mjs) -->
<script id="m2calc">
(function(G){
  const pKey = (p) => `${p.cat}|${p.name}|${p.spec}`;
  const ceil100 = (n) => Math.ceil(n / 100) * 100;
  const hash = (s) => { let h = 5381; s = String(s); for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(36); };
  const won = (v) => v == null || !isFinite(v) ? "—" : Math.round(v).toLocaleString("ko-KR");
  const pctTxt = (r) => r == null || !isFinite(r) ? "—" : `${(Math.round(r * 1000) / 10).toFixed(1)}%`;   // 버전1과 같이 소수 한 자리 (14.9% 가 15% 로 보이지 않게)
  const thrTxt = (r) => `${Math.round(r * 100)}%`;
  const lc = (a) => (Array.isArray(a) ? a : []).map((e) => String(e).toLowerCase());

  // 권한 (버전1 recompute*Allowed 와 같은 판정) → 'master' | 'sub' | 'general' | 'none'
  //  마스터 = masterEmail + masterEmails · 부마스터 = subMasterEmails · 둘 다 이메일 인증해야 원가 열림(인증 전엔 일반)
  //  일반 = allowedEmails · teamEmails (판매가만)
  function roleOf(access, email, verified) {
    const e = String(email || "").toLowerCase(); if (!e || !access) return "none";
    const masters = [String(access.masterEmail || "").toLowerCase(), ...lc(access.masterEmails)].filter(Boolean);
    const subs = lc(access.subMasterEmails), allow = lc(access.allowedEmails), team = lc(access.teamEmails);
    if (masters.includes(e)) return verified ? "master" : "general";
    if (subs.includes(e)) return verified ? "sub" : "general";
    if (allow.includes(e) || team.includes(e)) return "general";
    return "none";
  }
  const ROLE_NAME = { master: "마스터", sub: "부마스터", general: "일반", none: "권한 없음" };

  // 원가 찾기: 현재 이름 키(버전1 pKey) → {cost, ship}. products 는 원래 이름 → prod-rename 로 지금 이름
  function costIndex({ products = [], padd = [], renames = {}, pcost = {}, pship = {} }) {
    const idx = {};
    products.forEach((p) => {
      const ok = pKey(p), nm = renames[ok] || null;
      const cur = nm ? `${p.cat}|${nm.name || p.name}|${nm.spec != null ? nm.spec : p.spec}` : ok;
      if (!(cur in idx)) idx[cur] = { cost: p.cost == null || p.cost === "" ? null : +p.cost };
    });
    padd.forEach((p) => { const k = pKey(p); if (!(k in idx)) idx[k] = { cost: p.cost == null || p.cost === "" ? null : +p.cost }; });
    Object.keys(pcost || {}).forEach((k) => { const v = pcost[k]; idx[k] = { ...(idx[k] || {}), cost: v == null || v === "" ? null : +v }; });
    Object.keys(idx).forEach((k) => { const s = +((pship || {})[k]); idx[k].ship = s > 0 ? s : 0; });
    return idx;
  }

  // 한 칸 마진: 원가 = 원가 + 택배비(버전1 mCost) · raw = (판매가 − 원가)/판매가(버전1 가격정책표 값) · net = 채널 수수료(config/calc.chVar)까지 뺀 값
  function marginOf(price, cost, ship, feePct) {
    if (price == null || !(price > 0) || cost == null || !isFinite(cost)) return null;
    const c = cost + (ship || 0), f = (+feePct || 0) / 100;
    const profit = price * (1 - f) - c;
    return { raw: (price - c) / price, net: profit / price, profit, fee: +feePct || 0 };
  }

  // 화면용 제품 목록 — role 이 원가 권한(master·sub)일 때만 마진 계산
  function buildModel({ catalog, costIdx = {}, chVar = {}, threshold = 0.15, role = "general" }) {
    const chans = ((catalog && catalog.channels) || []).filter((c) => c && c.uid && c.role !== "export").slice().sort((a, b) => (a.ord ?? 0) - (b.ord ?? 0));
    const canCost = role === "master" || role === "sub";
    const products = ((catalog && catalog.products) || []).map((p, i) => {
      const key = pKey(p), set = p.type === "세트", ci = costIdx[key] || {};
      const cost = canCost && !set ? (ci.cost == null ? null : ci.cost) : null, ship = canCost ? ci.ship || 0 : 0;
      const rows = chans.filter((c) => p.prices && p.prices[c.uid] != null).map((c) => {
        const price = +p.prices[c.uid], fee = +((chVar[c.code] || {}).fee) || 0;
        const m = canCost && !set ? marginOf(price, cost, ship, fee) : null;
        return { uid: c.uid, code: c.code || "", name: c.short || c.name || c.code || "", full: c.name || "", role: c.role || "", gh: String(c.uid).startsWith("ghc-") || String(c.uid).startsWith("ghp-"), price, fee, m, low: !!(m && m.net < threshold) };
      });
      const retail = rows.find((r) => r.role === "retail") || rows[0] || null;
      const lowN = rows.filter((r) => r.low).length;
      return { i, key, h: hash(key), cat: p.cat || "", name: p.name || "", spec: p.spec && p.spec !== "-" ? p.spec : "", brand: Array.isArray(p.brand) ? p.brand : [], status: p.status || "", group: p.group || "", set, code: p.code || "",
        cost, ship, noCost: canCost && !set && cost == null, rows, retail, lowN, minNet: rows.reduce((a, r) => (r.m && (a == null || r.m.net < a) ? r.m.net : a), null) };
    });
    return { chans, products, threshold, canCost, role };
  }
  // 마진 낮음 (제품 × 채널) — 낮은 순
  function lowList(model) {
    const out = []; (model.products || []).forEach((p) => p.rows.forEach((r) => { if (r.low) out.push({ p, r, id: linkId("low", p.key, r.uid) }); }));
    return out.sort((a, b) => a.r.m.net - b.r.m.net);
  }
  const linkId = (k, key, uid) => `margin-${k}-${hash(key + "|" + (uid || ""))}`;
  const cut = (s, n) => String(s || "").replace(/\s+/g, " ").trim().slice(0, n);
  const pageUrl = (base, p) => `${base}#p-${p.h}`;
  // 업무OS 한 줄(pour-os/v2/links) — 이름·채널·% 만 (원가·금액 없음)
  function lowLink(p, r, threshold, { base, owner = "", ownerOsId = "", today, by = "" }) {
    return { id: linkId("low", p.key, r.uid), src: "margin", kind: "marginLow", title: cut(`${p.name} · ${r.name}`, 40),
      sub: `마진 ${pctTxt(r.m.net)} (기준 ${thrTxt(threshold)}) · 가격 확인`, date: today, time: "", owner, ownerOsId, url: pageUrl(base, p), open: true, at: new Date().toISOString(), by };
  }
  function reqLink(p, r, from, to, { base, today, by = "", byName = "" }) {
    return { id: linkId("req", p.key, r.role === "retail" ? "" : r.uid), src: "margin", kind: "priceReq", title: cut(`${p.name} ${r.name}가 변경`, 40),
      sub: `${byName || by} → 관리자 · ${won(from)} → ${won(to)}`, date: today, time: "", owner: "", ownerOsId: "", url: `${base}#req`, open: true, at: new Date().toISOString(), by };
  }
  // 열려 있는 마진 줄 정리(앱을 열 때) — 이제 낮지 않으면 닫고(open:false · 지우지 않음) · % 가 바뀌었으면 고침 · 승인·반려된 요청은 닫음
  function planLinkSync(open, model, draft, threshold) {
    const lows = new Map(lowList(model).map((x) => [x.id, x])), pend = new Set(pendingLinkIds(draft));
    const out = [];
    (open || []).forEach((l) => {
      if (!l || l.open === false || l.src !== "margin") return;
      if (l.kind === "marginLow") {
        const x = lows.get(l.id);
        if (!x) out.push({ id: l.id, data: { open: false, closedAt: new Date().toISOString(), closedWhy: "마진 기준 넘음" } });
        else { const sub = `마진 ${pctTxt(x.r.m.net)} (기준 ${thrTxt(threshold)}) · 가격 확인`; if (sub !== l.sub) out.push({ id: l.id, data: { sub } }); }
      } else if (l.kind === "priceReq") {
        if (!pend.has(l.id)) out.push({ id: l.id, data: { open: false, closedAt: new Date().toISOString(), closedWhy: "승인 또는 반려" } });
      }
    });
    return out;
  }
  // 개정안(버전1 product-meta/pricing-draft) — 자사몰 정가 = retail[pKey] · 그 밖 채널 = ovr["pKey|uid"] (버전1 draftSetRetail · draftSetOvr 와 같은 칸 · 100원 올림)
  const draftKeyOf = (p, r) => r.role === "retail" ? p.key : p.key + "|" + r.uid;
  function pendingKeys(d) { if (!d) return []; return [...Object.keys(d.retail || {}), ...Object.keys(d.ovr || {})]; }
  // 개정안 칸 → 업무OS 요청 줄 id (reqLink 와 같은 계산: 정가 = hash(pKey|) · 채널 = hash(pKey|uid))
  function pendingLinkIds(d) { if (!d) return []; return [...Object.keys(d.retail || {}).map((k) => linkId("req", k, "")), ...Object.keys(d.ovr || {}).map((k) => `margin-req-${hash(k)}`)]; }
  function draftWith(cur, p, r, price, meta) {
    const d = { vbase: {}, retail: {}, coeff: {}, ovr: {}, todo: {}, meta: { status: "", by: "", at: "", note: "" }, ...(cur || {}) };
    d.retail = { ...(d.retail || {}) }; d.ovr = { ...(d.ovr || {}) };
    const v = ceil100(+price);
    if (r.role === "retail") d.retail[p.key] = v; else d.ovr[p.key + "|" + r.uid] = v;
    const old = d.meta || {}, line = meta.note;

// 업무OS로 보내기 (마진 낮음 한 줄)
async function sendLow(ctx, items, owner) {

  items.forEach(({ p, r }) => { const l = C.lowLink(p, r, ctx.D.threshold, { base: SELF_URL, owner: owner ? owner.name : "", ownerOsId: owner ? owner.id : "", today, by }); const { id, ...data } = l; b.set(linksCol().doc(id), data); });

}
function SendBtn({ ctx, p, r, small }) {

// 가격 바꾸기 요청 → 개정안(대기) + 업무OS 한 줄(관리자)

  const { D, isMaster, user, setToast } = ctx;
  const rows = p.rows.filter((r) => !r.gh);
  const [uid, setUid] = useState((rows.find((r) => r.low) || rows[0] || {}).uid), [v, setV] = useState(""), [note, setNote] = useState(""), [busy, setBusy] = useState(false);

  const toC = to ? C.ceil100(to) : 0;
  const after = r && toC && p.cost != null ? C.marginOf(toC, p.cost, p.ship, r.fee) : null;
  const send = async () => {
    if (!r || !toC || toC === r.price) return; setBusy(true);
    try {
      const ref = pm("pricing-draft"), at = new Date().toISOString(), by = user.email || "";
      const line = `폰 요청: ${p.name} ${r.name} ${won(r.price)} → ${won(toC)}${note ? " (" + note.trim().slice(0, 80) + ")" : ""}`;
      await db.runTransaction(async (tx) => { const d = await tx.get(ref); tx.set(ref, { ...C.draftWith(d.exists ? d.data() : null, p, r, toC, { by, at, note: line }), updatedAt: at }); });
      try { const l = C.reqLink(p, r, r.price, toC, { base: SELF_URL, today: ymd(), by, byName: by.split("@")[0] }); const { id, ...data } = l; await linksCol().doc(id).set(data); }
      catch (e) { console.warn("[업무OS 다리] 요청 줄 못 보냄", e.code || e); }
      setToast(isMaster ? "개정안에 담았어요 · PC 가격정책표에서 승인하면 반영" : "요청했어요 · 관리자 업무OS '확인할 것'에 떠요"); done();
    } catch (e) { console.error("[pricing-draft] 요청 실패", e); setToast("요청 못 했어요: " + (e.code || e.message)); }
    setBusy(false);
  };
  return html`<div class="m2-card m2-pad" style=${{ marginTop: 12 }}>
    <div class="m2-sec" style=${{ marginTop: 0 }}>가격 바꾸기 요청</div>
    <div class="m2-chips">${rows.map((x) => html`<button key=${x.uid} class=${"m2-chip" + (x.uid === uid ? " on" : "")} onClick=${() => setUid(x.uid)}>${x.name}</button>`)}</div>
    <div class="m2-fld"><label>${r ? `${r.name} 지금 ${won(r.price)}원 → 새 가격` : "새 가격"}</label>
      <input class="m2-in" inputmode="numeric" placeholder="예: 27900" value=${v} onInput=${(e) => setV(e.target.value)} aria-label="새 가격" autofocus /></div>
    ${toC ? html`<p class="m2-sub" style=${{ margin: "0 0 8px" }}>${toC !== to ? `100원 올림 → ${won(toC)}원 · ` : ""}${after ? html`마진 ${pctTxt(r.m && r.m.net)} → <b class=${after.net < D.threshold ? "m2-red" : ""}>${pctTxt(after.net)}</b>` : ""}</p>` : ""}
    <div class="m2-fld"><label>한마디 (선택)</label><input class="m2-in" value=${note} onInput=${(e) => setNote(e.target.value)} placeholder="예: 쿠팡 경쟁가 맞춤" aria-label="한마디" /></div>
    <div class="m2-btns" style=${{ marginTop: 4 }}>
      <button class="m2-btn solid" disabled=${busy || !toC || !r || toC === r.price} onClick=${send}>${busy ? "보내는 중…" : "요청 보내기"}</button>
      <button class="m2-btn" onClick=${done}>그만두기</button>
    </div>

}

      <div class="m2-sub" style=${{ margin: 0 }}>마진</div>
      <div class=${"big" + (out && out.net < D.threshold ? " red" : "")}>${out ? pctTxt(out.net) : "—"}</div>
      ${out && showWon ? html`<div class="m2-sub" style=${{ margin: "2px 0 0" }}>개당 ${won(out.profit)}원${out.fee ? ` · 수수료 ${won(num(price) * out.fee / 100)}원` : ""}</div>` : ""}
      ${out && out.net < D.threshold ? html`<div class="m2-sub m2-red" style=${{ margin: "2px 0 0" }}>기준 ${thr(D.threshold)}보다 낮음</div>` : ""}
    </div>
    <div class="m2-sec">목표 마진이면 판매가는?</div>
    <div class="m2-grid2" style=${{ alignItems: "end" }}>
      <div class="m2-fld"><label>목표 마진 (%)</label><input class="m2-in" inputmode="decimal" value=${target} onInput=${(e) => setTarget(e.target.value)} aria-label="목표 마진" /></div>
      <div class="m2-out" style=${{ marginBottom: 10 }}><div class="m2-sub" style=${{ margin: 0 }}>필요한 판매가</div><div class="big" style=${{ fontSize: 20 }}>${need ? won(need) + "원" : "—"}</div></div>
    </div>
    ${p && canCost && !p.set && p.rows.some((r) => !r.gh) && need ? html`<p class="m2-note">이 가격으로 바꾸려면 상품에서 제품을 열고 [가격 바꾸기 요청]</p>` : ""}
  </div>`;
}

// ── 재고·유통기한 (공용 DB 읽기만) ──
function StockTab({ ctx }) {
  const [st, setSt] = useState({ loading: true, rows: [], meta: {}, err: "" }), [brand, setBrand] = useState(""), [sort, setSort] = useState("exp"), [q, setQ] = useState(""), [n, setN] = useState(50);
  const load = useCallback(() => { setSt((s) => ({ ...s, loading: true, err: "" }));
    cenDb().collection("expiryLots").get().then((s) => { console.log(`[expiryLots] ${s.size}건`); const r = C.expiryRows(s.docs.map((d) => ({ id: d.id, data: d.data() })), ymd()); setSt({ loading: false, ...r, err: "" }); })
      .catch((e) => { console.error("[expiryLots] 로드 실패", e); setSt({ loading: false, rows: [], meta: {}, err: "재고를 못 불러왔어요: " + (e.code || e.message) }); }); }, []);
  useEffect(load, []);
  const brands = Object.keys(st.meta);
  const t = q.replace(/\s/g, "").toLowerCase();
  const list = st.rows.filter((r) => (!brand || r.brand === brand) && (!t || (r.name + r.code).replace(/\s/g, "").toLowerCase().includes(t)))
    .sort((a, b) => sort === "qty" ? a.qty - b.qty : ((a.left == null ? 1e9 : a.left) - (b.left == null ? 1e9 : b.left)));
  const soon = st.rows.filter((r) => r.left != null && r.left <= 90).length;
  return html`<div>
    <div class="m2-h1">재고·유통기한 <span class="sp" /><button class="m2-btn sm" onClick=${load}>새로</button></div>
    <p class="m2-sub">3PL 재고(공용 DB) · 같은 상품코드는 합쳐서 · 90일 안에 끝나는 것 ${soon}개${brands.length ? " · 올린 때 " + brands.map((b) => `${b} ${whenTxt(st.meta[b].at)}`).join(" · ") : ""}</p>
    ${st.err && html`<div class="m2-err">${st.err}</div>`}
    <input class="m2-in" type="search" placeholder="제품 이름·코드 찾기" value=${q} onInput=${(e) => setQ(e.target.value)} aria-label="재고 찾기" style=${{ marginBottom: 8 }} />
    <div class="m2-chips">
      <button class=${"m2-chip" + (sort === "exp" ? " on" : "")} onClick=${() => setSort("exp")}>유통기한 빠른 순</button>
      <button class=${"m2-chip" + (sort === "qty" ? " on" : "")} onClick=${() => setSort("qty")}>재고 적은 순</button>
      ${brands.length > 1 ? [html`<span key="sp" style=${{ width: 6, flex: "none" }} />`, html`<button key="all" class=${"m2-chip" + (!brand ? " on" : "")} onClick=${() => setBrand("")}>모두</button>`, ...brands.map((b) => html`<button key=${b} class=${"m2-chip" + (brand === b ? " on" : "")} onClick=${() => setBrand(b)}>${b}</button>`)] : ""}
    </div>
    <div class="m2-card">
      ${st.loading ? html`<div class="m2-empty">불러오는 중…</div>` : list.length ? list.slice(0, n).map((r) => { const red = r.left != null && r.left <= 30;
        return html`<div key=${r.k} class="m2-row" style=${{ cursor: "default" }}>
          <div class="tx"><div class="t">${r.name}</div>
            <div class="s">${r.brand}${r.code ? " · " + r.code : ""} · 재고 ${won(r.qty)}개${r.onOrder ? ` · 주문함 ${won(r.onOrder.qty)}개${r.onOrder.eta ? " " + md(r.onOrder.eta) + " 입고" : ""}` : ""}</div></div>
          <div class="r">${r.exp ? html`<div class=${red ? "m2-red" : ""} style=${{ fontWeight: 700 }}>${r.left < 0 ? `${-r.left}일 지남` : `${r.left}일 남음`}</div><div>${md(r.exp)}${r.expQty !== r.qty ? ` · ${won(r.expQty)}개` : ""}</div>` : "기한 없음"}</div>
        </div>`; }) : html`<div class="m2-empty">${st.rows.length ? "찾는 재고가 없어요." : "공용 DB에 재고가 없어요. PC 화면에서 재고 엑셀을 올려 주세요."}</div>`}
      ${list.length > n && html`<button class="m2-list-more" onClick=${() => setN(n + 100)}>${list.length - n}개 더 보기</button>`}
    </div>
    <p class="m2-note">재고 엑셀 올리기 · 재고 충전(언제 몇 개 주문) 계산은 <a href=${V1_URL} target="_blank" rel="noopener">PC 화면 ›</a> · 재고 위험은 CRM이 업무OS에도 알려요.</p>
  </div>`;
}

// ── 더보기 ──
function MoreTab({ ctx }) {
  const { D, user, role, isMaster, canCost, setToast, setSheet } = ctx;
  const pend = useMemo(() => C.pendingList(D.draft, D.model), [D.draft, D.model]);
  const [tv, setTv] = useState(String(Math.round(D.threshold * 100))), [busy, setBusy] = useState(false);
  useEffect(() => setTv(String(Math.round(D.threshold * 100))), [D.threshold]);
  const saveT = async (v) => { const n = +v; if (!(n > 0 && n < 90)) { setToast("1~89 사이 숫자로 넣어 주세요"); return; } setBusy(true);
    try { await pm("margin-v2").set({ threshold: n / 100, updatedAt: new Date().toISOString(), updatedBy: user.email || "" }, { merge: true }); setToast(`기준 마진 ${n}%로 바꿨어요`); } catch (e) { console.error("[margin-v2] 저장 실패", e); setToast("저장 못 했어요: " + (e.code || e.message)); } setBusy(false); };
  // 옵시디언 제품 카드용 목록 — 단가표(team-catalog) 칸 중 아래 6가지만 · 원가·택배비·이익·마진·제조사(가칭 포함)는 절대 넣지 않음 (2026-10-09 사장님: 팀원이 원가를 알면 안 됨)
  const copyCatalog = async () => {
    const M = D.model || {}, chans = M.chans || [], prods = M.products || [];
    const cell = (v) => String(v == null ? "" : v).replace(/[\t\n]/g, " ");
    // 팀원이 볼 칸 = 분류 · 상품명 · 옵션 · 자체상품코드 · 브랜드 · 채널별 판매가 (이것만 · 2026-10-09 사장님)
    const head = ["분류", "상품명", "옵션", "자체상품코드", "브랜드", ...chans.map((c) => c.short || c.name || c.code)];
    const lines = prods.map((p) => { const pr = Object.fromEntries((p.rows || []).map((r) => [r.uid, r.price]));
      return [p.cat, p.name, p.spec, p.code, (p.brand || []).join("/"), ...chans.map((c) => pr[c.uid] ?? "")].map(cell).join("\t"); });
    try { await navigator.clipboard.writeText([head.join("\t"), ...lines].join("\n")); setToast(`제품 ${prods.length}개 복사 (원가 없음) — Claude 채팅에 붙여넣기`); }
    catch (e) { console.error("[제품 목록 복사] 실패", e); setToast("복사 못 했어요: " + (e.message || e)); }
  };
  return html`<div>
    <div class="m2-h1">더보기</div>
    <div class="m2-card">
      <div class="m2-row" style=${{ cursor: "default" }}><div class="tx"><div class="t">${user.email}</div><div class="s">${C.ROLE_NAME[role]} · ${role === "master" ? "원가·이익·마진 모두" : role === "sub" ? "마진 %만 (원가·금액은 가려짐)" : "판매가만"}${!user.emailVerified && role === "general" ? " · 이메일 인증 전" : ""}</div></div>
        <button class="m2-btn sm" onClick=${() => auth.signOut()}>로그아웃</button></div>
    </div>
    ${canCost && html`<div class="m2-sec">가격 요청 · 승인 대기 <span class="sp" /><span class="rt">${pend.length}건</span></div>
      <div class="m2-card">
        ${pend.length ? pend.map((x) => html`<button key=${x.k} class="m2-row" onClick=${() => x.p && setSheet({ type: "prod", key: x.p.key })}><div class="tx"><div class="t">${x.name} · ${x.ch}</div><div class="s">${x.from != null ? won(x.from) + " → " : ""}${won(x.to)}원</div></div><div class="r">›</div></button>`)
          : html`<div class="m2-empty">승인 대기 중인 가격 변경이 없어요.</div>`}
        ${D.draft && D.draft.meta && D.draft.meta.status === "대기" && html`<div class="m2-pad" style=${{ borderTop: "1px solid var(--line)" }}>
          <div class="m2-sub" style=${{ margin: 0 }}>요청: ${D.draft.meta.by || "-"} · ${whenTxt(D.draft.meta.at)}${D.draft.meta.note ? " · " + D.draft.meta.note : ""}</div>
          ${isMaster && html`<div class="m2-btns" style=${{ marginTop: 8 }}><a class="m2-btn solid" href=${V1_URL} target="_blank" rel="noopener">PC 가격정책표에서 승인 ›</a></div>`}
        </div>`}
      </div>`}
    ${canCost && html`<div class="m2-sec">기준 마진</div>
      <div class="m2-card m2-pad">
        <div class="m2-sub" style=${{ margin: "0 0 8px" }}>이보다 낮으면 '마진 낮음' (수수료 뺀 마진 · 모든 사람 같은 기준)</div>
        ${isMaster ? html`<div class="m2-chips">${[10, 15, 20, 25, 30].map((n) => html`<button key=${n} class=${"m2-chip" + (Math.round(D.threshold * 100) === n ? " on" : "")} disabled=${busy} onClick=${() => saveT(n)}>${n}%</button>`)}</div>
          <div style=${{ display: "flex", gap: 8 }}><input class="m2-in" inputmode="numeric" value=${tv} onInput=${(e) => setTv(e.target.value)} aria-label="기준 마진" style=${{ flex: 1 }} /><button class="m2-btn solid" disabled=${busy || +tv === Math.round(D.threshold * 100)} onClick=${() => saveT(tv)} style=${{ height: 44 }}>저장</button></div>`
          : html`<div style=${{ fontSize: 22, fontWeight: 800 }}>${thr(D.threshold)}</div><div class="m2-note" style=${{ marginTop: 4 }}>바꾸기는 마스터만</div>`}
      </div>`}
    <div class="m2-sec">옵시디언 제품 카드</div>
    <div class="m2-card m2-pad">
      <div class="m2-sub" style=${{ margin: "0 0 8px" }}>분류·상품명·옵션·자체상품코드·브랜드·채널별 판매가만 복사해요. 원가·이익·마진·제조사는 넣지 않아요.</div>
      <button class="m2-btn solid" style=${{ width: "100%", height: 44 }} onClick=${copyCatalog}>📋 제품 목록 복사 (원가 없음)</button>
    </div>
    <div class="m2-sec">바로가기</div>
    <div class="m2-card">
      <a class="m2-row" href=${CRM_SALES} target="_blank" rel="noopener" style=${{ textDecoration: "none" }}><div class="tx"><div class="t">이번 달 매출</div><div class="s">매출 원본 = CRM (채널별 합계)</div></div><div class="r">›</div></a>
      <a class="m2-row" href=${V1_URL} target="_blank" rel="noopener" style=${{ textDecoration: "none" }}><div class="tx"><div class="t">PC 가격·마진 대시보드 (버전1)</div><div class="s">가격정책표 · 개정안 승인 · 재고 엑셀 올리기 · 프로모션</div></div><div class="r">›</div></a>
      <a class="m2-row" href=${OS_URL} style=${{ textDecoration: "none" }}><div class="tx"><div class="t">업무OS</div><div class="s">마진 낮음 · 가격 요청은 '확인할 것'에</div></div><div class="r">›</div></a>
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
</body>
</html>
