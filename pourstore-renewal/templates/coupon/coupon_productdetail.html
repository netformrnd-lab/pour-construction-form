<!-- ============================================================
  coupon_productdetail.html — 카페24 상품상세 '쿠폰 다운로드' 화면
  ▸ 카페24 경로: /coupon/coupon_productdetail.html
  ▸ [넷폼 수정] 쿠폰 이름 잘림 해결
      - 원인: {$coupon_name|cut:13,...} → 13글자에서 잘리고 '…' 붙음
      - 조치: |cut 제거해 전체 이름 표시 + .title 인라인 스타일로 최대 2줄까지 보이게
              (카페24 기본 productDetailAjax.css 의 1줄 말줄임을 인라인으로 덮음)
  ▸ 카페24 변수/모듈/기능은 그대로. 이름 표시 방식만 변경.
============================================================ -->
<div module="coupon_productdetailajax" class="section">
    <!--
        $coupon_down_result_url = /coupon/coupon_down_result.html
    -->
    <!--@css(/css/module/coupon/productDetailAjax.css)-->
    <div class="title">
        <h2>쿠폰 다운로드</h2>
        <p class="button"><a href="#none" id="btn_all_coupondown" class="btnNormal sizeS">전체쿠폰다운받기</a></p>
    </div>
    <div class="couponSkinArea">
        <!--
            1 row : ul class="grid1"
            2 row : ul class="grid2"
            3 row : ul class="grid3"
        -->
        <ul class="grid3">
            <li>
                <div class="coupon {$background_class}" style="background-image:url('{$background_url}')">
                    <div class="detail" {$call_coupon_detail}>
                        <strong class="title" style="color:#888; font-size:11px; white-space:normal; overflow:visible; text-overflow:clip; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.35; word-break:keep-all;">{$coupon_name}</strong>
                        <p class="discount" style="color:#bd1b05;"><span style="">{$coupon_content}</span></p>
                        <p class="period" style="color:#888;">{$coupon_period}</p>
                    </div>
                    <div class="button"><a href="{$coupon_issue_url}"><img src="{$download_url}" alt="다운받기"></a></div>
                </div>
            </li>
            <li>
                <div class="coupon {$background_class}" style="background-image:url('{$background_url}')">
                    <div class="detail" {$call_coupon_detail}>
                        <strong class="title" style="color:#888; font-size:11px; white-space:normal; overflow:visible; text-overflow:clip; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.35; word-break:keep-all;">{$coupon_name}</strong>
                        <p class="discount" style="color:#bd1b05;"><span style="">{$coupon_content}</span></p>
                        <p class="period" style="color:#888;">{$coupon_period}</p>
                    </div>
                    <div class="button"><a href="{$coupon_issue_url}"><img src="{$download_url}" alt="다운받기"></a></div>
                </div>
            </li>
        </ul>
    </div>
</div>
