<!-- ============================================================
  POUR스토어 메인 — [패키지 시공] 풀폭 배너 (1장)  ▸ 파일: pour-02c-package.html
  ▸ 조립: index-main.html 에서 pour-02-best(섹션2)와 pour-03-doctor 사이에 @import 됨.
  ▸ 위치: 섹션2(상품카드 캐러셀) 아래, POUR닥터 진단 섹션 위.
  ▸ 가로: 화면 처음~끝까지 풀폭(full-bleed). 세로: 콘텐츠 기준(아래 --pshp-pad 로 조절).
  ▸ 자체 스코프 CSS/JS(.pshp-*)라 주변 섹션과 충돌하지 않습니다.
  ▸ 랜딩: /pourstore_renewal/package/pour-package.html
  ▸ 폰트: Pretendard (헤더가 이미 로드). 테마: POUR 블루 #1A72E8

  ★ 세로 높이 조절: 아래 .pshp 의 --pshp-pad 값(위아래 여백)만 바꾸면 됩니다. (기본 48px)
  ★ 배경사진 교체(어드민): 어드민 → "홈 소재별 카드 관리" → 📦 패키지 배너 배경사진 에서 업로드.
    (config/pourstoreHomeCards.packageBg 에 저장 → 이 섹션이 읽어 자동 적용)
    자동으로 블러 + 밝은 스크림 처리되어 글자·도형이 잘 보입니다. 없으면 파란 그라데이션 유지.
============================================================ -->
<section class="pshp" style="--pshp-pad:48px">
<style>
.pshp, .pshp *{box-sizing:border-box;margin:0;padding:0;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-0.02em}
/* 풀폭 밴드: 가로 처음~끝, 세로는 --pshp-pad 로 조절 */
.pshp{position:relative;overflow:hidden;display:block;width:100%;background:linear-gradient(120deg,#EAF2FF 0%,#F3F8FF 52%,#E8F0FF 100%);border-top:1px solid #E3ECFA;border-bottom:1px solid #E3ECFA}
/* 전체 배경사진 레이어 (어드민 교체, 블러) + 스크림(글자 가독성) — 사진 없으면 둘 다 숨김 */
.pshp-bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;filter:blur(4px);transform:scale(1.06);opacity:0;transition:opacity .4s}
.pshp-bg.has-img{opacity:1}
.pshp-scrim{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .4s;
  background:linear-gradient(120deg,rgba(238,244,255,.86) 0%,rgba(246,250,255,.74) 52%,rgba(236,243,255,.86) 100%)}
.pshp.has-bg .pshp-scrim{opacity:1}
.pshp-in{position:relative;z-index:2;max-width:1256px;margin:0 auto;padding:var(--pshp-pad) 24px;display:flex;align-items:center;gap:36px;text-decoration:none}

/* 왼쪽 텍스트 */
.pshp-txt{flex:1 1 auto;min-width:0}
.pshp-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pshp-badge{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #DCE8FB;color:#1A72E8;font-size:12.5px;font-weight:800;padding:7px 13px;border-radius:999px;box-shadow:0 2px 8px rgba(26,114,232,.10)}
.pshp-badge.free{background:#1A72E8;border-color:#1A72E8;color:#fff;box-shadow:0 4px 12px rgba(26,114,232,.28)}
.pshp-title{margin-top:15px;font-size:32px;font-weight:900;color:#0F1F5C;line-height:1.24;letter-spacing:-0.035em}
.pshp-title .hl{color:#1A72E8}
.pshp-desc{margin-top:13px;font-size:15px;font-weight:500;color:#4B5563;line-height:1.62}
.pshp-desc b{color:#1A72E8;font-weight:800}
/* 혜택 pill (잘 보이게) */
.pshp-feats{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;list-style:none}
.pshp-feats li{display:inline-flex;align-items:center;gap:9px;background:#fff;border:1px solid #DCE8FB;border-radius:12px;padding:10px 15px;font-size:13.5px;font-weight:600;color:#0F1F5C;box-shadow:0 2px 10px rgba(26,114,232,.10)}
.pshp-feats li b{font-weight:800;color:#1A72E8}
.pshp-feats .ic{flex:0 0 26px;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;background:#EFF4FF;font-size:14px}
.pshp-cta{display:inline-flex;align-items:center;gap:7px;margin-top:22px;background:#1A72E8;color:#fff;font-size:14.5px;font-weight:800;padding:13px 22px;border-radius:12px;box-shadow:0 6px 16px rgba(26,114,232,.28);transition:transform .12s,box-shadow .12s}
.pshp-in:hover .pshp-cta{transform:translateY(-1px);box-shadow:0 10px 22px rgba(26,114,232,.34)}

/* ===== 반응형 ===== */
@media (max-width:1000px){
  .pshp-title{font-size:27px}
}
@media (max-width:760px){
  /* 모바일 세로 높이 절반 수준으로 컴팩트 */
  .pshp{--pshp-pad:16px}
  .pshp-in{padding:var(--pshp-pad) 18px}
  .pshp-title{font-size:22px;margin-top:11px}
  .pshp-desc{font-size:12.5px;margin-top:8px;line-height:1.5}
  .pshp-feats{margin-top:11px;gap:7px}
  .pshp-feats li{padding:8px 12px;font-size:12px}
  .pshp-cta{margin-top:14px;padding:11px 18px;font-size:13.5px}
}
</style>
<div class="pshp-bg" aria-hidden="true"></div>
<div class="pshp-scrim" aria-hidden="true"></div>
<a class="pshp-in" href="https://pourstore.cafe24.com/pourstore_renewal/package/pour-package.html">

  <div class="pshp-txt">
    <div class="pshp-chips">
      <span class="pshp-badge">📦 올인원 패키지</span>
      <span class="pshp-badge free">남은 자재 무료 반환</span>
    </div>
    <h3 class="pshp-title">패키지로 쉽게, <span class="hl">부담 없이 시공해요</span></h3>
    <p class="pshp-desc">필요한 자재만 패키지로 한 번에 — 편하게 구매하고, 쓰고 <b>남은 자재는 무료로 반환</b>.<br>쉽고 · 빠르게 · 부담 없이, 딱 필요한 만큼만 쓰세요.</p>
    <ul class="pshp-feats">
      <li><span class="ic">💳</span>쓴 만큼만 결제, <b>남으면 그대로 반품</b></li>
      <li><span class="ic">🕒</span><b>원하시는 시간</b>에 맞춰 보내드려요</li>
    </ul>
    <span class="pshp-cta">패키지 보러가기 →</span>
  </div>

</a>
<!-- 배경사진: 어드민 '홈 소재별 카드 관리' → 패키지 배너 배경사진 (config/pourstoreHomeCards.packageBg) -->
<script>
(function(){
  var sec = document.currentScript.closest('.pshp'); if(!sec) return;
  var bg = sec.querySelector('.pshp-bg'); if(!bg) return;
  (async function(){
    try{
      var a=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
      var fs=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
      var cfg={apiKey:"AIzaSyBbct9tO8nCUCjz4s9GnXQLkHuHe2FFyyU",authDomain:"pour-app-new.firebaseapp.com",projectId:"pour-app-new",storageBucket:"pour-app-new.firebasestorage.app",messagingSenderId:"411031141847",appId:"1:411031141847:web:e658174fd4b9652cdadf92"};
      var app=a.getApps().length?a.getApps()[0]:a.initializeApp(cfg);
      var snap=await fs.getDoc(fs.doc(fs.getFirestore(app),'config','pourstoreHomeCards'));
      var url=snap.exists()?((snap.data()||{}).packageBg||''):'';
      if(url){ bg.style.backgroundImage='url("'+url+'")'; bg.classList.add('has-img'); sec.classList.add('has-bg'); }
      else { console.log('[pkg-banner] 배경사진 없음 — 기본 그라데이션'); }
    }catch(e){ console.log('[pkg-banner] 배경 로드 스킵:', e&&e.message?e.message:e); }
  })();
})();
</script>
</section>
