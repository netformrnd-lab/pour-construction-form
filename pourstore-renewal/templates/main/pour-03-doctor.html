<section class="pdq">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/[email protected]/dist/web/variable/pretendardvariable.css');
.pdq *, .pdq *::before, .pdq *::after { box-sizing:border-box; margin:0; padding:0; font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
.pdq { background:#fff; padding:64px 18px; color:#2F3438; letter-spacing:-0.02em; }
.pdq-inner { max-width:880px; margin:0 auto; }
/* 밴드: 부드러운 웜톤 + 둥근 모서리 */
.pdq-band { display:flex; align-items:center; gap:32px; background:linear-gradient(180deg,#FFFBF5 0%,#FBF6EE 100%); border:1px solid #F1E7D8; border-radius:26px; padding:34px 40px; box-shadow:0 14px 40px rgba(200,150,80,.08); }
/* 마스코트 — 원형, 둥둥 부유 + 은은한 후광 */
.pdq-char { position:relative; flex-shrink:0; width:150px; height:150px; display:grid; place-items:center; }
.pdq-char::after { content:''; position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); width:150px; height:150px; border-radius:50%; background:radial-gradient(circle, rgba(244,154,58,.20) 0%, transparent 66%); z-index:0; animation:pdqHalo 4.5s ease-in-out infinite; }
.pdq-frame { position:relative; z-index:1; width:150px; height:150px; border-radius:50%; background:#F5F2EC; display:grid; place-items:center; overflow:hidden; animation:pdqFloat 3.6s ease-in-out infinite; }
.pdq-char-img { display:block; width:148px; height:148px; object-fit:contain; filter:drop-shadow(0 6px 12px rgba(15,31,92,.14)); }
@keyframes pdqFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
@keyframes pdqBob   { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
@keyframes pdqHalo  { 0%,100% { opacity:.45; transform:translate(-50%,-50%) scale(.9); } 50% { opacity:.85; transform:translate(-50%,-50%) scale(1.07); } }
/* 본문 */
.pdq-body { flex:1; min-width:0; text-align:center; }
.pdq-kicker { display:inline-block; font-size:11.5px; font-weight:800; color:#E8780F; letter-spacing:0.04em; padding:5px 14px; background:#FFF1E2; border-radius:999px; margin-bottom:14px; }
/* 말풍선 — 마스코트가 말하는 느낌(좌측 꼬리) + 살짝 둥둥 */
.pdq-bubble { position:relative; background:#fff; border:1.5px solid #F1E7D8; border-radius:20px; padding:17px 26px; box-shadow:0 10px 26px rgba(15,31,92,.06); animation:pdqBob 4.2s ease-in-out infinite; }
.pdq-bubble::before { content:''; position:absolute; left:-10px; top:50%; transform:translateY(-50%) rotate(45deg); width:18px; height:18px; background:#fff; border-left:1.5px solid #F1E7D8; border-bottom:1.5px solid #F1E7D8; border-bottom-left-radius:5px; }
.pdq-title { font-size:23px; font-weight:800; color:#111111; line-height:1.35; letter-spacing:-0.03em; word-break:keep-all; }
.pdq-title .q { color:#E8780F; font-weight:800; }
/* 서브 — 양옆 작은 장식 틱 */
.pdq-sub { margin-top:14px; display:inline-flex; align-items:center; justify-content:center; gap:12px; font-size:13.5px; font-weight:500; color:#7A8089; line-height:1.5; word-break:keep-all; }
.pdq-sub::before, .pdq-sub::after { content:''; flex-shrink:0; width:2px; height:13px; background:#F0C79B; border-radius:1px; }
/* CTA — 부드러운 알약(pill) 버튼 */
.pdq-act { margin-top:20px; }
.pdq-cta { display:inline-flex; align-items:center; gap:9px; padding:14px 34px; background:#E8780F; color:#fff; font-size:15px; font-weight:800; border:none; border-radius:999px; letter-spacing:-0.02em; box-shadow:0 8px 20px rgba(232,120,15,.28); transition:background .2s ease, transform .2s ease, box-shadow .2s ease; text-decoration:none; cursor:pointer; }
.pdq-cta:hover { background:#D26A0A; transform:translateY(-2px); box-shadow:0 12px 26px rgba(232,120,15,.34); }
.pdq-cta-arrow { font-size:16px; transition:transform .2s ease; }
.pdq-cta:hover .pdq-cta-arrow { transform:translateX(4px); }
@media (prefers-reduced-motion: reduce) { .pdq-frame, .pdq-char::after, .pdq-bubble { animation:none !important; } }
/* 모바일 — 마스코트 상단 중앙 + 말풍선 꼬리 위로 */
@media (max-width:700px) {
  .pdq { padding:46px 14px 50px; }
  .pdq-band { flex-direction:column; gap:6px; padding:26px 20px 28px; border-radius:22px; }
  .pdq-char { width:118px; height:118px; }
  .pdq-char::after { width:118px; height:118px; }
  .pdq-frame { width:118px; height:118px; }
  .pdq-char-img { width:116px; height:116px; }
  .pdq-body { width:100%; margin-top:6px; }
  .pdq-title { font-size:19.5px; }
  .pdq-sub { font-size:12.5px; gap:9px; }
  .pdq-bubble::before { left:50%; top:-10px; transform:translateX(-50%) rotate(45deg); border-left:1.5px solid #F1E7D8; border-bottom:none; border-top:1.5px solid #F1E7D8; border-right:1.5px solid #F1E7D8; border-radius:0; border-top-right-radius:5px; }
  .pdq-cta { width:100%; justify-content:center; padding:14px 18px; }
  .pdq-act { width:100%; }
}
</style>
<div class="pdq-inner">
  <div class="pdq-band">
    <div class="pdq-char">
      <div class="pdq-frame">
        <img class="pdq-char-img" src="https://firebasestorage.googleapis.com/v0/b/pour-app-new.firebasestorage.app/o/%EB%A7%88%EC%8A%A4%EC%BD%94%ED%8A%B8%2Fbeaver_quickbanner_gown_circle_noborder.png?alt=media&token=1b20bea5-1fde-44aa-87bd-18a116b1eeee" alt="POUR닥터" loading="lazy"/>
      </div>
    </div>
    <div class="pdq-body">
      <div class="pdq-kicker">POUR닥터 · 1:1 무료 진단</div>
      <div class="pdq-bubble">
        <h2 class="pdq-title"><span class="q">“</span>무엇을, 얼마나 사야하는지 고민이실까요?<span class="q">”</span></h2>
      </div>
      <div class="pdq-sub">혼자 고민하지 마세요. 사진 한 장이면 POUR닥터가 답해드려요</div>
      <div class="pdq-act">
        <a class="pdq-cta" href="#none" onclick="if(window.pourDoctorOpen){pourDoctorOpen();return false;}">바로 문의하기 <span class="pdq-cta-arrow">→</span></a>
      </div>
    </div>
  </div>
</div>
</section>
