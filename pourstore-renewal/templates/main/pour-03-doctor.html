<section class="pdq">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/[email protected]/dist/web/variable/pretendardvariable.css');
.pdq *, .pdq *::before, .pdq *::after { box-sizing:border-box; margin:0; padding:0; font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
.pdq { background:#fff; padding:68px 24px; color:#2A2E33; letter-spacing:-0.02em; }
.pdq-inner { max-width:1060px; margin:0 auto; }
/* 가운데 크림 카드 */
.pdq-band { display:flex; align-items:center; gap:46px; background:#fff; border:1px solid #EEEEEE; border-radius:28px; padding:44px 54px; box-shadow:0 12px 34px rgba(15,31,92,.06); }
/* 마스코트 — 은은한 원형 배경 + 둥둥 부유 */
.pdq-char { position:relative; flex-shrink:0; width:230px; height:230px; display:grid; place-items:center; }
.pdq-char::before { content:''; position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle at 50% 45%, #FBEADA 0%, rgba(251,234,218,0) 68%); }
.pdq-char-img { position:relative; z-index:1; width:222px; height:222px; object-fit:contain; filter:drop-shadow(0 10px 18px rgba(120,80,40,.14)); animation:pdqFloat 3.8s ease-in-out infinite; }
@keyframes pdqFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-9px); } }
/* 본문 (왼쪽 정렬) */
.pdq-body { flex:1; min-width:0; }
/* 키커 — 점 + 텍스트 + 오른쪽으로 뻗는 얇은 라인 */
.pdq-kicker { display:flex; align-items:center; gap:11px; }
.pdq-kicker .dot { width:7px; height:7px; border-radius:50%; background:#E8780F; flex-shrink:0; }
.pdq-kicker .txt { font-size:14.5px; font-weight:800; color:#E8780F; letter-spacing:0.01em; white-space:nowrap; }
.pdq-kicker .line { flex:1; height:1px; background:#E7DED0; }
.pdq-title { margin-top:20px; font-size:clamp(24px,2.9vw,34px); font-weight:800; color:#2A2E33; line-height:1.32; letter-spacing:-0.035em; word-break:keep-all; }
.pdq-sub { margin-top:15px; font-size:15.5px; font-weight:500; color:#6B7280; line-height:1.6; word-break:keep-all; }
.pdq-act { margin-top:26px; }
.pdq-cta { display:inline-flex; align-items:center; gap:9px; padding:15px 34px; background:#E8780F; color:#fff; font-size:15px; font-weight:800; border:none; border-radius:999px; letter-spacing:-0.02em; box-shadow:0 8px 20px rgba(232,120,15,.26); text-decoration:none; cursor:pointer; transition:background .2s ease, transform .2s ease, box-shadow .2s ease; }
.pdq-cta:hover { background:#D26A0A; transform:translateY(-2px); box-shadow:0 12px 26px rgba(232,120,15,.32); }
.pdq-cta-arrow { font-size:16px; transition:transform .2s ease; }
.pdq-cta:hover .pdq-cta-arrow { transform:translateX(4px); }
@media (prefers-reduced-motion: reduce) { .pdq-char-img { animation:none !important; } }
/* 모바일 — 마스코트 위, 본문 아래 (가운데 정렬) */
@media (max-width:760px) {
  .pdq { padding:44px 16px 48px; }
  .pdq-band { flex-direction:column; gap:10px; padding:30px 22px 34px; border-radius:24px; }
  .pdq-char { width:168px; height:168px; }
  .pdq-char-img { width:162px; height:162px; }
  .pdq-body { text-align:center; width:100%; }
  .pdq-kicker { justify-content:center; }
  .pdq-kicker .line { display:none; }
  .pdq-title { font-size:21px; margin-top:12px; }
  .pdq-sub { font-size:13.5px; }
  .pdq-act { width:100%; }
  .pdq-cta { width:100%; justify-content:center; padding:14px 18px; }
}
</style>
<div class="pdq-inner">
  <div class="pdq-band">
    <div class="pdq-char">
      <img class="pdq-char-img" src="https://firebasestorage.googleapis.com/v0/b/pour-app-new.firebasestorage.app/o/%EB%A7%88%EC%8A%A4%EC%BD%94%ED%8A%B8%2Fbeaver_quickbanner_gown_circle_noborder.png?alt=media&token=1b20bea5-1fde-44aa-87bd-18a116b1eeee" alt="POUR닥터" loading="lazy"/>
    </div>
    <div class="pdq-body">
      <div class="pdq-kicker"><span class="dot"></span><span class="txt">POUR닥터 · 1:1 무료 진단</span><span class="line"></span></div>
      <h2 class="pdq-title">무엇을, 얼마나 사야 하는지 고민이실까요?</h2>
      <p class="pdq-sub">혼자 고민하지 마세요. 사진 한 장이면 POUR닥터가 답해드려요</p>
      <div class="pdq-act">
        <a class="pdq-cta" href="#none" onclick="if(window.pourDoctorOpen){pourDoctorOpen();return false;}">바로 문의하기 <span class="pdq-cta-arrow">→</span></a>
      </div>
    </div>
  </div>
</div>
</section>
