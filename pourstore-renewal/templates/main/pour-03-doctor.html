<section class="pdq">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/[email protected]/dist/web/variable/pretendardvariable.css');
.pdq *, .pdq *::before, .pdq *::after { box-sizing:border-box; margin:0; padding:0; font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
/* 섹션: 다른 메인 섹션과 동일 리듬(흰 배경) — 조용히 흐름에 녹아드는 CTA 밴드 */
.pdq { background:#fff; padding:66px 18px; color:#2F3438; letter-spacing:-0.02em; }
.pdq-inner { max-width:820px; margin:0 auto; }
/* 밴드: 은은한 웜 오프화이트 + 얇은 테두리(라운드 0, 형제 섹션과 통일) */
.pdq-band { display:flex; align-items:center; gap:26px; background:#FCFBF9; border:1px solid #EFEAE3; padding:26px 32px; }
/* 마스코트 — 좌측, 차분하게(은은한 정적 후광 + 느린 소폭 부유) */
.pdq-char { position:relative; flex-shrink:0; width:120px; display:grid; place-items:center; }
.pdq-char::after { content:''; position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); width:118px; height:118px; border-radius:50%; background:radial-gradient(circle, rgba(244,154,58,.14) 0%, transparent 64%); z-index:0; }
.pdq-char-img { position:relative; z-index:1; display:block; width:120px; height:auto; filter:drop-shadow(0 8px 14px rgba(15,31,92,.14)); animation:pdqFloat 6s ease-in-out infinite; }
@keyframes pdqFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
/* 본문 */
.pdq-body { flex:1; min-width:0; }
.pdq-kicker { display:inline-block; font-size:11.5px; font-weight:800; color:#E8780F; letter-spacing:0.04em; margin-bottom:9px; }
.pdq-title { font-size:24px; font-weight:800; color:#111111; line-height:1.34; letter-spacing:-0.03em; word-break:keep-all; }
.pdq-title b { color:#E8780F; font-weight:800; }
.pdq-sub { margin-top:9px; font-size:13.5px; font-weight:500; color:#6B7280; line-height:1.55; word-break:keep-all; }
/* CTA — 형제 섹션과 동일한 플랫 오렌지 버튼(라운드 0) */
.pdq-act { margin-top:18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.pdq-cta { display:inline-flex; align-items:center; gap:8px; padding:13px 24px; background:#E8780F; color:#fff; font-size:14.5px; font-weight:800; border:none; border-radius:0; letter-spacing:-0.02em; transition:background .2s ease; text-decoration:none; cursor:pointer; }
.pdq-cta:hover { background:#D26A0A; }
.pdq-cta-arrow { font-size:15px; transition:transform .2s ease; }
.pdq-cta:hover .pdq-cta-arrow { transform:translateX(4px); }
.pdq-trust { font-size:12.5px; font-weight:600; color:#9CA3AF; letter-spacing:-0.01em; }
@media (prefers-reduced-motion: reduce) { .pdq-char-img { animation:none !important; } }
/* 모바일 — 마스코트 상단 중앙 + 세로 스택 */
@media (max-width:700px) {
  .pdq { padding:48px 14px 52px; }
  .pdq-band { flex-direction:column; text-align:center; gap:14px; padding:26px 20px; }
  .pdq-char { width:100px; }
  .pdq-char::after { width:100px; height:100px; }
  .pdq-char-img { width:100px; }
  .pdq-body { width:100%; }
  .pdq-title { font-size:21px; }
  .pdq-act { flex-direction:column; align-items:center; gap:10px; margin-top:16px; }
  .pdq-cta { width:100%; justify-content:center; padding:14px 18px; }
}
</style>
<div class="pdq-inner">
  <div class="pdq-band">
    <div class="pdq-char">
      <img class="pdq-char-img" src="https://firebasestorage.googleapis.com/v0/b/pour-app-new.firebasestorage.app/o/%EB%A7%88%EC%8A%A4%EC%BD%94%ED%8A%B8%2Fbeaver_quickbanner_gown_circle_noborder.png?alt=media&token=1b20bea5-1fde-44aa-87bd-18a116b1eeee" alt="POUR닥터" loading="lazy"/>
    </div>
    <div class="pdq-body">
      <div class="pdq-kicker">POUR닥터 · 1:1 무료 진단</div>
      <h2 class="pdq-title">혹시, <b>무엇을 · 얼마나</b> 사야 할지 고민이실까요?</h2>
      <p class="pdq-sub">사진 한 장이면 R&D 박사가 딱 맞는 자재를 골라드려요.</p>
      <div class="pdq-act">
        <a class="pdq-cta" href="#none" onclick="if(window.pourDoctorOpen){pourDoctorOpen();return false;}">바로 문의하기 <span class="pdq-cta-arrow">→</span></a>
        <span class="pdq-trust">무료 상담 · 박사 직접 답변 · 평균 3분</span>
      </div>
    </div>
  </div>
</div>
</section>
