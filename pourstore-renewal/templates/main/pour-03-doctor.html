<section class="pdq">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/[email protected]/dist/web/variable/pretendardvariable.css');
.pdq *, .pdq *::before, .pdq *::after { box-sizing:border-box; margin:0; padding:0; font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
/* 섹션: 다른 메인 섹션과 동일 리듬(흰 배경) — 조용히 흐름에 녹아드는 CTA 밴드 */
.pdq { background:#fff; padding:64px 18px; color:#2F3438; letter-spacing:-0.02em; }
.pdq-inner { max-width:860px; margin:0 auto; }
/* 밴드: 은은한 웜 오프화이트(라운드 0, 형제 섹션과 통일) */
.pdq-band { display:flex; align-items:center; gap:34px; background:#FAF9F6; border:1px solid #F0ECE4; padding:30px 40px; }
/* 마스코트 — 좌측, 원형 프레임 */
.pdq-char { flex-shrink:0; width:152px; height:152px; border-radius:50%; background:#F4F2ED; display:grid; place-items:center; overflow:hidden; }
.pdq-char-img { display:block; width:150px; height:150px; object-fit:contain; filter:drop-shadow(0 6px 12px rgba(15,31,92,.12)); animation:pdqFloat 6s ease-in-out infinite; }
@keyframes pdqFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
/* 본문 — 가운데 정렬 */
.pdq-body { flex:1; min-width:0; text-align:center; }
.pdq-kicker { display:inline-block; font-size:11.5px; font-weight:800; color:#E8780F; letter-spacing:0.04em; padding:5px 13px; background:#FFF3E6; border-radius:999px; margin-bottom:14px; }
.pdq-title { font-size:25px; font-weight:800; color:#111111; line-height:1.34; letter-spacing:-0.03em; word-break:keep-all; }
.pdq-title .q { color:#E8780F; font-weight:800; }
/* 서브 — 양옆 작은 장식 틱 */
.pdq-sub { margin-top:13px; display:inline-flex; align-items:center; justify-content:center; gap:12px; font-size:13.5px; font-weight:500; color:#6B7280; line-height:1.5; word-break:keep-all; }
.pdq-sub::before, .pdq-sub::after { content:''; flex-shrink:0; width:2px; height:13px; background:#F0C79B; border-radius:1px; }
/* CTA — 형제 섹션과 동일한 플랫 오렌지 버튼(라운드 0) */
.pdq-act { margin-top:22px; }
.pdq-cta { display:inline-flex; align-items:center; gap:9px; padding:14px 34px; background:#E8780F; color:#fff; font-size:15px; font-weight:800; border:none; border-radius:0; letter-spacing:-0.02em; transition:background .2s ease; text-decoration:none; cursor:pointer; }
.pdq-cta:hover { background:#D26A0A; }
.pdq-cta-arrow { font-size:16px; transition:transform .2s ease; }
.pdq-cta:hover .pdq-cta-arrow { transform:translateX(4px); }
@media (prefers-reduced-motion: reduce) { .pdq-char-img { animation:none !important; } }
/* 모바일 — 마스코트 상단 중앙 + 세로 스택 */
@media (max-width:700px) {
  .pdq { padding:46px 14px 50px; }
  .pdq-band { flex-direction:column; gap:16px; padding:28px 20px; }
  .pdq-char { width:118px; height:118px; }
  .pdq-char-img { width:116px; height:116px; }
  .pdq-title { font-size:20px; }
  .pdq-sub { font-size:12.5px; gap:9px; }
  .pdq-cta { width:100%; justify-content:center; padding:14px 18px; }
  .pdq-act { width:100%; }
}
</style>
<div class="pdq-inner">
  <div class="pdq-band">
    <div class="pdq-char">
      <img class="pdq-char-img" src="https://firebasestorage.googleapis.com/v0/b/pour-app-new.firebasestorage.app/o/%EB%A7%88%EC%8A%A4%EC%BD%94%ED%8A%B8%2Fbeaver_quickbanner_gown_circle_noborder.png?alt=media&token=1b20bea5-1fde-44aa-87bd-18a116b1eeee" alt="POUR닥터" loading="lazy"/>
    </div>
    <div class="pdq-body">
      <div class="pdq-kicker">POUR닥터 · 1:1 무료 진단</div>
      <h2 class="pdq-title"><span class="q">“</span>무엇을, 얼마나 사야하는지 고민이실까요?<span class="q">”</span></h2>
      <div class="pdq-sub">혼자 고민하지 마세요. 사진 한 장이면 POUR닥터가 답해드려요</div>
      <div class="pdq-act">
        <a class="pdq-cta" href="#none" onclick="if(window.pourDoctorOpen){pourDoctorOpen();return false;}">바로 문의하기 <span class="pdq-cta-arrow">→</span></a>
      </div>
    </div>
  </div>
</div>
</section>
