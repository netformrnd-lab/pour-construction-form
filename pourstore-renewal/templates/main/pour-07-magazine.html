<!-- ============================================================
  pour-07-magazine — 메인 '자사몰 매거진(POUR이야기)' 섹션
  데이터: Firestore pourstore-postings (어드민 'POUR이야기 관리') → 등록/수정 시 자동 반영.
  구성: 정렬 상위 4건을 '같은 크기 카드 한 줄'로 노출(대표 카드 없음). 글 없으면 섹션 자동 숨김.
  정렬: magazineOrder(섹션 전용) 우선 → 없으면 전역 order → 최신 등록.
  썸네일: 유튜브 글은 유튜브 JPG 우선(업로드 AVIF 인앱브라우저 미표시 회피).
  클릭: 외부링크 있으면 그 링크(새 탭), 없으면 POUR이야기 허브로 이동.
  반응형: PC 4열 · 태블릿 2열 · 모바일 가로 스크롤(스와이프). 이모지 미사용(인라인 SVG).
  ============================================================ -->
<style>
.psg3 *, .psg3 *::before, .psg3 *::after { box-sizing:border-box; margin:0; padding:0; font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
.psg3 { background:#FFFBF5; padding:72px 18px; letter-spacing:-0.02em; }
.psg3[hidden] { display:none; }
.psg3-inner { max-width:1200px; margin:0 auto; }
.psg3-head { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:14px; }
.psg3-head .left { flex:1; min-width:240px; }
.psg3-head .kicker { font-size:12px; font-weight:800; color:#E8780F; letter-spacing:0.06em; margin-bottom:8px; }
.psg3-head h2 { font-size:30px; font-weight:900; color:#111111; letter-spacing:-0.035em; line-height:1.25; }
.psg3-head p { font-size:13.5px; font-weight:500; color:#6B7280; margin-top:6px; }
.psg3-head .more { display:inline-flex; align-items:center; gap:6px; padding:10px 18px; background:#fff; border:1.5px solid #E5E7EB; border-radius:0; color:#111111; font-size:13px; font-weight:800; text-decoration:none; transition:all .2s; letter-spacing:-0.02em; }
.psg3-head .more:hover { border-color:#111111; background:#0F1F5C; color:#fff; }

/* 균등 카드 4열 그리드 */
.psg3-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; align-items:stretch; }
.psg3-card { background:#fff; border-radius:12px; overflow:hidden; cursor:pointer; transition:transform .28s, box-shadow .28s, border-color .28s; text-decoration:none; color:inherit; display:flex; flex-direction:column; border:1px solid #F0EBE3; }
.psg3-card:hover { transform:translateY(-5px); box-shadow:0 18px 40px rgba(15,31,92,.12); border-color:transparent; }
.psg3-card .img { aspect-ratio:16/10; background:linear-gradient(135deg,#FED7AA,#FB923C) center/cover no-repeat; position:relative; flex-shrink:0; }
.psg3-card .img::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent 55%, rgba(0,0,0,.16) 100%); }
.psg3-card .tag { position:absolute; top:12px; left:12px; z-index:2; padding:5px 11px; background:rgba(15,31,92,.95); color:#fff; font-size:10.5px; font-weight:800; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); letter-spacing:0.04em; }
.psg3-card .play { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:2; width:46px; height:46px; border-radius:50%; background:rgba(15,23,42,.5); display:grid; place-items:center; -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); transition:transform .25s, background .25s; }
.psg3-card:hover .play { transform:translate(-50%,-50%) scale(1.08); background:#F97316; }
.psg3-card .play svg { width:19px; height:19px; color:#fff; margin-left:2px; }
.psg3-card .body { padding:16px 18px 18px; flex:1; display:flex; flex-direction:column; }
.psg3-card .title { font-size:15px; font-weight:800; color:#111111; line-height:1.45; letter-spacing:-0.03em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.psg3-card .desc { margin-top:8px; font-size:12.5px; font-weight:500; color:#6B7280; line-height:1.6; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; letter-spacing:-0.02em; }
.psg3-card .meta-bot { display:flex; gap:8px; align-items:center; margin-top:auto; padding-top:13px; font-size:11.5px; color:#9CA3AF; font-weight:700; letter-spacing:-0.02em; }
.psg3-card .meta-bot .kind { color:#E8780F; }
.psg3-loading { grid-column:1/-1; text-align:center; padding:50px 0; color:#9AA0A6; font-size:14px; font-weight:500; }
.psg3-swipe { display:none; }
@keyframes psg3SwipeAr { 0%,100% { transform:translateX(0); } 50% { transform:translateX(4px); } }

@media (max-width:1080px) {
  .psg3-grid { grid-template-columns:repeat(2,1fr); gap:16px; }
}
@media (max-width:700px) {
  .psg3 { padding:48px 0 52px; }
  .psg3-inner { max-width:none; }
  .psg3-head { padding:0 18px; margin-bottom:16px; }
  .psg3-head h2 { font-size:24px; }
  .psg3-head p { font-size:12.5px; }
  .psg3-head .more { font-size:12px; padding:9px 14px; }
  /* 모바일: 같은 크기 카드 가로 스크롤(스와이프) */
  .psg3-grid { display:flex; grid-template-columns:none; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; -ms-overflow-style:none; gap:12px; padding:0 18px 6px; }
  .psg3-grid::-webkit-scrollbar { display:none; }
  .psg3-card { flex:0 0 76%; max-width:300px; scroll-snap-align:center; }
  .psg3-card .img { aspect-ratio:16/9; }
  .psg3-swipe { display:flex; align-items:center; justify-content:center; gap:6px; margin:8px 18px 0; font-size:12px; font-weight:700; color:#E8780F; letter-spacing:-0.02em; }
  .psg3-swipe .ar { display:inline-block; animation:psg3SwipeAr 1.3s ease-in-out infinite; }
}
</style>
<section class="psg3" data-psg3 hidden>
  <div class="psg3-inner">
    <div class="psg3-head">
      <div class="left">
        <div class="kicker">MAGAZINE</div>
        <h2>POUR이야기</h2>
        <p>시공 노하우·하자 해결 사례·트렌드 인사이트</p>
      </div>
      <a class="more" href="/pourstore_renewal/story/pour-story.html">전체 보기 →</a>
    </div>
    <div class="psg3-grid" data-psg3-grid><div class="psg3-loading">불러오는 중…</div></div>
    <div class="psg3-swipe" data-psg3-swipe hidden>옆으로 밀어 더 보기 <span class="ar">→</span></div>
  </div>
</section>
<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBbct9tO8nCUCjz4s9GnXQLkHuHe2FFyyU",
  authDomain: "pour-app-new.firebaseapp.com", projectId: "pour-app-new",
  storageBucket: "pour-app-new.firebasestorage.app", messagingSenderId: "411031141847",
  appId: "1:411031141847:web:e658174fd4b9652cdadf92"
};
const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const db = getFirestore(app);
/* 공유 로딩 캐시(성능) — 메인의 다른 섹션이 이미 받은 pourstore-postings 재사용(중복 fetch 제거). define-if-absent. */
window.__pcache = window.__pcache || (function(){ var mem={}; var _bust=/nocache|__fresh|preview/i.test((location.search||'')+(location.hash||'')); return { bust:_bust, wrap:function(key,ttl,fetcher){ if(mem[key])return mem[key]; if(!_bust){try{var raw=sessionStorage.getItem('pc:'+key); if(raw){var o=JSON.parse(raw); if(o&&(Date.now()-o.t)<ttl){return (mem[key]=Promise.resolve(o.v));}}}catch(e){}} var p=Promise.resolve().then(fetcher).then(function(v){try{sessionStorage.setItem('pc:'+key,JSON.stringify({t:Date.now(),v:v}));}catch(e){} return v;}); p.catch(function(){delete mem[key];}); return (mem[key]=p); }}; })();
var PC_TTL = 60000;

(async function(){
  var sec = document.querySelector('[data-psg3]');
  if (!sec) return;
  var grid = sec.querySelector('[data-psg3-grid]');
  var swipe = sec.querySelector('[data-psg3-swipe]');
  var HUB = '/pourstore_renewal/story/pour-story.html';
  var TYPE = { news:'뉴스', guide:'시공가이드', case:'시공사례', interview:'인터뷰', video:'영상', short:'숏츠', blog:'컨텐츠', event:'이벤트' };

  function esc(s){ return (s||'').toString().replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function ytId(u){ var m=(u||'').match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/)([\w-]{11})/); return m?m[1]:null; }
  function isYt(u){ return /youtu\.?be/.test(u||''); }
  // 유튜브 글은 유튜브 JPG 우선(업로드 썸네일이 AVIF면 카톡·네이버 인앱브라우저·구형기기에서 안 보임). 없을 때만 저장 썸네일.
  function thumbOf(p){ var id=ytId(p.link); if(id) return 'https://img.youtube.com/vi/'+id+'/hqdefault.jpg'; var t=p.thumbnail||p.thumb||p.image; return (t&&String(t).trim())?t:''; }
  function typeLabel(t){ return TYPE[t] || '이야기'; }
  function hrefOf(p){ return (p.link && /^https?:\/\//.test(p.link)) ? { h:p.link, t:' target="_blank" rel="noopener"' } : { h:HUB, t:'' }; }
  function bgStyle(p){ var t=thumbOf(p); return t ? ' style="background-image:url(\''+esc(t)+'\')"' : ''; }
  function playHtml(p){ return isYt(p.link) ? '<div class="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>' : ''; }

  // 매거진 섹션 전용 노출 순서(magazineOrder) 우선 — 어드민 'POUR이야기 관리 > 매거진 순서'에서 지정.
  // 미지정 글은 전역 order 뒤로(+1000) 밀려 큐레이션한 글이 항상 위. 둘 다 없으면 최신 등록 우선.
  function magOrd(p){ return p.magazineOrder!=null ? p.magazineOrder : (p.order!=null ? p.order+1000 : 9999); }
  var posts = [];
  try {
    var rawPosts = await window.__pcache.wrap('col:postings', PC_TTL, function(){ return getDocs(collection(db,"pourstore-postings")).then(function(sn){ return sn.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); }); });
    posts = rawPosts.filter(function(p){ return p && p.active !== false; })
      .sort(function(a,b){ var o=magOrd(a)-magOrd(b); return o!==0?o:String(b.createdAt||'').localeCompare(String(a.createdAt||'')); });
    console.log("[psg3] 매거진 글 " + posts.length + "건 로드");
  } catch (e) {
    console.error("[psg3] 로드 실패:", e && e.message ? e.message : e);
    sec.hidden = true; return;
  }
  if (!posts.length){ sec.hidden = true; return; }
  sec.hidden = false;

  var items = posts.slice(0, 4);   // 같은 크기 카드 4개 한 줄
  grid.innerHTML = items.map(function(p){
    var l = hrefOf(p);
    return '<a class="psg3-card" href="'+l.h+'"'+l.t+'>'
      + '<div class="img"'+bgStyle(p)+'><span class="tag">'+esc(typeLabel(p.type))+'</span>'+playHtml(p)+'</div>'
      + '<div class="body"><div class="title">'+esc(p.title||'')+'</div>'
      +   (p.summary ? '<div class="desc">'+esc(p.summary)+'</div>' : '')
      +   '<div class="meta-bot"><span class="kind">'+esc(typeLabel(p.type))+'</span><span>POUR스토어</span></div></div></a>';
  }).join('');
  if (swipe) swipe.hidden = items.length < 2;
})();
</script>
