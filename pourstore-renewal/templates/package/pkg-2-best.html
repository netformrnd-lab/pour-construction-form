<!-- 성능 힌트: 폰트·Firebase SDK 조기 로딩 (FOUC 감소 + 첫 응답 단축) -->

<section data-section="베스트 패키지">
<style>
  .ppr2 * { box-sizing:border-box; margin:0; padding:0; font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo',sans-serif; }
  .ppr2 { background:#fff; padding:72px 18px; }
  .ppr2-inner { max-width:1200px; margin:0 auto; }
  .ppr2-head { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:14px; }
  .ppr2-head .left { flex:1; min-width:240px; }
  .ppr2-head .kicker { font-size:11.5px; font-weight:800; color:#EA580C; letter-spacing:1.5px; margin-bottom:8px; }
  .ppr2-head h2 { font-size:30px; font-weight:900; color:#111111; letter-spacing:-1px; line-height:1.2; margin-bottom:6px; }
  .ppr2-head p { font-size:13.5px; color:#6B7280; }
  .ppr2-head .more { font-size:13px; font-weight:700; color:#EA580C; text-decoration:none; padding:8px 14px; border:1px solid #FED7AA; border-radius:999px; transition:all .25s; }
  .ppr2-head .more:hover { background:#FFF7ED; }
  .ppr2-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:30px 16px; align-items:start; }
  /* 참고 이미지(커머스 그리드) 스타일: 한 줄 최대 4개, 원본 이미지 그대로(잘림 없음) → 해시태그 → 이름 → 설명 → 가격. 뱃지 없음. */
  .ppr2-card { background:#fff; overflow:visible; transition:all .3s; text-decoration:none; display:flex; flex-direction:column; }
  .ppr2-card:hover .ppr2-thumb { transform:translateY(-4px); box-shadow:0 18px 38px rgba(0,0,0,.12); }
  /* ★ 비율 고정 없음 — 원본 이미지의 세로/가로 비율 그대로 표시(잘리지 않음) */
  .ppr2-thumb { position:relative; border-radius:6px; overflow:hidden; background-color:#F5F5F5; transition:transform .3s, box-shadow .3s; line-height:0; }
  .ppr2-thumb img { display:block; width:100%; height:auto; }
  .ppr2-thumb.noimg { aspect-ratio:4/5; }
  .ppr2-info { padding:14px 2px 2px; flex:1; display:flex; flex-direction:column; }
  .ppr2-info .tags { font-size:12px; font-weight:700; color:#EA580C; letter-spacing:-.2px; margin-bottom:6px; line-height:1.45; }
  .ppr2-info .name { font-size:15px; font-weight:700; color:#111111; margin-bottom:5px; line-height:1.4; letter-spacing:-.3px; }
  .ppr2-info .desc { font-size:13px; color:#6B7280; line-height:1.55; margin-bottom:10px; }
  .ppr2-info .price { display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; margin-top:auto; }
  .ppr2-info .now { font-size:17px; font-weight:700; color:#111111; letter-spacing:-.3px; }
  .ppr2-info .unit { font-size:12px; font-weight:500; color:#9CA3AF; }
  @media (max-width:640px) { .ppr2 { padding:52px 14px; } .ppr2-head h2 { font-size:22px; } .ppr2-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px 10px; } .ppr2-info { padding:11px 2px 2px; } .ppr2-info .name { font-size:14px; } .ppr2-info .now { font-size:16px; } }
  </style>
  <section class="ppr2">
    <div class="ppr2-inner">
      <div class="ppr2-head">
        <div class="left">
          <div class="kicker"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="#F59E0B" style="vertical-align:-0.14em"><path d="M12 3l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 18l-5.8 3 1.1-6.5L2.6 9.8l6.5-.9z"/></svg> BEST PACKAGES</div>
          <h2>인기 BEST 방수·보강 패키지</h2>
          <p>현장에서 자주 찾는 R&D 시너지 조합 패키지</p>
        </div>
        <a class="more" href="/product/list.html?cate_no=71">전체 패키지 →</a>
      </div>
      <div class="ppr2-grid" data-ppr2-grid>
        <div style="grid-column:1/-1;text-align:center;color:#9CA3AF;font-size:13px;font-weight:700;padding:30px 0">베스트로 지정된 상품이 없습니다</div>
      </div>

<script type="module">
// 이 달의 베스트 — 어드민 '패키지 구성 관리'에서 '베스트' 지정한 상품 (pourstore-packages, best:true)
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey:"AIzaSyBbct9tO8nCUCjz4s9GnXQLkHuHe2FFyyU", authDomain:"pour-app-new.firebaseapp.com", projectId:"pour-app-new", storageBucket:"pour-app-new.firebasestorage.app", messagingSenderId:"411031141847", appId:"1:411031141847:web:e658174fd4b9652cdadf92" };
const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const db = getFirestore(app);
/* 공유 로딩 캐시(성능) — 중복 fetch 제거 + 페이지 이동 시 재사용. define-if-absent. */
window.__pcache = window.__pcache || (function(){ var mem={}; return { wrap:function(key,ttl,fetcher){ if(mem[key])return mem[key]; try{var raw=sessionStorage.getItem('pc:'+key); if(raw){var o=JSON.parse(raw); if(o&&(Date.now()-o.t)<ttl){return (mem[key]=Promise.resolve(o.v));}}}catch(e){} var p=Promise.resolve().then(fetcher).then(function(v){try{sessionStorage.setItem('pc:'+key,JSON.stringify({t:Date.now(),v:v}));}catch(e){} return v;}); p.catch(function(){delete mem[key];}); return (mem[key]=p); }}; })();
var PC_TTL = 300000;
const esc=(s)=>(s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GRAD=['135deg,#F97316,#EA580C','135deg,#EA580C,#9A3412','135deg,#0F1F5C,#1E3A8A','135deg,#059669,#065F46'];
// 부위(area)별 기본 해시태그·설명 — 상품에 tags/desc가 없을 때 자동 사용(있으면 상품값 우선)
const AREA_TAGS={ slab:'#물고임 · 조인트 · 에어포켓 대응', roof:'#지붕 탈락 방지 · 방수층 일체화', wall:'#거동 대응력 · 재균열 방지', drain:'#배수 · 베란다 · 이음부 누수' };
const AREA_DESC={ slab:'우레탄보다 쉽고 간편하게 셀프로도 튼튼한 옥상 방수!', roof:'교체·철거 없이 새 지붕처럼 방수 기능과 미관까지 UP!', wall:'터지고 갈라진 균열·크랙 모든 부위를 셀프로 쉽고 간편하게 보강!', drain:'배수구·이음부 취약 부위를 한 번에 방수 보강!' };
function fmtPrice(pr, unitOverride){
  pr=(pr||'').toString().trim(); if(!pr) return '';
  var num=pr, unit=unitOverride||'';
  var m=pr.match(/^(.*?)\s*\/\s*(㎡|m2|m²|평|m)\s*$/i);
  if(m){ num=m[1].trim(); var u=m[2].toLowerCase(); if(!unit) unit = (u==='m')?'(평균 m당)':((u==='평')?'(평균 평당)':'(평균 ㎡당)'); }
  return '<span class="now">'+esc(num)+'</span>'+(unit?'<span class="unit">'+esc(unit)+'</span>':'');
}
function card(p,i){
  const thumb = p.thumbnail
    ? ('<div class="ppr2-thumb"><img src="'+esc(p.thumbnail)+'" alt="" loading="lazy"></div>')
    : ('<div class="ppr2-thumb noimg" style="background:linear-gradient('+GRAD[i%GRAD.length]+')"></div>');
  let nm=esc(p.name||''); if(nm && !/패키지|세트/.test(nm)) nm=nm+' 패키지';
  let tags;
  if(p.tags){ tags = Array.isArray(p.tags) ? p.tags.map(t=>{ t=esc(t); return t.charAt(0)==='#'?t:('#'+t); }).join(' · ') : esc(p.tags); }
  else { tags = AREA_TAGS[p.area]||'#POUR R&D 시너지 패키지'; }
  const desc = p.desc ? esc(p.desc) : (AREA_DESC[p.area]||'현장에서 자주 찾는 R&D 조합으로 오래가는 유지보수를 한 번에.');
  return '<a class="ppr2-card" href="/product/detail.html?product_no='+esc(p.productNo)+'&cate_no=71">'
    +thumb
    +'<div class="ppr2-info">'
    +'<div class="tags">'+tags+'</div>'
    +'<div class="name">'+nm+'</div>'
    +'<div class="desc">'+desc+'</div>'
    +'<div class="price">'+fmtPrice(p.price, p.priceUnit)+'</div>'
    +'</div></a>';
}
(async function(){
  const grid=document.querySelector('[data-ppr2-grid]'); if(!grid) return;
  let pkgs=[];
  try{ pkgs=await window.__pcache.wrap('col:packages',PC_TTL,()=>getDocs(collection(db,"pourstore-packages")).then(sn=>sn.docs.map(d=>({id:d.id,...d.data()})))); console.log('[ppr2] 패키지 '+pkgs.length+'건 로드'); }
  catch(e){ console.log('[ppr2] 로드 실패:', e && e.message); return; }
  const best=pkgs.filter(p=>p.active!==false && p.best).sort((a,b)=>((a.order??999)-(b.order??999))).slice(0,8);
  console.log('[ppr2] 베스트 '+best.length+'건');
  if(!best.length) return;
  grid.innerHTML=best.map(card).join('');
})();
</script>
      </div>
    </div>
  </section>
</section>
