<script>
(function () {
  /*
   * 캐릭터 이미지를 Firebase Storage에 업로드한 후
   * 아래 폴더명과 파일명만 실제 값으로 수정하세요.
   *
   * 배경이 투명한 PNG 또는 WebP 사용을 권장합니다.
   */

  var IMAGE_FOLDER = 'POUR스토어_리뉴얼/package';
  var IMAGE_FILE = 'pour-doctor.png';

  var STORAGE_BUCKET = 'pour-app-new.firebasestorage.app';

  var fullPath = IMAGE_FOLDER + '/' + IMAGE_FILE;
  var encodedPath = encodeURIComponent(fullPath);

  var imageUrl =
    'https://firebasestorage.googleapis.com/v0/b/' +
    STORAGE_BUCKET +
    '/o/' +
    encodedPath +
    '?alt=media';

  var doctorImage = document.querySelector(
    '.pour-doctor-section [data-pour-doctor-image]'
  );

  if (!doctorImage) return;

  doctorImage.src = imageUrl;

  doctorImage.addEventListener('error', function () {
    console.warn(
      'POUR 닥터 이미지를 불러오지 못했습니다. Firebase 경로와 파일명을 확인하세요:',
      fullPath
    );

    this.style.display = 'none';
  });
})();
</script>
