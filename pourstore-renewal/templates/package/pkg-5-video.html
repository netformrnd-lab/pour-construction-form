<link rel="preconnect" href="https://fonts.googleapis.com">

<section data-section="전화 상담 (POUR 닥터)">
<style>
  .ppr5 * { box-sizing:border-box; margin:0; padding:0; font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo',sans-serif; }
  .ppr5 { background:#fff; padding:72px 18px; }
  .ppr5-inner { position:relative; max-width:1200px; margin:0 auto; background:linear-gradient(180deg,#FFF6EE 0%,#FDEFE3 100%); border-radius:32px; padding:56px 56px 30px; }
  .ppr5-hero { display:flex; align-items:flex-end; gap:30px; }
  .ppr5-copy { flex:1; min-width:0; padding-bottom:14px; }
  .ppr5-eyebrow { display:inline-flex; align-items:center; gap:8px; font-size:16px; font-weight:700; color:#EA580C; margin-bottom:20px; }
  .ppr5-eyebrow .ic { width:34px; height:34px; border-radius:50%; background:#fff; display:grid; place-items:center; color:#EA580C; box-shadow:0 3px 10px rgba(234,88,12,.18); }
  .ppr5-copy h2 { font-size:48px; font-weight:900; color:#0F1F5C; letter-spacing:-1.8px; line-height:1.15; margin-bottom:16px; white-space:nowrap; }
  .ppr5-sub { font-size:23px; font-weight:700; color:#0F1F5C; letter-spacing:-.6px; line-height:1.4; margin-bottom:26px; white-space:nowrap; }
  .ppr5-sub b { font-weight:900; }
  .ppr5-sub .or { color:#EA580C; }
  .ppr5-divider { width:56px; height:2px; background:#F2C9A8; margin-bottom:22px; }
  .ppr5-desc { font-size:16px; color:#6B7280; line-height:1.6; margin-bottom:32px; }
  .ppr5-btns { display:flex; gap:14px; flex-wrap:wrap; }
  .ppr5-btn { display:inline-flex; align-items:center; gap:10px; padding:17px 34px; border-radius:999px; font-size:18px; font-weight:800; text-decoration:none; transition:all .2s; white-space:nowrap; }
  .ppr5-btn.primary { background:linear-gradient(135deg,#F97316,#EA580C); color:#fff; box-shadow:0 10px 24px rgba(234,88,12,.32); }
  .ppr5-btn.primary:hover { transform:translateY(-2px); box-shadow:0 14px 30px rgba(234,88,12,.4); }
  .ppr5-btn.ghost { background:#fff; color:#EA580C; border:2px solid #F6C6A2; }
  .ppr5-btn.ghost:hover { border-color:#EA580C; background:#FFF7F0; }
  .ppr5-visual { flex-shrink:0; width:46%; max-width:500px; display:flex; justify-content:center; align-self:flex-end; margin-bottom:-58px; position:relative; z-index:2; }
  .ppr5-visual img { width:100%; height:auto; display:block; }
  /* 하단 정보 바 */
  .ppr5-bar { position:relative; z-index:1; display:flex; align-items:center; gap:20px; margin-top:34px; padding:22px 30px; background:#FBEADB; border-radius:20px; flex-wrap:wrap; }
  .ppr5-bar-item { display:flex; align-items:center; gap:14px; flex:1; min-width:230px; }
  .ppr5-bar-item .cic { width:52px; height:52px; border-radius:50%; background:#fff; display:grid; place-items:center; color:#EA580C; flex-shrink:0; box-shadow:0 3px 10px rgba(234,88,12,.15); }
  .ppr5-bar-item .t1 { font-size:15px; font-weight:800; color:#0F1F5C; margin-bottom:3px; }
  .ppr5-bar-item .t2 { font-size:13px; color:#6B7280; font-weight:500; }
  .ppr5-bar-item.center { flex-direction:column; align-items:center; text-align:center; gap:2px; border-left:1px solid #F1D6BF; border-right:1px solid #F1D6BF; }
  .ppr5-bar-item.center .t1 { font-size:13px; font-weight:700; color:#9A6A45; margin-bottom:2px; }
  .ppr5-bar-item.center .tel { font-size:28px; font-weight:900; color:#EA580C; letter-spacing:-.5px; }
  @media (max-width:860px){
    .ppr5-inner { padding:40px 26px 24px; border-radius:24px; }
    .ppr5-hero { flex-direction:column-reverse; align-items:center; gap:20px; text-align:center; }
    .ppr5-copy { padding-bottom:0; }
    .ppr5-eyebrow { justify-content:center; }
    .ppr5-btns { justify-content:center; }
    .ppr5-visual { width:72%; max-width:320px; margin-bottom:0; align-self:center; }
    .ppr5-copy h2 { font-size:32px; white-space:normal; }
    .ppr5-sub { font-size:19px; white-space:normal; }
    .ppr5-divider { margin-left:auto; margin-right:auto; }
    .ppr5-bar-item.center { border-left:none; border-right:none; border-top:1px solid #F1D6BF; border-bottom:1px solid #F1D6BF; padding:14px 0; width:100%; }
  }
  @media (max-width:640px){ .ppr5 { padding:52px 14px; } .ppr5-copy h2 { font-size:28px; } .ppr5-btn { font-size:16px; padding:15px 26px; } }
  </style>

            <a class="ppr5-btn ghost" href="/board/product/list.html?board_no=6"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4L3 21l1.1-3.2A8.4 8.4 0 1 1 21 11.5z"/></svg> 문의 남기기 &nbsp;›</a>

        </div>
        <div class="ppr5-visual">

      <div class="ppr5-bar">
        <div class="ppr5-bar-item">
          <span class="cic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.5-1.1a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z"/></svg></span>
          <div><div class="t1">1:1 전화 상담 무료</div><div class="t2">전문 상담원이 친절하게 도와드립니다.</div></div>

<script>
(function(){
  // ▼▼▼ 캐릭터(POUR 닥터) 이미지 경로 — 파이어베이스 Storage에 올린 뒤 여기 2줄만 바꾸세요 ▼▼▼
  var IMG_FOLDER = 'POUR스토어_리뉴얼/package';   // ← Storage에 만든 폴더 경로
  var IMG_FILE   = 'pour-doctor.png';             // ← 업로드한 파일 이름 (png/jpg/webp)
  // ▲▲▲ 여기까지만 수정하면 됩니다 ▲▲▲
  var BUCKET = 'pour-app-new.firebasestorage.app';
  var path = encodeURIComponent(IMG_FOLDER + '/' + IMG_FILE);
  var url = 'https://firebasestorage.googleapis.com/v0/b/' + BUCKET + '/o/' + path + '?alt=media';
  var el = document.querySelector('[data-doctor-img]');
  if(el) el.src = url;
})();
