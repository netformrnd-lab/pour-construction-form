<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POUR스토어 파트너 전용몰 — 상단 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<!--
  ▣ POUR스토어 파트너 전용몰 상단 안내 (카페24 상품분류 상단 붙여넣기용) — 실용형
  ─ 필독사항 + 자료 다운로드만. 마케팅 문구 없음.
  ─ 카페24 스킨 CSS 충돌 방지: 전 클래스 ppm- 접두사.
  ─ [★수정] 표시된 링크/문구만 실제 값으로 교체.
-->
<style>
  .ppm, .ppm *{box-sizing:border-box;margin:0;padding:0}
  .ppm{
    --or:#E1782D; --or2:#c95214; --navy:#0F1F5C;
    --ink:#1b2233; --muted:#6B7280; --line:#E5E1DA; --card:#fff; --bg:#F7F5F1;
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    color:var(--ink); line-height:1.6; max-width:1180px; margin:0 auto; padding:0 16px;
    -webkit-font-smoothing:antialiased;
  }
  .ppm a{text-decoration:none;color:inherit}
  .ppm svg{display:block}

  /* 제목 줄 */
  .ppm-top{display:flex;align-items:center;gap:10px;padding:2px 2px 14px}
  .ppm-top h2{font-size:20px;font-weight:900;letter-spacing:-.02em;color:var(--navy)}
  .ppm-top .ppm-line{flex:1;height:1px;background:var(--line)}

  /* 2열 패널: 필독 | 자료 */
  .ppm-panel{display:flex;flex-wrap:wrap;gap:14px;align-items:stretch}
  .ppm-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
  .ppm-notice{flex:1 1 420px;min-width:0;background:var(--bg)}
  .ppm-files{flex:1 1 260px;min-width:0;display:flex;flex-direction:column}

  .ppm-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:var(--navy);margin-bottom:12px}
  .ppm-h .ppm-tag{font-size:11px;font-weight:700;color:#fff;background:var(--or);border-radius:5px;padding:2px 7px;letter-spacing:.02em}

  .ppm-notice ul{margin:0}
  .ppm-notice li{list-style:none;position:relative;padding-left:16px;font-size:13.5px;color:#4a4a4a;margin-bottom:8px;line-height:1.6}
  .ppm-notice li:last-child{margin-bottom:0}
  .ppm-notice li::before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--or)}
  .ppm-notice b{color:var(--navy);font-weight:700}

  /* 다운로드 버튼 */
  .ppm-dl{display:flex;flex-direction:column;gap:8px}
  .ppm-dl a{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--navy);
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;transition:.15s}
  .ppm-dl a:hover{border-color:var(--or);background:#FCF3EA;color:var(--or2)}
  .ppm-dl a .ppm-dico{flex:0 0 auto;color:var(--or)}
  .ppm-dl a .ppm-arr{margin-left:auto;color:#b8b2a8}
  .ppm-dl a:hover .ppm-arr{color:var(--or)}

  @media (max-width:760px){
    .ppm-top{padding-bottom:12px}
    .ppm-top h2{font-size:18px}
    .ppm-notice,.ppm-files{flex-basis:100%}
    .ppm-box{padding:18px}
  }
</style>
</head>
<body>
<!-- ▼▼▼ 여기부터 카페24에 붙여넣기 ▼▼▼ -->
<div class="ppm">

  <div class="ppm-top">
    <h2>파트너 전용몰</h2>
    <span class="ppm-line"></span>
  </div>

  <div class="ppm-panel">

    <!-- 구매 전 필독사항 -->
    <div class="ppm-box ppm-notice">
      <div class="ppm-h"><span class="ppm-tag">필독</span> 구매 전 확인사항</div>
      <ul>
        <li>전용 공급가는 <b>승인된 파트너 등급 로그인 시</b>에만 적용됩니다.</li>
        <li>등급별 공급가·<b>최소 주문수량</b> 조건은 상품 상세에서 확인해 주세요.</li>
        <li>배송·정산·세금계산서 안내는 아래 <b>자료</b>를 확인해 주세요. <!--[★수정] 실제 정책으로--></li>
      </ul>
    </div>

    <!-- 자료 다운로드 -->
    <div class="ppm-box ppm-files">
      <div class="ppm-h">자료 다운로드</div>
      <div class="ppm-dl">
        <a href="#" target="_blank" rel="noopener"><!--[★수정] 링크-->
          <span class="ppm-dico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span>
          상세페이지 자료<span class="ppm-arr"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="M7 12l5 5 5-5"/><path d="M5 21h14"/></svg></span>
        </a>
        <a href="#" target="_blank" rel="noopener"><!--[★수정] 링크-->
          <span class="ppm-dico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg></span>
          콘텐츠 자료<span class="ppm-arr"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="M7 12l5 5 5-5"/><path d="M5 21h14"/></svg></span>
        </a>
      </div>
    </div>

  </div>

</div>
<!-- ▲▲▲ 여기까지 붙여넣기 ▲▲▲ -->
</body>
</html>
