<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POUR스토어 파트너 전용몰 — 상단 구분 띠</title>
<!--
  ▣ POUR스토어 파트너 전용몰 상단 구분 띠
  ─ 넣는 곳: 카페24 관리자 → 상품분류 관리 → "파트너 전용몰"(120) → '분류 상세 설명' HTML칸
  ─ 아래 ▼▼▼ ~ ▲▲▲ 사이(= <style> + <div>)만 복사해서 붙여넣으면 됨. (헤더/푸터는 그대로 유지, 상품목록 위에만 띠가 얹힘)
  ─ 카페24 스킨 CSS 충돌 방지: 전 클래스 ppm- 접두사.
-->
</head>
<body>
<!-- ▼▼▼ 여기부터 복사해서 카페24 '분류 상세 설명'에 붙여넣기 ▼▼▼ -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  .ppm, .ppm *{box-sizing:border-box;margin:0;padding:0}
  .ppm{
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    max-width:1180px; margin:0 auto; padding:0 16px; -webkit-font-smoothing:antialiased;
  }
  .ppm-bar{
    display:flex; align-items:center; gap:11px;
    background:linear-gradient(90deg,#FFF4EA 0%,#FFF9F4 100%);
    border:1px solid #F3DCC8; border-left:4px solid #E1782D;
    border-radius:12px; padding:12px 18px; margin:4px 0 14px;
    line-height:1.5;
  }
  .ppm-bar-ico{ flex:0 0 auto; display:inline-flex; color:#E1782D; }
  .ppm-bar-ico svg{ width:19px; height:19px; display:block; }
  .ppm-bar b{ font-size:15.5px; font-weight:800; color:#2a2016; letter-spacing:-.02em; white-space:nowrap; }
  .ppm-bar .ppm-tag{ flex:0 0 auto; font-size:11px; font-weight:800; color:#fff; background:#E1782D;
    border-radius:999px; padding:3px 10px; letter-spacing:.01em; white-space:nowrap; }
  .ppm-bar .ppm-sub{ font-size:12.5px; font-weight:500; color:#9a6a45; letter-spacing:-.01em;
    margin-left:auto; white-space:nowrap; }
  .ppm-bar .ppm-sub b{ font-size:12.5px; font-weight:700; color:#c95214; }
  @media (max-width:640px){
    .ppm-bar{ flex-wrap:wrap; gap:7px 9px; padding:12px 15px; border-radius:11px; }
    .ppm-bar .ppm-sub{ margin-left:0; flex-basis:100%; white-space:normal; }
  }
</style>
<div class="ppm">
  <div class="ppm-bar">
    <span class="ppm-bar-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/><circle cx="12" cy="15.4" r="1.3"/></svg></span>
    <b>파트너 전용몰</b>
    <span class="ppm-tag">등급 전용가</span>
    <span class="ppm-sub">로그인하신 <b>파트너 등급 전용 공급가</b>로 표시됩니다</span>
  </div>
</div>
<!-- ▲▲▲ 여기까지 복사 ▲▲▲ -->
</body>
</html>
