<!-- ============================================================
  pour-popup-1.html — 카페24 팝업 화면 (슬롯 1)
  ▸ 사용법(카페24): 디자인 > 팝업 > "직접만든 팝업 선택하기" 에서 이 파일 선택
  ▸ 팝업 창/오늘 하루 열지 않음/노출기간/닫기 = 카페24가 자동 처리
  ▸ 이미지·링크 = 어드민 "📢 팝업 관리 > 슬롯 1" 에서 등록/교체 (config/pourstorePopups)
  ▸ 슬롯 2 팝업이 필요하면 pour-popup-2.html 사용
============================================================ -->
<script>(function(){try{var m=document.querySelector('meta[name=viewport]');var v='width=device-width, initial-scale=1';if(!m){m=document.createElement('meta');m.setAttribute('name','viewport');m.setAttribute('content',v);document.head.appendChild(m);}else if(!/width=device-width/i.test(m.getAttribute('content')||'')){m.setAttribute('content',v);}}catch(e){}})();</script>
<div class="pourpop" data-slot="1">
<style>
.pourpop, .pourpop *{box-sizing:border-box;margin:0;padding:0;}
.pourpop{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#fff;}
.pourpop a.pourpop-link{display:none;text-decoration:none;line-height:0;cursor:pointer;}
.pourpop img.pourpop-img{display:block;width:100%;height:auto;}
</style>
<a class="pourpop-link" href="#none" rel="noopener"><img class="pourpop-img" src="" alt="이벤트 팝업"></a>
<script>
(function(){
  var root=document.currentScript.closest('.pourpop'); if(!root) return;
  var SLOT=parseInt(root.getAttribute('data-slot')||'1',10);
  var link=root.querySelector('.pourpop-link'), img=root.querySelector('.pourpop-img');
  var HREF='';
  // 카페24 레이어/윈도우 팝업 모두 대응 → 스토어(부모/최상위) 창을 이동
  link.addEventListener('click',function(e){
    e.preventDefault();
    if(!HREF) return;
    var w=(window.opener&&!window.opener.closed)?window.opener:window.top;
    try{ (w||window).location.href=HREF; }catch(_){ window.location.href=HREF; }
  });
  (async function(){
    try{
      var a=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
      var fs=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
      var cfg={apiKey:"AIzaSyBbct9tO8nCUCjz4s9GnXQLkHuHe2FFyyU",authDomain:"pour-app-new.firebaseapp.com",projectId:"pour-app-new",storageBucket:"pour-app-new.firebasestorage.app",messagingSenderId:"411031141847",appId:"1:411031141847:web:e658174fd4b9652cdadf92"};
      var app=a.getApps().length?a.getApps()[0]:a.initializeApp(cfg);
      var snap=await fs.getDoc(fs.doc(fs.getFirestore(app),'config','pourstorePopups'));
      var arr=snap.exists()?(((snap.data()||{}).popups)||[]):[];
      var p=arr.filter(function(x){return x&&Number(x.slot)===SLOT;})[0]||arr[SLOT-1];
      if(p&&p.active!==false&&p.image){
        img.src=p.image;
        HREF=(p.link||'').trim();
        link.style.cursor=HREF?'pointer':'default';
        link.style.display='block';
      } else {
        console.log('[popup] 슬롯 '+SLOT+' — 비활성 또는 이미지 없음');
      }
    }catch(e){ console.log('[popup] 로드 스킵:', e&&e.message?e.message:e); }
  })();
})();
</script>
</div>
