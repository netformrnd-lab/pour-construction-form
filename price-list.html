<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>사용하지 않는 페이지 — 넷폼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<!--
  예전 초안 "POUR스토어 단가·공급망 관리" 페이지 (2026-08-25 작성, 어디에도 연결 안 됨).
  단가 데이터가 누구나 읽을 수 있는 자리(sourcing-os/price-list)에 있어서 원가 보호를 위해 사용을 멈췄어요.
  · 데이터: 소싱앱 대표 로그인 때 관리자 전용 저장소(sourcing-cost/backup-price-list-*)로 옮겨 보관
  · 예전 코드: GitHub 기록에 그대로 있음 (필요하면 되돌릴 수 있음)
  · 지금 가격·마진 관리는 가격 대시보드(pourstore-pricing-dashboard.html)에서
-->
<style>
  :root{--navy:#0D1B2A;--accent:#2563EB;--text:#111827;--text-md:#4B5563;--bg:#F9FAFB;--card:#fff;--border:#E5E7EB}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .box{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 8px 32px rgba(0,0,0,.08);max-width:440px;width:100%;padding:28px 24px;text-align:center}
  .ic{font-size:40px;margin-bottom:10px}
  h1{font-size:19px;font-weight:800;color:var(--navy);margin-bottom:8px;letter-spacing:-.02em}
  p{font-size:14px;line-height:1.65;color:var(--text-md);margin-bottom:6px;word-break:keep-all}
  a.go{display:block;margin-top:18px;padding:14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:15px;text-decoration:none}
  .sub{font-size:12px;color:#9CA3AF;margin-top:14px}
</style>
</head>
<body>
  <div class="box">
    <div class="ic">🔒</div>
    <h1>사용하지 않는 페이지예요</h1>
    <p>예전 초안으로 만든 단가표 페이지예요.<br>원가 보호를 위해 사용을 멈췄어요.</p>
    <p>가격·마진 관리는 <b>가격 대시보드</b>에서 해 주세요.</p>
    <a class="go" href="pourstore-pricing-dashboard.html">가격 대시보드로 가기 ›</a>
    <div class="sub">입력돼 있던 데이터는 관리자 전용 저장소에 보관돼 있어요.</div>
  </div>
</body>
</html>
