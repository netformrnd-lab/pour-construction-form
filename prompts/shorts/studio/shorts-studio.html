// 한국어 읽기 변환 (나레이션 지침: POUR → 포어, PVC → 피브이씨, 숫자는 한글로)

async function save() {

  P.updatedAt = nowIso(); const body = clone(P); delete body.id;

    } else {

      store.set('studio.projects', JSON.stringify(projects));
    }
    projects[curId] = Object.assign({ id: curId }, clone(body));

    const d = new Date(); saveMsg = `${mode === 'db' ? '저장됨' : '이 기기에 저장됨'} ${pad(d.getHours())}:${pad(d.getMinutes())}`; saveErr = false;
  } catch (e) {

    else if (e && e.code === 'quota_exceeded') saveMsg = '저장 공간이 가득 찼어요. 오래된 숏폼을 보관 처리해 주세요';
    else saveMsg = '저장 실패 — 잠시 후 자동으로 다시 시도해요';

async function createProject(name, from) {

function clockHTML() {
  if (!P.startedAt) return `<div class="clock"><div><span class="lbl">3시간 타이머</span><span class="big mono">0:00</span></div><button class="btn pri" data-act="start">타이머 시작</button></div>`;
  const el = Math.max(0, (Date.now() - new Date(P.startedAt).getTime()) / 60000);
  const ps = progressStage(); const plannedEnd = ps <= 6 ? CUM[ps] : 180;
  let pill;
  if (ps > 6) pill = `<span class="pill good">완료</span>`;
  else if (el > 180) pill = `<span class="pill bad">3시간 초과 ${Math.round(el - 180)}분</span>`;
  else if (el > plannedEnd) pill = `<span class="pill warn">${Math.round(el - plannedEnd)}분 늦음</span>`;
  else pill = `<span class="pill good">예정대로 · 이 단계 ${Math.round(plannedEnd - el)}분 남음</span>`;
  return `<div class="clock"><div><span class="lbl">경과</span><span class="big mono">${hm(el)}</span></div><div><span class="lbl">남음</span><span class="big mono">${hm(Math.max(0, 180 - el))}</span></div>${pill}
    <button class="btn sm ghost ${armed === 'restart' ? 'danger' : ''}" data-act="restart">${armed === 'restart' ? '처음부터 다시?' : '다시 시작'}</button></div>`;
}
function timelineHTML() {
  const ps = progressStage();

  return `<div><div class="tl" role="img" aria-label="3시간 계획: ${STAGES.map(s => s.n + '단계 ' + s.name + ' ' + s.min + '분').join(', ')}">

    ${el != null ? `<div class="now" style="left:calc(${(el / 180 * 100).toFixed(2)}% - 1px)"></div>` : ''}
  </div><div class="tl-axis"><span>0:00</span><span>0:45</span><span>1:30</span><span>2:15</span><span>3:00</span></div></div>`;
}

function qaAutoHTML() { return qaAuto().map(([l, ok, d]) => `<div class="row"><span class="chip ${ok ? 'good' : 'warn'}">${ok ? '✓' : '!'}</span><span>${l}</span><span class="note">${esc(d)}</span></div>`).join(''); }

function panel6() {
  const o = P.output;
  let out = stageHead(5);
  out += `<section class="card"><h3>완성본</h3><div class="fgrid">${field('완성 mp4 링크', 'output.mp4', 'https://…mp4 (Claude가 채움)')}${field('캡컷 소스 zip 링크', 'output.zip', 'https://…zip')}${field('버전', 'output.version', '예) v1')}</div>
    <div class="addbar">${o.mp4 ? `<a class="btn" href="${esc(o.mp4)}" target="_blank" rel="noopener">▶ 완성본 보기</a>` : ''}${o.zip ? `<a class="btn" href="${esc(o.zip)}" target="_blank" rel="noopener">캡컷 소스 받기</a>` : ''}</div></section>`;
  out += `<section class="gate ${P.gates.final ? 'ok' : ''}"><div><b>승인 ③ 최종 영상</b><p>소리 켜고 처음부터 끝까지 한 번. 발음·자막·제품 모양·표기 확인.</p></div>${chk('gates.final', '승인')}</section>`;
  out += `<section class="card"><h3>업로드</h3><label class="f">업로드 문구 (제목·설명·해시태그)${ta('upload.caption', '예) 옥상 배수구 막힘, 이거 하나로 끝 #옥상방수 #셀프시공', 4)}</label>
    <div class="addbar">${chk('upload.yt', '유튜브 쇼츠')}${chk('upload.ig', '인스타 릴스')}${chk('upload.tt', '틱톡')}${chk('upload.store', '스토어 상세페이지')}</div></section>`;
  return out;
}

function railHTML() {
  return `<section class="card meter" id="meter">${meterHTML()}</section>
  <section class="card ask"><h3>Claude에게 요청 <span class="sub">${tab + 1}단계</span></h3><pre class="code" data-ask>${esc(askText(tab + 1))}</pre>
    <div class="addbar"><button class="btn sm pri" data-act="copyAsk">${copied === 'ask' ? '복사됨 — 채팅에 붙여넣기' : '요청문 복사'}</button></div>
    <p class="note">Claude는 이 대시보드를 직접 읽고 결과를 채워 넣어요.</p></section>
  <section class="card"><h3>3시간 계획</h3><ol class="plan">${STAGES.map((s, i) => `<li class="${progressStage() === s.n ? 'cur' : ''}"><span class="mono">${hm(CUM[i])}–${hm(CUM[i + 1])}</span><span>${s.n}. ${s.name}</span></li>`).join('')}</ol>
    <p class="note">승인은 3번만: ① 대본·목소리 ② 장면 이미지 ③ 최종 영상</p></section>
  <section class="card"><h3>기준 숏폼</h3><dl class="kv"><dt>상품</dt><dd>옥상배관방수트랩 v12</dd><dt>컷</dt><dd>13</dd><dt>길이</dt><dd>54.5초</dd><dt>성우</dt><dd>서준</dd><dt>컷 사이</dt><dd>0.42초</dd></dl>
    <p class="note">v12는 세부 내용이 많아 54초. 45초 목표면 원인·한계 컷을 한 문장으로 합치세요.</p></section>`;
}
function meterHTML() {
  const tot = totalSec(), tgt = P.targetSec || 45, max = Math.max(tgt * 1.4, tot * 1.05), over = tot > tgt + 0.5;
  return `<h3>예상 길이 <span class="sub">서준 실측 기준</span></h3>
    <div><span class="num mono">${tot.toFixed(1)}</span><span class="sub"> 초 / 목표 ${tgt}초</span></div>
    <div class="bar2" aria-hidden="true"><div class="fill ${over ? 'over' : ''}" style="width:${Math.min(100, tot / max * 100).toFixed(1)}%"></div><div class="tick" style="left:${(tgt / max * 100).toFixed(1)}%"></div></div>
    <div class="legend"><span>0초</span><span>${over ? `${(tot - tgt).toFixed(1)}초 넘음 — 대본 줄이기` : `${(tgt - tot).toFixed(1)}초 여유`}</span></div>
    <dl class="kv"><dt>컷</dt><dd>${P.cuts.length}</dd><dt>음절</dt><dd>${totalSyl()}</dd><dt>목표 음절 (대략)</dt><dd>${Math.round((tgt - P.cuts.length * (P.build.gap ?? GAP) - P.cuts.length * 0.3) / 0.2)}</dd></dl>`;
}

function render() {
  const app = document.getElementById('app');
  const ae = document.activeElement; const focus = ae && ae.id ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
  if (mode === 'loading') { app.innerHTML = '<p class="empty">숏폼 스튜디오를 불러오는 중…</p>'; return; }
  if (!P) {
    app.innerHTML = `<header>${headerHTML()}</header><section class="card" style="margin-top:16px"><h3>아직 숏폼이 없어요</h3>
      <p class="empty">상품 하나로 숏폼 1편을 3시간 안에 만드는 작업판이에요. "새 숏폼"을 누르고 상품명만 적으면 기준 구조(① 고객 문제 → ⑥ 상품 추천)가 채워져요.</p>
      <div><button class="btn pri" data-act="new">새 숏폼 만들기</button></div></section>`;
  } else {
    const panels = [panel1, panel2, panel3, panel4, panel5, panel6];
    app.innerHTML = `<header>${headerHTML()}<div class="board" id="topbox">${topboxHTML()}</div></header>
      <nav class="tabs" role="tablist" id="tabs" aria-label="제작 단계">${tabsHTML()}</nav>
      <div class="grid"><main class="main">${panels[tab]()}</main><aside class="rail" id="rail">${railHTML()}</aside></div>`;
  }
  pendingRemote = false;
  if (focus) { const el = document.getElementById(focus.id); if (el) { el.focus({ preventScroll: true }); try { if (focus.s != null) el.setSelectionRange(focus.s, focus.e); } catch (e) { /* select 등 */ } } }
}
function updateDerived() {
  if (!P) return;
  const set = (sel, html) => document.querySelectorAll(sel).forEach(el => { el.innerHTML = html; });
  set('#topbox', topboxHTML()); set('#tabs', tabsHTML()); set('#meter', meterHTML());
  document.querySelectorAll('[data-stat]').forEach(el => { const c = P.cuts[+el.dataset.stat]; if (c) el.innerHTML = statHTML(c); });
  document.querySelectorAll('[data-prompt]').forEach(el => { const c = P.cuts[+el.dataset.prompt]; if (c) el.textContent = promptOf(c); });
  document.querySelectorAll('[data-total]').forEach(el => { el.textContent = `${totalSec().toFixed(1)}초 / ${P.targetSec || 45}초`; });
  document.querySelectorAll('[data-json]').forEach(el => { el.textContent = JSON.stringify(buildConfig(), null, 1); });
  document.querySelectorAll('[data-qa]').forEach(el => { el.innerHTML = qaAutoHTML(); });
  document.querySelectorAll('[data-ask]').forEach(el => { el.textContent = askText(tab + 1); });
  const sel = document.getElementById('proj'); if (sel) { const o = sel.querySelector(`option[value="${curId}"]`); if (o) o.textContent = (P.product.name || P.name) + (P.output.version ? ' · ' + P.output.version : ''); }
}

// ── 이벤트 ──────────────────────────────────────────
async function copy(text, key) {
  try { await navigator.clipboard.writeText(text); copied = key; }
  catch (e) { copied = ''; const pre = document.querySelector(key === 'json' ? '[data-json]' : key === 'ask' ? '[data-ask]' : `[data-prompt="${key.slice(1)}"]`); if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } }
  render(); setTimeout(() => { if (copied === key) { copied = ''; render(); } }, 2000);
}
document.addEventListener('input', e => {
  const el = e.target.closest('[data-f]'); if (!el || !P) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.num) v = el.value === '' ? '' : parseFloat(el.value);
  setPath(P, el.dataset.f, v);
  if (el.dataset.f.endsWith('.type')) { const c = P.cuts[+el.dataset.f.split('.')[1]]; if (c && !c.src.length) c.src = [{ u: '', l: '', w: 1 }]; }
  if (el.dataset.f === 'product.name' && P.cta && (!P.cta.title || P.cta.title === P.name)) { P.cta.title = v; }
  if (el.dataset.f === 'product.name') P.name = v;
  touch();
  if (el.dataset.full) render(); else updateDerived();
});
document.addEventListener('change', e => {
  if (e.target.id === 'proj') { if (dirty) save(); armed = null; pickProject(e.target.value); render(); }
});
document.addEventListener('focusout', e => {
  if (!pendingRemote) return;
  setTimeout(() => { const a = document.activeElement; if (!(a && a.matches && a.matches('input,textarea,select'))) render(); }, 0);
});
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i, j = +b.dataset.j;
  if (act !== 'archive' && act !== 'restart' && act !== 'del') armed = null;
  switch (act) {
    case 'new': showNew = true; render(); setTimeout(() => document.getElementById('newName')?.focus(), 0); return;
    case 'cancelNew': showNew = false; render(); return;
    case 'createNew': return createProject(document.getElementById('newName')?.value);
    case 'createDup': return createProject(document.getElementById('newName')?.value, P);
    case 'dup': showNew = true; render(); setTimeout(() => document.getElementById('newName')?.focus(), 0); return;
    case 'archive':
      if (armed !== 'archive') { armed = 'archive'; render(); return; }
      armed = null; P.archived = true; await saveNow(); pickProject(); render(); return;
    case 'tab': case 'goto': tab = +b.dataset.s; store.set('studio.tab', String(tab)); copied = ''; render(); window.scrollTo({ top: 0 }); return;
    case 'start': P.startedAt = nowIso(); break;
    case 'restart': if (armed !== 'restart') { armed = 'restart'; render(); return; } armed = null; P.startedAt = nowIso(); break;
    case 'seg': { const raw = b.dataset.v; setPath(P, b.dataset.f, /^\d+$/.test(raw) ? +raw : raw); break; }
    case 'addFact': P.facts.push({ text: '', source: '', ok: false }); break;
    case 'delFact': P.facts.splice(i, 1); break;
    case 'addCut': {
      const k = b.dataset.p; let at = -1; P.cuts.forEach((c, x) => { if (c.part === k) at = x; });
      if (at < 0) { const order = PARTS.map(p => p.key); P.cuts.forEach((c, x) => { if (order.indexOf(c.part) < order.indexOf(k)) at = x; }); }
      P.cuts.splice(at + 1, 0, blankCut(k)); break;
    }
    case 'up': if (i > 0) [P.cuts[i - 1], P.cuts[i]] = [P.cuts[i], P.cuts[i - 1]]; break;
    case 'down': if (i < P.cuts.length - 1) [P.cuts[i + 1], P.cuts[i]] = [P.cuts[i], P.cuts[i + 1]]; break;
    case 'del': if (armed !== 'del' + i) { armed = 'del' + i; render(); return; } armed = null; P.cuts.splice(i, 1); break;
    case 'addSrc': P.cuts[i].src.push({ u: '', l: '', w: 1 }); break;
    case 'delSrc': P.cuts[i].src.splice(j, 1); break;
    case 'approveAll': P.cuts.forEach(c => { if (c.type === 'ai' && c.img.status === 'made') c.img.status = 'ok'; }); break;
    case 'copyPrompt': return copy(promptOf(P.cuts[i]), 'p' + i);
    case 'copyJson': return copy(JSON.stringify(buildConfig(), null, 1), 'json');
    case 'copyAsk': return copy(askText(tab + 1), 'ask');
    default: return;
  }
  touch(); render();
});
setInterval(() => { if (P && P.startedAt) { const c = document.getElementById('clock'); if (c) c.innerHTML = clockHTML(); } }, 20000);

// ── 시작: 공유 저장소(db) 연결, 없으면 이 기기 저장 ─────────────
(async function boot() {
  let ns = null;
  try { ns = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('db') : null; } catch (e) { ns = null; }
  if (!ns) {
    mode = 'local';
    try { projects = JSON.parse(store.get('studio.projects') || '{}') || {}; } catch (e) { projects = {}; }
    console.log(`[projects] 이 기기 저장 ${Object.keys(projects).length}건`);
    pickProject(); render(); return;
  }
  db = ns; mode = 'db';
  db.collection('projects').onSnapshot(snap => {
    const next = {}; snap.docs.forEach(d => { next[d.id] = Object.assign({ id: d.id }, clone(d.data())); });
    console.log(`[projects] ${snap.size}건`);
    projects = next;
    if (!curId || !projects[curId] || projects[curId].archived) { pickProject(); render(); return; }
    if (dirty || saving || snap.metadata.hasPendingWrites) { updateDerived(); return; }
    const remote = normalize(clone(projects[curId])); const changed = JSON.stringify(remote) !== JSON.stringify(P);
    P = remote;
    const a = document.activeElement;
    if (a && a.matches && a.matches('input,textarea,select') && document.getElementById('app').contains(a)) { if (changed) { pendingRemote = true; updateDerived(); } return; }
    render();
  }, err => { console.error('[projects] 구독 오류:', err); saveErr = true; saveMsg = '불러오기 오류 — 새로고침해 주세요'; paintSave(); });
})();
render();
</script>
