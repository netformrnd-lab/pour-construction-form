<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>촬영 데스크</title>
<meta name="description" content="촬영 요청 접수부터 브랜드·제품 폴더, 회차별 투두·레퍼런스까지 한 곳에서">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F1F2F5; --card:#FFFFFF; --card2:#F7F8FA; --sunk:#EBEDF1;
  --line:#E2E4EA; --line2:#EDEFF3;
  --ink:#15171C; --text:#242830; --muted:#6E7480; --faint:#9AA0AC;
  --accent:#C9482A; --accent-soft:#FAE9E3; --on-accent:#FFFFFF;
  --q1:#2F63D8; --q1s:#E8EEFC; --q2:#C9482A; --q2s:#FAE9E3;
  --q3:#9C7412; --q3s:#F8EFD9; --q4:#2F6E56; --q4s:#E3EFE9;
  --b1:#1F6F63; --b1s:#E1EEEB; --b2:#5F7F33; --b2s:#EAF0DF; --b3:#A65A34; --b3s:#F7E9E1; --b4:#525C75; --b4s:#E9EBF1;
  --shadow:0 1px 2px rgba(20,22,28,.05), 0 10px 26px rgba(20,22,28,.055);
  --shadow-sm:0 1px 2px rgba(20,22,28,.06);
  --r:14px; --r-lg:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D0F13; --card:#161A20; --card2:#1B1F26; --sunk:#11141A;
    --line:#272C35; --line2:#20252C;
    --ink:#F3F4F7; --text:#E3E6EB; --muted:#98A0AC; --faint:#6C7480;
    --accent:#F0714C; --accent-soft:#33201B; --on-accent:#1A0D08;
    --q1:#7BA2F5; --q1s:#1A2333; --q2:#F0714C; --q2s:#33201B;
    --q3:#DDB44E; --q3s:#2E2718; --q4:#68B694; --q4s:#16281F;
    --b1:#63BBAC; --b1s:#152724; --b2:#A7C46F; --b2s:#1F2718; --b3:#E09468; --b3s:#2E1F17; --b4:#9AA6C4; --b4s:#1C202B;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#0D0F13; --card:#161A20; --card2:#1B1F26; --sunk:#11141A;
  --line:#272C35; --line2:#20252C;
  --ink:#F3F4F7; --text:#E3E6EB; --muted:#98A0AC; --faint:#6C7480;
  --accent:#F0714C; --accent-soft:#33201B; --on-accent:#1A0D08;
  --q1:#7BA2F5; --q1s:#1A2333; --q2:#F0714C; --q2s:#33201B;
  --q3:#DDB44E; --q3s:#2E2718; --q4:#68B694; --q4s:#16281F;
  --b1:#63BBAC; --b1s:#152724; --b2:#A7C46F; --b2s:#1F2718; --b3:#E09468; --b3s:#2E1F17; --b4:#9AA6C4; --b4s:#1C202B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.35);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* shell */
.shell{max-width:560px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;position:relative}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line2)}
.topbar-in{display:flex;align-items:center;gap:10px;padding:12px 16px 10px}
.tb-title{font-weight:700;font-size:17px;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:11px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.crumbs{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--faint);padding:0 16px 9px;
  overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumbs a{font-weight:500;color:var(--muted)}
.crumbs b{font-weight:500;color:var(--ink)}
main{flex:1;padding:16px 16px 108px;display:flex;flex-direction:column;gap:18px;min-width:0}
body.noTabs main{padding-bottom:150px}

/* tabbar */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:7px 0 max(7px,env(safe-area-inset-bottom))}
body.noTabs .tabbar{display:none}
.tabbar-in{display:flex;width:100%;max-width:560px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--faint);font-size:10.5px;font-weight:500;position:relative}
.tab svg{width:21px;height:21px}
.tab[aria-current="true"]{color:var(--ink)}
.tab[aria-current="true"] .dotmark{opacity:1}
.dotmark{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0;margin-top:-1px}
.badge{position:absolute;top:1px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:99px;
  background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}

/* generic */
.sec-head{display:flex;align-items:baseline;gap:8px;margin-bottom:-6px}
.sec-title{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.sec-act{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--accent);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.tiny{font-size:11.5px} .small{font-size:13px}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pre{white-space:pre-wrap;word-break:break-word}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;
  font-weight:600;letter-spacing:-.01em;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.b1{background:var(--b1s);color:var(--b1)} .chip.b2{background:var(--b2s);color:var(--b2)}
.chip.b3{background:var(--b3s);color:var(--b3)} .chip.b4{background:var(--b4s);color:var(--b4)}
.chip.q1{background:var(--q1s);color:var(--q1)} .chip.q2{background:var(--q2s);color:var(--q2)}
.chip.q3{background:var(--q3s);color:var(--q3)} .chip.q4{background:var(--q4s);color:var(--q4)}
.chip.line{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filterbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.filterbar::-webkit-scrollbar{display:none}
.fchip{padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:500;border:1px solid var(--line);
  background:var(--card);color:var(--muted);white-space:nowrap;flex:none}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* progress */
.bar{height:5px;border-radius:99px;background:var(--sunk);overflow:hidden;flex:1}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--ink);transition:width .35s ease}
.bar.done > i{background:var(--q4)}
.pct{font-size:11.5px;font-weight:600;color:var(--muted);flex:none}

/* folder card */
.fcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:14px 14px 12px;box-shadow:var(--shadow-sm);position:relative}
.fcard:hover{border-color:var(--faint)}
.fcard .tabtop{position:absolute;top:-1px;left:16px;width:44px;height:5px;border-radius:0 0 4px 4px;background:var(--line)}
.fcard h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.015em;color:var(--ink);word-break:keep-all}
.fcard .sub{margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
.fmeta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint);margin-top:9px;flex-wrap:wrap}
.fmeta .dot{width:3px;height:3px;border-radius:50%;background:var(--faint);opacity:.6}
.fmeta svg{width:11px;height:11px}
.dday{font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;flex:none}
.dday.past{background:var(--sunk);color:var(--faint)}
.dday.calm{background:var(--sunk);color:var(--muted)}
.minithumbs{display:flex;gap:5px;margin-top:9px}
.minithumbs span{width:40px;height:40px;border-radius:8px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;color:var(--faint);flex:none;position:relative}
.minithumbs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.minithumbs svg{width:15px;height:15px}
.hidden-tag{opacity:.55}

/* request cta */
.reqcta{background:var(--accent);color:var(--on-accent);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.reqcta .eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.reqcta h2{margin:6px 0 4px;font-size:21px;line-height:1.3;font-weight:700;letter-spacing:-.02em}
.reqcta p{margin:0;font-size:13px;opacity:.85;line-height:1.55}
.reqcta .cta{display:block;margin-top:14px;width:100%;padding:13px;border-radius:12px;background:var(--card);color:var(--ink);
  font-weight:700;font-size:15px;text-align:center}
.reqcta .sub-act{display:block;margin:10px auto 0;font-size:12px;opacity:.85;text-decoration:underline;text-underline-offset:3px}

/* hero next shoot */
.hero{background:var(--ink);color:var(--paper);border-radius:var(--r-lg);padding:18px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero .frame{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,color-mix(in srgb,var(--paper) 7%,transparent) 0 1px,transparent 1px 46px);pointer-events:none}
.hero .eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.6}
.hero h2{margin:8px 0 2px;font-size:21px;line-height:1.3;font-weight:700;letter-spacing:-.02em;word-break:keep-all}
.hero .hsub{opacity:.7;font-size:13px}
.hero .hrow{display:flex;gap:14px;margin-top:12px;font-size:12px;opacity:.85;flex-wrap:wrap}
.hero .bar{background:color-mix(in srgb,var(--paper) 18%,transparent);margin-top:14px}
.hero .bar > i{background:var(--paper)}
.hero .cta{display:block;margin-top:14px;width:100%;padding:11px;border-radius:11px;background:var(--paper);color:var(--ink);font-weight:600;font-size:14px;text-align:center}
.dcount{font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:600;letter-spacing:-.02em}

.nextline{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:12px;padding:11px 12px;font-size:13.5px;color:var(--ink);box-shadow:var(--shadow-sm)}
.nextline .lbl{font-size:10.5px;font-weight:700;color:var(--accent);letter-spacing:.06em;flex:none}
.nextline .go{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--accent);flex:none}

/* matrix */
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:380px){.matrix{grid-template-columns:1fr}}
.quad{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 10px 9px;
  display:flex;flex-direction:column;gap:6px;min-height:132px;box-shadow:var(--shadow-sm);min-width:0}
.quad-h{display:flex;align-items:center;gap:6px}
.quad-h .nm{font-size:12px;font-weight:700;letter-spacing:-.01em}
.quad-h .ct{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--faint)}
.q-1 .nm{color:var(--q1)} .q-2 .nm{color:var(--q2)} .q-3 .nm{color:var(--q3)} .q-4 .nm{color:var(--q4)}
.q-1{border-top:2px solid var(--q1)} .q-2{border-top:2px solid var(--q2)} .q-3{border-top:2px solid var(--q3)} .q-4{border-top:2px solid var(--q4)}
.tasks{display:flex;flex-direction:column;gap:1px}
.task{display:flex;align-items:flex-start;border-radius:8px}
.task:hover{background:var(--card2)}
.task .tg{display:flex;gap:8px;align-items:flex-start;padding:6px 4px;flex:1;min-width:0;text-align:left}
.task .del{width:26px;height:28px;color:var(--faint);font-size:14px;flex:none;opacity:.55;border-radius:7px}
.task .del:hover{opacity:1;color:var(--accent);background:var(--sunk)}
.box{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center;color:transparent}
.box svg{width:10px;height:10px}
.task.done .box{background:var(--q4);border-color:var(--q4);color:#fff}
.task .tx{font-size:12.5px;line-height:1.45;color:var(--text);word-break:keep-all;overflow-wrap:anywhere}
.task.done .tx{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
.task .who{font-size:9.5px;color:var(--faint);display:block}
.addtask{font-size:11.5px;color:var(--faint);padding:6px 4px;text-align:left;border-radius:8px}
.addtask:hover{color:var(--accent);background:var(--card2)}
.qdone{font-size:10px;font-weight:600;color:var(--q4);background:var(--q4s);padding:2px 6px;border-radius:6px;margin-left:auto}
.inlineform{display:flex;gap:6px;padding:2px 0}
.inlineform input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card2);border-radius:8px;padding:7px 8px;font-size:16px}
.inlineform button{font-size:12.5px;font-weight:600;color:var(--accent);padding:0 4px;flex:none}

/* refs */
.refgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:480px){.refgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.refcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;box-shadow:var(--shadow-sm);position:relative;min-width:0;display:block;width:100%}
.refthumb{height:96px;background:var(--sunk);display:grid;place-items:center;position:relative;overflow:hidden}
.refthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.refthumb > svg{width:20px;height:20px;color:var(--faint)}
.refthumb .play{position:absolute;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:11px}
.linktile{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:10px;background:linear-gradient(140deg,var(--card2),var(--sunk))}
.linktile svg{width:18px;height:18px;color:var(--muted)}
.linktile .host{font-size:10px;font-family:"IBM Plex Mono",monospace;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reflabel{padding:7px 9px 9px}
.reflabel .t{font-size:11.5px;font-weight:600;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.reflabel .d{font-size:10px;color:var(--faint);margin-top:3px}
.refx{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(10,12,16,.62);color:#fff;font-size:13px;display:grid;place-items:center;z-index:2}
.refadd{display:flex;gap:8px}
.refadd button{flex:1;padding:11px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px;font-weight:500;background:var(--card)}
.refadd button:hover{border-color:var(--faint);color:var(--ink)}

/* calendar */
.calhead{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.calhead .m{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--shadow-sm)}
.caldow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10.5px;color:var(--faint);padding-bottom:6px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{aspect-ratio:1/1.06;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;gap:3px;font-size:12.5px;color:var(--text);position:relative}
.day.out{color:var(--faint);opacity:.45}
.day.today{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);font-weight:600}
.day[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pips{display:flex;gap:2.5px;height:5px}
.pips i{width:5px;height:5px;border-radius:50%}
.pips i.dl{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--accent)}
.day[aria-pressed="true"] .pips i{background:var(--paper)}
.sat{color:var(--q1)} .sun{color:var(--accent)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--faint);padding:2px 2px 0}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:0}

/* form */
.field{display:block;margin-bottom:14px}
.field > span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field > span .req{color:var(--accent)}
.field > span .cnt{margin-left:auto}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card);
  border-radius:10px;padding:11px 12px;font-size:16px;min-width:0}
.sheet .field input,.sheet .field select,.sheet .field textarea{background:var(--card2)}
.field textarea{min-height:84px;resize:vertical;line-height:1.55}
.field input[type="date"],.field input[type="time"]{min-height:46px}
.field .hint{font-size:11.5px;color:var(--faint);margin-top:5px}
.field.err input,.field.err textarea,.field.err .picks{outline:2px solid var(--accent);outline-offset:1px;border-radius:10px}
.picks{display:flex;gap:6px;flex-wrap:wrap}
.pick{padding:9px 13px;border-radius:999px;font-size:13.5px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--text)}
.pick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 4px;box-shadow:var(--shadow-sm)}
.formcard h4{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--ink)}
.linkform{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.linkform input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:10px 11px;font-size:16px}
.linkform .row button{flex:1;padding:10px;border-radius:9px;font-weight:600;font-size:13.5px}

.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--ink);color:var(--paper);font-weight:600;font-size:15px;text-align:center}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--accent-soft);color:var(--accent)}
.btn.soft{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.dim{opacity:.5}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;display:inline-block}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1}

.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:color-mix(in srgb,var(--card) 94%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px 16px max(12px,env(safe-area-inset-bottom))}
.actionbar-in{max-width:528px;margin:0 auto}
.actionbar .missing{font-size:12px;color:var(--muted);margin-bottom:8px;text-align:center}
.actionbar .missing b{color:var(--accent);font-weight:600}

/* info blocks */
.info{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow-sm)}
.info h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.04em}
.info p{margin:0;font-size:14px;line-height:1.65;color:var(--text)}
.info + .info{margin-top:-8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--faint)} .kv dd{margin:0;color:var(--text);min-width:0;overflow-wrap:anywhere}
.reqbox{background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.reqbox .t{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.reqbox p{margin:6px 0 0;font-size:13.5px;line-height:1.6;color:var(--text)}
.reqbox .lb{font-size:11px;color:var(--faint);margin-top:10px;display:block}
.prompt{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500}
.prompt button{margin-left:auto;font-weight:700;flex:none}
.folderlink{display:flex;align-items:center;gap:10px;background:var(--q4s);color:var(--q4);border-radius:12px;padding:12px;font-size:13px;font-weight:500}
.folderlink svg{width:18px;height:18px;flex:none}
.folderlink .go{margin-left:auto;font-weight:700;flex:none}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.42);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-radius:20px 20px 0 0;
  border-top:1px solid var(--line);max-width:560px;margin:0 auto;transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:90vh;overflow-y:auto;padding:8px 16px max(20px,env(safe-area-inset-bottom));visibility:hidden}
.sheet.on{transform:translateY(0);visibility:visible}
.grab{width:36px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 12px}
.sheet h3{margin:0 0 12px;font-size:17px;font-weight:700;color:var(--ink);word-break:keep-all}
.sheet .lead{font-size:12.5px;color:var(--muted);margin:-6px 0 14px;line-height:1.55}
.menu{display:flex;flex-direction:column;gap:2px;padding-bottom:6px}
.menu button,.menu a{display:flex;align-items:center;gap:11px;padding:13px 10px;border-radius:11px;font-size:15px;text-align:left;width:100%}
.menu button:hover,.menu a:hover{background:var(--card2)}
.menu .warn{color:var(--accent)}
.menu .ico{width:20px;text-align:center;font-size:15px;color:var(--muted)}
.viewer{border-radius:14px;overflow:hidden;background:var(--sunk);min-height:160px;display:grid;place-items:center;margin-bottom:12px}
.viewer img{width:100%;height:auto;display:block;max-height:62vh;object-fit:contain}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,14px);z-index:70;background:var(--ink);color:var(--paper);
  padding:10px 15px;border-radius:11px;font-size:13px;font-weight:500;opacity:0;transition:.24s;pointer-events:none;box-shadow:var(--shadow);max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.noTabs .toast{bottom:150px}
.empty{text-align:center;color:var(--faint);font-size:13px;padding:24px 12px;border:1px dashed var(--line);border-radius:var(--r);line-height:1.6}
.banner{font-size:12px;padding:9px 12px;border-radius:10px;background:var(--q3s);color:var(--q3);line-height:1.5}
.banner.err{background:var(--accent-soft);color:var(--accent)}
.fab{position:fixed;right:calc(50% - 280px + 16px);bottom:88px;z-index:35;height:48px;padding:0 16px;border-radius:16px;
  background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);font-size:14px;font-weight:600}
@media(max-width:592px){.fab{right:16px}}
.skel{height:84px;border-radius:var(--r);background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sk 1.2s infinite linear;border:1px solid var(--line)}
@keyframes sk{to{background-position:-200% 0}}
.foot{font-size:11px;color:var(--faint);text-align:center}
.foot button{text-decoration:underline;text-underline-offset:3px}

@media(min-width:900px){
  .shell{max-width:none;margin:0;padding-left:210px}
  .topbar-in,.crumbs,main{width:100%;max-width:900px;margin-left:auto;margin-right:auto}
  .tabbar{position:fixed;top:0;bottom:0;left:auto;right:auto;width:210px;border-top:0;border-right:1px solid var(--line);
    flex-direction:column;justify-content:flex-start;padding:22px 12px 12px;background:var(--card)}
  .tabbar::before{content:"SHOOTDESK";display:block;font:600 11px "IBM Plex Mono",monospace;letter-spacing:.12em;color:var(--faint);padding:0 12px 18px}
  body.noTabs .tabbar{display:flex}
  .tabbar-in{flex-direction:column;gap:2px;max-width:none}
  .tab{flex-direction:row;gap:11px;justify-content:flex-start;padding:11px 12px;border-radius:11px;font-size:14px}
  .tab[aria-current="true"]{background:var(--sunk)}
  .dotmark{display:none}
  .badge{position:static;margin-left:auto}
  main{padding:20px 24px 40px}
  body.noTabs main{padding-bottom:140px}
  .actionbar{left:210px}
  .actionbar-in{max-width:852px}
  .matrix{gap:12px}
  .quad{min-height:170px}
  .refgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .sheet{border-radius:18px;bottom:auto;top:50%;left:50%;right:auto;transform:translate(-50%,-46%) scale(.98);
    width:460px;margin:0;opacity:0;transition:.2s;border:1px solid var(--line);max-height:86vh}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
  .fab{right:max(24px,calc((100vw - 210px)/2 - 426px));bottom:28px}
  .toast{bottom:32px} body.noTabs .toast{bottom:130px}
  .homegrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  .homegrid > .stack{gap:18px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div class="shell">
  <header class="topbar">
    <div class="topbar-in" id="topbar"></div>
    <div class="crumbs" id="crumbs"></div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabbar" aria-label="메뉴"><div class="tabbar-in" id="tabs"></div></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="filepick" accept="image/*" multiple hidden>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
/* =====================================================================
   촬영 데스크 (shoot-desk.html)
   요청 접수 → 확인·수락 → 브랜드 › 제품 폴더 › N차 촬영(투두 4종 + 레퍼런스)
   데이터: Firestore pour-app-new · config 컬렉션 (로그인 없이 누구나 읽고 씀)
     config/shootreq-<id>   촬영 요청 1건
     config/shootprod-<id>  제품 폴더 1개 (회차 rounds[] 포함)
     config/shootimg-<id>   레퍼런스 사진 원본 1장 (base64 JPEG)
   ?local=1 을 붙이면 이 기기에만 저장되는 미리보기 모드
   ===================================================================== */

/* ---------------- 기준 데이터 ---------------- */
const BRANDS=[{name:'그로홈',c:'b2'},{name:'POUR스토어',c:'b1'},{name:'바라스데이',c:'b3'}];
const brandC=n=>(BRANDS.find(b=>b.name===n)||{c:'b4'}).c;
const QUADS=[{k:'pre',n:'촬영 전 투두',q:'q-1',c:'q1'},{k:'during',n:'촬영 시 투두',q:'q-2',c:'q2'},{k:'props',n:'촬영 준비물',q:'q-3',c:'q3'},{k:'post',n:'촬영 후 투두',q:'q-4',c:'q4'}];
const QK=QUADS.map(q=>q.k);
const TPL={pre:['컷 리스트 확정','레퍼런스 팀 공유','제품 실물 입고'],during:['정면 누끼컷','디테일 클로즈업','연출 · 사용 장면'],
  props:['제품 본품 2개 (여분 포함)','배경지 · 소품'],post:['원본 백업','셀렉 후 리터칭 요청']};
const REQ_ST={new:{n:'확인 대기',c:'q2'},accepted:{n:'수락됨',c:'q4'},hold:{n:'보류',c:'line'}};
const MAX_REFS=12;
const P_REQ='shootreq-', P_PROD='shootprod-', P_IMG='shootimg-';
const NAME_KEY='shootdesk.name', LOCAL_KEY='shootdesk-local-v1';

/* ---------------- 유틸 ---------------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=o=>JSON.parse(JSON.stringify(o));
const nowISO=()=>new Date().toISOString();
const norm=s=>String(s||'').replace(/\s+/g,'').toLowerCase();
const WD=['일','월','화','수','목','금','토'];
const today=new Date(); today.setHours(0,0,0,0);
const d2s=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const s2d=s=>{const[a,b,c]=String(s).split('-').map(Number);return new Date(a,b-1,c);};
const fmtD=s=>{const d=s2d(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')';};
const fmtS=s=>{const d=s2d(s);return String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');};
const fmtISO=iso=>{if(!iso)return '';const d=new Date(iso);return (d.getMonth()+1)+'/'+d.getDate();};
const dday=s=>Math.round((s2d(s)-today)/864e5);
const ddayLabel=n=>n===0?'D-DAY':(n>0?'D-'+n:'D+'+(-n));
const ddayChip=(s,pre)=>{if(!s)return '';const n=dday(s);return '<span class="dday '+(n<0?'past':n>7?'calm':'')+'">'+(pre||'')+ddayLabel(n)+'</span>';};
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return String(u).replace(/^https?:\/\//,'').split('/')[0];}};
const ytId=u=>{const m=String(u||'').match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/)([\w-]{11})/);return m?m[1]:null;};
const safeUrl=u=>/^https?:\/\//i.test(String(u||''))?String(u):'#';
const bar=(p,cls)=>'<div class="bar '+(cls||'')+'"><i style="width:'+p+'%"></i></div>';
const opts=(arr,sel)=>arr.map(([v,l])=>'<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(l)+'</option>').join('');
const lsGet=k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const H={home:'#/',form:'#/request',requests:'#/requests',req:id=>'#/r/'+encodeURIComponent(id),folders:'#/folders',
  brand:b=>'#/folders/'+encodeURIComponent(b),prod:id=>'#/p/'+encodeURIComponent(id),round:(p,r)=>'#/p/'+encodeURIComponent(p)+'/'+encodeURIComponent(r),cal:'#/calendar'};

/* ---------------- 아이콘 ---------------- */
const SV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">';
const I={
 home:SV+'<rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg>',
 inbox:SV+'<path d="M3 13.2h4.8l1.6 2.6h5.2l1.6-2.6H21"/><path d="M5.6 5h12.8L21 13.2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4.8z"/></svg>',
 folder:SV+'<path d="M3 7.2a2 2 0 0 1 2-2h3.6l1.8 2.2H19a2 2 0 0 1 2 2v7.4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
 cal:SV+'<rect x="3.2" y="4.8" width="17.6" height="16" rx="2.4"/><path d="M3.2 9.6h17.6M8 3.2v3.2M16 3.2v3.2"/></svg>',
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 chk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5 9.5 18 20 6.5"/></svg>',
 link:SV+'<path d="M10.5 13.5a4 4 0 0 0 5.7 0l2.6-2.6a4 4 0 0 0-5.7-5.7L11.6 6.7"/><path d="M13.5 10.5a4 4 0 0 0-5.7 0l-2.6 2.6a4 4 0 1 0 5.7 5.7l1.4-1.4"/></svg>',
 img:SV+'<rect x="3.2" y="4.6" width="17.6" height="14.8" rx="2.4"/><circle cx="8.6" cy="10" r="1.7"/><path d="M3.6 17.2 9 12.4l4 3.4 3.2-2.6 4.2 3.6"/></svg>',
 pin:SV+'<path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>',
 more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>'
};

/* ---------------- 저장소 (Firestore / 이 기기) ---------------- */
let MODE='db', db=null, LOAD_ERR='';
const localSubs=[];
const local={
  read(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||'{}');}catch(e){console.error('[local] 읽기 실패:',e);return {};}},
  write(o){localStorage.setItem(LOCAL_KEY,JSON.stringify(o));},
  emit(){const o=local.read();localSubs.forEach(s=>s.cb(Object.keys(o).filter(k=>k.startsWith(s.prefix)).map(k=>Object.assign({},o[k],{id:k.slice(s.prefix.length)}))));}
};
const IMG={};
const Store={
  async set(id,obj){
    const data=clean(obj);
    if(MODE==='db'){await db.collection('config').doc(id).set(data);return;}
    const o=local.read();o[id]=data;local.write(o);setTimeout(local.emit,0);
  },
  async mutate(id,fn){
    if(MODE==='db'){
      const ref=db.collection('config').doc(id);
      return db.runTransaction(async tx=>{
        const s=await tx.get(ref); if(!s.exists)throw new Error('문서를 찾지 못했어요: '+id);
        const next=clean(fn(clean(s.data()))); tx.set(ref,next); return next;});
    }
    const o=local.read(); if(!o[id])throw new Error('문서를 찾지 못했어요: '+id);
    o[id]=clean(fn(clean(o[id]))); local.write(o); setTimeout(local.emit,0); return o[id];
  },
  async setImg(id,data){
    if(MODE==='db'){await db.collection('config').doc(P_IMG+id).set({data,createdAt:nowISO()});}
    else{const o=local.read();o[P_IMG+id]={data};local.write(o);}
    IMG[id]=data;
  },
  async getImg(id){
    if(IMG[id])return IMG[id];
    if(MODE==='db'){const d=await db.collection('config').doc(P_IMG+id).get();console.log('[shootimg] '+id+(d.exists?' 불러옴':' 없음'));IMG[id]=d.exists?d.data().data:'';}
    else{const o=local.read();IMG[id]=(o[P_IMG+id]||{}).data||'';}
    return IMG[id];
  },
  listen(prefix,cb,onErr){
    if(MODE==='db'){
      const FP=firebase.firestore.FieldPath.documentId();
      return db.collection('config').where(FP,'>=',prefix).where(FP,'<',prefix.slice(0,-1)+'.')
        .onSnapshot(s=>cb(s.docs.map(d=>Object.assign({},d.data(),{id:d.id.slice(prefix.length)}))),
          e=>{console.error('['+prefix+'] 실시간 연결 실패:',e);onErr(e);});
    }
    localSubs.push({prefix,cb}); setTimeout(local.emit,0);
  }
};

/* ---------------- 상태 ---------------- */
let REQS=[], PRODS=[];
const loaded={req:false,prod:false};
const S={adding:null,reqStatus:'new',reqBrand:'all',showHidden:{req:false,prod:false,round:false},cal:null,sel:null,busy:false};
let DRAFT=null;

/* ---------------- 집계 ---------------- */
const cnt=todos=>{let d=0,t=0;QK.forEach(k=>((todos||{})[k]||[]).forEach(x=>{t++;if(x.done)d++;}));return{d,t,p:t?Math.round(d/t*100):0};};
const visRounds=(p,all)=>(p.rounds||[]).filter(r=>all||!r.archived);
const pCount=p=>{let d=0,t=0;visRounds(p).forEach(r=>{const c=cnt(r.todos);d+=c.d;t+=c.t;});return{d,t,p:t?Math.round(d/t*100):0};};
const visProds=()=>PRODS.filter(p=>!p.archived);
const visReqs=()=>REQS.filter(r=>!r.archived);
function allRounds(){const a=[];visProds().forEach(p=>visRounds(p).forEach(r=>a.push({p,r})));return a;}
function nextRound(){
  return allRounds().filter(x=>x.r.date&&dday(x.r.date)>=0).sort((a,b)=>a.r.date<b.r.date?-1:a.r.date>b.r.date?1:(a.r.time||'')<(b.r.time||'')?-1:1)[0]||null;
}
function brandList(){
  const s=new Set(BRANDS.map(b=>b.name));
  visProds().forEach(p=>p.brand&&s.add(p.brand)); visReqs().forEach(r=>r.brand&&s.add(r.brand));
  return [...s];
}
const customBrands=()=>brandList().filter(n=>!BRANDS.some(b=>b.name===n));
const findProd=id=>PRODS.find(p=>p.id===id);
const findReq=id=>REQS.find(r=>r.id===id);
const findRound=(p,rid)=>p?(p.rounds||[]).find(r=>r.id===rid):null;
const reqsOfProd=p=>REQS.filter(r=>r.prodId===p.id&&!r.archived);
const locations=()=>[...new Set(allRounds().map(x=>x.r.loc).filter(Boolean))];
const pendingCount=()=>visReqs().filter(r=>r.status==='new').length;
function roundOfReq(r){const p=r.prodId&&findProd(r.prodId);const rd=p&&findRound(p,r.roundId);return p&&rd?{p,r:rd}:null;}
const sortNew=(a,b)=>(a.deadline||'9')<(b.deadline||'9')?-1:(a.deadline||'9')>(b.deadline||'9')?1:(b.createdAt||'').localeCompare(a.createdAt||'');
const sortRecent=(a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'');

/* ---------------- 라우팅 ---------------- */
function parseRoute(){
  const seg=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean).map(s=>{try{return decodeURIComponent(s);}catch(e){return s;}});
  const [a,b,c]=seg;
  if(a==='request')return{v:'form',id:b||null,tab:'requests'};
  if(a==='requests')return{v:'requests',tab:'requests'};
  if(a==='r'&&b)return{v:'req',id:b,tab:'requests'};
  if(a==='folders')return b?{v:'brand',brand:b,tab:'folders'}:{v:'folders',tab:'folders'};
  if(a==='p'&&b)return c?{v:'round',pid:b,rid:c,tab:'folders'}:{v:'prod',pid:b,tab:'folders'};
  if(a==='calendar')return{v:'calendar',tab:'calendar'};
  return{v:'home',tab:'home'};
}
function parentOf(R){
  if(R.v==='form')return R.id?H.req(R.id):H.home;
  if(R.v==='req')return H.requests;
  if(R.v==='brand')return H.folders;
  if(R.v==='prod'){const p=findProd(R.pid);return p?H.brand(p.brand):H.folders;}
  if(R.v==='round')return H.prod(R.pid);
  return null;
}
const go=h=>{if(location.hash===h)render();else location.hash=h;};

/* ---------------- 상단 · 탭 ---------------- */
const TABS=[['home','홈',I.home,H.home],['requests','요청함',I.inbox,H.requests],['folders','폴더',I.folder,H.folders],['calendar','캘린더',I.cal,H.cal]];
function renderChrome(R){
  let title='촬영 데스크', sub='SHOOTDESK';
  const p=R.pid?findProd(R.pid):null, rd=p&&R.rid?findRound(p,R.rid):null, rq=R.id?findReq(R.id):null;
  if(R.v==='form'){title=R.id?'요청 수정':'촬영 요청';sub='REQUEST';}
  if(R.v==='requests'){title='요청함';sub='REQUESTS';}
  if(R.v==='req'){title=rq?rq.product:'요청';sub='REQUEST';}
  if(R.v==='folders'){title='폴더';sub='FOLDERS';}
  if(R.v==='brand'){title=R.brand;sub='BRAND';}
  if(R.v==='prod'){title=p?p.name:'제품 폴더';sub='PRODUCT';}
  if(R.v==='round'){title=rd?rd.title:'촬영 회차';sub=p?p.name:'SHOOT';}
  if(R.v==='calendar'){title='촬영 캘린더';sub='CALENDAR';}
  const parent=parentOf(R);
  const menu=(R.v==='prod'&&p)?'<button class="iconbtn" data-act="menu" data-kind="prod" data-p="'+esc(p.id)+'" aria-label="폴더 메뉴">'+I.more+'</button>'
    :(R.v==='round'&&rd)?'<button class="iconbtn" data-act="menu" data-kind="round" data-p="'+esc(p.id)+'" data-r="'+esc(rd.id)+'" aria-label="회차 메뉴">'+I.more+'</button>'
    :(R.v==='req'&&rq)?'<button class="iconbtn" data-act="menu" data-kind="req" data-id="'+esc(rq.id)+'" aria-label="요청 메뉴">'+I.more+'</button>':'';
  $('#topbar').innerHTML=(parent?'<a class="iconbtn" href="'+parent+'" aria-label="뒤로">'+I.back+'</a>':'')+
    '<div class="grow"><div class="tb-sub mono trunc">'+esc(sub)+'</div><div class="tb-title">'+esc(title)+'</div></div>'+menu;
  const cr=[];
  if(R.v==='brand')cr.push('<a href="'+H.folders+'">폴더</a>','›','<b>'+esc(R.brand)+'</b>');
  if((R.v==='prod'||R.v==='round')&&p){cr.push('<a href="'+H.folders+'">폴더</a>','›','<a href="'+H.brand(p.brand)+'">'+esc(p.brand)+'</a>','›');
    cr.push(rd?'<a href="'+H.prod(p.id)+'">'+esc(p.name)+'</a>':'<b>'+esc(p.name)+'</b>');
    if(rd)cr.push('›','<b>'+esc(rd.title)+'</b>');}
  $('#crumbs').innerHTML=cr.join(' ');
  $('#crumbs').style.display=cr.length?'':'none';
  const pc=pendingCount();
  $('#tabs').innerHTML=TABS.map(([k,n,ic,h])=>'<a class="tab" href="'+h+'" aria-current="'+(R.tab===k)+'">'+ic+'<span>'+n+'</span>'+
    (k==='requests'&&pc?'<span class="badge">'+pc+'</span>':'')+'<span class="dotmark"></span></a>').join('');
}

/* ---------------- 공통 조각 ---------------- */
function refThumb(ref){
  if(ref.kind==='image')return '<div class="refthumb">'+I.img+(ref.thumb||ref.data?'<img src="'+esc(ref.thumb||ref.data)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'</div>';
  const y=ytId(ref.url);
  if(y)return '<div class="refthumb">'+I.link+'<img src="https://i.ytimg.com/vi/'+y+'/hqdefault.jpg" alt="" loading="lazy" onerror="this.remove()"><span class="play">▶</span></div>';
  return '<div class="refthumb linktile">'+I.link+'<span class="host">'+esc(host(ref.url))+'</span></div>';
}
function refTile(ref,src,extra){
  const label=ref.note||(ref.kind==='image'?'사진':host(ref.url));
  return '<div class="refcard" role="button" tabindex="0" data-act="openref" data-src="'+src+'" data-ref="'+esc(ref.id)+'"'+(extra||'')+'>'+refThumb(ref)+
    '<div class="reflabel"><div class="t">'+esc(label)+'</div><div class="d">'+(ref.kind==='image'?'사진':'링크 · '+esc(host(ref.url)))+'</div></div></div>';
}
function miniThumbs(refs){
  if(!refs||!refs.length)return '';
  return '<div class="minithumbs">'+refs.slice(0,5).map(r=>{
    if(r.kind==='image'&&r.thumb)return '<span>'+I.img+'<img src="'+esc(r.thumb)+'" alt="" loading="lazy" onerror="this.remove()"></span>';
    const y=ytId(r.url); if(y)return '<span>'+I.link+'<img src="https://i.ytimg.com/vi/'+y+'/default.jpg" alt="" loading="lazy" onerror="this.remove()"></span>';
    return '<span>'+I.link+'</span>';}).join('')+(refs.length>5?'<span class="tiny mono">+'+(refs.length-5)+'</span>':'')+'</div>';
}
function reqCard(r){
  const st=REQ_ST[r.status]||REQ_ST.new, lk=r.status==='accepted'?roundOfReq(r):null;
  return '<a class="fcard'+(r.archived?' hidden-tag':'')+'" href="'+H.req(r.id)+'">'+
    '<div class="row" style="gap:6px"><span class="chip '+brandC(r.brand)+'">'+esc(r.brand)+'</span><span class="chip '+st.c+'">'+st.n+'</span>'+
      (r.archived?'<span class="chip line">숨김</span>':'')+'<span class="grow"></span>'+(r.status!=='hold'?ddayChip(r.deadline,'마감 '):'')+'</div>'+
    '<h3 style="margin-top:9px">'+esc(r.product)+'</h3>'+
    (r.concept?'<p class="sub clamp2">'+esc(r.concept)+'</p>':'')+
    miniThumbs(r.refs)+
    '<div class="fmeta"><span>'+esc(r.name)+'</span><span class="dot"></span><span>요청 '+fmtISO(r.createdAt)+'</span>'+
      (r.deadline?'<span class="dot"></span><span class="mono">마감 '+fmtS(r.deadline)+'</span>':'')+
      (lk?'<span class="dot"></span><span>'+esc(lk.r.title)+(lk.r.date?' · '+fmtS(lk.r.date):'')+'</span>':'')+'</div></a>';
}
function prodCard(p){
  const c=pCount(p), rs=visRounds(p), last=rs[rs.length-1], nq=reqsOfProd(p).length;
  const nx=rs.filter(r=>r.date&&dday(r.date)>=0).sort((a,b)=>a.date<b.date?-1:1)[0];
  return '<a class="fcard'+(p.archived?' hidden-tag':'')+'" href="'+H.prod(p.id)+'"><div class="tabtop" style="background:var(--'+brandC(p.brand)+')"></div>'+
    '<div class="row" style="gap:8px"><h3 class="grow trunc">'+esc(p.name)+'</h3>'+(p.archived?'<span class="chip line">숨김</span>':'')+(nx?ddayChip(nx.date):'')+'</div>'+
    '<p class="sub">'+(last?esc(last.title)+(last.date?' · '+fmtD(last.date):' · 날짜 미정')+(last.loc?' · '+esc(last.loc):''):'아직 촬영 회차가 없어요')+'</p>'+
    '<div class="fmeta"><span>회차 '+rs.length+'</span><span class="dot"></span><span>요청 '+nq+'</span>'+(c.t?'<span class="dot"></span><span class="mono">'+c.d+'/'+c.t+' 항목</span>':'')+'</div>'+

}
function roundCard(p,r,i){

/* ---------------- 다음 할 일 ---------------- */
function nextAction(){
  const pend=visReqs().filter(r=>r.status==='new').sort(sortNew);
  if(pend.length)return{t:'새 촬영 요청 '+pend.length+'건 — 확인하고 수락해 주세요',h:pend.length===1?H.req(pend[0].id):H.requests,g:'확인'};
  const nodate=allRounds().filter(x=>!x.r.date&&cnt(x.r.todos).p<100);
  if(nodate.length)return{t:'“'+nodate[0].p.name+'” '+nodate[0].r.title+' 날짜·장소를 정해 주세요',h:H.round(nodate[0].p.id,nodate[0].r.id),g:'정하기'};
  const nx=nextRound();
  if(nx){const left=((nx.r.todos||{}).pre||[]).filter(t=>!t.done).length+((nx.r.todos||{}).props||[]).filter(t=>!t.done).length;
    if(left&&dday(nx.r.date)<=3)return{t:'“'+nx.p.name+'” 촬영 '+ddayLabel(dday(nx.r.date))+' · 준비 항목 '+left+'개 남았어요',h:H.round(nx.p.id,nx.r.id),g:'열기'};}
  return null;
}

      '<a class="cta" href="'+H.form+'">촬영 요청하기</a><button class="sub-act" data-act="copylink">요청 페이지 링크 복사</button></section>',

function modeBanner(){
  if(LOAD_ERR)return '<div class="banner err">데이터 연결에 문제가 있어요: '+esc(LOAD_ERR)+'</div>';
  if(MODE==='local')return '<div class="banner">이 기기에만 저장되는 미리보기 모드예요. 팀과 함께 쓰려면 주소에서 ?local=1 을 빼고 열어 주세요.</div>';
  return '';
}

/* ---------------- 요청 폼 ---------------- */
function newDraft(){return{id:null,name:lsGet(NAME_KEY),brand:'',brandMode:'pick',brandCustom:'',product:'',concept:'',deadline:'',cuts:'',refs:[],linkOpen:false,err:{}};}
function draftFrom(r){
  const fixed=brandList().includes(r.brand);
  return{id:r.id,name:r.name||'',brand:fixed?r.brand:'',brandMode:fixed?'pick':'custom',brandCustom:fixed?'':(r.brand||''),
    product:r.product||'',concept:r.concept||'',deadline:r.deadline||'',cuts:r.cuts||'',refs:clean(r.refs||[]),linkOpen:false,err:{}};
}
const draftBrand=()=>DRAFT.brandMode==='custom'?DRAFT.brandCustom.trim():DRAFT.brand;
function missing(){
  const D=DRAFT,m=[];
  if(!D.name.trim())m.push(['name','요청자 이름']);
  if(!draftBrand())m.push(['brand','브랜드']);
  if(!D.product.trim())m.push(['product','촬영 품목']);
  if(!D.concept.trim())m.push(['concept','촬영 컨셉']);
  if(!D.deadline)m.push(['deadline','마감일']);
  if(D.refs.length<2)m.push(['refs','레퍼런스 '+(2-D.refs.length)+'개 더']);
  return m;
}
function viewForm(R){
  if(!DRAFT||DRAFT.id!==(R.id||null)){
    if(R.id){const r=findReq(R.id);if(!r)return empty('요청을 찾지 못했어요');DRAFT=draftFrom(r);}else DRAFT=newDraft();

      F('name','요청자 이름','<input data-f="name" value="'+esc(D.name)+'" placeholder="예: 김송희" autocomplete="name">',1),
      '<div class="field'+(E.brand?' err':'')+'" data-field="brand"><span>브랜드 <b class="req">*</b></span><div class="picks" role="group" aria-label="브랜드">'+
        chips.map(n=>'<button type="button" class="pick" data-act="pick-brand" data-b="'+esc(n)+'" aria-pressed="'+(D.brandMode==='pick'&&D.brand===n)+'">'+esc(n)+'</button>').join('')+
        '<button type="button" class="pick" data-act="pick-brand" data-b="__custom" aria-pressed="'+(D.brandMode==='custom')+'">+ 직접 입력</button></div>'+
        (D.brandMode==='custom'?'<input data-f="brandCustom" value="'+esc(D.brandCustom)+'" placeholder="브랜드 이름 입력" style="margin-top:8px">':'')+'</div>',
      F('product','촬영 품목','<input data-f="product" value="'+esc(D.product)+'" placeholder="예: 옥상배관방수트랩">',1),

    '</section>',
    '<div class="actionbar"><div class="actionbar-in"><div class="missing" id="missing"></div>'+
      '<button class="btn accent" id="submitReq" data-act="submit-req">'+(R.id?'수정 저장':'요청 보내기')+'</button></div></div>'
  ].join('');
}
function updateMissing(){
  const el=$('#missing'), btn=$('#submitReq'); if(!el||!DRAFT)return;
  const m=missing();
  el.innerHTML=m.length?'남은 항목: <b>'+m.map(x=>x[1]).join(', ')+'</b>':'모두 채웠어요. 보내면 바로 요청함에 쌓여요.';
  btn.classList.toggle('dim',m.length>0);
}
async function submitReq(){
  if(S.busy)return;
  const m=missing();
  if(m.length){
    DRAFT.err={}; m.forEach(([k])=>DRAFT.err[k]=1); render();
    const el=document.querySelector('[data-field="'+m[0][0]+'"]');
    if(el){el.scrollIntoView({behavior:'smooth',block:'center'});const i=el.querySelector('input,textarea');if(i)setTimeout(()=>i.focus({preventScroll:true}),300);}
    const MSG={name:'요청자 이름을 입력해 주세요',brand:'브랜드를 골라 주세요',product:'촬영 품목을 입력해 주세요',concept:'촬영 컨셉을 입력해 주세요',deadline:'촬영 마감일을 골라 주세요'};
    toast(MSG[m[0][0]]||'레퍼런스를 '+(2-DRAFT.refs.length)+'개 더 넣어 주세요'); return;
  }
  S.busy=true; const btn=$('#submitReq'); if(btn){btn.textContent='보내는 중…';btn.classList.add('dim');}
  try{
    const D=DRAFT;
    for(const ref of D.refs){if(ref.kind==='image'&&ref.data&&!ref.img){const iid=uid();await Store.setImg(iid,ref.data);ref.img=iid;}}
    const refs=D.refs.map(r=>{const o=Object.assign({},r);delete o.data;return o;});
    const prev=D.id?findReq(D.id):null;
    const id=D.id||uid();
    const doc=Object.assign({},prev||{status:'new',archived:false,createdAt:nowISO()},{
      id,name:D.name.trim(),brand:draftBrand(),product:D.product.trim(),concept:D.concept.trim(),deadline:D.deadline,cuts:D.cuts.trim(),refs,updatedAt:nowISO()});
    await Store.set(P_REQ+id,doc);
    upsert(REQS,clean(doc));
    console.log('[shootreq] 저장 '+id);
    lsSet(NAME_KEY,D.name.trim());
    DRAFT=null; S.busy=false;
    toast(prev?'수정했어요':'요청을 보냈어요 · 확인 후 일정을 잡아 드려요');
    go(H.req(id));
  }catch(e){
    console.error('[shootreq] 저장 실패:',e); S.busy=false;
    if(btn){btn.textContent=DRAFT&&DRAFT.id?'수정 저장':'요청 보내기';btn.classList.remove('dim');}
    toast('저장하지 못했어요 · 인터넷 연결을 확인하고 다시 눌러 주세요');
  }
}

function viewCal(){
  if(!S.cal){const nx=nextRound();const d=nx?s2d(nx.r.date):today;S.cal={y:d.getFullYear(),m:d.getMonth()};S.sel=d2s(d);}
  const {y,m}=S.cal;
  const first=new Date(y,m,1), start=new Date(y,m,1-first.getDay());
  const weeks=Math.ceil((first.getDay()+new Date(y,m+1,0).getDate())/7);
  const by={};
  allRounds().forEach(x=>{if(x.r.date)(by[x.r.date]=by[x.r.date]||[]).push({k:'shoot',x});});
  visReqs().forEach(r=>{if(r.deadline&&r.status!=='hold')(by[r.deadline]=by[r.deadline]||[]).push({k:'dl',r});});
  let cells='';

/* ---------------- 이미지 처리 ---------------- */
function loadImg(file){return new Promise((ok,no)=>{const url=URL.createObjectURL(file),i=new Image();i.onload=()=>ok({i,url});i.onerror=()=>{URL.revokeObjectURL(url);no(new Error('이미지를 읽지 못했어요: '+file.name));};i.src=url;});}
function toJpeg(img,max,q){const w=img.naturalWidth,h=img.naturalHeight,r=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*r));c.height=Math.max(1,Math.round(h*r));
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q);}
async function compress(file){
  const {i,url}=await loadImg(file);
  let full=toJpeg(i,1400,.78);
  if(full.length>850000)full=toJpeg(i,1100,.66);
  if(full.length>850000)full=toJpeg(i,900,.55);
  const thumb=toJpeg(i,360,.62); URL.revokeObjectURL(url);
  return{full,thumb};
}
let pickTarget=null;
$('#filepick').addEventListener('change',async e=>{
  const files=[...e.target.files]; e.target.value=''; if(!files.length||!pickTarget)return;
  const tg=pickTarget; pickTarget=null;
  toast('사진 '+files.length+'장 처리 중…');
  try{
    const made=[]; for(const f of files){const {full,thumb}=await compress(f);made.push({id:uid(),kind:'image',thumb,data:full,note:''});}
    if(tg.to==='draft'){
      if(!DRAFT)return;
      const room=MAX_REFS-DRAFT.refs.length; DRAFT.refs.push(...made.slice(0,Math.max(0,room))); DRAFT.err.refs=0;
      if(made.length>room)toast('레퍼런스는 최대 '+MAX_REFS+'개까지 넣을 수 있어요'); else toast('사진 '+made.length+'장을 넣었어요');
      render(); return;
    }
    for(const m of made){const iid=uid();await Store.setImg(iid,m.data);m.img=iid;delete m.data;}
    mutateProd(tg.p,p=>{const r=findRound(p,tg.r);if(r)r.refs=(r.refs||[]).concat(made);return p;});
    toast('사진 '+made.length+'장을 레퍼런스에 넣었어요');
  }catch(err){console.error('[사진] 처리 실패:',err);toast('사진을 넣지 못했어요 · '+err.message);}
});

/* ---------------- 클릭 ---------------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.tagName==='FORM')return;
  const a=el.dataset.act, d=el.dataset;
  switch(a){
   case 'copylink': copyText(pageURL()+'#/request','요청 페이지 링크를 복사했어요 · 요청할 분께 보내 주세요'); break;
   case 'sharelink': closeSheet(); copyText(location.href,'링크를 복사했어요'); break;
   case 'reqst': S.reqStatus=d.k; render(); break;
   case 'reqbrand': S.reqBrand=d.b; render(); break;
   case 'togglehidden': S.showHidden[d.k]=!S.showHidden[d.k]; render(); break;
   case 'pick-brand':
     if(d.b==='__custom'){DRAFT.brandMode='custom';}else{DRAFT.brandMode='pick';DRAFT.brand=d.b;}
     DRAFT.err.brand=0; render();
     if(d.b==='__custom'){const i=document.querySelector('[data-f="brandCustom"]');if(i)i.focus();}
     break;
   case 'draft-linkopen':
     if(DRAFT.refs.length>=MAX_REFS){toast('레퍼런스는 최대 '+MAX_REFS+'개까지예요');break;}
     DRAFT.linkOpen=true; S.focusLink=true; render(); break;
   case 'draft-linkcancel': DRAFT.linkOpen=false; render(); break;
   case 'draft-linkadd': {
     const u=normUrl($('#lk-url').value); if(!u){toast('링크 주소를 확인해 주세요');$('#lk-url').focus();break;}
     DRAFT.refs.push({id:uid(),kind:'link',url:u,note:$('#lk-note').value.trim()}); DRAFT.linkOpen=false; DRAFT.err.refs=0; render();
     toast(DRAFT.refs.length>=2?'레퍼런스 '+DRAFT.refs.length+'개 · 충분해요':'1개 더 넣어 주세요'); break;}
   case 'draft-delref': e.stopPropagation(); DRAFT.refs=DRAFT.refs.filter(x=>x.id!==d.ref); render(); break;
   case 'pickimg':
     if(d.to==='draft'&&DRAFT.refs.length>=MAX_REFS){toast('레퍼런스는 최대 '+MAX_REFS+'개까지예요');break;}
     pickTarget={to:d.to,p:d.p,r:d.r}; $('#filepick').click(); break;
   case 'submit-req': submitReq(); break;
   case 'openref': openRefSheet(d); break;
   case 'accept': acceptSheet(d.id); break;
   case 'hold': holdSheet(d.id); break;
   case 'unhold':
     try{await patchReq(d.id,{status:'new',holdMemo:''});render();toast('확인 대기로 되돌렸어요');}
     catch(err){console.error('[shootreq] 되돌리기 실패:',err);toast('저장하지 못했어요');} break;
   case 'menu': menuSheet(d); break;
   case 'editprod': closeSheet(); setTimeout(()=>prodSheet(d.p),180); break;
   case 'newprod': prodSheet(null,d.b||''); break;
   case 'newround': closeSheet(); setTimeout(()=>roundSheet(d.p),180); break;
   case 'editround': closeSheet(); setTimeout(()=>roundSheet(d.p,d.r),180); break;
   case 'roundlink': linkSheet(d.p,d.r); break;
   case 'addtask': S.adding=d.q; S.focusAdd=true; render(); break;
   case 'toggle': {
     const p=findProd(d.p), r=findRound(p,d.r), t=r&&((r.todos||{})[d.q]||[]).find(x=>x.id===d.t); if(!t)break;
     const to=!t.done, at=to?shortNow():null;
     mutateProd(d.p,p=>{const rr=findRound(p,d.r),tt=rr&&((rr.todos||{})[d.q]||[]).find(x=>x.id===d.t);if(tt){tt.done=to;tt.at=at;}return p;}).catch(()=>{});
     if(to){const c=cnt(findRound(findProd(d.p),d.r).todos);if(c.t&&c.d===c.t)toast('“'+p.name+'” '+r.title+' 투두를 모두 끝냈어요');}
     break;}
   case 'deltodo':
     mutateProd(d.p,p=>{const rr=findRound(p,d.r);if(rr&&rr.todos&&rr.todos[d.q])rr.todos[d.q]=rr.todos[d.q].filter(x=>x.id!==d.t);return p;}).catch(()=>{});
     break;
   case 'delroundref':
     closeSheet();
     mutateProd(d.p,p=>{const rr=findRound(p,d.r);if(rr)rr.refs=(rr.refs||[]).filter(x=>x.id!==d.ref);return p;}).then(()=>toast('레퍼런스를 뺐어요')).catch(()=>{});
     break;
   case 'copyround': {
     closeSheet();
     const p=findProd(d.p), src=findRound(p,d.r); if(!src)break;
     const nid=uid(), n=(p.rounds||[]).length+1;
     const copy={id:nid,title:n+'차 촬영',date:'',time:src.time||'10:00',loc:src.loc||'',reqId:null,note:src.note||'',refs:clean(src.refs||[]),archived:false,createdAt:nowISO(),
       todos:(()=>{const o={};QK.forEach(k=>o[k]=((src.todos||{})[k]||[]).map(t=>({id:uid(),text:t.text,done:false})));return o;})()};
     mutateProd(d.p,pp=>{pp.rounds=(pp.rounds||[]).concat(copy);return pp;}).then(()=>{go(H.round(d.p,nid));toast(n+'차 촬영을 만들었어요 · 날짜를 정해 주세요');}).catch(()=>{});
     break;}
   case 'archive': {
     closeSheet();
     try{
       if(d.kind==='req'){const r=findReq(d.id);await patchReq(d.id,{archived:!r.archived});toast(r.archived?'다시 보이게 했어요':'목록에서 숨겼어요 · 요청함 아래에서 다시 볼 수 있어요');render();}
       if(d.kind==='prod'){const p=findProd(d.p),was=!!p.archived;await mutateProd(d.p,pp=>{pp.archived=!was;return pp;});toast(was?'다시 보이게 했어요':'폴더를 숨겼어요 · 폴더 목록 아래에서 다시 볼 수 있어요');if(!was)go(H.brand(p.brand));}
       if(d.kind==='round'){const p=findProd(d.p),r=findRound(p,d.r),was=!!r.archived;await mutateProd(d.p,pp=>{const rr=findRound(pp,d.r);if(rr)rr.archived=!was;return pp;});toast(was?'다시 보이게 했어요':'회차를 숨겼어요 · 제품 폴더 아래에서 다시 볼 수 있어요');if(!was)go(H.prod(d.p));}
     }catch(err){console.error('[숨기기] 실패:',err);toast('저장하지 못했어요');}
     break;}
   case 'day': S.sel=d.d; render(); break;
   case 'mv': {
     if(d.n==='0'){S.cal={y:today.getFullYear(),m:today.getMonth()};S.sel=d2s(today);}
     else{let m=S.cal.m+Number(d.n),y=S.cal.y;if(m<0){m=11;y--;}if(m>11){m=0;y++;}S.cal={y,m};}
     render(); break;}
   case 'close': closeSheet(); break;
  }
});

/* ---------------- 입력 ---------------- */
document.addEventListener('input',e=>{
  const f=e.target.dataset&&e.target.dataset.f; if(!f||!DRAFT)return;
  DRAFT[f]=e.target.value; if(DRAFT.err[f==='brandCustom'?'brand':f]){DRAFT.err[f==='brandCustom'?'brand':f]=0;const fe=e.target.closest('.field');if(fe)fe.classList.remove('err');}
  if(f==='deadline'){const h=e.target.parentNode.querySelector('.hint');if(h)h.textContent='이 날짜까지 촬영이 끝나야 해요'+(DRAFT.deadline?' · '+fmtD(DRAFT.deadline)+' ('+ddayLabel(dday(DRAFT.deadline))+')':'');}
  updateMissing();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSheet();
  if(e.key==='Enter'&&e.target.id==='lk-url'){e.preventDefault();$('#lk-note').focus();}
  else if(e.key==='Enter'&&e.target.id==='lk-note'){e.preventDefault();document.querySelector('[data-act="draft-linkadd"]').click();}
  if(e.key==='Enter'&&e.target.getAttribute&&e.target.getAttribute('role')==='button'){e.preventDefault();e.target.click();}
});
$scrim.addEventListener('click',closeSheet);
document.addEventListener('change',e=>{if(e.target.name==='prod'&&$('#newname'))$('#newname').hidden=e.target.value!=='__new';});

/* ---------------- 폼 제출 (시트) ---------------- */
document.addEventListener('submit',async e=>{
  const f=e.target; if(!f.dataset.act)return; e.preventDefault();
  const v=n=>{const x=f.elements[n];return x?String(x.value||'').trim():'';};
  const a=f.dataset.act, d=f.dataset;
  const btn=f.querySelector('button[type=submit]');
  const lock=()=>{if(btn){btn.disabled=true;btn.dataset.t=btn.textContent;btn.textContent='저장 중…';}};
  const unlock=()=>{if(btn){btn.disabled=false;btn.textContent=btn.dataset.t||'저장';}};
  try{
    if(a==='addtodo'){
      const tx=v('tx'); if(!tx)return; f.elements.tx.value='';
      const nt={id:uid(),text:tx,done:false}; S.focusAdd=true;
      mutateProd(d.p,p=>{const r=findRound(p,d.r);if(r){r.todos=r.todos||{};r.todos[d.q]=(r.todos[d.q]||[]).concat(nt);}return p;}).catch(()=>{});
      return;
    }
    lock();
    if(a==='do-accept'){
      const r=findReq(d.id); if(!r)throw new Error('요청을 찾지 못했어요');
      const rid=uid(); let pid=v('prod');
      const round={id:rid,title:'',date:v('date'),time:v('time')||'10:00',loc:v('loc'),reqId:r.id,note:'',todos:tplTodos(),refs:[],archived:false,createdAt:nowISO()};
      if(pid==='__new'){
        pid=uid(); round.title='1차 촬영';
        const np={id:pid,brand:r.brand,name:v('name')||r.product,memo:'',rounds:[round],archived:false,createdAt:nowISO(),updatedAt:nowISO()};
        await Store.set(P_PROD+pid,np); upsert(PRODS,clean(np));
      }else{
        await Store.mutate(P_PROD+pid,p=>{round.title=((p.rounds||[]).length+1)+'차 촬영';p.rounds=(p.rounds||[]).concat(round);p.updatedAt=nowISO();return p;});
      }
      await patchReq(r.id,{status:'accepted',prodId:pid,roundId:rid,acceptedAt:nowISO(),holdMemo:''});
      console.log('[shootreq] 수락 '+r.id+' → '+pid+'/'+rid);
      closeSheet(); go(H.round(pid,rid)); toast('폴더를 만들었어요 · 투두와 일정을 확인해 주세요');
    }
    if(a==='do-hold'){await patchReq(d.id,{status:'hold',holdMemo:v('memo')});closeSheet();render();toast('보류했어요 · 요청함 “보류”에 남아요');}
    if(a==='do-newround'){
      const p=findProd(d.p); const rid=uid();
      const round={id:rid,title:v('title')||((p.rounds||[]).length+1)+'차 촬영',date:v('date'),time:v('time')||'10:00',loc:v('loc'),reqId:v('req')||null,note:v('note'),todos:tplTodos(),refs:[],archived:false,createdAt:nowISO()};
      await mutateProd(d.p,pp=>{pp.rounds=(pp.rounds||[]).concat(round);return pp;});
      if(round.reqId)await patchReq(round.reqId,{roundId:rid});
      closeSheet(); go(H.round(d.p,rid)); toast(round.title+'을 만들었어요');
    }
    if(a==='do-editround'){
      await mutateProd(d.p,pp=>{const rr=findRound(pp,d.r);if(rr){rr.title=v('title')||rr.title;rr.date=v('date');rr.time=v('time');rr.loc=v('loc');rr.note=v('note');}return pp;});
      closeSheet(); render(); toast('저장했어요');
    }
    if(a==='do-newprod'){
      const brand=v('brand'), name=v('name'); if(!brand||!name){unlock();toast('브랜드와 제품 이름을 넣어 주세요');return;}
      const pid=uid(), np={id:pid,brand,name,memo:v('memo'),rounds:[],archived:false,createdAt:nowISO(),updatedAt:nowISO()};
      await Store.set(P_PROD+pid,np); upsert(PRODS,clean(np));
      closeSheet(); go(H.prod(pid)); toast('폴더를 만들었어요 · 1차 촬영을 추가해 주세요');
    }
    if(a==='do-editprod'){
      const brand=v('brand'), name=v('name'); if(!brand||!name){unlock();toast('브랜드와 제품 이름을 넣어 주세요');return;}
      await mutateProd(d.p,pp=>{pp.brand=brand;pp.name=name;pp.memo=v('memo');return pp;});
      closeSheet(); render(); toast('저장했어요');
    }
    if(a==='do-roundlink'){
      const u=normUrl(v('url')); if(!u){unlock();toast('링크 주소를 확인해 주세요');return;}
      await mutateProd(d.p,pp=>{const rr=findRound(pp,d.r);if(rr)rr.refs=(rr.refs||[]).concat({id:uid(),kind:'link',url:u,note:v('note')});return pp;});
      closeSheet(); toast('레퍼런스를 넣었어요');
    }
  }catch(err){console.error('['+a+'] 실패:',err);unlock();toast('저장하지 못했어요 · '+(err.message||'다시 시도해 주세요'));}
});

/* ---------------- 시작 ---------------- */
window.addEventListener('hashchange',()=>{S.adding=null;closeSheet();render();window.scrollTo(0,0);});
function start(){
  const forceLocal=/[?&]local=1/.test(location.search);
  if(forceLocal||typeof firebase==='undefined'){
    MODE='local'; if(!forceLocal)console.error('[shootdesk] Firebase를 불러오지 못해 이 기기 저장 모드로 열어요');
  }else{
    try{
      if(!firebase.apps.length)firebase.initializeApp({
        apiKey:"AIzaSyBbct9tO8nCUCjz4s9GnXQLkHuHe2FFyyU",authDomain:"pour-app-new.firebaseapp.com",projectId:"pour-app-new",
        storageBucket:"pour-app-new.firebasestorage.app",messagingSenderId:"411031141847",appId:"1:411031141847:web:e658174fd4b9652cdadf92"});
      db=firebase.firestore();
    }catch(e){console.error('[shootdesk] Firebase 초기화 실패:',e);MODE='local';}
  }
  const onErr=e=>{LOAD_ERR=e.message||String(e);loaded.req=loaded.prod=true;render();};
  Store.listen(P_REQ,docs=>{REQS=docs;loaded.req=true;console.log('[shootreq] '+docs.length+'건 로드');scheduleRender();},onErr);
  Store.listen(P_PROD,docs=>{PRODS=docs;loaded.prod=true;console.log('[shootprod] '+docs.length+'건 로드');scheduleRender();},onErr);
  render();
}
start();
</script>
