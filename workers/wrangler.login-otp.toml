# Cloudflare Worker — SMS-OTP 로그인 (비밀번호 없이 문자 코드로 로그인)
# 배포: npx wrangler deploy --config workers/wrangler.login-otp.toml

name = "pour-login-otp"
main = "pour-login-otp.js"
compatibility_date = "2024-01-01"

# ── 시크릿 등록 (평문 저장 금지 — 모두 secret 으로) ─────────
# npx wrangler secret put FB_PROJECT_ID     --config workers/wrangler.login-otp.toml   # pourstoreproject
# npx wrangler secret put FB_CLIENT_EMAIL   --config workers/wrangler.login-otp.toml   # 서비스계정 client_email
# npx wrangler secret put FB_PRIVATE_KEY    --config workers/wrangler.login-otp.toml   # 서비스계정 private_key (PEM, 개행 포함)
# npx wrangler secret put FB_API_KEY        --config workers/wrangler.login-otp.toml   # 웹 API 키 (firebaseConfig.apiKey) — 신규 유저 생성용
# npx wrangler secret put SOLAPI_API_KEY    --config workers/wrangler.login-otp.toml
# npx wrangler secret put SOLAPI_API_SECRET --config workers/wrangler.login-otp.toml
# npx wrangler secret put SOLAPI_SENDER     --config workers/wrangler.login-otp.toml   # 발신번호
#
# 서비스계정 키: Firebase 콘솔 → pourstoreproject → 프로젝트 설정 → 서비스 계정
#   → "새 비공개 키 생성"으로 받은 JSON 의 client_email / private_key 사용
#   (pour-master-otp 와 동일 서비스계정·Solapi 시크릿을 그대로 재사용해도 됨)
